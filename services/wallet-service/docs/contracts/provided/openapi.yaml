              - msisdn
              - language
              - consents
            example:
              msisdn: '8801812000001'
              language: bn
              nameEn: Rahim Uddin
              referralCode: null
              consents:
              - consentType: TERMS
                documentVersion: TNC-2026.10-bn
                language: bn
              - consentType: PRIVACY
