  /v1/kyc-submissions/{submissionId}:decide:
    post:
      operationId: decideKyc
      tags:
      - wallet
      summary: Decide APPROVE / REJECT — single step in the MVP, maker-checker in R1 (BR-W-25).
      description: 'decision-mode SINGLE_STEP (MVP): the OPS_MAKER decision is applied at once (tier, risk grade, wallet P → A, KYC_APPROVED /
        KYC_REJECTED) and answered 200 with state APPROVED / REJECTED; HIGH grade or PEP still needs the EDD fields. decision-mode MAKER_CHECKER
        (R1): maker proposal → PENDING_APPROVAL + approval request, answered 202; HIGH grade or PEP → 2 levels (level 2 COMPLIANCE_OFFICER / CAMLCO);
        NID correction on upgrade → 2 levels. CR-WALLET-2.'
      x-audience: staff
      x-actors:
      - type: STAFF
        roles:
        - OPS_MAKER
      x-module: wallet
      x-release: MVP
      x-idempotency: none
      parameters:
      - $ref: '#/components/parameters/XCorrelationId'
      - $ref: '#/components/parameters/XActorType'
      - $ref: '#/components/parameters/XActorId'
      - $ref: '#/components/parameters/XActorWalletId'
      - $ref: '#/components/parameters/XActorRoles'
      - $ref: '#/components/parameters/XActorUserId'
      - $ref: '#/components/parameters/XChannel'
      - $ref: '#/components/parameters/XDeviceId'
      - $ref: '#/components/parameters/Traceparent'
      - name: submissionId
        in: path
        required: true
        schema:
          type: string
          format: uuid
          pattern: ^[0-9a-f]{8}-[0-9a-f]{4}-[0-9a-f]{4}-[0-9a-f]{4}-[0-9a-f]{12}$
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              additionalProperties: true
              properties:
                decision:
                  type: string
                  enum:
                  - APPROVE
                  - REJECT
                tier:
                  type:
                  - integer
                  - 'null'
                  format: int32
                  minimum: 1
                  maximum: 2
                  description: required for APPROVE
                reasonCode:
                  type: string
                  pattern: ^[A-Z_]{3,40}$
                  description: KYC_APPROVED or a KYC rejection code
                checklist:
                  type: object
                  additionalProperties: true
                  description: reviewer checklist (manual verification result)
                comment:
                  type:
                  - string
                  - 'null'
                  maxLength: 500
              required:
              - decision
              - reasonCode
              - checklist
            example:
              decision: APPROVE
              tier: 2
              reasonCode: KYC_APPROVED
              checklist:
                nidImageLegible: true
                nidDataMatchesForm: true
                selfieMatchesNidPhoto: true
                ageOver18: true
                addressComplete: true
              comment: Documents verified manually
      responses:
        '200':
          description: decided (decision-mode SINGLE_STEP, MVP)
          content:
            application/json:
              schema:
                type: object
                additionalProperties: true
                properties:
                  submissionId:
                    type: string
                    format: uuid
                    pattern: ^[0-9a-f]{8}-[0-9a-f]{4}-[0-9a-f]{4}-[0-9a-f]{4}-[0-9a-f]{12}$
                  state:
                    type: string
                    enum:
                    - APPROVED
                    - REJECTED
                  approvalId:
                    type: 'null'
                  requiredLevels:
                    type: integer
                    format: int32
                    minimum: 0
                    maximum: 0
                required:
                - submissionId
                - state
              example:
                submissionId: 0192f2c0-7a00-7000-8000-0000000000b1
                state: APPROVED
                approvalId: null
                requiredLevels: 0
        '202':
          description: proposal recorded (decision-mode MAKER_CHECKER, R1)
          content:
            application/json:
              schema:
                type: object
                additionalProperties: true
                properties:
                  submissionId:
                    type: string
                    format: uuid
                    pattern: ^[0-9a-f]{8}-[0-9a-f]{4}-[0-9a-f]{4}-[0-9a-f]{4}-[0-9a-f]{12}$
                  state:
                    type: string
                    enum:
                    - PENDING_APPROVAL
                  approvalId:
                    type: string
                    format: uuid
                    pattern: ^[0-9a-f]{8}-[0-9a-f]{4}-[0-9a-f]{4}-[0-9a-f]{4}-[0-9a-f]{12}$
                  requiredLevels:
                    type: integer
                    format: int32
                    minimum: 1
                    maximum: 2
                required:
                - submissionId
                - state
                - approvalId
                - requiredLevels
              example:
                submissionId: 0192f2c0-7a00-7000-8000-0000000000b1
                state: PENDING_APPROVAL
                approvalId: 0192f400-1111-7000-8000-00000000b001
                requiredLevels: 1
        '400':
          description: VALIDATION_FAILED — EDD fields missing for HIGH / PEP, tier missing
          content:
            application/problem+json:
              schema:
                allOf:
                - $ref: '#/components/schemas/Problem'
                - properties:
                    code:
                      type: string
                      enum:
                      - VALIDATION_FAILED
        '403':
          description: ACTOR_NOT_ALLOWED — actor type, role or caller not permitted
          content:
            application/problem+json:
              schema:
                allOf:
                - $ref: '#/components/schemas/Problem'
                - properties:
                    code:
                      type: string
                      enum:
                      - ACTOR_NOT_ALLOWED
        '404':
          description: NOT_FOUND — path entity missing (or not visible to the actor)
          content:
            application/problem+json:
              schema:
                allOf:
                - $ref: '#/components/schemas/Problem'
                - properties:
                    code:
                      type: string
                      enum:
                      - NOT_FOUND
        '409':
          description: STATE_CONFLICT — not in PENDING_REVIEW / gate no longer satisfied
          content:
            application/problem+json:
              schema:
                allOf:
                - $ref: '#/components/schemas/Problem'
                - properties:
                    code:
                      type: string
