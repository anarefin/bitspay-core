  /v1/wallets/{walletId}/status-changes:
    post:
      operationId: changeWalletStatus
      tags:
      - wallet
      summary: Add / lift a restriction, set dormancy or reactivate (BR-W-10..16).
      description: 'Applied immediately only for SERVICE/SYSTEM callers in the immediate-apply table (§7.2 BR-W-11): compliance-service AML_FREEZE
        / FRAUD_FREEZE (BLOCKED, DEBIT_BLOCKED, ACTIVE = lift that freeze); limits-risk-service FRAUD_FREEZE (reserved, not called in R1). Everything
        else creates a `WalletStatusChange / APPLY` approval and returns 202. admin-service is reserved (not called in R1). SERVICE compliance-service
        sends only `FREEZE <reference>` / `LIFT <reference>` as comment (no narrative).'
      x-audience: service
      x-actors:
      - type: STAFF
        roles:
        - SUP_AGENT
        - SUP_MAKER
        - OPS_MAKER
        - RISK_ANALYST
        - COMPLIANCE_OFFICER
      - type: SERVICE
        actorIds:
        - support-service
        - compliance-service
        - limits-risk-service
        - admin-service
      - type: SYSTEM
        actorIds:
        - wallet-service
      x-module: wallet
      x-release: R1
      x-idempotency: optional
      x-forwarded-actor-context: '`support-service` (and `compliance-service` on reads) may forward the staff context: `X-Actor-Type: SERVICE`,
        `X-Actor-Id: <service>`, `X-Actor-Roles: <staff roles>`, `X-Actor-User-Id: <staff uuid>`. Authority and masking are evaluated on the forwarded
        roles; the maker is the forwarded user id.'
      parameters:
      - $ref: '#/components/parameters/XCorrelationId'
      - $ref: '#/components/parameters/XActorType'
      - $ref: '#/components/parameters/XActorId'
      - $ref: '#/components/parameters/XActorWalletId'
      - $ref: '#/components/parameters/XActorRoles'
      - $ref: '#/components/parameters/XActorUserId'
      - $ref: '#/components/parameters/XChannel'
      - $ref: '#/components/parameters/XDeviceId'
      - $ref: '#/components/parameters/Traceparent'
      - $ref: '#/components/parameters/IdempotencyKeyOptional'
      - name: walletId
        in: path
        required: true
        schema:
          type: string
          format: uuid
          pattern: ^[0-9a-f]{8}-[0-9a-f]{4}-[0-9a-f]{4}-[0-9a-f]{4}-[0-9a-f]{12}$
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              additionalProperties: true
              properties:
                targetStatus:
                  type: string
                  description: '`BLOCKED|DEBIT_BLOCKED|CREDIT_BLOCKED|ACTIVE|DORMANT` or code `F|X|C|A|D`; `PENDING_KYC`/`PENDING_CLOSURE`/`CLOSED`
                    → 409 TARGET_NOT_ALLOWED'
                reasonCode:
                  type: string
                  pattern: ^[A-Z_]{3,40}$
                  description: a wallet status reason the actor has authority for
                reference:
                  type:
                  - string
                  - 'null'
                  maxLength: 64
                  description: mandatory for COURT_ORDER, REGULATORY_INSTRUCTION, AML_FREEZE, FRAUD_FREEZE on add and on lift
                comment:
                  type: string
                  minLength: 1
                  maxLength: 500
              required:
              - targetStatus
              - reasonCode
              - comment
            example:
              targetStatus: BLOCKED
              reasonCode: AML_FREEZE
              reference: CASE-2026-000045
              comment: FREEZE CASE-2026-000045
      responses:
        '200':
          description: APPLIED or NOOP
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/StatusChangeResult'
              example:
                changeRequestId: 0192f400-2222-7000-8000-00000000a002
                walletId: 0192f2bb-4d5f-7c62-9b3e-6f1a4dac8b12
                outcome: APPLIED
                approvalId: null
                walletStatus: F
                walletVersion: 8813
        '202':
          description: PENDING_APPROVAL
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/StatusChangeResult'
              example:
                changeRequestId: 0192f400-1111-7000-8000-00000000a001
                walletId: 0192f2aa-1c3e-7b51-8a2d-5e0f3c9b7a01
                outcome: PENDING_APPROVAL
                approvalId: 0192f400-1111-7000-8000-00000000b001
                walletStatus: A
                walletVersion: 8813
        '400':
          description: VALIDATION_FAILED — unknown reason, missing reference on add or lift
          content:
            application/problem+json:
              schema:
                allOf:
                - $ref: '#/components/schemas/Problem'
                - properties:
                    code:
                      type: string
                      enum:
                      - VALIDATION_FAILED
        '403':
          description: ACTOR_NOT_ALLOWED — no authority for the reason (REASON_AUTHORITY)
          content:
            application/problem+json:
              schema:
                allOf:
                - $ref: '#/components/schemas/Problem'
                - properties:
                    code:
                      type: string
                      enum:
                      - ACTOR_NOT_ALLOWED
        '404':
          description: NOT_FOUND — path entity missing (or not visible to the actor)
          content:
            application/problem+json:
              schema:
                allOf:
                - $ref: '#/components/schemas/Problem'
                - properties:
                    code:
                      type: string
                      enum:
                      - NOT_FOUND
        '409':
          description: STATE_CONFLICT — `changeRequestId` carries the pending request when reason = ALREADY_PENDING; IDEMPOTENCY_CONFLICT — same
            key, different body
          content:
            application/problem+json:
              schema:
                allOf:
                - $ref: '#/components/schemas/Problem'
                - properties:
                    code:
                      type: string
                      enum:
                      - IDEMPOTENCY_CONFLICT
                      - STATE_CONFLICT
                    reason:
                      type:
                      - string
                      - 'null'
                      enum:
                      - ALREADY_PENDING
                      - OPEN_REGULATORY_FREEZE
                      - REKYC_REQUIRED
                      - TARGET_NOT_ALLOWED
                      - WALLET_CLOSED
                      - null
                    changeRequestId:
                      type: string
                      format: uuid
