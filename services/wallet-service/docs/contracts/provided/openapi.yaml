openapi: 3.1.0
info:
  title: wallet-service — provided API
  version: 1.2.0
  description: 'Every operation served by wallet-service (modules wallet and partner), incl. staff, channel and internal/test operations. Kernel
    1.0 rules apply (headers K3.1, idempotency K3.3, pagination K3.4, problem+json K3.6, maker-checker K5). x-audience: service | staff | customer
    | partner | internal. x-actors: allowed actor types, roles and SERVICE X-Actor-Id values.'
servers:
- url: http://wallet-service:8103
  description: Compose stack
- url: http://localhost:8103
  description: local / hybrid
tags:
- name: wallet
  description: wallet module (customers, KYC, wallets, lifecycle, status cache)
- name: partner
  description: partner module (agents, merchants, distributors, institutions, billers and the biller catalogue, hierarchy, Bangla QR)
- name: approvals
  description: shared maker-checker engine (kernel K5)
- name: internal
  description: test and operations support (x-audience internal)
paths:
  /v1/wallets:
    post:
      operationId: createWallet
      tags:
      - wallet
      summary: Create a wallet (ledger account first).
      description: 'Natural idempotency on (ownerType, ownerId, walletType): a repeat returns the same wallet (200). Customer wallets are created
        only by registration / pre-registration; `ownerType=CUSTOMER` from outside → 403. Partner wallets are created in-process by the partner
        module through the same use case.'
      x-audience: staff
      x-actors:
      - type: STAFF
        roles:
        - ADMIN
      - type: SYSTEM
        actorIds:
        - wallet-service
      x-module: wallet
      x-release: R1
      x-idempotency: natural on (ownerType, ownerId, walletType); `Idempotency-Key` optional
      parameters:
      - $ref: '#/components/parameters/XCorrelationId'
      - $ref: '#/components/parameters/XActorType'
      - $ref: '#/components/parameters/XActorId'
      - $ref: '#/components/parameters/XActorWalletId'
      - $ref: '#/components/parameters/XActorRoles'
      - $ref: '#/components/parameters/XActorUserId'
      - $ref: '#/components/parameters/XChannel'
      - $ref: '#/components/parameters/XDeviceId'
      - $ref: '#/components/parameters/Traceparent'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              additionalProperties: true
              properties:
                ownerType:
                  type: string
                  enum:
                  - CUSTOMER
                  - AGENT
                  - MERCHANT
                  - DISTRIBUTOR
                  - INSTITUTION
                  - BILLER
                  description: must match walletType; `CUSTOMER` from outside → 403
                ownerId:
                  type: string
                  format: uuid
                  pattern: ^[0-9a-f]{8}-[0-9a-f]{4}-[0-9a-f]{4}-[0-9a-f]{4}-[0-9a-f]{12}$
                  description: customerId / partnerId
                walletType:
                  type: string
                  description: code `C|A|D|M|I|B` or name; CUSTOMER↔C AGENT↔A MERCHANT↔M DISTRIBUTOR↔D INSTITUTION↔I BILLER↔B
                msisdn:
                  type: string
                  description: accepts `01…`, `880…`, `+880…`; normalised; unique among non-CLOSED wallets
                categoryCode:
                  type:
                  - integer
                  - 'null'
                  format: int32
                  minimum: 0
                  maximum: 99999
                  description: codes.yaml categoryCode; 0/absent for C
                displayName:
                  type: string
                  minLength: 1
                  maxLength: 100
              required:
              - ownerType
              - ownerId
              - walletType
              - msisdn
              - displayName
            example:
              ownerType: MERCHANT
              ownerId: 0192f4a0-0e01-7c00-8a00-00000000e001
              walletType: M
              msisdn: '8801812000111'
              categoryCode: 3101
              displayName: Nirob Store
      responses:
        '201':
          description: created
          content:
            application/json:
              schema:
                type: object
                additionalProperties: true
                properties:
                  walletId:
                    type: string
                    format: uuid
                    pattern: ^[0-9a-f]{8}-[0-9a-f]{4}-[0-9a-f]{4}-[0-9a-f]{4}-[0-9a-f]{12}$
                    description: UUIDv7 = ledger account id
                  status:
                    type: string
                    enum:
                    - P
                    - A
                    - D
                    description: partner → A, customer → P, pre-registered → D
                required:
                - walletId
                - status
              example:
                walletId: 0192f2dd-3a4b-7c5d-8e6f-708192a3b4c5
                status: A
        '200':
          description: already existed (same walletId)
          content:
            application/json:
              schema:
                type: object
                additionalProperties: true
                properties:
                  walletId:
                    type: string
                    format: uuid
                    pattern: ^[0-9a-f]{8}-[0-9a-f]{4}-[0-9a-f]{4}-[0-9a-f]{4}-[0-9a-f]{12}$
                  status:
                    type: string
                    enum:
                    - P
                    - A
                    - D
                required:
                - walletId
                - status
              example:
                walletId: 0192f2dd-3a4b-7c5d-8e6f-708192a3b4c5
                status: A
        '400':
          description: VALIDATION_FAILED — malformed header, parameter or body
          content:
            application/problem+json:
              schema:
                allOf:
                - $ref: '#/components/schemas/Problem'
                - properties:
                    code:
                      type: string
                      enum:
                      - VALIDATION_FAILED
        '403':
          description: ACTOR_NOT_ALLOWED — actor type, role or caller not permitted
          content:
            application/problem+json:
              schema:
                allOf:
                - $ref: '#/components/schemas/Problem'
                - properties:
                    code:
                      type: string
                      enum:
                      - ACTOR_NOT_ALLOWED
        '409':
          description: STATE_CONFLICT — MSISDN uniqueness / cooling / owner already has another MSISDN
          content:
            application/problem+json:
              schema:
                allOf:
                - $ref: '#/components/schemas/Problem'
                - properties:
                    code:
                      type: string
                      enum:
                      - STATE_CONFLICT
                    reason:
                      type:
                      - string
                      - 'null'
                      enum:
                      - DUPLICATE_MSISDN
                      - MSISDN_COOLING
                      - OWNER_HAS_DIFFERENT_MSISDN
                      - null
        '503':
          description: 'DEPENDENCY_UNAVAILABLE — ledger down: row kept LEDGER_PENDING, retry returns the same walletId'
          content:
            application/problem+json:
              schema:
                allOf:
                - $ref: '#/components/schemas/Problem'
                - properties:
                    code:
                      type: string
                      enum:
                      - DEPENDENCY_UNAVAILABLE
  /v1/wallets/{walletId}:
    get:
      operationId: getWallet
      tags:
      - wallet
      summary: Wallet detail.
      description: 'Holder actors read only their own wallet (X-Actor-Wallet-Id = walletId or own ownerId); an INSTITUTION actor must own an `I`
        wallet. MSISDN masking per BR-W-68; tipping-off: holder actors receive `statusReasonCode = RESTRICTED` for AML_FREEZE / REGULATORY_INSTRUCTION
        / COURT_ORDER. A caller that keeps a contact copy overwrites it only when `version` is newer.'
      x-audience: service
      x-actors:
      - type: CUSTOMER
        scope: own wallet
      - type: AGENT
        scope: own wallet
      - type: MERCHANT
        scope: own wallet
      - type: DISTRIBUTOR
        scope: own wallet
      - type: INSTITUTION
        scope: own wallet
      - type: STAFF
        roles:
        - '*'
      - type: SERVICE
        actorIds:
        - treasury-service
        - support-service
        - compliance-service
        - finance-ops-service
        - admin-service
        - disbursement-service
      - type: SYSTEM
      x-module: wallet
      x-release: R1
      x-idempotency: none
      x-forwarded-actor-context: '`support-service` (and `compliance-service` on reads) may forward the staff context: `X-Actor-Type: SERVICE`,
        `X-Actor-Id: <service>`, `X-Actor-Roles: <staff roles>`, `X-Actor-User-Id: <staff uuid>`. Authority and masking are evaluated on the forwarded
        roles; the maker is the forwarded user id.'
      parameters:
      - $ref: '#/components/parameters/XCorrelationId'
      - $ref: '#/components/parameters/XActorType'
      - $ref: '#/components/parameters/XActorId'
      - $ref: '#/components/parameters/XActorWalletId'
      - $ref: '#/components/parameters/XActorRoles'
      - $ref: '#/components/parameters/XActorUserId'
      - $ref: '#/components/parameters/XChannel'
      - $ref: '#/components/parameters/XDeviceId'
      - $ref: '#/components/parameters/Traceparent'
      - name: walletId
        in: path
        required: true
        schema:
          type: string
          format: uuid
          pattern: ^[0-9a-f]{8}-[0-9a-f]{4}-[0-9a-f]{4}-[0-9a-f]{4}-[0-9a-f]{12}$
      responses:
        '200':
          description: success
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/WalletDetail'
              example:
                walletId: 0192f2bb-4d5f-7c62-9b3e-6f1a4dac8b12
                ownerType: CUSTOMER
                ownerId: 0192f2a0-5b1c-7d10-8e11-0a1b2c3d4e02
                msisdn: '8801711000000'
                displayName: Karim Ahmed
                language: bn
                status: A
                statusName: ACTIVE
                statusReasonCode: KYC_APPROVED
                kycTier: 1
                walletType: C
                walletTypeName: CUSTOMER
                categoryCode: 0
                flags: 0
                version: 8812
                createdAt: '2026-10-09T05:10:00.000Z'
                updatedAt: '2026-10-09T06:00:00.000Z'
        '400':
          description: VALIDATION_FAILED — malformed header, parameter or body
          content:
            application/problem+json:
              schema:
                allOf:
                - $ref: '#/components/schemas/Problem'
                - properties:
                    code:
                      type: string
                      enum:
                      - VALIDATION_FAILED
        '403':
          description: ACTOR_NOT_ALLOWED — actor type, role or caller not permitted
          content:
            application/problem+json:
              schema:
                allOf:
                - $ref: '#/components/schemas/Problem'
                - properties:
                    code:
                      type: string
                      enum:
                      - ACTOR_NOT_ALLOWED
        '404':
          description: NOT_FOUND — unknown or not READY
          content:
            application/problem+json:
              schema:
                allOf:
                - $ref: '#/components/schemas/Problem'
                - properties:
                    code:
                      type: string
                      enum:
                      - NOT_FOUND
  /v1/wallets/{walletId}/status:
    get:
      operationId: getWalletStatus
      tags:
      - wallet
      summary: Status object — the status-cache miss fallback.
      description: Served from the primary (never a replica), one PK lookup, no outbound call; after responding a read-repair CAS of the same
        tuple is queued (BR-W-53).
      x-audience: service
      x-actors:
      - type: SERVICE
        actorIds:
        - transaction-service
        - disbursement-service
        - pricing-service
      - type: SYSTEM
      - type: STAFF
        roles:
        - '*'
      x-module: wallet
      x-release: R1
      x-idempotency: none
      parameters:
      - $ref: '#/components/parameters/XCorrelationId'
      - $ref: '#/components/parameters/XActorType'
      - $ref: '#/components/parameters/XActorId'
      - $ref: '#/components/parameters/XActorWalletId'
      - $ref: '#/components/parameters/XActorRoles'
      - $ref: '#/components/parameters/XActorUserId'
      - $ref: '#/components/parameters/XChannel'
      - $ref: '#/components/parameters/XDeviceId'
      - $ref: '#/components/parameters/Traceparent'
      - name: walletId
        in: path
        required: true
        schema:
          type: string
          format: uuid
          pattern: ^[0-9a-f]{8}-[0-9a-f]{4}-[0-9a-f]{4}-[0-9a-f]{4}-[0-9a-f]{12}$
      responses:
        '200':
          description: success
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/WalletStatus'
              example:
                walletId: 0192f2aa-1c3e-7b51-8a2d-5e0f3c9b7a01
                version: 8813
                status: A
                kycTier: 2
                walletType: C
                categoryCode: 0
                flags: 0
        '400':
          description: VALIDATION_FAILED — malformed header, parameter or body
          content:
            application/problem+json:
              schema:
                allOf:
                - $ref: '#/components/schemas/Problem'
                - properties:
                    code:
                      type: string
                      enum:
                      - VALIDATION_FAILED
        '403':
          description: ACTOR_NOT_ALLOWED — actor type, role or caller not permitted
          content:
            application/problem+json:
              schema:
                allOf:
                - $ref: '#/components/schemas/Problem'
                - properties:
                    code:
                      type: string
                      enum:
                      - ACTOR_NOT_ALLOWED
        '404':
          description: NOT_FOUND — unknown or not READY (the reader may write `wsn:`)
          content:
            application/problem+json:
              schema:
                allOf:
                - $ref: '#/components/schemas/Problem'
                - properties:
                    code:
                      type: string
                      enum:
                      - NOT_FOUND
        '503':
          description: DEPENDENCY_UNAVAILABLE — database unavailable
          content:
            application/problem+json:
              schema:
                allOf:
                - $ref: '#/components/schemas/Problem'
                - properties:
                    code:
                      type: string
                      enum:
                      - DEPENDENCY_UNAVAILABLE
  /v1/wallets/status:batchGet:
    post:
      operationId: batchGetWalletStatus
      tags:
      - wallet
      summary: Status objects for up to 1,000 wallets.
      description: One `WHERE wallet_id = ANY(?)` query on the primary. Duplicates ignored. `notFound` includes not-yet-READY wallets; callers
        treat them as not eligible and do not retry within the same call.
      x-audience: service
      x-actors:
      - type: SERVICE
        actorIds:
        - disbursement-service
        - pricing-service
        - transaction-service
      - type: SYSTEM
      - type: STAFF
        roles:
        - '*'
      x-module: wallet
      x-release: R1
      x-idempotency: none
      parameters:
      - $ref: '#/components/parameters/XCorrelationId'
      - $ref: '#/components/parameters/XActorType'
      - $ref: '#/components/parameters/XActorId'
      - $ref: '#/components/parameters/XActorWalletId'
      - $ref: '#/components/parameters/XActorRoles'
      - $ref: '#/components/parameters/XActorUserId'
      - $ref: '#/components/parameters/XChannel'
      - $ref: '#/components/parameters/XDeviceId'
      - $ref: '#/components/parameters/Traceparent'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              additionalProperties: true
              properties:
                walletIds:
                  type: array
                  items:
                    type: string
                    format: uuid
                    pattern: ^[0-9a-f]{8}-[0-9a-f]{4}-[0-9a-f]{4}-[0-9a-f]{4}-[0-9a-f]{12}$
                  minItems: 1
                  maxItems: 1000
              required:
              - walletIds
            example:
              walletIds:
              - 0192f2aa-1c3e-7b51-8a2d-5e0f3c9b7a01
              - 0192f2bb-4d5f-7c62-9b3e-6f1a4dac8b12
              - 0192f2ff-0000-7000-8000-000000000999
      responses:
        '200':
          description: success
          content:
            application/json:
              schema:
                type: object
                additionalProperties: true
                properties:
                  items:
                    type: array
                    items:
                      $ref: '#/components/schemas/WalletStatus'
                  notFound:
                    type: array
                    items:
                      type: string
                      format: uuid
                      pattern: ^[0-9a-f]{8}-[0-9a-f]{4}-[0-9a-f]{4}-[0-9a-f]{4}-[0-9a-f]{12}$
                required:
                - items
                - notFound
              example:
                items:
                - walletId: 0192f2aa-1c3e-7b51-8a2d-5e0f3c9b7a01
                  version: 8813
                  status: A
                  kycTier: 2
                  walletType: C
                  categoryCode: 0
                  flags: 0
                - walletId: 0192f2bb-4d5f-7c62-9b3e-6f1a4dac8b12
                  version: 8812
                  status: A
                  kycTier: 1
                  walletType: C
                  categoryCode: 0
                  flags: 0
                notFound:
                - 0192f2ff-0000-7000-8000-000000000999
        '400':
          description: VALIDATION_FAILED — 0 or > 1000 ids, malformed uuid
          content:
            application/problem+json:
              schema:
                allOf:
                - $ref: '#/components/schemas/Problem'
                - properties:
                    code:
                      type: string
                      enum:
                      - VALIDATION_FAILED
        '403':
          description: ACTOR_NOT_ALLOWED — actor type, role or caller not permitted
          content:
            application/problem+json:
              schema:
                allOf:
                - $ref: '#/components/schemas/Problem'
                - properties:
                    code:
                      type: string
                      enum:
                      - ACTOR_NOT_ALLOWED
  /v1/wallets/lookup:
    get:
      operationId: lookupWallet
      tags:
      - wallet
      summary: Find the READY, non-CLOSED wallet of an MSISDN (confirmation screen).
      description: Cache-aside `wlk:` → `wd:` (BR-W-56). Name matching is not supported.
      x-audience: service
      x-actors:
      - type: CUSTOMER
        scope: own wallet
      - type: AGENT
        scope: own wallet
      - type: MERCHANT
        scope: own wallet
      - type: DISTRIBUTOR
        scope: own wallet
      - type: INSTITUTION
        scope: own wallet
      - type: SERVICE
        actorIds:
        - disbursement-service
        - treasury-service
        - support-service
      - type: STAFF
        roles:
        - '*'
      x-module: wallet
      x-release: R1
      x-idempotency: none
      parameters:
      - $ref: '#/components/parameters/XCorrelationId'
      - $ref: '#/components/parameters/XActorType'
      - $ref: '#/components/parameters/XActorId'
      - $ref: '#/components/parameters/XActorWalletId'
      - $ref: '#/components/parameters/XActorRoles'
      - $ref: '#/components/parameters/XActorUserId'
      - $ref: '#/components/parameters/XChannel'
      - $ref: '#/components/parameters/XDeviceId'
      - $ref: '#/components/parameters/Traceparent'
      - name: msisdn
        in: query
        required: true
        schema:
          type: string
        description: accepts `01…`, `880…`, `+880…`; normalised
      - name: walletType
        in: query
        required: false
        schema:
          type: string
        description: code `C|A|D|M|I|B` or name; default `C`
      responses:
        '200':
          description: success
          content:
            application/json:
              schema:
                type: object
                additionalProperties: true
                properties:
                  walletId:
                    type: string
                    format: uuid
                    pattern: ^[0-9a-f]{8}-[0-9a-f]{4}-[0-9a-f]{4}-[0-9a-f]{4}-[0-9a-f]{12}$
                  displayNameMasked:
                    type: string
                    description: 'C: first name + initial + `***`; A/M/D/I/B: full display name'
                  walletType:
                    type: string
                    enum:
                    - C
                    - A
                    - D
                    - M
                    - I
                    - B
                  status:
                    type: string
                    enum:
                    - P
                    - A
                    - D
                    - X
                    - C
                    - F
                    - Q
                    description: never Z
                required:
                - walletId
                - displayNameMasked
                - walletType
                - status
              example:
                walletId: 0192f2bb-4d5f-7c62-9b3e-6f1a4dac8b12
                displayNameMasked: Karim A***
                walletType: C
                status: A
        '400':
          description: VALIDATION_FAILED — malformed MSISDN or walletType
          content:
            application/problem+json:
              schema:
                allOf:
                - $ref: '#/components/schemas/Problem'
                - properties:
                    code:
                      type: string
                      enum:
                      - VALIDATION_FAILED
        '403':
          description: ACTOR_NOT_ALLOWED — actor type, role or caller not permitted
          content:
            application/problem+json:
              schema:
                allOf:
                - $ref: '#/components/schemas/Problem'
                - properties:
                    code:
                      type: string
                      enum:
                      - ACTOR_NOT_ALLOWED
        '404':
          description: NOT_FOUND — no READY non-CLOSED wallet
          content:
            application/problem+json:
              schema:
                allOf:
                - $ref: '#/components/schemas/Problem'
                - properties:
                    code:
                      type: string
                      enum:
                      - NOT_FOUND
  /v1/wallets/lookup:batch:
    post:
      operationId: batchLookupWallets
      tags:
      - wallet
      summary: Batch MSISDN lookup (one item per MSISDN, same order).
      description: 'Read-only. A malformed MSISDN gives a null item, never a 400. Not READY or CLOSED → `walletId: null`.'
      x-audience: service
      x-actors:
      - type: SERVICE
        actorIds:
        - disbursement-service
      - type: STAFF
        roles:
        - '*'
      x-module: wallet
      x-release: R1
      x-idempotency: none
      parameters:
      - $ref: '#/components/parameters/XCorrelationId'
      - $ref: '#/components/parameters/XActorType'
      - $ref: '#/components/parameters/XActorId'
      - $ref: '#/components/parameters/XActorWalletId'
      - $ref: '#/components/parameters/XActorRoles'
      - $ref: '#/components/parameters/XActorUserId'
      - $ref: '#/components/parameters/XChannel'
      - $ref: '#/components/parameters/XDeviceId'
      - $ref: '#/components/parameters/Traceparent'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              additionalProperties: true
              properties:
                walletType:
                  type: string
                  description: code `C|A|D|M|I|B` or name
                msisdns:
                  type: array
                  items:
                    type: string
                  minItems: 1
                  maxItems: 1000
                  description: each accepts `01…`, `880…`, `+880…`
              required:
              - walletType
              - msisdns
            example:
              walletType: C
              msisdns:
              - '8801711000000'
              - '01755000017'
      responses:
        '200':
          description: success
          content:
            application/json:
              schema:
                type: object
                additionalProperties: true
                properties:
                  items:
                    type: array
                    items:
                      type: object
                      additionalProperties: true
                      properties:
                        msisdn:
                          type: string
                          description: echoed exactly as sent
                        walletId:
                          type:
                          - string
                          - 'null'
                          format: uuid
                          pattern: ^[0-9a-f]{8}-[0-9a-f]{4}-[0-9a-f]{4}-[0-9a-f]{4}-[0-9a-f]{12}$
                          description: null = not found or malformed entry
                        walletType:
                          type: string
                          enum:
                          - C
                          - A
                          - D
                          - M
                          - I
                          - B
                        status:
                          type:
                          - string
                          - 'null'
                          enum:
                          - P
                          - A
                          - D
                          - X
                          - C
                          - F
                          - Q
                          - null
                          description: null iff walletId null
                        displayNameMasked:
                          type:
                          - string
                          - 'null'
                          description: null iff walletId null
                      required:
                      - msisdn
                      - walletId
                      - walletType
                      - status
                      - displayNameMasked
                required:
                - items
              example:
                items:
                - msisdn: '8801711000000'
                  walletId: 0192f2bb-4d5f-7c62-9b3e-6f1a4dac8b12
                  walletType: C
                  status: A
                  displayNameMasked: Karim A***
                - msisdn: '01755000017'
                  walletId: null
                  walletType: C
                  status: null
                  displayNameMasked: null
        '400':
          description: VALIDATION_FAILED — 0 or > 1000 msisdns, invalid walletType
          content:
            application/problem+json:
              schema:
                allOf:
