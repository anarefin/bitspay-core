  parameters:
    XCorrelationId:
      name: X-Correlation-Id
      in: header
      required: false
      schema:
        type: string
        maxLength: 64
        pattern: ^[A-Za-z0-9._-]+$
      description: Kernel K3.1; generated when absent; echoed.
    XActorType:
      name: X-Actor-Type
      in: header
      required: true
      schema:
        type: string
        enum:
        - CUSTOMER
        - AGENT
        - MERCHANT
        - DISTRIBUTOR
        - INSTITUTION
        - STAFF
        - SYSTEM
        - SERVICE
    XActorId:
      name: X-Actor-Id
      in: header
      required: true
      schema:
        type: string
        maxLength: 64
    XActorWalletId:
      name: X-Actor-Wallet-Id
      in: header
      required: false
      schema:
        type: string
        format: uuid
      description: Required for wallet-holder actors.
    XActorRoles:
      name: X-Actor-Roles
      in: header
      required: false
      schema:
        type: string
      description: Comma-separated kernel K7 role codes; required for STAFF; forwarded staff roles for SERVICE callers listed in x-forwarded-actor-context.
    XActorUserId:
      name: X-Actor-User-Id
      in: header
      required: false
      schema:
        type: string
        maxLength: 64
        pattern: ^[A-Za-z0-9_-]+$
    XChannel:
      name: X-Channel
      in: header
      required: true
      schema:
        type: string
        enum:
        - APP
        - USSD
        - PARTNER_APP
        - PORTAL
        - BACKOFFICE
        - API
        - SYSTEM
    XDeviceId:
      name: X-Device-Id
      in: header
      required: false
      schema:
        type: string
        maxLength: 128
    Traceparent:
      name: traceparent
      in: header
      required: false
      schema:
        type: string
    IdempotencyKeyRequired:
      name: Idempotency-Key
      in: header
      required: true
      schema:
        type: string
        maxLength: 64
        pattern: ^[A-Za-z0-9_-]+$
      description: Kernel K3.3; scope (X-Actor-Id, key); retention 7 days.
    IdempotencyKeyOptional:
      name: Idempotency-Key
      in: header
      required: false
      schema:
        type: string
        maxLength: 64
        pattern: ^[A-Za-z0-9_-]+$
      description: Kernel K3.3; honoured when present; scope (X-Actor-Id, key).
    Limit:
      name: limit
      in: query
      required: false
      schema:
        type: integer
        minimum: 1
        maximum: 200
        default: 50
    Cursor:
      name: cursor
      in: query
      required: false
      schema:
        type: string
      description: Opaque, 24 h, same endpoint/actor/filters (kernel K3.4).
