      description: '≤ 1,000 rows; rows processed in chunks of 200 per transaction; created wallets are `D` with flag 4. A returned walletId is
        usable only once GET …/status or status:batchGet returns it. Callers use `Idempotency-Key: prereg-{batchId}-{groupNo}`. Unknown fields
