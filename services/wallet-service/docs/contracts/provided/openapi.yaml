      - $ref: '#/components/parameters/XActorId'
      - $ref: '#/components/parameters/XActorWalletId'
      - $ref: '#/components/parameters/XActorRoles'
      - $ref: '#/components/parameters/XActorUserId'
      - $ref: '#/components/parameters/XChannel'
      - $ref: '#/components/parameters/XDeviceId'
      - $ref: '#/components/parameters/Traceparent'
      - $ref: '#/components/parameters/IdempotencyKeyRequired'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              additionalProperties: true
              properties:
                institutionId:
                  type: string
                  format: uuid
                  pattern: ^[0-9a-f]{8}-[0-9a-f]{4}-[0-9a-f]{4}-[0-9a-f]{4}-[0-9a-f]{12}$
                  description: INSTITUTION partnerId
                rows:
                  type: array
                  items:
                    type: object
                    additionalProperties: true
                    properties:
                      rowRef:
                        type: string
                        maxLength: 32
                        description: unique within the request; JSON string
                      msisdn:
                        type: string
                        description: accepts `01…`, `880…`, `+880…`
                      nameEn:
                        type:
                        - string
                        - 'null'
                        minLength: 1
                        maxLength: 100
                      nidLast4:
                        type:
                        - string
                        - 'null'
                        pattern: ^[0-9]{4}$
                    required:
                    - rowRef
                    - msisdn
                  minItems: 1
                  maxItems: 1000
              required:
              - institutionId
              - rows
            example:
              institutionId: 0192f2e0-0000-7000-8000-00000000e100
              rows:
              - rowRef: '17'
                msisdn: '8801755000017'
                nameEn: Shila Akter
                nidLast4: '4421'
              - rowRef: '18'
                msisdn: '8801711000000'
                nameEn: Karim Ahmed
      responses:
        '200':
          description: success
          content:
            application/json:
              schema:
                type: object
                additionalProperties: true
                properties:
                  results:
                    type: array
                    items:
                      type: object
                      additionalProperties: true
                      properties:
                        rowRef:
                          type: string
                        result:
                          type: string
                          enum:
                          - CREATED
                          - EXISTS
                          - REJECTED
                        reason:
                          type:
                          - string
                          - 'null'
                          enum:
                          - INVALID_MSISDN
                          - MSISDN_COOLING
                          - CLOSED_WALLET
                          - null
                          description: non-null iff REJECTED
                        customerId:
                          type:
                          - string
                          - 'null'
                          format: uuid
                          pattern: ^[0-9a-f]{8}-[0-9a-f]{4}-[0-9a-f]{4}-[0-9a-f]{4}-[0-9a-f]{12}$
                        walletId:
                          type:
                          - string
                          - 'null'
                          format: uuid
                          pattern: ^[0-9a-f]{8}-[0-9a-f]{4}-[0-9a-f]{4}-[0-9a-f]{4}-[0-9a-f]{12}$
                        status:
                          type:
                          - string
                          - 'null'
                          enum:
                          - D
                          - P
                          - A
                          - X
                          - C
                          - F
                          - null
                      required:
                      - rowRef
                      - result
                      - reason
                      - customerId
                      - walletId
                      - status
                  created:
                    type: integer
                    format: int32
                    minimum: 0
                  existing:
                    type: integer
                    format: int32
                    minimum: 0
                  rejected:
                    type: integer
                    format: int32
                    minimum: 0
                required:
                - results
                - created
                - existing
                - rejected
              example:
                results:
                - rowRef: '17'
                  result: CREATED
                  reason: null
                  customerId: 0192f500-0000-7000-8000-000000000017
                  walletId: 0192f501-0000-7000-8000-000000000017
                  status: D
                - rowRef: '18'
                  result: EXISTS
                  reason: null
                  customerId: 0192f2a0-5b1c-7d10-8e11-0a1b2c3d4e02
                  walletId: 0192f2bb-4d5f-7c62-9b3e-6f1a4dac8b12
                  status: A
                created: 1
                existing: 1
                rejected: 0
        '400':
          description: VALIDATION_FAILED — malformed header, parameter or body
          content:
            application/problem+json:
              schema:
                allOf:
                - $ref: '#/components/schemas/Problem'
                - properties:
