        '200':
          description: applied
          content:
            application/json:
              schema:
                type: object
                additionalProperties: true
                properties:
                  items:
                    type: array
                    items:
                      $ref: '#/components/schemas/Nominee'
                required:
                - items
              example:
                items:
                - nomineeId: 0192f2d6-0000-7000-8000-0000000000a6
                  name: Ayesha Begum
                  relationship: SPOUSE
                  idType: NID
                  idMasked: '******1234'
                  shareBps: 10000
                  dob: '1990-04-12'
        '202':
          description: pending approval
          content:
            application/json:
              schema:
                type: object
                additionalProperties: true
                properties:
                  changeRequestId:
                    type: string
                    format: uuid
                    pattern: ^[0-9a-f]{8}-[0-9a-f]{4}-[0-9a-f]{4}-[0-9a-f]{4}-[0-9a-f]{12}$
                  approvalId:
                    type: string
                    format: uuid
                    pattern: ^[0-9a-f]{8}-[0-9a-f]{4}-[0-9a-f]{4}-[0-9a-f]{4}-[0-9a-f]{12}$
                  outcome:
                    type: string
                    enum:
                    - PENDING_APPROVAL
                required:
                - changeRequestId
                - approvalId
                - outcome
              example:
                changeRequestId: 0192f400-1111-7000-8000-00000000a001
                approvalId: 0192f400-1111-7000-8000-00000000b001
                outcome: PENDING_APPROVAL
        '400':
          description: VALIDATION_FAILED — shares do not sum to 10000
