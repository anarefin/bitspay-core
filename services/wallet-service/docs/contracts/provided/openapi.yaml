  /v1/wallets/{walletId}/closures:
    post:
      operationId: requestClosure
      tags:
      - wallet
      summary: Start a closure; runs the pre-checks (BR-W-40).
      description: All pass → PENDING_APPROVAL (`WalletClosure / CLOSE`); only BALANCE_NOT_ZERO failing → AWAITING_ZERO_BALANCE; any other failing
        → PRECHECK_FAILED. BALANCE_NOT_ZERO does not block when payoutPreference = OWN_WALLET names a same-person wallet. Sends WALLET_CLOSURE_REQUESTED.
      x-audience: customer
      x-actors:
      - type: CUSTOMER
        scope: own (X-Channel APP)
      - type: STAFF
        roles:
        - SUP_MAKER
        - OPS_MAKER
      x-module: wallet
      x-release: R1
      x-idempotency: optional
      parameters:
      - $ref: '#/components/parameters/XCorrelationId'
      - $ref: '#/components/parameters/XActorType'
      - $ref: '#/components/parameters/XActorId'
      - $ref: '#/components/parameters/XActorWalletId'
      - $ref: '#/components/parameters/XActorRoles'
      - $ref: '#/components/parameters/XActorUserId'
      - $ref: '#/components/parameters/XChannel'
      - $ref: '#/components/parameters/XDeviceId'
      - $ref: '#/components/parameters/Traceparent'
      - $ref: '#/components/parameters/IdempotencyKeyOptional'
      - name: walletId
        in: path
        required: true
        schema:
          type: string
          format: uuid
          pattern: ^[0-9a-f]{8}-[0-9a-f]{4}-[0-9a-f]{4}-[0-9a-f]{4}-[0-9a-f]{12}$
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              additionalProperties: true
              properties:
                requestedVia:
                  type: string
                  enum:
                  - APP
                  - CALL_CENTRE
                  - SERVICE_POINT
                  - BACKOFFICE
                identityVerification:
                  type: object
                  additionalProperties: true
                  properties:
                    method:
                      type: string
                      enum:
                      - NID_PHYSICAL_CHECK
                      - CALL_VERIFICATION
                      - APP_SESSION
                    reference:
                      type: string
                      maxLength: 64
                  required:
                  - method
                  - reference
                payoutPreference:
                  type: object
                  additionalProperties: true
                  properties:
                    method:
                      type: string
                      enum:
                      - CASH_OUT
                      - OWN_WALLET
                    toWalletId:
                      type:
                      - string
                      - 'null'
                      format: uuid
                      pattern: ^[0-9a-f]{8}-[0-9a-f]{4}-[0-9a-f]{4}-[0-9a-f]{4}-[0-9a-f]{12}$
                      description: required for OWN_WALLET
                  required:
                  - method
                reasonNote:
                  type:
                  - string
                  - 'null'
                  maxLength: 500
              required:
              - requestedVia
              - identityVerification
              - payoutPreference
            example:
              requestedVia: SERVICE_POINT
              identityVerification:
                method: NID_PHYSICAL_CHECK
                reference: SP-DHK-01/2210
              payoutPreference:
                method: CASH_OUT
                toWalletId: null
              reasonNote: Moving abroad
      responses:
        '201':
          description: success
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Closure'
              example:
                closureId: 0192fb5f-0000-7000-8000-00000000c105
                walletId: 0192f2bb-4d5f-7c62-9b3e-6f1a4dac8b12
                state: AWAITING_ZERO_BALANCE
                requestedVia: SERVICE_POINT
                identityVerification:
                  method: NID_PHYSICAL_CHECK
                  reference: SP-DHK-01/2210
                  verifiedBy: 0192f1aa-0000-7000-8000-0000000000a1
                payoutPreference:
                  method: CASH_OUT
                  toWalletId: null
                precheck:
                  openDisputes: 0
                  openHolds: 0
                  regulatoryFreeze: false
                  pendingApprovals: 0
                  ledgerBalancePoisha: 42575
                  availableBalancePoisha: 42575
                  heldPoisha: 0
                  payoutTargetEligible: null
                  passed: false
                  blocking:
                  - BALANCE_NOT_ZERO
                  checkedAt: '2026-10-13T04:00:00.000Z'
                approvalId: null
                settleAfter: null
                payout: null
                closedAt: null
                reasonNote: Moving abroad
                createdAt: '2026-10-13T04:00:00.000Z'
                updatedAt: '2026-10-13T04:00:00.000Z'
        '400':
          description: VALIDATION_FAILED — OWN_WALLET without toWalletId; BANK payout not available
          content:
            application/problem+json:
              schema:
                allOf:
                - $ref: '#/components/schemas/Problem'
                - properties:
                    code:
                      type: string
                      enum:
                      - VALIDATION_FAILED
        '403':
          description: ACTOR_NOT_ALLOWED — actor type, role or caller not permitted
          content:
            application/problem+json:
              schema:
                allOf:
                - $ref: '#/components/schemas/Problem'
                - properties:
                    code:
                      type: string
                      enum:
                      - ACTOR_NOT_ALLOWED
        '404':
          description: NOT_FOUND — path entity missing (or not visible to the actor)
          content:
            application/problem+json:
              schema:
                allOf:
                - $ref: '#/components/schemas/Problem'
                - properties:
                    code:
                      type: string
