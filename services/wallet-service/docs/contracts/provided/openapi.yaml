        required: true
        content:
          application/json:
            schema:
              type: object
              additionalProperties: true
              properties:
                msisdn:
                  type: string
                  description: accepts `01…`, `880…`, `+880…`
                language:
                  type: string
                  enum:
                  - bn
                  - en
                nameEn:
                  type:
                  - string
                  - 'null'
                  pattern: ^[A-Za-z][A-Za-z .'-]{1,99}$
                referralCode:
                  type:
                  - string
                  - 'null'
                  maxLength: 16
                  description: opaque; stored and emitted only on CUSTOMER_REGISTERED
                consents:
                  type: array
                  items:
                    type: object
                    additionalProperties: true
                    properties:
                      consentType:
                        type: string
                        enum:
                        - TERMS
                        - PRIVACY
                        - DATA_SHARING
                        - MARKETING
                        - LOCATION
                      documentVersion:
                        type: string
                        maxLength: 64
                      language:
                        type: string
                        enum:
                        - bn
                        - en
                      counterparty:
                        type:
                        - string
                        - 'null'
                    required:
                    - consentType
                    - documentVersion
                    - language
                  minItems: 2
