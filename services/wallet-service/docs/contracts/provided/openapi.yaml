                - walletId
                - status
                - walletStatus
                - kycTier
                - result
              example:
                customerId: 0192f2a0-5b1c-7d10-8e11-0a1b2c3d4e01
                walletId: 0192f2aa-1c3e-7b51-8a2d-5e0f3c9b7a01
                status: REGISTERED
                walletStatus: P
                kycTier: 0
                result: RESUMED
        '400':
          description: VALIDATION_FAILED — MSISDN format, missing TERMS/PRIVACY consent
          content:
            application/problem+json:
              schema:
                allOf:
                - $ref: '#/components/schemas/Problem'
                - properties:
                    code:
                      type: string
                      enum:
                      - VALIDATION_FAILED
        '403':
          description: ACTOR_NOT_ALLOWED — actor type, role or caller not permitted
          content:
            application/problem+json:
              schema:
                allOf:
                - $ref: '#/components/schemas/Problem'
                - properties:
                    code:
                      type: string
                      enum:
                      - ACTOR_NOT_ALLOWED
        '409':
          description: STATE_CONFLICT — MSISDN used by another live customer / in cooling; IDEMPOTENCY_CONFLICT — same `Idempotency-Key`, different
            body
          content:
            application/problem+json:
              schema:
                allOf:
                - $ref: '#/components/schemas/Problem'
                - properties:
                    code:
                      type: string
                      enum:
                      - IDEMPOTENCY_CONFLICT
                      - STATE_CONFLICT
                    reason:
                      type:
                      - string
                      - 'null'
                      enum:
                      - DUPLICATE_MSISDN
                      - MSISDN_COOLING
                      - null
        '503':
          description: 'DEPENDENCY_UNAVAILABLE — ledger down: customer and wallet kept, wallet provisioned by the retry job (walletId returned
            on resume)'
          content:
            application/problem+json:
              schema:
                allOf:
                - $ref: '#/components/schemas/Problem'
                - properties:
                    code:
                      type: string
                      enum:
                      - DEPENDENCY_UNAVAILABLE
