reasonCodes:
- group: Wallet status
  field: wallet statusReasonCode / status-changes reasonCode
  values:
  - KYC_APPROVED
  - KYC_EXPIRED
  - DORMANCY
  - CUSTOMER_REQUEST
  - FRAUD_FREEZE
  - AML_FREEZE
  - COURT_ORDER
  - REGULATORY_INSTRUCTION
  - CLOSURE
  - WALLET_CREATED
  - PRE_REGISTRATION
  - REACTIVATION
  - KYC_UPGRADE
  - RISK_REGRADE
  - SCREENING_REJECT
  - PARTNER_SUSPENDED
  - PARTNER_REACTIVATED
  - PARTNER_TERMINATED
  displayOnly:
  - RESTRICTED
  notes: Customer notification of AML_FREEZE, REGULATORY_INSTRUCTION, COURT_ORDER (and lifts) is suppressed; FRAUD_FREEZE is notified (OPEN D-06). RESTRICTED is returned
    to holder actors by GET /v1/wallets/{walletId} instead of those three; never stored or emitted.
- group: Partner status
  field: partner statusReasonCode / partner status-changes reasonCode
  values:
  - AML_FREEZE
  - FRAUD_FREEZE
  - SCREENING_REJECTED
  - RISK_PERFORMANCE
  - DISTRIBUTOR_SUSPENSION
  - BLACKLIST_MATCH
  - ONBOARDING_APPROVED
  - SUSPENSION_EXPIRED
  - NAME_CHANGED
  - PARTNER_REJECTED
  - BLACKLISTED
  notes: ONBOARDING_APPROVED .. BLACKLISTED pending governance sign-off (OPEN D-32).
- group: KYC
  field: customer.events reasonCode (KYC_* types); KYC decision reasonCode
  values:
  - KYC_SUBMITTED
  - KYC_APPROVED
  - KYC_UPGRADE
  - RISK_REGRADE
  - NID_MISMATCH
  - IMAGE_UNCLEAR
  - SELFIE_MISMATCH
  - INCOMPLETE
  - DUPLICATE
  - SCREENING_REJECT
  - BLACKLISTED
  - FRAUD_SUSPECTED
  - UNDERAGE
  - OTHER
  notes: OPEN D-32
- group: Customer profile
  field: customer.events reasonCode (CUSTOMER_REGISTERED, CUSTOMER_PROFILE_UPDATED)
  values:
  - REGISTERED
  - PROFILE_UPDATED
  - PREFERENCES_UPDATED
  - NOMINEES_UPDATED
  - KYC_REVIEW_DUE
  - KYC_REVIEW_OVERDUE
  notes: CUSTOMER_REGISTERED also uses PRE_REGISTRATION (Wallet status group). OPEN D-32
- group: Wallet flag
  field: POST /v1/wallets/{walletId}/flags reasonCode
  values:
  - AML_WATCH
  - AML_LIEN
  - PIN_RESET
  - NEW_DEVICE
  notes: Also accepts the Hold group codes owned by ledger-service (DISPUTE_HOLD, AML_LIEN, WRONG_TRANSFER_HOLD). OPEN D-32
- group: Partner application
  field: stage return / reject reasonCode; PARTNER_APPLICATION_RETURNED / _REJECTED variable reason
  values:
  - INCOMPLETE_KYB
  - DOCUMENT_UNREADABLE
  - DOCUMENT_EXPIRED
  - SITE_VISIT_FAILED
  - DUPLICATE_PARTNER
  - SCREENING_REJECTED
  - BLACKLISTED
  - OTHER
  notes: new seed introduced by this pack (OPEN D-32)
- group: Partner change
  field: hierarchy / category / territory change reasonCode
  values:
  - TERRITORY_REALIGNMENT
  - BUSINESS_GROWTH
  - SHOP_MOVED
  - CORRECTION
  - OTHER
  notes: new seed (OPEN D-32)
- group: QR revoke
  field: POST /v1/qr/{qrPayloadId}:revoke reasonCode
  values:
  - LOST_STICKER
  - DAMAGED
  - NAME_CHANGED
  - REGENERATED
  - OUTLET_CLOSED
  - PARTNER_TERMINATED
  - OTHER
  notes: new seed (OPEN D-32)
txnRefPrefixes:
- prefix: WC
  kind: ledger
  meaning: closure payout (ledger command 17, post-closure-payout)
  format: WC{yyMMdd}00{8 Crockford base32}
  length: 18
  carriedOnEvent: null
  note: no producer event carries it yet (OPEN D-51)
- prefix: A
  kind: business
  meaning: partnerCode of an AGENT (not a txnRef)
  format: A{8-digit sequence}{Luhn digit}
  length: 10
- prefix: M
  kind: business
  meaning: partnerCode of a MERCHANT (not a txnRef)
  format: M{8-digit sequence}{Luhn digit}
  length: 10
- prefix: D
  kind: business
  meaning: partnerCode of a DISTRIBUTOR (not a txnRef)
  format: D{8-digit sequence}{Luhn digit}
  length: 10
- prefix: I
  kind: business
  meaning: partnerCode of an INSTITUTION (not a txnRef)
  format: I{8-digit sequence}{Luhn digit}
  length: 10
- prefix: Q
  kind: business
  meaning: dynamic Bangla QR reference (tag 62.05; not a txnRef)
  format: Q{9 Crockford base32}
  length: 10
