# wallet-service — owned code lists (CONTRACT-MODEL §4). contractVersion 1.0.0, kernel 1.0.
# Producer-owned (O1): only wallet-service edits this file, through CHANGE-PROCESS.
codeSets:
  walletStatus:
    description: Effective wallet status. Single-letter code on the wire and in the status cache; requests accept the code or the name. Directions per code below.
    values:
    - code: P
      name: PENDING_KYC
      description: debit no; credit only when the reader's policy WALLET.ALLOW_INBOUND_BEFORE_KYC is true (default false)
      debitAllowed: false
      creditAllowed: policy
    - code: A
      name: ACTIVE
      description: debit and credit
      debitAllowed: true
      creditAllowed: true
    - code: D
      name: DORMANT
      description: credit only
      debitAllowed: false
      creditAllowed: true
    - code: X
      name: DEBIT_BLOCKED
      description: credit only
      debitAllowed: false
      creditAllowed: true
    - code: C
      name: CREDIT_BLOCKED
      description: debit only
      debitAllowed: true
      creditAllowed: false
    - code: F
      name: BLOCKED
      description: no debit, no credit
      debitAllowed: false
      creditAllowed: false
    - code: Q
      name: PENDING_CLOSURE
      description: debit only by the closure payout (ledger command 17) or a treasury closure redemption (command 10, reasonCode CLOSURE_PAYOUT, partner wallets A/D/M/I);
        no credit
      debitAllowed: closure-only
      creditAllowed: false
    - code: Z
      name: CLOSED
      description: no debit, no credit; never deleted from the cache
      debitAllowed: false
      creditAllowed: false
  walletType:
    description: Wallet type code (status cache, events, responses) and the matching ledger account type.
    values:
    - code: C
      name: CUSTOMER
      ledgerAccountType: CUSTOMER_WALLET
      ownerType: CUSTOMER
    - code: A
      name: AGENT
      ledgerAccountType: AGENT_WALLET
      ownerType: AGENT
    - code: D
      name: DISTRIBUTOR
      ledgerAccountType: DISTRIBUTOR_WALLET
      ownerType: DISTRIBUTOR
    - code: M
      name: MERCHANT
      ledgerAccountType: MERCHANT_WALLET
      ownerType: MERCHANT
    - code: I
      name: INSTITUTION
      ledgerAccountType: INSTITUTION_WALLET
      ownerType: INSTITUTION
  walletStatusReason:
    description: Wallet statusReasonCode / status-changes reasonCode values (reasonCodes group 'Wallet status'); RESTRICTED is display-only.
    values:
    - KYC_APPROVED
    - KYC_EXPIRED
    - DORMANCY
    - CUSTOMER_REQUEST
    - FRAUD_FREEZE
    - AML_FREEZE
    - COURT_ORDER
    - REGULATORY_INSTRUCTION
    - CLOSURE
    - WALLET_CREATED
    - PRE_REGISTRATION
    - REACTIVATION
    - KYC_UPGRADE
    - RISK_REGRADE
    - SCREENING_REJECT
    - PARTNER_SUSPENDED
    - PARTNER_REACTIVATED
    - PARTNER_TERMINATED
    - RESTRICTED
  ownerType:
    description: Wallet owner type.
    values:
    - CUSTOMER
    - AGENT
    - MERCHANT
    - DISTRIBUTOR
    - INSTITUTION
  categoryCode:
    description: Partner category (int32, 0..99999), derived only by the partner module; never an MCC. CUSTOMER = 0; AGENT 101..104; DISTRIBUTOR 201..203; INSTITUTION
      401..404; MERCHANT = 3000 + d*100 + g with d = MICRO 1, SMALL 2, ENTERPRISE 3, ONLINE 4 and g = refdata MCC attributes.group (01 GROCERY_RETAIL, 02 FOOD, 03
      UTILITY_TELCO, 04 TRANSPORT, 05 HEALTH, 06 EDUCATION, 07 DIGITAL, 99 OTHER). Consumers may match a merchant size class by its hundred group (3100, 3200, 3300,
      3400). Pending architect sign-off (OPEN D-21).
    formula: 'merchant: 3000 + d*100 + int(mccGroup)'
    values:
    - code: 0
      name: CUSTOMER
      description: customer wallets (C)
    - code: 101
      name: AGENT_RETAIL
    - code: 102
      name: AGENT_SUPER_AGENT
    - code: 103
      name: AGENT_MERCHANT_AGENT
    - code: 104
      name: AGENT_BANK_AGENT
    - code: 201
      name: DISTRIBUTOR_MASTER
    - code: 202
      name: DISTRIBUTOR_DISTRIBUTOR
    - code: 203
      name: DISTRIBUTOR_SUB
    - code: 3101
      name: MERCHANT_MICRO_GROCERY_RETAIL
    - code: 3102
      name: MERCHANT_MICRO_FOOD
    - code: 3103
      name: MERCHANT_MICRO_UTILITY_TELCO
    - code: 3104
      name: MERCHANT_MICRO_TRANSPORT
    - code: 3105
      name: MERCHANT_MICRO_HEALTH
    - code: 3106
      name: MERCHANT_MICRO_EDUCATION
    - code: 3107
      name: MERCHANT_MICRO_DIGITAL
    - code: 3199
      name: MERCHANT_MICRO_OTHER
    - code: 3201
      name: MERCHANT_SMALL_GROCERY_RETAIL
    - code: 3202
      name: MERCHANT_SMALL_FOOD
    - code: 3203
      name: MERCHANT_SMALL_UTILITY_TELCO
    - code: 3204
      name: MERCHANT_SMALL_TRANSPORT
    - code: 3205
      name: MERCHANT_SMALL_HEALTH
    - code: 3206
      name: MERCHANT_SMALL_EDUCATION
    - code: 3207
      name: MERCHANT_SMALL_DIGITAL
    - code: 3299
      name: MERCHANT_SMALL_OTHER
    - code: 3301
      name: MERCHANT_ENTERPRISE_GROCERY_RETAIL
    - code: 3302
      name: MERCHANT_ENTERPRISE_FOOD
    - code: 3303
      name: MERCHANT_ENTERPRISE_UTILITY_TELCO
    - code: 3304
      name: MERCHANT_ENTERPRISE_TRANSPORT
    - code: 3305
      name: MERCHANT_ENTERPRISE_HEALTH
    - code: 3306
      name: MERCHANT_ENTERPRISE_EDUCATION
    - code: 3307
      name: MERCHANT_ENTERPRISE_DIGITAL
    - code: 3399
      name: MERCHANT_ENTERPRISE_OTHER
    - code: 3401
      name: MERCHANT_ONLINE_GROCERY_RETAIL
    - code: 3402
      name: MERCHANT_ONLINE_FOOD
    - code: 3403
      name: MERCHANT_ONLINE_UTILITY_TELCO
    - code: 3404
      name: MERCHANT_ONLINE_TRANSPORT
    - code: 3405
      name: MERCHANT_ONLINE_HEALTH
    - code: 3406
      name: MERCHANT_ONLINE_EDUCATION
    - code: 3407
      name: MERCHANT_ONLINE_DIGITAL
    - code: 3499
      name: MERCHANT_ONLINE_OTHER
    - code: 401
      name: INSTITUTION_EMPLOYER
    - code: 402
      name: INSTITUTION_GOVERNMENT
    - code: 403
      name: INSTITUTION_NGO
    - code: 404
      name: INSTITUTION_OTHER
  kycTier:
    description: KYC tier (definitions configurable in KYC_TIERS).
    values:
    - code: 0
      name: MOBILE_VERIFIED
    - code: 1
      name: SIMPLIFIED
    - code: 2
      name: FULL
  riskGrade:
    description: Customer / partner risk grade.
    values:
    - LOW
    - MEDIUM
    - HIGH
  walletFlag:
    description: flags bitmask. Bits 4 and 16 are not externally settable.
    values:
    - code: 1
      name: AML_WATCH
    - code: 2
      name: PIN_RESET_COOLING
    - code: 4
      name: PRE_REGISTERED
      externallySettable: false
    - code: 8
      name: HAS_OPEN_LIEN
    - code: 16
      name: NEW_DEVICE_COOLING
      description: reserved for the auth layer
      externallySettable: false
  statusChangeTarget:
    description: targetStatus of POST /v1/wallets/{walletId}/status-changes (name or code).
    values:
    - code: BLOCKED
      description: add FULL_BLOCK
    - code: DEBIT_BLOCKED
      description: add DEBIT_BLOCK
    - code: CREDIT_BLOCKED
      description: add CREDIT_BLOCK
    - code: ACTIVE
      description: lift / reactivate
    - code: DORMANT
      description: set dormancy
  statusChangeOutcome:
    description: Outcome of a wallet status change.
    values:
    - APPLIED
    - PENDING_APPROVAL
    - NOOP
  customerStatus:
    values:
    - PRE_REGISTERED
    - REGISTERED
    - ACTIVE
    - CLOSED
  kycStatus:
    description: Derived from the latest submission (BR-W-37).
    values:
    - NOT_STARTED
    - IN_PROGRESS
    - PENDING_REVIEW
    - APPROVED
    - REJECTED
  kycReviewStatus:
    values:
    - NONE
    - DUE
    - OVERDUE
  customerScreeningStatus:
    values:
    - NOT_SCREENED
    - PENDING
    - CLEAR
    - POTENTIAL_MATCH
    - CONFIRMED_MATCH
    - REJECTED
  gender:
    values:
    - MALE
    - FEMALE
    - THIRD_GENDER
  incomeBand:
    values:
    - UP_TO_BDT_10K
    - BDT_10K_25K
    - BDT_25K_50K
    - BDT_50K_100K
    - ABOVE_BDT_100K
  preRegisterResult:
    values:
    - CREATED
    - EXISTS
    - REJECTED
  preRegisterRejectReason:
    values:
    - INVALID_MSISDN
    - MSISDN_COOLING
    - CLOSED_WALLET
  partnerType:
    values:
    - AGENT
    - MERCHANT
    - DISTRIBUTOR
    - INSTITUTION
  partnerSubType:
    description: Partner sub-type per partner type.
    values:
    - code: RETAIL
      partnerType: AGENT
    - code: SUPER_AGENT
      partnerType: AGENT
    - code: MERCHANT_AGENT
      partnerType: AGENT
    - code: BANK_AGENT
      partnerType: AGENT
    - code: MICRO
      partnerType: MERCHANT
    - code: SMALL
      partnerType: MERCHANT
    - code: ENTERPRISE
      partnerType: MERCHANT
    - code: ONLINE
      partnerType: MERCHANT
    - code: MASTER
      partnerType: DISTRIBUTOR
    - code: DISTRIBUTOR
      partnerType: DISTRIBUTOR
    - code: SUB
      partnerType: DISTRIBUTOR
    - code: EMPLOYER
      partnerType: INSTITUTION
    - code: GOVERNMENT
      partnerType: INSTITUTION
    - code: NGO
      partnerType: INSTITUTION
    - code: OTHER
      partnerType: INSTITUTION
  partnerStatus:
    description: Compliance screens on PENDING_SCREENING; money paths treat only ACTIVE as active (float return also from PENDING_TERMINATION).
    values:
    - PENDING_SCREENING
    - PENDING_APPROVAL
    - ACTIVE
    - SUSPENDED
    - PENDING_TERMINATION
    - TERMINATED
    - REJECTED
  partnerStatusTarget:
    values:
    - SUSPENDED
    - ACTIVE
    - PENDING_TERMINATION
  partnerFlag:
    values:
    - PERFORMANCE_WATCH
    - COMPLAINT_WATCH
    - FRAUD_WATCH
    - AML_WATCH
    - BLACKLIST_MATCH
    - INACTIVE
  keyPersonRole:
    values:
    - PROPRIETOR
    - DIRECTOR
    - PARTNER
    - AUTHORISED_SIGNATORY
    - BENEFICIAL_OWNER
  settlementMode:
    description: Only WALLET produced in R1; BANK reserved (OPEN D-42).
    values:
    - WALLET
    - BANK
  hierarchyLevel:
    values:
    - code: 0
      name: OPERATOR
    - code: 1
      name: MASTER_DISTRIBUTOR
    - code: 2
      name: DISTRIBUTOR
    - code: 3
      name: SUB_DISTRIBUTOR
    - code: 4
      name: OUTLET
  qrPointOfInitiation:
    values:
    - STATIC
    - DYNAMIC
  qrNotPayableReason:
    values:
    - EXPIRED
    - REVOKED
    - PARTNER_NOT_ACTIVE
    - UNKNOWN_ACCOUNT
    - TAMPERED
    - OFF_US_NOT_SUPPORTED
    - CURRENCY_NOT_SUPPORTED
  qrDecodeError:
    description: errors[].message of 400 on POST /v1/qr/decode.
    values:
    - CRC_MISMATCH
    - BAD_TLV
    - MISSING_TAG
    - BAD_FORMAT
problemReasons:
- code: STATE_CONFLICT
  reason: DUPLICATE_MSISDN
  operations:
  - POST /v1/wallets
  - POST /v1/customers
  - PATCH /v1/customers/{customerId}
  - POST /v1/partners/{partnerId}/profile-changes
  - POST /v1/partners/{partnerId}/users
- code: STATE_CONFLICT
  reason: MSISDN_COOLING
  operations:
  - POST /v1/wallets
  - POST /v1/customers
  - PATCH /v1/customers/{customerId}
  - POST /v1/partners/{partnerId}/profile-changes
- code: STATE_CONFLICT
  reason: OWNER_HAS_DIFFERENT_MSISDN
  operations:
  - POST /v1/wallets
- code: STATE_CONFLICT
  reason: WALLET_CLOSED
  operations:
  - POST /v1/wallets/{walletId}/status-changes
  - PATCH /v1/wallets/{walletId}/category
  - POST /v1/wallets/{walletId}/flags
  - POST /v1/wallets/{walletId}/closures
- code: STATE_CONFLICT
  reason: TARGET_NOT_ALLOWED
  operations:
  - POST /v1/wallets/{walletId}/status-changes
- code: STATE_CONFLICT
  reason: ALREADY_PENDING
  operations:
  - POST /v1/wallets/{walletId}/status-changes
  - PATCH /v1/customers/{customerId}
  - POST /v1/kyc/exceptions/{itemId}:resolve
  - POST /v1/wallet-config/{key}/versions
  - POST /v1/partners/{partnerId}/status-changes
  - POST /v1/partners/{partnerId}/category-changes
  - POST /v1/partners/{partnerId}/profile-changes
  - PUT /v1/partner-config/{section}
  extensions:
  - changeRequestId
- code: STATE_CONFLICT
  reason: REKYC_REQUIRED
  operations:
  - POST /v1/wallets/{walletId}/status-changes
- code: STATE_CONFLICT
  reason: OPEN_REGULATORY_FREEZE
  operations:
  - POST /v1/wallets/{walletId}/status-changes
- code: STATE_CONFLICT
  reason: CUSTOMER_WALLET
  operations:
  - PATCH /v1/wallets/{walletId}/category
- code: STATE_CONFLICT
  reason: FIELD_LOCKED
  operations:
  - PATCH /v1/customers/{customerId}
- code: STATE_CONFLICT
  reason: INVALID_TRANSITION
  operations:
  - POST /v1/partners/{partnerId}/status-changes
  - POST /v1/partners/{partnerId}:complete-termination
  - partner application, QR, closure and KYC state transitions
- code: STATE_CONFLICT
  reason: HAS_ACTIVE_DESCENDANTS
  operations:
  - POST /v1/partners/{partnerId}/status-changes
  extensions:
  - activeDescendants
- code: STATE_CONFLICT
  reason: BALANCE_NOT_ZERO
  operations:
  - POST /v1/partners/{partnerId}:complete-termination
  extensions:
  - ledgerBalancePoisha
  - heldPoisha
- code: STATE_CONFLICT
  reason: CONSENT_REQUIRED
  operations:
  - POST /v1/customers/{customerId}/consents/{consentId}:withdraw
- code: STATE_CONFLICT
  reason: ALREADY_WITHDRAWN
  operations:
  - POST /v1/customers/{customerId}/consents/{consentId}:withdraw
- code: STATE_CONFLICT
  reason: OPEN_SUBMISSION_EXISTS
  operations:
  - POST /v1/customers/{customerId}/kyc-submissions
  extensions:
  - existingId
- code: STATE_CONFLICT
  reason: MAX_ATTEMPTS
  operations:
  - POST /v1/customers/{customerId}/kyc-submissions
- code: STATE_CONFLICT
  reason: TIER_NOT_HIGHER
  operations:
  - POST /v1/customers/{customerId}/kyc-submissions
- code: STATE_CONFLICT
  reason: NOT_DRAFT
  operations:
  - PATCH /v1/kyc-submissions/{submissionId}
  - POST /v1/kyc-submissions/{submissionId}/documents
  - POST /v1/kyc-submissions/{submissionId}:submit
- code: STATE_CONFLICT
  reason: NOT_PENDING_REVIEW
  operations:
  - POST /v1/kyc-submissions/{submissionId}:decide
- code: STATE_CONFLICT
  reason: GATE_NOT_SATISFIED
  operations:
  - POST /v1/kyc-submissions/{submissionId}:decide
  - POST /v1/approvals/{id}:approve
- code: STATE_CONFLICT
  reason: NOT_OPEN
  operations:
  - POST /v1/kyc/exceptions/{itemId}:resolve
- code: STATE_CONFLICT
  reason: CLOSURE_OPEN
  operations:
  - POST /v1/wallets/{walletId}/closures
  extensions:
  - existingId
- code: STATE_CONFLICT
  reason: PAYOUT_TARGET_NOT_ELIGIBLE
  operations:
  - POST /v1/wallets/{walletId}/closures
- code: STATE_CONFLICT
  reason: NOT_PENDING
  operations:
  - POST /v1/approvals/{id}:approve
  - POST /v1/approvals/{id}:reject
- code: STATE_CONFLICT
  reason: EXPIRED
  operations:
  - POST /v1/approvals/{id}:approve
  - POST /v1/approvals/{id}:reject
- code: STATE_CONFLICT
  reason: REVALIDATION_FAILED
  operations:
  - POST /v1/approvals/{id}:approve
- code: STATE_CONFLICT
  reason: SCREENING_NOT_CLEAR
  operations:
  - POST /v1/approvals/{id}:approve
- code: STATE_CONFLICT
  reason: DUPLICATE_PARTNER
  operations:
  - POST /v1/partner-applications/{applicationId}:submit
- code: STATE_CONFLICT
  reason: NO_APPROVAL_CHAIN
  operations:
  - POST /v1/partner-applications/{applicationId}:submit
- code: STATE_CONFLICT
  reason: MAX_RESUBMISSIONS
  operations:
  - POST /v1/partner-applications/{applicationId}:submit
- code: STATE_CONFLICT
  reason: CYCLE
  operations:
  - POST /v1/partners/{partnerId}/hierarchy-changes
- code: STATE_CONFLICT
  reason: DEPTH_EXCEEDED
  operations:
  - POST /v1/partners/{partnerId}/hierarchy-changes
- code: STATE_CONFLICT
  reason: PARENT_NOT_ACTIVE
  operations:
  - POST /v1/partners/{partnerId}/hierarchy-changes
- code: STATE_CONFLICT
  reason: RULE_NOT_ALLOWED
  operations:
  - POST /v1/partners/{partnerId}/hierarchy-changes
- code: STATE_CONFLICT
  reason: BACKDATED
  operations:
  - POST /v1/partners/{partnerId}/hierarchy-changes
- code: STATE_CONFLICT
  reason: ALREADY_SCHEDULED
  operations:
  - POST /v1/partners/{partnerId}/hierarchy-changes
- code: STATE_CONFLICT
  reason: PARTNER_NOT_ACTIVE
  operations:
  - POST /v1/qr/static
  - POST /v1/qr/dynamic
- code: STATE_CONFLICT
  reason: OUTLET_CLOSED
  operations:
  - POST /v1/qr/static
  - POST /v1/qr/dynamic
- code: RISK_BLOCKED
  reason: BLACKLISTED
  operations:
  - POST /v1/partner-applications/{applicationId}/key-persons
  - PUT /v1/partner-applications/{applicationId}/key-persons/{keyPersonId}
  - POST /v1/partner-applications/{applicationId}/bank-accounts
  - POST /v1/partner-applications/{applicationId}:submit
  - POST /v1/partners/{partnerId}/profile-changes
  - POST /v1/partners/{partnerId}/bank-accounts
- code: SERVICE_DISABLED
  reason: SELF_REGISTRATION_DISABLED
  operations:
  - POST /v1/partner-applications
- code: SERVICE_DISABLED
  reason: BANK_SETTLEMENT_DISABLED
  operations:
  - POST /v1/partner-applications
- code: VALIDATION_FAILED
  reason: INVALID_CURSOR
  operations:
  - every paged operation (kernel-reserved)
problemExtensions:
- name: changeRequestId
  type: uuid
  when: reason = ALREADY_PENDING (the existing pending request)
- name: activeDescendants
  type: int32
  when: reason = HAS_ACTIVE_DESCENDANTS
- name: ledgerBalancePoisha
  type: int64 (poisha)
  when: reason = BALANCE_NOT_ZERO
- name: heldPoisha
  type: int64 (poisha)
  when: reason = BALANCE_NOT_ZERO
- name: existingId
  type: uuid
  when: reason = OPEN_SUBMISSION_EXISTS | CLOSURE_OPEN (the existing open entity)
- name: missingItems
  type: array<string>
  when: 400 on partner application submit (missing documents / key persons / bank account / site visit); errors[] lists the same
entityTypes:
- module: wallet
  values:
  - WalletStatusChange
  - KycSubmission
  - CustomerProfile
  - CustomerRiskGrade
  - WalletClosure
  - ConfigDocument
  - ExceptionItem
  actions:
    WalletStatusChange:
    - APPLY
    KycSubmission:
    - APPROVE_KYC
    - REJECT_KYC
    CustomerProfile:
    - UPDATE
    CustomerRiskGrade:
    - CHANGE_GRADE
    WalletClosure:
    - CLOSE
    ConfigDocument:
    - ACTIVATE
    ExceptionItem:
    - OVERRIDE
- module: partner
  values:
  - Partner
  - PartnerApplication
  - HierarchyAssignment
  - Config
  - BankAccount
  actions:
    Partner:
    - SUSPEND
    - REACTIVATE
    - TERMINATE
    - CANCEL_TERMINATION
    - CHANGE_CATEGORY
    - CHANGE_TERRITORY
    - UPDATE_PROFILE
    PartnerApplication:
    - APPROVE_STAGE_SALES
    - APPROVE_STAGE_COMPLIANCE
    - APPROVE_STAGE_EDD
    - APPROVE_STAGE_FINANCE
    - APPROVE_STAGE_OPERATIONS
    HierarchyAssignment:
    - CHANGE_HIERARCHY
    Config:
    - CONFIG_APPROVAL_CHAINS
    - CONFIG_HIERARCHY_RULES
    - CONFIG_HIERARCHY_LEVELS
    - CONFIG_CATEGORY_CODES
    - CONFIG_DOCUMENT_CHECKLISTS
    - CONFIG_RISK_SCORE_RULES
    - CONFIG_PARAMS
    BankAccount:
    - ADD_BANK_ACCOUNT
    - REMOVE_BANK_ACCOUNT
notificationTemplates:
- code: WALLET_CLOSURE_REQUESTED
  category: SERVICE
  recipient: wallet holder (walletId)
  channels:
  - IN_APP
  - SMS
  variables:
  - name: closureId
    type: TEXT
    req: true
    notes: uuid text
  - name: requestedAt
    type: DATETIME
    req: true
    notes: ''
  - name: awaitingZeroBalance
    type: TEXT
    req: true
    notes: enum{true,false}
  module: wallet
  trigger: closure request accepted
- code: WALLET_CLOSURE_APPROVED
  category: SERVICE
  recipient: wallet holder (walletId)
  channels:
  - IN_APP
  - SMS
  variables:
  - name: closureId
    type: TEXT
    req: true
    notes: ''
  - name: settleAfter
    type: DATETIME
    req: true
    notes: required
  module: wallet
  trigger: closure approved
- code: WALLET_CLOSURE_COMPLETED
  category: SERVICE
  recipient: msisdn only (closed wallet)
  channels:
  - SMS
  variables:
  - name: closureId
    type: TEXT
    req: true
    notes: ''
  - name: closedAt
    type: DATETIME
    req: true
    notes: ''
  module: wallet
  trigger: wallet closed (Z, reason CLOSURE)
- code: WALLET_CLOSURE_REVERTED
  category: SERVICE
  recipient: wallet holder (walletId)
  channels:
  - IN_APP
  - SMS
  variables:
  - name: closureId
    type: TEXT
    req: true
    notes: ''
  - name: reason
    type: TEXT
    req: true
    notes: blocking check code, e.g. BALANCE_NOT_ZERO, AWAITING_ZERO_BALANCE
  module: wallet
  trigger: closure reverted (blocking final check or payout rejected)
- code: WALLET_DORMANCY_WARNING
  category: SERVICE
  recipient: wallet holder (walletId)
  channels:
  - SMS
  - IN_APP
  variables:
  - name: dormantFrom
    type: DATE
    req: true
    notes: ''
  - name: inactiveDays
    type: INT
    req: true
    notes: ''
  module: wallet
  trigger: dormancy warning job
- code: KYC_REVIEW_DUE
  category: SERVICE
  recipient: wallet holder (walletId)
  channels:
  - SMS
  - IN_APP
  variables:
  - name: dueDate
    type: DATE
    req: true
    notes: ''
  module: wallet
  trigger: re-KYC due job (single sender of re-KYC reminders, OPEN D-11)
- code: KYC_REVIEW_OVERDUE
  category: SERVICE
  recipient: wallet holder (walletId)
  channels:
  - SMS
  - IN_APP
  variables:
  - name: dueDate
    type: DATE
