# finance-ops-service manifest (CONTRACT-MODEL §3). Generated layout; edit only through a change request.
service: finance-ops-service
number: '12'
modules:
- reconciliation
- reporting
contractVersion: 1.0.0
kernel: '1.0'
owner: Dev-6
moduleOwners:
  reconciliation: Dev-6
  reporting: Dev-7
provides:
  apis:
  - openapi: provided/openapi.yaml
    major: 1
    note: every operation is provided; x-audience customer|partner|staff|internal, x-module reconciliation|reporting|approvals
  events:
  - topic: recon.events
    module: reconciliation
    key: runId (all three eventTypes; exceptions outside a run attach to the day's LEDGER_TXN run)
    compacted: false
    tombstones: false
    partitions:
      dev: 1
      prod: 3
    retention: 14d
    transport: outbox
    eventTypes:
    - type: RECON_RUN_COMPLETED
      version: 1
      aggregateType: ReconRun
      schema: provided/events/recon.events/RECON_RUN_COMPLETED.v1.schema.json
      example: provided/events/recon.events/RECON_RUN_COMPLETED.v1.example.json
    - type: EMONEY_VARIANCE_DETECTED
      version: 1
      aggregateType: ReconRun
      schema: provided/events/recon.events/EMONEY_VARIANCE_DETECTED.v1.schema.json
      example: provided/events/recon.events/EMONEY_VARIANCE_DETECTED.v1.example.json
    - type: RECON_EXCEPTION_RAISED
      version: 1
      aggregateType: ReconRun
      schema: provided/events/recon.events/RECON_EXCEPTION_RAISED.v1.schema.json
      example: provided/events/recon.events/RECON_EXCEPTION_RAISED.v1.example.json
  inboundTopics: []
  data: []
  codes: provided/codes.yaml
consumes:
  apis:
  - producer: ledger-service
    operation: POST /v1/ledger/accounts/balances:batchGet
    major: 1
    pinnedContractVersion: 1.0.0
    module: both
    purpose: 'reconciliation: projection verification (BR-REC-27); reporting: daily-close spot check and RR-01 cross-check (BR-RPT-42)'
    fieldsUsed:
    - req.accountIds
    - res.items[].accountId
    - res.items[].ledgerBalancePoisha
    - res.items[].heldPoisha
    - res.items[].asOf
    - res.items[].accountType
    - res.notFound
    codesUsed: []
    resilience:
      timeoutMs: 2000
      connectTimeoutMs: 300
      circuitBreaker: ledger (shared by both modules)
      rateLimitRps: 50
      onFailure: check SKIPPED; run summary partial=true; never blocks EOD
  - producer: ledger-service
    operation: GET /v1/ledger/accounts/{id}/transfers
    major: 1
    pinnedContractVersion: 1.0.0
    module: reconciliation
    purpose: posting-sum check on sampled accounts (REL-002); trust-movement backfill for file recon
    fieldsUsed:
    - path.id
    - query.fromTs
    - query.toTs
    - query.limit
    - query.cursor
    - res.items[].transferId
    - res.items[].commandId
    - res.items[].commandType
    - res.items[].legIndex
    - res.items[].code
    - res.items[].direction
    - res.items[].debitAccountId
    - res.items[].creditAccountId
    - res.items[].amountPoisha
    - res.items[].pendingId
    - res.items[].flags
    - res.items[].timestamp
    - res.items[].postedAt
    - res.items[].balanceAfterPoisha
    - res.nextCursor
    codesUsed: []
    resilience:
      timeoutMs: 3000
      connectTimeoutMs: 300
      circuitBreaker: ledger
      rateLimitRps: 50
      onFailure: posting-sum check SKIPPED; 400 INVALID_CURSOR → restart from fromTs
  - producer: ledger-service
    operation: GET /v1/ledger/commands/{commandId}
    major: 1
    pinnedContractVersion: 1.0.0
    module: reconciliation
    purpose: investigate MISSING_IN_LEDGER; original legs of a reversal; resolve unknown adjustment outcome
    fieldsUsed:
    - path.commandId
    - res.found
    - res.result
    - res.rejectionCode
    - res.transfers[].transferId
    - res.transfers[].legIndex
    - res.transfers[].code
    - res.transfers[].commandType
    - res.transfers[].debitAccountId
    - res.transfers[].creditAccountId
    - res.transfers[].amountPoisha
    - res.transfers[].pendingId
    - res.transfers[].flags
    - res.transfers[].timestamp
    - res.transfers[].postedAt
    codesUsed: []
    resilience:
      timeoutMs: 1000
      connectTimeoutMs: 300
      circuitBreaker: ledger
      onFailure: exception stays open; retried by job
  - producer: ledger-service
    operation: GET /v1/ledger/system-balance-sheet
    major: 1
    pinnedContractVersion: 1.0.0
    module: reconciliation
    purpose: e-money LIVE mode (EMY-004 on demand); informational EOD cross-check
    fieldsUsed:
    - res.asOf
    - res.trustMirrorTotalPoisha
    - res.trustAccounts[].accountId
    - res.trustAccounts[].trustIndex
    - res.trustAccounts[].mirrorBalancePoisha
