    - res.result
    - res.rejectionCode
    - res.detail
    - res.transferIds
    - res.postedAt
    codesUsed:
    - set: commandResult
      values:
      - OK
      - EXISTS
      - REJECTED
    resilience:
      timeoutMs: 2000
      connectTimeoutMs: 300
      circuitBreaker: ledger
      inlineRetry: false
      onFailure: timeout/503/5xx → POSTING, retried with the same commandId and body (1, 2, 5, 10 min…); REJECTED → FAILED; 400/403/409 → FAILED + CRITICAL alert
