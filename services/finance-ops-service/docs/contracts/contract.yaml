    - res.byWalletType
    - res.projectionLagMs
    codesUsed: []
    resilience:
      timeoutMs: 2000
      connectTimeoutMs: 300
      circuitBreaker: ledger
      onFailure: LIVE run FAILED → 503 DEPENDENCY_UNAVAILABLE to the caller; EOD unaffected
  - producer: ledger-service
    operation: POST /v1/ledger/commands/post-adjustment
    major: 1
    pinnedContractVersion: 1.0.0
    module: reconciliation
    purpose: post an APPROVED reconciliation adjustment (command 11, RCA- reference)
    fieldsUsed:
    - header.Idempotency-Key
    - req.commandId
    - req.txnRef
    - req.debitAccountId
    - req.creditAccountId
    - req.amountPoisha
    - req.reasonCode
