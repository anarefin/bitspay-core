    post:
      operationId: closeEodDay
      summary: Manual EOD close (force=true needs approval)
      tags:
      - reconciliation
      x-module: reconciliation
      x-audience: staff
      x-actors:
        types:
        - STAFF
        - SYSTEM
        roles:
        - FIN_MAKER
      x-release: R1
      parameters:
      - $ref: '#/components/parameters/XCorrelationId'
      - $ref: '#/components/parameters/XActorType'
      - $ref: '#/components/parameters/XActorId'
      - $ref: '#/components/parameters/XActorWalletId'
      - $ref: '#/components/parameters/XActorRoles'
      - $ref: '#/components/parameters/XActorUserId'
      - $ref: '#/components/parameters/XChannel'
      - $ref: '#/components/parameters/IdempotencyKeyRequired'
      - name: businessDate
        in: path
        required: true
        schema:
          type: string
          format: date
          pattern: ^\d{4}-\d{2}-\d{2}$
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/EodCloseRequest'
            example:
              force: false
              reason: null
      responses:
        '202':
          description: Accepted
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/EodCloseAccepted'
              example:
                businessDate: '2026-10-09'
                status: AWAITING_WATERMARK
                approvalId: null
        '400':
          $ref: '#/components/responses/BadRequest'
        '403':
          $ref: '#/components/responses/Forbidden'
        '409':
          description: STATE_CONFLICT; reason ∈ {ALREADY_CLOSED, NOT_YET_CUTOFF, PREVIOUS_DAY_OPEN} · or IDEMPOTENCY_CONFLICT (same key, different
            body)
          content:
            application/problem+json:
              schema:
                allOf:
                - $ref: '#/components/schemas/Problem'
                - properties:
                    reason:
                      type:
                      - string
                      - 'null'
                      enum:
                      - ALREADY_CLOSED
                      - NOT_YET_CUTOFF
                      - PREVIOUS_DAY_OPEN
                      - null
              example:
                type: about:blank
                title: Conflict
                status: 409
                code: STATE_CONFLICT
                correlationId: c-0f3e9a
                reason: ALREADY_CLOSED
