                status: 400
                code: VALIDATION_FAILED
                correlationId: c-0f3e9a
                errors:
                - field: limit
                  message: must be 1..200
                reason: TOO_LARGE_FOR_SYNC
        '403':
          $ref: '#/components/responses/Forbidden'
        '404':
          $ref: '#/components/responses/NotFound'
        '409':
          $ref: '#/components/responses/Conflict'
        '503':
