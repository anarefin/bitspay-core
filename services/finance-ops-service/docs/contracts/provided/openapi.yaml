          description: 'Extension: set with reason DUPLICATE_STATEMENT_FILE'
      description: 'Kernel K3.6 problem body. Extension member owned here: existingFileId.'
  parameters:
    XCorrelationId:
      name: X-Correlation-Id
      in: header
      required: false
      schema:
        type: string
        maxLength: 64
        pattern: ^[A-Za-z0-9._-]+$
      description: Generated if absent (kernel K3.1)
    XActorType:
      name: X-Actor-Type
      in: header
      required: true
      schema:
        type: string
        enum:
        - CUSTOMER
        - AGENT
        - MERCHANT
        - DISTRIBUTOR
        - INSTITUTION
        - STAFF
        - SYSTEM
        - SERVICE
    XActorId:
      name: X-Actor-Id
      in: header
      required: true
      schema:
        type: string
        maxLength: 64
    XActorWalletId:
      name: X-Actor-Wallet-Id
      in: header
      required: false
      schema:
        type: string
        format: uuid
        pattern: ^[0-9a-f]{8}-[0-9a-f]{4}-[0-9a-f]{4}-[0-9a-f]{4}-[0-9a-f]{12}$
    XActorRoles:
      name: X-Actor-Roles
      in: header
      required: false
      schema:
        type: string
      description: Comma-separated K7 role codes (STAFF)
    XActorUserId:
      name: X-Actor-User-Id
      in: header
      required: false
      schema:
        type: string
        maxLength: 64
        pattern: ^[A-Za-z0-9_-]+$
    XChannel:
      name: X-Channel
      in: header
      required: true
      schema:
        type: string
        enum:
        - APP
        - USSD
        - PARTNER_APP
        - PORTAL
        - BACKOFFICE
        - API
        - SYSTEM
    IdempotencyKeyRequired:
      name: Idempotency-Key
      in: header
      required: true
      schema:
        type: string
        maxLength: 64
        pattern: ^[A-Za-z0-9_-]+$
    IdempotencyKeyOptional:
      name: Idempotency-Key
      in: header
      required: false
      schema:
        type: string
        maxLength: 64
        pattern: ^[A-Za-z0-9_-]+$
      description: Optional; same key + same body within 7 days replays the original response
    Limit:
      name: limit
      in: query
      required: false
      schema:
        type: integer
        format: int32
        minimum: 1
        maximum: 200
        default: 50
    Cursor:
      name: cursor
      in: query
      required: false
      schema:
        type: string
      description: Opaque, 24 h (kernel K3.4)
  responses:
    BadRequest:
      description: VALIDATION_FAILED
      content:
        application/problem+json:
          schema:
            $ref: '#/components/schemas/Problem'
          example:
            type: about:blank
            title: BadRequest
            status: 400
            code: VALIDATION_FAILED
            correlationId: c-0f3e9a
            errors:
            - field: limit
              message: must be 1..200
    Forbidden:
      description: ACTOR_NOT_ALLOWED
      content:
        application/problem+json:
          schema:
            $ref: '#/components/schemas/Problem'
          example:
            type: about:blank
            title: Forbidden
            status: 403
            code: ACTOR_NOT_ALLOWED
            correlationId: c-0f3e9a
    NotFound:
