          description: VALIDATION_FAILED; reason ∈ {TOO_LARGE_FOR_SYNC, TOO_MANY_ROWS_FOR_PDF, PARAMETER_INVALID, RANGE_TOO_LARGE, FORMAT_NOT_ALLOWED}
