        - FIN_MAKER
        - FIN_CHECKER
        - COMPLIANCE_OFFICER
        - CAMLCO
        - AUDITOR
        - READ_ONLY
        serviceCallers:
        - support-service
        note: 'Holder: X-Actor-Wallet-Id = walletId (SELF); DISTRIBUTOR ancestor of the wallet''s partner (HIER); listed STAFF roles; SERVICE
          support-service only'
      x-release: R1
      parameters:
      - $ref: '#/components/parameters/XCorrelationId'
      - $ref: '#/components/parameters/XActorType'
      - $ref: '#/components/parameters/XActorId'
