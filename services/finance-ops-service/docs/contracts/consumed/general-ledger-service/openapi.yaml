            description: 'provider extension: what blocks the close (business dates, journal ids, exception ids, period ids), max 200'
  parameters:
    XActorType:
      name: X-Actor-Type
      in: header
      required: true
      description: Kernel K3.1. general-ledger-service accepts STAFF, SERVICE (catalogued reads) and SYSTEM (internal job hook).
      schema:
        type: string
        enum:
        - STAFF
        - SERVICE
        - SYSTEM
    XActorId:
      name: X-Actor-Id
      in: header
      required: true
      description: 'Kernel K3.1: staffUserId (canonical UUID) for STAFF; bare spring.application.name for SERVICE/SYSTEM.'
      schema:
        type: string
        maxLength: 64
    XActorRoles:
      name: X-Actor-Roles
      in: header
      required: false
      description: 'Kernel K3.1/K7: STAFF role codes, comma-separated, no spaces. Required for STAFF.'
      schema:
        type: string
    XChannel:
      name: X-Channel
      in: header
      required: true
      description: Kernel K3.1 closed list. BACKOFFICE for staff, SYSTEM for services and jobs.
      schema:
        type: string
        enum:
        - APP
        - USSD
        - PARTNER_APP
        - PORTAL
        - BACKOFFICE
        - API
        - SYSTEM
    XCorrelationId:
      name: X-Correlation-Id
      in: header
      required: false
      description: Kernel K3.1; generated when absent.
      schema:
        type: string
        maxLength: 64
        pattern: ^[A-Za-z0-9._-]+$
    IdempotencyKey:
      name: Idempotency-Key
      in: header
      required: true
      description: 'Kernel K3.3: scope (X-Actor-Id, key), retention 7 days, same key + different payload → 409 IDEMPOTENCY_CONFLICT.'
      schema:
        type: string
        maxLength: 64
        pattern: ^[A-Za-z0-9_-]+$
    Limit:
      name: limit
      in: query
      schema:
        type: integer
        minimum: 1
        maximum: 200
        default: 50
      description: 'Kernel K3.4: 1..200, default 50.'
    Cursor:
      name: cursor
      in: query
      schema:
        type: string
      description: 'Kernel K3.4: opaque, 24 h, same endpoint/actor/filters; else 400 reason INVALID_CURSOR.'
    XActorUserId:
      name: X-Actor-User-Id
      in: header
      required: false
      description: 'Kernel K3.1: individual user; compared for maker ≠ checker and audit only.'
      schema:
        type: string
        maxLength: 64
        pattern: ^[A-Za-z0-9_-]+$
  responses:
    E400:
      description: VALIDATION_FAILED
      content:
        application/problem+json:
          schema:
            $ref: '#/components/schemas/Problem'
    E403:
      description: ACTOR_NOT_ALLOWED
      content:
        application/problem+json:
          schema:
            $ref: '#/components/schemas/Problem'
    E404:
      description: NOT_FOUND
      content:
        application/problem+json:
          schema:
            $ref: '#/components/schemas/Problem'
    E409:
      description: STATE_CONFLICT / IDEMPOTENCY_CONFLICT (reason in `reason`)
      content:
        application/problem+json:
          schema:
            $ref: '#/components/schemas/Problem'
    E422:
      description: MAKER_CHECKER_VIOLATION
      content:
        application/problem+json:
          schema:
            $ref: '#/components/schemas/Problem'
    E503:
      description: DEPENDENCY_UNAVAILABLE
      content:
        application/problem+json:
          schema:
            $ref: '#/components/schemas/Problem'
