# general-ledger-service — provided REST contract (v6 pack, contractVersion 2.0.0). OpenAPI 3.1.
# Every operation: x-audience, x-actors, operationId, per-operation problem reasons, request/2xx examples.
openapi: 3.1.0
info:
  title: general-ledger-service
  version: 2.0.0
  description: 'Provided REST contract of general-ledger-service (SVC-16): the Operator''s books. Chart of accounts, posting rules, journals,
    GL days and control totals, periods and fiscal years, reports, exceptions and the maker-checker approval API. Kernel rules apply
    (headers K3.1, idempotency K3.3, pagination K3.4, problem+json K3.6). Every operation carries x-audience and x-actors; x-actors lists the
    allowed actor types with STAFF roles, or the allowed X-Actor-Id values for SERVICE callers. Read-only operations take no Idempotency-Key.
    Every list and report operation that declares text/csv also answers Accept: text/csv.'
servers:
- url: http://localhost:8000/general-ledger
- url: http://localhost:8116
tags:
- name: Chart of accounts
- name: Posting rules
- name: Journals
- name: Days
- name: Periods
- name: Reports
- name: Exceptions
- name: Approvals
- name: Internal
paths:
  /v1/gl/accounts:
    get:
      summary: List chart-of-accounts entries
      tags:
      - Chart of accounts
      parameters:
      - $ref: '#/components/parameters/XActorType'
      - $ref: '#/components/parameters/XActorId'
      - $ref: '#/components/parameters/XActorRoles'
      - $ref: '#/components/parameters/XChannel'
      - $ref: '#/components/parameters/XCorrelationId'
      - name: status
        in: query
        required: false
        schema:
          type: string
          enum:
          - ACTIVE
          - INACTIVE
          - PENDING_APPROVAL
      - name: accountClass
        in: query
        required: false
        schema:
          type: string
          enum:
          - ASSET
          - LIABILITY
          - EQUITY
          - INCOME
          - EXPENSE
      - name: parentCode
        in: query
        required: false
        schema:
          type: string
      - name: postable
        in: query
        required: false
        schema:
          type: boolean
      - $ref: '#/components/parameters/Limit'
      - $ref: '#/components/parameters/Cursor'
      responses:
        '200':
          description: OK
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/GlAccountPage'
              example:
                items:
                - code: '2101'
                  nameEn: E-money liability - customers
                  nameBn: null
                  accountClass: LIABILITY
                  normalSide: CREDIT
                  contra: false
                  parentCode: '2100'
                  level: 3
                  postable: true
                  ledgerControlled: true
                  manualPostingAllowed: false
                  mustBeZero: false
                  status: ACTIVE
                  provisional: true
                  version: 1
                  updatedAt: '2026-10-01T00:00:05.000Z'
                  templateCode: null
                  description: All CUSTOMER_WALLET (100) accounts
                  effectiveFrom: '2026-10-01'
                  createdAt: '2026-10-01T00:00:05.000Z'
                - code: '5301'
                  nameEn: Bank charges
                  nameBn: null
                  accountClass: EXPENSE
                  normalSide: DEBIT
                  contra: false
                  parentCode: '5300'
                  level: 3
                  postable: true
                  ledgerControlled: false
                  manualPostingAllowed: true
                  mustBeZero: false
                  status: ACTIVE
                  provisional: true
                  version: 3
                  updatedAt: '2026-10-01T00:00:05.000Z'
                  templateCode: null
                  description: Operating bank account charges
                  effectiveFrom: '2026-10-01'
                  createdAt: '2026-10-01T00:00:05.000Z'
                nextCursor: null
        '400':
          description: VALIDATION_FAILED; reason ∈ {INVALID_CURSOR}
          content:
            application/problem+json:
              schema:
                allOf:
                - $ref: '#/components/schemas/Problem'
                - type: object
                  properties:
                    reason:
                      type:
                      - string
                      - 'null'
                      enum:
                      - INVALID_CURSOR
                      - null
        '403':
          description: ACTOR_NOT_ALLOWED
          content:
            application/problem+json:
              schema:
                $ref: '#/components/schemas/Problem'
        '503':
          description: DEPENDENCY_UNAVAILABLE
          content:
            application/problem+json:
              schema:
                $ref: '#/components/schemas/Problem'
      operationId: listGlAccounts
      x-audience: service
      x-actors:
      - type: SERVICE
        ids:
        - finance-ops-service
      - type: STAFF
        roles:
        - FIN_MAKER
        - FIN_CHECKER
        - AUDITOR
      x-idempotency: none (read-only or naturally idempotent)
    post:
      summary: Propose a new GL account (maker-checker GlAccount/CREATE)
      tags:
      - Chart of accounts
      parameters:
      - $ref: '#/components/parameters/XActorType'
      - $ref: '#/components/parameters/XActorId'
      - $ref: '#/components/parameters/XActorRoles'
      - $ref: '#/components/parameters/XActorUserId'
      - $ref: '#/components/parameters/XChannel'
      - $ref: '#/components/parameters/XCorrelationId'
      - $ref: '#/components/parameters/IdempotencyKey'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/GlAccountCreate'
            example:
              code: '5302'
              nameEn: Bank charges - trust accounts
              nameBn: null
              accountClass: EXPENSE
              contra: false
              parentCode: '5300'
              postable: true
              ledgerControlled: false
              manualPostingAllowed: true
              mustBeZero: false
              description: Charges levied on trust bank accounts
              effectiveFrom: '2026-11-01'
      responses:
        '202':
          description: Accepted — approval created
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ApprovalRef'
              example:
                approvalId: 0192f701-0000-7000-8000-000000000001
                entityType: GlAccount
                entityId: '5302'
                status: PENDING
                requiredLevels: 1
                checkerRoles:
                - FIN_CHECKER
                expiresAt: '2026-10-13T09:30:00.120Z'
        '400':
          description: VALIDATION_FAILED; reason ∈ {PARENT_CLASS_MISMATCH, MANUAL_POSTING_NOT_ALLOWED}
          content:
            application/problem+json:
              schema:
                allOf:
                - $ref: '#/components/schemas/Problem'
                - type: object
                  properties:
                    reason:
                      type:
                      - string
                      - 'null'
                      enum:
                      - PARENT_CLASS_MISMATCH
                      - MANUAL_POSTING_NOT_ALLOWED
                      - null
        '403':
          description: ACTOR_NOT_ALLOWED
          content:
            application/problem+json:
              schema:
                $ref: '#/components/schemas/Problem'
        '409':
          description: STATE_CONFLICT or IDEMPOTENCY_CONFLICT; reason ∈ {PERIOD_CLOSED}; IDEMPOTENCY_CONFLICT when the key was used with another
            payload
          content:
            application/problem+json:
              schema:
                allOf:
                - $ref: '#/components/schemas/Problem'
                - type: object
                  properties:
                    reason:
                      type:
                      - string
                      - 'null'
                      enum:
                      - PERIOD_CLOSED
                      - null
        '503':
          description: DEPENDENCY_UNAVAILABLE
          content:
            application/problem+json:
              schema:
                $ref: '#/components/schemas/Problem'
      operationId: createGlAccount
      x-audience: staff
      x-actors:
      - type: STAFF
        roles:
        - FIN_MAKER
      x-idempotency: Idempotency-Key required (kernel K3.3)
