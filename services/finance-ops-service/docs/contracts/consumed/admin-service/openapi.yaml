      - $ref: '#/components/parameters/XActorType'
      - $ref: '#/components/parameters/XActorId'
      - $ref: '#/components/parameters/XChannel'
      - $ref: '#/components/parameters/XActorRoles'
      - $ref: '#/components/parameters/IdempotencyKeyOptional'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/StaffUserCreate'
            example:
              username: tanvir.h
              fullName: Tanvir Hasan
              email: tanvir.h@bitspay.example
              msisdn: '8801712345678'
              employeeNo: E-1042
              department: OPERATIONS
              roles:
              - OPS_CHECKER
              scopes:
              - scopeType: ALL
                scopeCode: '*'
      responses:
        '202':
          description: Accepted — approval created
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ApprovalAccepted'
              example:
                approvalId: 0192f4a0-1b2c-7d00-8e11-2a3b4c5d6e7f
                status: PENDING
                entityType: StaffUser
                entityId: 0192f49f-5c3d-7a10-b2c4-9d8e7f6a5b4c
                requiredLevels: 1
                expiresAt: '2026-10-12T04:00:00.000Z'
                sodWarnings: []
        '400':
          $ref: '#/components/responses/BadRequest'
        '403':
          $ref: '#/components/responses/Forbidden'
        '409':
          $ref: '#/components/responses/Conflict'
      x-problem-reasons:
        VALIDATION_FAILED:
        - UNKNOWN_ROLE
        - UNKNOWN_GEO
        - SCOPE_ALL_EXCLUSIVE
        STATE_CONFLICT:
        - USERNAME_EXISTS
        - APPROVAL_ALREADY_OPEN
        SOD_VIOLATION:
        - SOD_BLOCK
    get:
      operationId: listStaffUsers
      summary: List staff users
      tags:
      - 'governance: staff RBAC'
      x-audience: staff
      x-actors:
      - type: STAFF
        roles:
        - ADMIN
        - AUDITOR
        - READ_ONLY
      x-module: governance
      x-idempotency: read-only or naturally idempotent; no key
      parameters:
      - $ref: '#/components/parameters/XCorrelationId'
      - $ref: '#/components/parameters/XActorType'
      - $ref: '#/components/parameters/XActorId'
      - $ref: '#/components/parameters/XChannel'
      - $ref: '#/components/parameters/XActorRoles'
      - name: status
        in: query
        required: false
        schema:
          type: string
          enum:
          - ACTIVE
          - SUSPENDED
          - DISABLED
      - name: role
        in: query
        required: false
        schema:
          type: string
      - name: department
        in: query
        required: false
        schema:
          type: string
      - name: q
        in: query
        required: false
        schema:
          type: string
      - name: cursor
        in: query
        required: false
        schema:
          type: string
      - name: limit
        in: query
        required: false
        schema:
          type: integer
          minimum: 1
          maximum: 200
          default: 50
      responses:
        '200':
          description: OK
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/StaffUserPage'
              example:
                items:
                - staffId: 0192f49f-5c3d-7a10-b2c4-9d8e7f6a5b4c
                  username: tanvir.h
                  fullName: Tanvir Hasan
                  email: tanvir.h@bitspay.example
                  msisdn: '8801712345678'
                  employeeNo: E-1042
                  department: OPERATIONS
                  status: ACTIVE
                  disabledReason: null
                  roles:
                  - OPS_CHECKER
                  dataScopes:
                  - scopeType: ALL
                    scopeCode: '*'
                  lastActivityAt: '2026-10-09T05:00:00.000Z'
                  createdAt: '2026-10-01T04:00:00.000Z'
                  updatedAt: '2026-10-09T05:10:11.000Z'
                  version: 3
                nextCursor: null
        '400':
          $ref: '#/components/responses/BadRequest'
        '403':
          $ref: '#/components/responses/Forbidden'
