          minLength: 1
          maxLength: 500
        reasonCode:
          type: string
          pattern: ^[A-Z_]{3,40}$
      required:
      - comment
    CancelBody:
      type: object
      additionalProperties: true
      properties:
        comment:
          type: string
          maxLength: 500
      required: []
    ApprovalPage:
