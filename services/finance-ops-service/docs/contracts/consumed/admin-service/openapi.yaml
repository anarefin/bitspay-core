components:
  parameters:
    XCorrelationId:
      name: X-Correlation-Id
      in: header
      required: false
      schema:
        type: string
        maxLength: 64
    XActorType:
      name: X-Actor-Type
      in: header
      required: true
      schema:
        type: string
        enum:
        - CUSTOMER
        - AGENT
        - MERCHANT
        - DISTRIBUTOR
        - INSTITUTION
        - STAFF
        - SERVICE
        - SYSTEM
    XActorId:
      name: X-Actor-Id
      in: header
      required: true
      schema:
        type: string
        maxLength: 64
    XActorRoles:
      name: X-Actor-Roles
      in: header
      required: false
      schema:
        type: string
    XActorWalletId:
      name: X-Actor-Wallet-Id
      in: header
      required: false
      schema:
        type: string
        format: uuid
        pattern: ^[0-9a-f]{8}-[0-9a-f]{4}-[0-9a-f]{4}-[0-9a-f]{4}-[0-9a-f]{12}$
    XActorUserId:
      name: X-Actor-User-Id
      in: header
      required: false
      schema:
        type: string
        maxLength: 64
    XChannel:
      name: X-Channel
      in: header
      required: true
      schema:
        type: string
        enum:
        - APP
        - USSD
        - PARTNER_APP
        - PORTAL
        - BACKOFFICE
        - API
        - SYSTEM
    IdempotencyKeyOptional:
      name: Idempotency-Key
      in: header
      required: false
      schema:
        type: string
        maxLength: 64
        pattern: ^[A-Za-z0-9_-]+$
    IdempotencyKeyRequired:
      name: Idempotency-Key
      in: header
      required: true
      schema:
        type: string
        maxLength: 64
        pattern: ^[A-Za-z0-9_-]+$
  responses:
    BadRequest:
      description: VALIDATION_FAILED
      content:
        application/problem+json:
          schema:
            $ref: '#/components/schemas/Problem'
    Forbidden:
      description: ACTOR_NOT_ALLOWED
      content:
        application/problem+json:
          schema:
            $ref: '#/components/schemas/Problem'
    NotFound:
      description: NOT_FOUND
      content:
        application/problem+json:
          schema:
            $ref: '#/components/schemas/Problem'
    Conflict:
      description: STATE_CONFLICT | IDEMPOTENCY_CONFLICT | SOD_VIOLATION
      content:
        application/problem+json:
          schema:
            $ref: '#/components/schemas/Problem'
    Unprocessable:
      description: MAKER_CHECKER_VIOLATION
      content:
        application/problem+json:
          schema:
            $ref: '#/components/schemas/Problem'
    Unavailable:
      description: DEPENDENCY_UNAVAILABLE
      content:
        application/problem+json:
          schema:
            $ref: '#/components/schemas/Problem'
  schemas:
    Problem:
      type: object
      additionalProperties: true
      properties:
        type:
          type: string
        title:
          type: string
          maxLength: 200
        status:
          type: integer
          format: int32
        code:
          type: string
          enum:
          - VALIDATION_FAILED
          - ACTOR_NOT_ALLOWED
          - NOT_FOUND
          - IDEMPOTENCY_CONFLICT
          - STATE_CONFLICT
          - SOD_VIOLATION
          - INSUFFICIENT_FUNDS
          - LIMIT_EXCEEDED
          - RISK_BLOCKED
          - RISK_STEP_UP_REQUIRED
          - RISK_HELD_FOR_REVIEW
          - WALLET_NOT_TRANSACTABLE
          - MAX_BALANCE_EXCEEDED
          - REFUND_EXCEEDS_ORIGINAL
          - SERVICE_DISABLED
          - MAKER_CHECKER_VIOLATION
          - DEPENDENCY_UNAVAILABLE
        detail:
          type:
          - string
          - 'null'
          maxLength: 1000
        instance:
          type:
          - string
          - 'null'
        correlationId:
          type: string
        reason:
          type:
          - string
          - 'null'
          pattern: ^[A-Z][A-Z0-9_]*$
        errors:
          type: array
          items:
            type: object
            additionalProperties: true
            properties:
              field:
                type: string
              message:
                type: string
            required:
            - field
            - message
        retryable:
          type: boolean
        sodRuleCodes:
          type: array
          items:
            type: string
          description: admin-service extension; present iff code = SOD_VIOLATION
      required:
      - type
      - title
      - status
      - code
      - correlationId
      description: Kernel K3.6 problem body plus admin-service extension members
    ApprovalAccepted:
      type: object
      additionalProperties: true
      properties:
        approvalId:
          type: string
          format: uuid
          pattern: ^[0-9a-f]{8}-[0-9a-f]{4}-[0-9a-f]{4}-[0-9a-f]{4}-[0-9a-f]{12}$
        status:
          type: string
          enum:
          - PENDING
        entityType:
          type: string
        entityId:
          type: string
        requiredLevels:
          type: integer
          format: int32
        expiresAt:
          type: string
          format: date-time
        sodWarnings:
          type: array
          items:
            type: string
          description: SoD WARN rule codes (staff role changes only)
      required:
      - approvalId
      - status
      - entityType
      - entityId
      - requiredLevels
      - expiresAt
      description: 202 body of every maker request; the change applies only on final approval
    Approval:
      type: object
      additionalProperties: true
      properties:
        approvalId:
          type: string
          format: uuid
          pattern: ^[0-9a-f]{8}-[0-9a-f]{4}-[0-9a-f]{4}-[0-9a-f]{4}-[0-9a-f]{12}$
        module:
          type: string
          enum:
          - governance
          - notification
        entityType:
          type: string
        entityId:
          type: string
        action:
          type: string
        makerId:
          type: string
        status:
          type: string
          enum:
          - PENDING
          - APPROVED
          - REJECTED
          - EXPIRED
          - CANCELLED
        level:
          type: integer
          minimum: 1
          description: 1-based level awaiting decision (PENDING) or last decided
        requiredLevels:
          type: integer
          format: int32
        checkerRoles:
          type: array
          items:
            type: string
            enum:
            - OPS_MAKER
            - OPS_CHECKER
            - FIN_MAKER
            - FIN_CHECKER
            - SUP_AGENT
            - SUP_MAKER
            - SUP_CHECKER
            - RISK_ANALYST
            - RISK_CHECKER
            - COMPLIANCE_OFFICER
            - CAMLCO
            - PARTNER_OPS_MAKER
            - PARTNER_OPS_CHECKER
            - PRICING_MAKER
            - PRICING_CHECKER
            - ADMIN
            - AUDITOR
            - READ_ONLY
        amountPoisha:
          type:
          - integer
          - 'null'
          format: int64
        summary:
          type: string
        payload:
          type: object
        decidedBy:
          type: array
          items:
            type: string
        createdAt:
          type: string
          format: date-time
        decidedAt:
          type:
          - string
          - 'null'
          format: date-time
        expiresAt:
          type: string
          format: date-time
        decisionComment:
          type:
          - string
          - 'null'
      required:
      - approvalId
      - module
      - entityType
      - entityId
      - action
      - makerId
      - status
      - level
      - requiredLevels
      - checkerRoles
      - amountPoisha
      - summary
      - payload
      - decidedBy
      - createdAt
      - decidedAt
      - expiresAt
      - decisionComment
    ApproveBody:
      type: object
      additionalProperties: true
      properties:
        comment:
          type: string
          maxLength: 500
      required: []
    RejectBody:
      type: object
      additionalProperties: true
      properties:
        comment:
