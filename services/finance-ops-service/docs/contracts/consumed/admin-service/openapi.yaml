openapi: 3.1.0
info:
  title: admin-service (governance + notification)
  version: 1.1.0
  description: Every operation served by admin-service (SVC-15). x-audience marks who may call; x-actors lists allowed actor types, staff roles and SERVICE caller ids. Errors are RFC 9457 problem+json per
    kernel K3.6; x-problem-reasons lists the provider-owned reason values per code. Maker requests return 202 and apply only on final approval (kernel K5).
servers:
- url: http://localhost:8115
tags:
- name: Approvals (shared engine)
- name: 'governance: activity monitoring'
- name: 'governance: approval inbox'
- name: 'governance: audit'
- name: 'governance: products and retention'
- name: 'governance: reference data'
- name: 'governance: staff RBAC'
- name: 'notification: inbox'
- name: 'notification: logs'
- name: 'notification: policies'
- name: 'notification: preferences'
- name: 'notification: reminders'
- name: 'notification: rules and providers'
- name: 'notification: templates'
paths:
  /v1/approvals:
    get:
      operationId: listApprovals
      summary: List this service's own approvals (both modules)
      tags:
      - Approvals (shared engine)
      x-audience: staff
      x-actors:
      - type: STAFF
        roles:
        - '*'
      x-module: common
      x-idempotency: read-only or naturally idempotent; no key
      parameters:
      - $ref: '#/components/parameters/XCorrelationId'
      - $ref: '#/components/parameters/XActorType'
      - $ref: '#/components/parameters/XActorId'
      - $ref: '#/components/parameters/XChannel'
      - $ref: '#/components/parameters/XActorRoles'
      - name: status
        in: query
        required: false
        schema:
          type: string
          enum:
          - PENDING
          - APPROVED
          - REJECTED
          - EXPIRED
          - CANCELLED
      - name: entityType
        in: query
        required: false
        schema:
          type: string
      - name: module
        in: query
        required: false
        schema:
          type: string
          enum:
          - governance
          - notification
      - name: cursor
        in: query
        required: false
        schema:
          type: string
      - name: limit
        in: query
        required: false
        schema:
          type: integer
          minimum: 1
          maximum: 200
          default: 50
      responses:
        '200':
          description: OK
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ApprovalPage'
              example:
                items:
                - approvalId: 0192f4a0-1b2c-7d00-8e11-2a3b4c5d6e7f
                  module: governance
                  entityType: StaffUser
                  entityId: 0192f49f-5c3d-7a10-b2c4-9d8e7f6a5b4c
                  action: ASSIGN_ROLES
                  makerId: 0192f001-0000-7000-8000-000000000001
                  status: APPROVED
                  level: 1
                  requiredLevels: 1
                  checkerRoles:
                  - ADMIN
                  amountPoisha: null
                  summary: Assign OPS_CHECKER to tanvir.h
                  payload:
                    add:
                    - OPS_CHECKER
                    remove: []
                  decidedBy:
                  - 0192f002-0000-7000-8000-000000000002
                  createdAt: '2026-10-09T04:00:00.000Z'
                  decidedAt: '2026-10-09T05:10:11.000Z'
                  expiresAt: '2026-10-12T04:00:00.000Z'
                  decisionComment: ok
                nextCursor: null
        '400':
          $ref: '#/components/responses/BadRequest'
        '403':
          $ref: '#/components/responses/Forbidden'
  /v1/approvals/{id}:approve:
    post:
      operationId: approveApproval
      summary: Approve the current level of an approval
      tags:
      - Approvals (shared engine)
      x-audience: staff
      x-actors:
      - type: STAFF
        roles:
        - ADMIN
        - OPS_CHECKER
        - FIN_CHECKER
        - CAMLCO
      x-module: common
      description: Role required = the current level's checkerRoles (BR-GOV-03 / BR-NOT-14). Applying the change, APPROVAL_DECIDED and AUDIT_RECORDED happen in one DB transaction.
      x-idempotency: Idempotency-Key optional; honoured for 7 days when sent (kernel K3.3)
      parameters:
      - $ref: '#/components/parameters/XCorrelationId'
      - $ref: '#/components/parameters/XActorType'
      - $ref: '#/components/parameters/XActorId'
      - $ref: '#/components/parameters/XChannel'
      - $ref: '#/components/parameters/XActorRoles'
      - $ref: '#/components/parameters/XActorUserId'
      - $ref: '#/components/parameters/IdempotencyKeyOptional'
      - name: id
        in: path
        required: true
        schema:
          type: string
          format: uuid
          pattern: ^[0-9a-f]{8}-[0-9a-f]{4}-[0-9a-f]{4}-[0-9a-f]{4}-[0-9a-f]{12}$
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/ApproveBody'
            example:
              comment: ok
      responses:
        '200':
          description: OK
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Approval'
              example:
                approvalId: 0192f4a0-1b2c-7d00-8e11-2a3b4c5d6e7f
                module: governance
                entityType: StaffUser
                entityId: 0192f49f-5c3d-7a10-b2c4-9d8e7f6a5b4c
                action: ASSIGN_ROLES
                makerId: 0192f001-0000-7000-8000-000000000001
                status: APPROVED
                level: 1
                requiredLevels: 1
                checkerRoles:
                - ADMIN
                amountPoisha: null
                summary: Assign OPS_CHECKER to tanvir.h
                payload:
                  add:
                  - OPS_CHECKER
                  remove: []
                decidedBy:
                - 0192f002-0000-7000-8000-000000000002
                createdAt: '2026-10-09T04:00:00.000Z'
                decidedAt: '2026-10-09T05:10:11.000Z'
                expiresAt: '2026-10-12T04:00:00.000Z'
                decisionComment: ok
        '400':
          $ref: '#/components/responses/BadRequest'
        '403':
          $ref: '#/components/responses/Forbidden'
        '404':
          $ref: '#/components/responses/NotFound'
        '409':
          $ref: '#/components/responses/Conflict'
        '422':
          $ref: '#/components/responses/Unprocessable'
      x-problem-reasons:
        STATE_CONFLICT:
        - NOT_PENDING
        - APPROVAL_EXPIRED
        - REVALIDATION_FAILED
        SOD_VIOLATION:
        - SOD_BLOCK
        MAKER_CHECKER_VIOLATION:
        - CHECKER_IS_MAKER
        - CHECKER_IS_SUBJECT
        - CHECKER_ALREADY_DECIDED
  /v1/approvals/{id}:reject:
    post:
      operationId: rejectApproval
      summary: Reject an approval
      tags:
      - Approvals (shared engine)
      x-audience: staff
      x-actors:
      - type: STAFF
        roles:
        - ADMIN
        - OPS_CHECKER
        - FIN_CHECKER
        - CAMLCO
      x-module: common
      x-idempotency: Idempotency-Key optional; honoured for 7 days when sent (kernel K3.3)
      parameters:
      - $ref: '#/components/parameters/XCorrelationId'
      - $ref: '#/components/parameters/XActorType'
      - $ref: '#/components/parameters/XActorId'
      - $ref: '#/components/parameters/XChannel'
      - $ref: '#/components/parameters/XActorRoles'
      - $ref: '#/components/parameters/XActorUserId'
      - $ref: '#/components/parameters/IdempotencyKeyOptional'
      - name: id
        in: path
        required: true
        schema:
          type: string
          format: uuid
          pattern: ^[0-9a-f]{8}-[0-9a-f]{4}-[0-9a-f]{4}-[0-9a-f]{4}-[0-9a-f]{12}$
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/RejectBody'
            example:
              comment: wrong district
      responses:
        '200':
          description: OK
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Approval'
              example:
                approvalId: 0192f4a0-1b2c-7d00-8e11-2a3b4c5d6e7f
                module: governance
                entityType: StaffUser
                entityId: 0192f49f-5c3d-7a10-b2c4-9d8e7f6a5b4c
                action: ASSIGN_ROLES
                makerId: 0192f001-0000-7000-8000-000000000001
                status: REJECTED
                level: 1
                requiredLevels: 1
                checkerRoles:
                - ADMIN
                amountPoisha: null
                summary: Assign OPS_CHECKER to tanvir.h
                payload:
                  add:
                  - OPS_CHECKER
                  remove: []
                decidedBy:
                - 0192f002-0000-7000-8000-000000000002
                createdAt: '2026-10-09T04:00:00.000Z'
                decidedAt: '2026-10-09T05:10:11.000Z'
                expiresAt: '2026-10-12T04:00:00.000Z'
                decisionComment: wrong district
        '400':
          $ref: '#/components/responses/BadRequest'
        '403':
          $ref: '#/components/responses/Forbidden'
        '404':
          $ref: '#/components/responses/NotFound'
        '409':
          $ref: '#/components/responses/Conflict'
        '422':
          $ref: '#/components/responses/Unprocessable'
      x-problem-reasons:
        STATE_CONFLICT:
        - NOT_PENDING
        - APPROVAL_EXPIRED
        MAKER_CHECKER_VIOLATION:
        - CHECKER_IS_MAKER
        - CHECKER_IS_SUBJECT
        - CHECKER_ALREADY_DECIDED
  /v1/approvals/{id}:cancel:
    post:
      operationId: cancelApproval
      summary: Maker withdraws a pending approval
      tags:
      - Approvals (shared engine)
      x-audience: staff
      x-actors:
      - type: STAFF
        roles:
        - '*'
      x-module: common
      x-idempotency: Idempotency-Key optional; honoured for 7 days when sent (kernel K3.3)
      parameters:
      - $ref: '#/components/parameters/XCorrelationId'
      - $ref: '#/components/parameters/XActorType'
      - $ref: '#/components/parameters/XActorId'
      - $ref: '#/components/parameters/XChannel'
      - $ref: '#/components/parameters/IdempotencyKeyOptional'
      - name: id
        in: path
        required: true
        schema:
          type: string
          format: uuid
          pattern: ^[0-9a-f]{8}-[0-9a-f]{4}-[0-9a-f]{4}-[0-9a-f]{4}-[0-9a-f]{12}$
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/CancelBody'
            example:
              comment: raised by mistake
      responses:
        '200':
          description: OK
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Approval'
              example:
                approvalId: 0192f4a0-1b2c-7d00-8e11-2a3b4c5d6e7f
                module: governance
                entityType: StaffUser
                entityId: 0192f49f-5c3d-7a10-b2c4-9d8e7f6a5b4c
                action: ASSIGN_ROLES
                makerId: 0192f001-0000-7000-8000-000000000001
                status: CANCELLED
                level: 1
                requiredLevels: 1
                checkerRoles:
                - ADMIN
                amountPoisha: null
                summary: Assign OPS_CHECKER to tanvir.h
                payload:
                  add:
                  - OPS_CHECKER
                  remove: []
                decidedBy: []
                createdAt: '2026-10-09T04:00:00.000Z'
                decidedAt: '2026-10-09T05:10:11.000Z'
                expiresAt: '2026-10-12T04:00:00.000Z'
                decisionComment: raised by mistake
        '400':
          $ref: '#/components/responses/BadRequest'
        '403':
          $ref: '#/components/responses/Forbidden'
        '404':
          $ref: '#/components/responses/NotFound'
        '409':
          $ref: '#/components/responses/Conflict'
      x-problem-reasons:
        STATE_CONFLICT:
        - NOT_PENDING
        ACTOR_NOT_ALLOWED:
        - NOT_MAKER
  /v1/staff/users:
