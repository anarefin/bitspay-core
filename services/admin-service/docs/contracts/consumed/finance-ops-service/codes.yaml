# finance-ops-service — owned code lists (CONTRACT-MODEL §4). contractVersion 1.0.0, kernel 1.0.
codeSets:
  reconRunType:
    description: recon.events RECON_RUN_COMPLETED.type and GET /v1/recon/runs type
    values:
    - code: LEDGER_TXN
      description: daily ledger ↔ business matching summary (completed at EOD)
    - code: EOD
      description: EOD close cycle (written last of the four EOD runs)
    - code: TRIAL_BALANCE
      description: trial-balance checks TB-1..TB-6
    - code: EMONEY
      description: e-money reconciliation (EOD or LIVE)
    - code: FILE
      description: counterparty statement matching run
    - code: PROJECTION_VERIFY
      description: projection vs ledger verification
    - code: GL_TIEOUT
      description: tie-out of the general ledger's control totals with reconciliation's own counters
  reconRunCompletedStatus:
    description: RECON_RUN_COMPLETED.status
    values:
    - code: COMPLETED
    - code: COMPLETED_WITH_EXCEPTIONS
    - code: FAILED
    - code: RESTATED
  reconRunStatus:
    description: GET /v1/recon/runs/{runId} status
    values:
    - code: SCHEDULED
    - code: WAITING_FOR_DATA
    - code: RUNNING
    - code: COMPLETED
    - code: COMPLETED_WITH_EXCEPTIONS
    - code: FAILED
    - code: RESTATED
  eodStatus:
    description: EOD day status
    values:
    - code: OPEN
    - code: AWAITING_WATERMARK
    - code: CLOSING
    - code: CLOSED
    - code: CLOSED_WITH_BREAKS
    - code: RESTATING
    - code: FAILED
  emoneyStatus:
    description: e-money reconciliation status
    values:
    - code: MATCHED
    - code: VARIANCE
    - code: INCOMPLETE
  trialBalanceResult:
    description: summary.trialBalance
    values:
    - code: OK
    - code: BREAK
  glTieOutResult:
    description: summary.glTieOut
    values:
    - code: MATCHED
    - code: BREAK
  reconExceptionCategory:
    description: closed enum; GL_UNMAPPED reserved (never emitted)
    values:
    - code: MISSING_IN_LEDGER
    - code: MISSING_IN_TXN
    - code: MISSING_IN_SOURCE
    - code: MISSING_AT_COUNTERPARTY
    - code: AMOUNT_MISMATCH
    - code: ACCOUNT_MISMATCH
    - code: STATUS_MISMATCH
    - code: DUPLICATE
    - code: NEGATIVE_BALANCE
    - code: TRIAL_BALANCE_BREAK
    - code: EMONEY_VARIANCE
    - code: PROJECTION_DRIFT
    - code: LATE_LEDGER_EVENT
    - code: STATEMENT_BALANCE_BREAK
    - code: GL_UNMAPPED
    - code: GL_TIEOUT_BREAK
  reconExceptionSource:
    description: RECON_EXCEPTION_RAISED.source
    values:
    - code: LEDGER_TXN
    - code: FILE
    - code: EMONEY
    - code: EOD
    - code: PROJECTION
    - code: GL
  reconExceptionPublishedSeverity:
    description: only severity ≥ HIGH is published
    values:
    - code: CRITICAL
    - code: HIGH
  reconExceptionStatus:
    description: staff API only
    values:
    - code: OPEN
    - code: ASSIGNED
    - code: INVESTIGATING
    - code: ADJUSTMENT_PROPOSED
    - code: ADJUSTMENT_PENDING_APPROVAL
    - code: ADJUSTMENT_POSTED
    - code: RESOLVED
    - code: AUTO_RESOLVED
    - code: CLOSED
    - code: REOPENED
  adjustmentReasonCode:
    description: producer-local reasonCode sent on ledger post-adjustment (not governance REASON_CODE)
    values:
    - code: RECON_BANK_CHARGE
    - code: RECON_BANK_INTEREST
    - code: RECON_MISSING_CREDIT
    - code: RECON_CORRECTION
    - code: RECON_SUSPENSE_CLEARING
  exceptionResolutionCode:
    description: internal resolution codes
    values:
    - code: TIMING_DIFFERENCE
    - code: COUNTERPARTY_ERROR_REPORTED
    - code: DUPLICATE_CONFIRMED_NO_IMPACT
    - code: OTHER
    - code: LATE_ARRIVAL
    - code: CONFIRMATION_ARRIVED
  statementSource:
    description: StatementLine.source / HistoryItem.source
    values:
    - code: TRANSACTION
    - code: DISBURSEMENT
    - code: CAMPAIGN
    - code: COMMISSION
    - code: TREASURY
    - code: RECON
      description: reconciliation adjustments (RCA- references)
    - code: LEDGER
      description: other ledger commands (holds; closure payout until OPEN D-51)
  historyStatus:
    description: HistoryItem.status
    values:
    - code: COMPLETED
    - code: FAILED
    - code: REVERSED
    - code: PARTIALLY_REFUNDED
    - code: REFUNDED
  statementExportStatus:
    description: statement export lifecycle
    values:
    - code: QUEUED
    - code: RUNNING
    - code: SUCCEEDED
    - code: FAILED
    - code: EXPIRED
  reportRunStatus:
    description: report run lifecycle
    values:
    - code: QUEUED
    - code: RUNNING
    - code: SUCCEEDED
    - code: FAILED
    - code: EXPIRED
    - code: CANCELLED
  regulatoryRunStatus:
    description: regulatory run lifecycle
    values:
    - code: GENERATING
    - code: GENERATED
    - code: PENDING_REVIEW
    - code: READY_FOR_SUBMISSION
    - code: REJECTED
    - code: SUBMITTED
    - code: FAILED
    - code: SUPERSEDED
problemReasons:
- code: VALIDATION_FAILED
  reason: INVALID_CURSOR
  operations:
  - '*'
  note: kernel-reserved (K3.6); used by every paged list
- code: STATE_CONFLICT
