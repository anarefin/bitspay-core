problemExtensions:
- name: existingFileId
  type: uuid
  when: reason = DUPLICATE_STATEMENT_FILE (POST /v1/recon/statements)
entityTypes:
- module: reconciliation
  values:
  - ReconAdjustment
  - EodForceClose
  - EodRestatement
  - ReconCounterparty
  - ReconFileProfile
  - ReconMatchRule
  - ReconManualMatch
  - ReconUnmatch
  - StatementLineIgnore
  - AutoResolutionRule
  - ReconSourceRule
  - ReconSourceMapping
  checkerRoles:
    ReconAdjustment: L1 FIN_CHECKER; amount ≥ 10,000,000 poisha or a wallet side → L2 CAMLCO | FIN_CHECKER (distinct users)
    ReconSourceRule: FIN_CHECKER | ADMIN
    ReconSourceMapping: FIN_CHECKER | ADMIN
    '*': FIN_CHECKER
- module: reporting
  values:
  - ReportDefinition
  - ReportSchedule
  - MaskingRule
  - RegulatoryRun
  - IngestionReplay
  checkerRoles:
    ReportDefinition: ADMIN
    ReportSchedule: OPS_CHECKER | FIN_CHECKER
    MaskingRule: ADMIN
    RegulatoryRun: dataset checker roles
    IngestionReplay: ADMIN
notificationTemplates:
- code: EMONEY_VARIANCE
  module: reconciliation
  category: INTERNAL
  trigger: daily e-money reconciliation VARIANCE / INCOMPLETE
  recipient: 'Finance + Compliance: configured staffUserIds, else recipient.role FIN_CHECKER and COMPLIANCE_OFFICER (one request per role)'
  variables:
  - name: businessDate
    type: DATE
    req: true
    notes: ''
  - name: status
    type: TEXT
    req: true
    notes: enum{VARIANCE,INCOMPLETE}
  - name: variancePoisha
    type: MONEY
    req: false
    notes: ''
  - name: walletsTotalPoisha
    type: MONEY
    req: true
    notes: ''
  - name: trustMirrorPoisha
    type: MONEY
    req: true
    notes: ''
  - name: confirmedTrustPoisha
    type: MONEY
    req: false
    notes: ''
  - name: runId
    type: TEXT
    req: true
    notes: ''
- code: TRIAL_BALANCE_BREAK
  module: reconciliation
  category: INTERNAL
  trigger: trial-balance check failed
  recipient: 'Finance: configured staffUserIds (bitspay.recon.notify.finance), else recipient.role FIN_CHECKER'
  variables:
  - name: businessDate
    type: DATE
    req: true
    notes: ''
  - name: revision
    type: INT
    req: true
    notes: ''
  - name: failedChecks
    type: TEXT
    req: true
    notes: comma list, e.g. TB-1,TB-3
  - name: netCreditTotalPoisha
    type: MONEY
    req: true
    notes: ''
  - name: runId
    type: TEXT
    req: true
    notes: ''
- code: EOD_FAILED
  module: reconciliation
  category: INTERNAL
  trigger: EOD failed / waiting for watermark
  recipient: 'Finance: configured staffUserIds (bitspay.recon.notify.finance), else recipient.role FIN_CHECKER'
  variables:
  - name: businessDate
    type: DATE
    req: true
    notes: ''
  - name: status
    type: TEXT
    req: true
    notes: enum{FAILED,AWAITING_WATERMARK}
  - name: errorCode
    type: TEXT
    req: true
    notes: ''
  - name: blockedMinutes
    type: INT
    req: true
    notes: ''
- code: RECON_CRITICAL_EXCEPTION
  module: reconciliation
  category: INTERNAL
  trigger: CRITICAL exception opened
  recipient: 'Finance: configured staffUserIds (bitspay.recon.notify.finance), else recipient.role FIN_CHECKER'
  variables:
  - name: exceptionId
    type: TEXT
    req: true
    notes: ''
  - name: category
    type: TEXT
    req: true
    notes: ''
  - name: businessDate
    type: DATE
    req: true
    notes: ''
  - name: amountPoisha
    type: MONEY
    req: false
    notes: signed
  - name: txnRef
    type: TEXT
    req: false
    notes: ''
  - name: dueAt
    type: DATETIME
    req: true
    notes: ''
- code: REPORT_READY
  module: reporting
  category: INTERNAL
  trigger: report run completed (async or scheduled)
  recipient: 'requesting staffUserId (schedules: notify_staff_ids)'
  variables:
  - name: code
    type: TEXT
    req: true
    notes: report code
  - name: runId
    type: TEXT
    req: true
    notes: ''
  - name: format
    type: TEXT
    req: true
    notes: ''
  - name: businessDate
    type: DATE
    req: false
    notes: ''
- code: STATEMENT_READY
  module: reporting
  category: SERVICE
  trigger: statement export ready
  recipient: walletId (holder) or staffUserId (staff requester)
  variables:
  - name: exportId
    type: TEXT
    req: true
    notes: ''
  - name: walletId
    type: TEXT
    req: true
    notes: uuid text
  - name: from
    type: DATE
    req: true
    notes: ''
  - name: to
    type: DATE
    req: true
    notes: ''
  - name: format
    type: TEXT
    req: true
    notes: ''
- code: REGULATORY_REVIEW_PENDING
  module: reporting
  category: INTERNAL
  trigger: regulatory run awaiting review
  recipient: recipient.role = dataset checker role (one request per role)
  variables:
  - name: rrCode
    type: TEXT
    req: true
    notes: ''
  - name: regulatoryRunId
    type: TEXT
    req: true
    notes: ''
  - name: periodStart
    type: DATE
    req: true
    notes: ''
  - name: periodEnd
    type: DATE
    req: true
    notes: ''
