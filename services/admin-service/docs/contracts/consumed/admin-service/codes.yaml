    (entityType ApprovalRoute); a new producer entityType needs no change here.'
  rows:
  - service: wallet-service
    module: wallet
    entityType: '*'
    checkerRoles:
    - OPS_CHECKER
    - SUP_CHECKER
  - service: wallet-service
    module: partner
    entityType: '*'
    checkerRoles:
    - PARTNER_OPS_CHECKER
  - service: limits-risk-service
    module: '*'
    entityType: '*'
    checkerRoles:
    - RISK_CHECKER
  - service: pricing-service
    module: pricing
    entityType: '*'
    checkerRoles:
    - PRICING_CHECKER
  - service: pricing-service
    module: campaign
    entityType: '*'
    checkerRoles:
    - OPS_CHECKER
  - service: treasury-service
    module: '*'
    entityType: '*'
    checkerRoles:
    - FIN_CHECKER
  - service: transaction-service
    module: '*'
    entityType: '*'
    checkerRoles:
    - OPS_CHECKER
  - service: disbursement-service
    module: '*'
    entityType: '*'
    checkerRoles:
    - OPS_CHECKER
  - service: support-service
    module: '*'
    entityType: '*'
    checkerRoles:
    - SUP_CHECKER
  - service: compliance-service
    module: '*'
    entityType: '*'
    checkerRoles:
    - CAMLCO
  - service: finance-ops-service
    module: reconciliation
    entityType: '*'
    checkerRoles:
    - FIN_CHECKER
  - service: finance-ops-service
    module: reporting
    entityType: '*'
    checkerRoles:
    - FIN_CHECKER
    - CAMLCO
  - service: general-ledger-service
    module: '*'
    entityType: '*'
    checkerRoles:
    - FIN_CHECKER
  - service: admin-service
    module: notification
    entityType: '*'
    checkerRoles:
    - OPS_CHECKER
  - service: admin-service
    module: governance
    entityType: '*'
    checkerRoles:
    - ADMIN
  - service: admin-service
    module: governance
    entityType: RefDataItem
    checkerRoles:
    - OPS_CHECKER
