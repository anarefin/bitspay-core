# admin-service owned codes (CONTRACT-MODEL §4). contractVersion 1.1.0 (CR-ADMIN-1: + BILL_PAYMENT_*/RECHARGE_* templates). Producer-declared templates, reason codes and product codes of other services
# are NOT listed here: admin-service seeds them from ../../00-global/generated/*.json (seed import, SPEC §7.9).
codeSets:
  refdataType:
    description: REFDATA_UPSERTED.type and GET /v1/refdata/{type} path values (closed for this major)
    values:
    - code: GEO
      description: 'BBS geocode: division 2, district 4, upazila 6, union 8 digits'
    - code: MCC
      description: merchant category code
    - code: PURPOSE_CODE
      description: P2P purpose
    - code: REASON_CODE
      description: status / reversal / hold / refund / KYC / partner reasons
    - code: BANK
      description: banks
    - code: HOLIDAY
      description: public / bank holidays
    - code: SYSTEM_PARAM
      description: namespaced system parameters
  systemParamValueType:
    description: attributes.valueType of SYSTEM_PARAM items
    values:
    - code: STRING
    - code: INT
    - code: BOOL
    - code: TIME
    - code: DURATION
    - code: CRON
    - code: JSON
    - code: FEATURE
    - code: RETENTION
  systemParamNamespace:
    description: Reserved SYSTEM_PARAM namespaces (code prefix before the first dot). Consumers must not invent codes inside them.
    values:
    - code: FEATURE
      description: product enable switches FEATURE.<PRODUCT> (kernel K3.7)
    - code: CUTOFF
      description: cut-off times (CUTOFF.EOD, CUTOFF.EOD_GRACE_MINUTES, CUTOFF.SETTLEMENT_BANK)
    - code: EOD
      description: EOD schedule
    - code: CALENDAR
      description: weekend days, time zone
    - code: RETENTION
      description: retention policy per category incl. legalHold
    - code: WALLET
      description: wallet behaviour switches
    - code: SUPPORT
      description: support contact data
    - code: GL
      description: general-ledger parameters (GL.FISCAL_YEAR_START_MONTH)
  retentionCategory:
    description: RETENTION.<CATEGORY> and legal-hold categories
    values:
    - code: FINANCIAL_TXN
    - code: CUSTOMER_KYC
    - code: PARTNER
    - code: AML_CASE
    - code: AUDIT
    - code: NOTIFICATION_LOG
    - code: API_LOG
    - code: RECON
    - code: COMPLAINT
  legalHoldSubjectType:
    description: GET /v1/retention/legal-holds subjectType
    values:
    - code: CATEGORY
    - code: CUSTOMER
    - code: WALLET
    - code: PARTNER
    - code: CASE
    - code: TXN
  templateCategory:
    description: Notification template categories; the template category is authoritative (producers send priority null unless SECURITY)
    values:
    - code: SECURITY
      mandatory: true
      ttl: PT15M
    - code: TRANSACTIONAL
      mandatory: true
      ttl: PT24H
    - code: SERVICE
      mandatory: true
      ttl: PT24H
    - code: INTERNAL
      mandatory: true
      ttl: PT24H
    - code: REMINDER
      mandatory: false
      ttl: PT12H
    - code: MARKETING
      mandatory: false
      ttl: PT48H
  templateVariableType:
    description: Template variable types and their JSON value on notification.requests.variables
    values:
    - code: MONEY
      json: int64 poisha; name ends in Poisha; never pre-formatted
      formatter: money
    - code: DATETIME
      json: timestamp ISO-8601 UTC ms Z; never local time
      formatter: datetime
    - code: DATE
      json: date YYYY-MM-DD (Asia/Dhaka)
      formatter: date
    - code: MSISDN
      json: full 13-digit 8801…; never pre-masked
      formatter: msisdnMask
    - code: INT
      json: int64
      formatter: int / digits
    - code: TEXT
      json: string ≤ 500
      formatter: none / upper
  notificationChannel:
    values:
    - code: IN_APP
    - code: SMS
    - code: PUSH
    - code: EMAIL
    - code: IVR
  notificationPriority:
    values:
    - code: SECURITY
    - code: TRANSACTIONAL
    - code: SERVICE
    - code: REMINDER
    - code: MARKETING
  reminderPolicyCode:
    values:
    - code: PAYMENT_REQUEST_DUE
      enabled: true
    - code: SCHEDULED_TRANSFER_PRE
      enabled: true
    - code: KYC_EXPIRY
      enabled: false
    - code: BILL_DUE
      enabled: false
  reminderSubjectType:
    values:
    - code: PAYMENT_REQUEST
      policy: PAYMENT_REQUEST_DUE
      subjectRef: '{requestId} (uuid)'
    - code: SCHEDULED_TRANSFER
      policy: SCHEDULED_TRANSFER_PRE
      subjectRef: '{scheduleId}:{yyyy-MM-dd} (occurrence date Asia/Dhaka)'
    - code: KYC_EXPIRY
      policy: KYC_EXPIRY
      subjectRef: '{customerId} (reserved)'
    - code: BILL_DUE
      policy: BILL_DUE
      subjectRef: reserved
    - code: SERVICE_EXPIRY
      policy: null
      subjectRef: reserved
    - code: AGREEMENT_EXPIRY
      policy: null
      subjectRef: reserved
  deliveryStatus:
    description: GET /v1/notifications/logs deliveries[].status
    values:
    - code: UNREAD
    - code: READ
    - code: ARCHIVED
    - code: PENDING
    - code: WAITING_CONTACT
    - code: DEFERRED
    - code: SENDING
    - code: RETRY_WAIT
    - code: SENT
    - code: DELIVERED
    - code: UNDELIVERED
    - code: SENT_NO_DLR
    - code: FAILED
    - code: SUPPRESSED
    - code: EXPIRED
  deliveryStatusReason:
    values:
    - code: OPTED_OUT
    - code: NO_ADDRESS
    - code: NO_CONTACT
    - code: QUIET_HOURS
    - code: FREQ_CAP
    - code: STALE_EVENT
    - code: PERMANENT_ERROR
    - code: MAX_ATTEMPTS
    - code: TTL
    - code: PROVIDER_DLR_*
  approvalStatus:
    description: approval.events status (closed)
    values:
    - code: PENDING
    - code: APPROVED
    - code: REJECTED
    - code: EXPIRED
    - code: CANCELLED
  approvalModule:
    description: approval.events / audit.events module (required for merged services)
    values:
    - code: wallet
    - code: partner
    - code: pricing
    - code: campaign
    - code: reconciliation
    - code: reporting
    - code: governance
    - code: notification
  auditOutcome:
    values:
    - code: SUCCESS
    - code: FAILURE
    - code: DENIED
      description: refused for authorisation / role / SoD / maker-checker reasons
  verificationFindingReason:
    values:
    - code: HASH_MISMATCH
    - code: PREV_LINK_MISMATCH
    - code: SEQ_GAP
    - code: SEQ_DUPLICATE
    - code: HEAD_MISMATCH
    - code: SEAL_MISMATCH
    - code: ANCHOR_MISMATCH
    - code: MISSING_SEAL
    - code: C14N_INVALID
    - code: COLUMN_MISMATCH
    - code: GENESIS_MISMATCH
  ageingBucket:
    values:
    - code: LT_4H
    - code: H4_24
    - code: D1_3
    - code: GT_3D
