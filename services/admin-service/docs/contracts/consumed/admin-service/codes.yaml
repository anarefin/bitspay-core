    module: '*'
    entityType: '*'
    checkerRoles:
    - ADMIN
notificationTemplates:
- code: P2P_SENT
  category: TRANSACTIONAL
  trigger: R-P2P-SENT · txn.events TRANSACTION_COMPLETED, txnType = P2P
  recipient: FROM_WALLET
  channels:
  - IN_APP
  - SMS
  variables:
  - name: amountPoisha
    type: MONEY
    req: true
    notes: ← amountPoisha
  - name: feePoisha
    type: MONEY
    req: false
    notes: ← sum(feePoisha, vatPoisha) only when feeBearer = PAYER; section hidden when 0
  - name: counterpartyMsisdn
    type: MSISDN
    req: true
    notes: ← contact(toWalletId).msisdn
  - name: counterpartyName
    type: TEXT
    req: false
    notes: ← contact(toWalletId).name
  - name: txnRef
    type: TEXT
    req: true
    notes: ← txnRef
  - name: time
    type: DATETIME
    req: true
    notes: ← completedAt
  group: A
  sentVia: event rule (never on notification.requests)
- code: P2P_RECEIVED
  category: TRANSACTIONAL
  trigger: R-P2P-RECEIVED · same event
  recipient: TO_WALLET
  channels:
  - IN_APP
  - SMS
  variables:
  - name: amountPoisha
    type: MONEY
    req: true
    notes: ← amountPoisha
  - name: counterpartyMsisdn
    type: MSISDN
    req: true
    notes: ← contact(fromWalletId).msisdn
  - name: counterpartyName
    type: TEXT
    req: false
    notes: ← contact(fromWalletId).name
  - name: txnRef
    type: TEXT
    req: true
    notes: ← txnRef
  - name: time
    type: DATETIME
    req: true
    notes: ← completedAt
  group: A
  sentVia: event rule (never on notification.requests)
- code: CASH_IN_RECEIVED
  category: TRANSACTIONAL
  trigger: R-CASHIN-CUST · COMPLETED CASH_IN
  recipient: TO_WALLET
  channels:
  - IN_APP
  - SMS
  variables:
  - name: amountPoisha
    type: MONEY
