notificationTemplatesSeededFromIndex:
  source: ../../00-global/generated/notification-templates.json (written by contracts.py index from every sender's codes.yaml → notificationTemplates)
  rule: admin-service seeds code, category, variables and allowed channels of every indexed template; BN/EN text lives in admin-service seed files. Groups A, B and C9 above are the templates admin-service
    itself sends.
refdataTypes:
  attributesSchema: provided/data/refdata-attributes.v1.schema.json
  systemParams: provided/data/refdata-system-params.v1.md
  types:
  - type: GEO
    codeRegex: ^[0-9]{2}([0-9]{2}([0-9]{2}([0-9]{2})?)?)?$
    parentCode: parent GEO code (null for divisions)
    attributes: level enum{DIVISION,DISTRICT,UPAZILA,UNION} (req, must match code length); bbsCode (req); cityCorporation bool (opt); riskFlag bool (opt, default false); qrCity ≤ 15 ^[A-Z ]+$ (opt; fallback
      upper-cased nameEn)
  - type: MCC
    codeRegex: ^[0-9]{4}$
    parentCode: null
    attributes: group string ^[0-9]{2}$ ∈ {01..07, 99}; riskLevel enum{LOW,MEDIUM,HIGH}
  - type: PURPOSE_CODE
    codeRegex: ^[A-Z_]{3,32}$
    parentCode: null
    attributes: appliesTo array<txnType>; requiresNote bool
  - type: REASON_CODE
    codeRegex: ^[A-Z_]{3,40}$
    parentCode: null
    attributes: domain enum{WALLET,REVERSAL,HOLD,REFUND,KYC,PARTNER,APPROVAL,OTHER} (informational, first group); customerVisible bool
  - type: BANK
    codeRegex: ^[A-Z0-9-]{3,12}$
    parentCode: null
    attributes: routingPrefix (opt); swift (opt); trustEligible bool
  - type: HOLIDAY
    codeRegex: ^\d{4}-\d{2}-\d{2}$
    parentCode: null
    attributes: date; kind enum{PUBLIC,BANK,OPTIONAL}; bankHoliday bool; provisional bool
  - type: SYSTEM_PARAM
    codeRegex: ^[A-Z][A-Z0-9_]*(\.[A-Z0-9_]+)+$
    parentCode: null
    attributes: valueType (always) + value, or the FEATURE / RETENTION fields
  businessDayRule: a date is a non-business day ⇔ its weekday ∈ CALENDAR.WEEKEND_DAYS or an ACTIVE HOLIDAY with bankHoliday = true exists for it
