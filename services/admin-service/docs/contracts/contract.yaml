# admin-service (SVC-15) contract manifest — CONTRACT-MODEL §3. Modules: governance (lead) and notification.
service: admin-service
number: '15'
modules:
- governance
- notification
contractVersion: 1.1.0
kernel: '1.0'
owner: Dev-8
provides:
  apis:
  - openapi: provided/openapi.yaml
    major: 1
  events:
  - topic: refdata.events
    key: '{type}:{code}'
    compacted: true
    tombstones: false
    partitions:
      dev: 1
      prod: 3
    retention: compacted (no time retention)
    transport: outbox
    module: governance
    eventTypes:
    - type: REFDATA_UPSERTED
      version: 1
      aggregateType: RefData
      schema: provided/events/refdata.events/REFDATA_UPSERTED.v1.schema.json
      example: provided/events/refdata.events/REFDATA_UPSERTED.v1.example.json
  inboundTopics:
  - topic: notification.requests
    module: notification
    key: 'first non-null of recipient.walletId → recipient.staffUserId → recipient.msisdn → recipient.role (never a partnerId); NOTIFICATION_REMINDER_CANCELLED: the key of the registering request'
    compacted: false
    tombstones: false
    partitions:
      dev: 3
      prod: 24
    retention: 7d
    transport: outbox (each writer's own)
    eventTypes:
    - type: NOTIFICATION_REQUESTED
      version: 1
      aggregateType: Notification
      schema: provided/events/notification.requests/NOTIFICATION_REQUESTED.v1.schema.json
      example: provided/events/notification.requests/NOTIFICATION_REQUESTED.v1.example.json
    - type: NOTIFICATION_REMINDER_CANCELLED
      version: 1
      aggregateType: Notification
      schema: provided/events/notification.requests/NOTIFICATION_REMINDER_CANCELLED.v1.schema.json
      example: provided/events/notification.requests/NOTIFICATION_REMINDER_CANCELLED.v1.example.json
    writerObligations: templateCode and variables exactly as declared in the writer's own codes.yaml → notificationTemplates; variables is generic object<string, string|int64>
  - topic: approval.events
    module: governance
    key: approvalId
    compacted: false
    tombstones: false
    partitions:
      dev: 3
      prod: 6
    retention: 7d
    transport: outbox (each writer's own)
    eventTypes:
    - type: APPROVAL_REQUESTED
      version: 1
      aggregateType: Approval
      schema: provided/events/approval.events/APPROVAL_REQUESTED.v1.schema.json
      example: provided/events/approval.events/APPROVAL_REQUESTED.v1.example.json
    - type: APPROVAL_DECIDED
      version: 1
      aggregateType: Approval
      schema: provided/events/approval.events/APPROVAL_DECIDED.v1.schema.json
      example: provided/events/approval.events/APPROVAL_DECIDED.v1.example.json
    - type: APPROVAL_EXPIRED
      version: 1
      aggregateType: Approval
      schema: provided/events/approval.events/APPROVAL_EXPIRED.v1.schema.json
      example: provided/events/approval.events/APPROVAL_EXPIRED.v1.example.json
    writerObligations: entityType from the writer's own codes.yaml → entityTypes; checkerRoles mandatory (kernel K7 roles); service = bare name + module for merged services
  - topic: audit.events
    module: governance
    key: entityId
    compacted: false
    tombstones: false
    partitions:
      dev: 6
      prod: 48
    retention: 14d
    transport: outbox (each writer's own)
    eventTypes:
    - type: AUDIT_RECORDED
      version: 1
      aggregateType: Audit
      schema: provided/events/audit.events/AUDIT_RECORDED.v1.schema.json
      example: provided/events/audit.events/AUDIT_RECORDED.v1.example.json
    writerObligations: kernel K6 PII rules for before/after; actorRoles kernel K7 codes
  data:
  - id: refdata-attributes
    version: 1
    file: provided/data/refdata-attributes.v1.schema.json
    kind: json-schema
    description: per-type attribute schemas of refdata items (code set / data contract)
  - id: refdata-system-params
    version: 1
    file: provided/data/refdata-system-params.v1.md
    kind: code-set
    description: reserved SYSTEM_PARAM namespaces, attribute shapes and seed values
  codes: provided/codes.yaml
consumes:
  apis:
  - producer: wallet-service
    operation: GET /v1/wallets/{walletId}
    major: 1
    pinnedContractVersion: 1.1.0
    module: notification
    purpose: contact fallback when an SMS delivery waits ≥ 60 s for a wallet not yet seen on wallet.events; the copy is overwritten only when version is newer
    fieldsUsed:
    - path.walletId
    - res.msisdn
    - res.displayName
    - res.language
    - res.status
    - res.walletType
    - res.version
    codesUsed:
    - set: walletStatus
      values:
      - A
      - D
      - F
      - X
      - C
      - Z
    resilience:
      timeoutMs: 1000
      connectTimeoutMs: 300
      circuitBreaker: true
      rateLimitPerPod: 200
      onFailure: delivery stays WAITING_CONTACT, retried each minute up to contact.wait-max (10 min), then FAILED(NO_CONTACT); IN_APP never blocked
