              example: {type: 'about:blank', title: same SHA-256 already uploaded for this list, status: 409, code: STATE_CONFLICT, detail: null, instance: '/v1/screening/lists/{listCode}/versions',
                correlationId: c-77aa, reason: DUPLICATE_LIST_FILE, existingVersionId: 0193a1c1-0000-7000-8000-000000000302}
