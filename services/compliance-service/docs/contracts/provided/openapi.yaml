        '403':
          description: 'ACTOR_NOT_ALLOWED: actor type or role not permitted'
          content:
            application/problem+json:
              schema:
                allOf:
                - {$ref: '#/components/schemas/Problem'}
                - type: object
                  properties:
                    code:
                      enum: [ACTOR_NOT_ALLOWED]
              example: {type: 'about:blank', title: actor type or role not permitted, status: 403, code: ACTOR_NOT_ALLOWED, detail: null, instance: '/v1/approvals/{id}:reject',
                correlationId: c-77aa, reason: null}
        '404':
          description: 'NOT_FOUND: entity missing'
          content:
            application/problem+json:
              schema:
                allOf:
                - {$ref: '#/components/schemas/Problem'}
                - type: object
                  properties:
