        dob:
          type: [string, 'null']
          format: date
        dobYear:
          type: [integer, 'null']
          format: int32
          description: used when dob is unknown
        entityKind:
          type: string
          enum: [INDIVIDUAL, ORGANISATION]
          description: default INDIVIDUAL
      required: [name]
      additionalProperties: true
    TestMatchRequest:
      type: object
      properties:
        a: {$ref: '#/components/schemas/NameSample'}
        b: {$ref: '#/components/schemas/NameSample'}
      required: [a, b]
      additionalProperties: true
    TestMatchResult:
      type: object
      properties:
        score: {type: number, description: 0..1}
        breakdown: {$ref: '#/components/schemas/ScoreBreakdown'}
        threshold: {type: number, description: review threshold of the active settings}
        classification:
          type: string
          enum: [CLEAR, POTENTIAL_MATCH]
        normalizedA:
          type: array
          items: {type: string}
          description: name variants after normalisation
        normalizedB:
          type: array
          items: {type: string}
      required: [score, breakdown, threshold, classification, normalizedA, normalizedB]
      additionalProperties: true
    ScreeningSettings:
      type: object
      properties:
        settingsVersion: {type: integer, format: int32}
        thresholdReview: {type: number, description: 0.5..1 seed 0.85}
        listThresholds:
          type: object
          additionalProperties: {type: number}
          description: 'listCode -> threshold seed {PEP: 0.88}'
        candidateCap: {type: integer, format: int32, description: 50..5000 seed 500}
        singleTokenMinScore: {type: number, description: seed 0.95}
        partnerScreenStatuses:
          type: array
          items: {type: string}
          description: seed [PENDING_SCREENING]
        eddHoldViaScreening: {type: boolean, description: seed true}
        status:
          type: string
          enum: [ACTIVE]
        pendingApprovalId:
          type: [string, 'null']
          format: uuid
          description: a pending change, if any
        createdBy: {type: string, format: uuid}
        approvedBy:
          type: [string, 'null']
          format: uuid
          description: null for the seed
        createdAt: {type: string, format: date-time}
      required: [settingsVersion, thresholdReview, listThresholds, candidateCap, singleTokenMinScore, partnerScreenStatuses, eddHoldViaScreening, status, pendingApprovalId,
        createdBy, approvedBy, createdAt]
      additionalProperties: true
    ScreeningSettingsChange:
      type: object
      properties:
        thresholdReview: {type: number, description: 0.5..1 seed 0.85}
        listThresholds:
          type: object
          additionalProperties: {type: number}
          description: 'listCode -> threshold seed {PEP: 0.88}'
        candidateCap: {type: integer, format: int32, description: 50..5000 seed 500}
        singleTokenMinScore: {type: number, description: seed 0.95}
        partnerScreenStatuses:
          type: array
          items: {type: string}
          description: seed [PENDING_SCREENING]
        eddHoldViaScreening: {type: boolean, description: seed true}
        comment: {type: string, minLength: 1, maxLength: 500, description: 1..500}
      required: [thresholdReview, listThresholds, candidateCap, singleTokenMinScore, partnerScreenStatuses, eddHoldViaScreening, comment]
      additionalProperties: true
    TranslitRule:
      type: object
      properties:
        bnSeq: {type: string, description: Bengali sequence}
        latin: {type: string, description: empty string = drop}
        priority: {type: integer, format: int32, description: 'longest match first, then priority'}
      required: [bnSeq, latin, priority]
      additionalProperties: true
    DictionaryEntry:
      type: object
      properties:
        variant: {type: string}
        canonical: {type: string}
        kind:
          type: string
          enum: [HONORIFIC, NAME, COMMON_TOKEN]
      required: [variant, canonical, kind]
      additionalProperties: true
    Transliteration:
      type: object
      properties:
        rulesVersion: {type: integer, format: int64, description: bumps on every activated change set}
        rules:
          type: array
          items: {$ref: '#/components/schemas/TranslitRule'}
          description: not paged (<= 2000)
        dictionary:
          type: array
          items: {$ref: '#/components/schemas/DictionaryEntry'}
          description: not paged (<= 20000)
        pendingApprovalId:
          type: [string, 'null']
          format: uuid
      required: [rulesVersion, rules, dictionary, pendingApprovalId]
      additionalProperties: true
    TransliterationChangeSet:
      type: object
      properties:
        upsertRules:
          type: array
          items: {$ref: '#/components/schemas/TranslitRule'}
          description: may be []
        deleteRules:
          type: array
          items: {type: string}
          description: bnSeq values; may be []
        upsertDictionary:
          type: array
          items: {$ref: '#/components/schemas/DictionaryEntry'}
          description: may be []
        deleteDictionary:
          type: array
          items: {type: string}
          description: variant values; may be []
        comment: {type: string, minLength: 1, maxLength: 500, description: 1..500}
      required: [upsertRules, deleteRules, upsertDictionary, deleteDictionary, comment]
      additionalProperties: true
    AmlScenario:
      type: object
      properties:
        code: {type: string, pattern: '^AML-SC-[0-9]{2}$', description: '`AML-SC-nn`'}
        name: {type: string}
        scenarioType:
          type: string
          enum: [STRUCTURING_CASH, HIGH_CASH_ACTIVITY, RAPID_MOVEMENT, UNUSUAL_VS_PROFILE, MANY_TO_ONE, ONE_TO_MANY, DORMANT_REACTIVATION, AGENT_ANOMALY, MERCHANT_ANOMALY,
            HIGH_RISK_GEOGRAPHY, FRAUD_ALERT_ESCALATION]
        enabled: {type: boolean}
        params: {type: object, additionalProperties: true, description: validated against the scenario type money parameters end in `Poisha`}
        schedule:
          type: string
          enum: [HOURLY, DAILY]
        severity:
          type: string
          enum: [LOW, MEDIUM, HIGH, CRITICAL]
        paramsVersion: {type: integer, format: int32, description: '>= 1'}
        provisional: {type: boolean, description: seed not yet confirmed by CAMLCO}
        lastRunAt:
          type: [string, 'null']
          format: date-time
        lastRunWindowEnd:
          type: [string, 'null']
          format: date-time
        pendingApprovalId:
          type: [string, 'null']
          format: uuid
      required: [code, name, scenarioType, enabled, params, schedule, severity, paramsVersion, provisional, lastRunAt, lastRunWindowEnd, pendingApprovalId]
      additionalProperties: true
    AmlScenarioCollection:
      type: object
      properties:
        items:
          type: array
          items: {$ref: '#/components/schemas/AmlScenario'}
          description: not paged (<= 32)
      required: [items]
      additionalProperties: true
    ScenarioUpdateRequest:
      type: object
      description: At least one of enabled, params, severity, schedule.
      properties:
        enabled: {type: boolean}
        params: {type: object, additionalProperties: true, description: full parameter object}
        severity:
          type: string
          enum: [LOW, MEDIUM, HIGH, CRITICAL]
        schedule:
          type: string
          enum: [HOURLY, DAILY]
        comment: {type: string, minLength: 1, maxLength: 500, description: 1..500}
      required: [comment]
      additionalProperties: true
    ScenarioRunRequest:
      type: object
      properties:
        windowEnd: {type: string, format: date-time, description: 'a full hour (HOURLY) or Asia/Dhaka day boundary (DAILY), not in the future'}
      required: [windowEnd]
      additionalProperties: true
    ScenarioRun:
      type: object
      properties:
        runId: {type: string, format: uuid}
        scenarioCode: {type: string}
        windowStart: {type: string, format: date-time}
        windowEnd: {type: string, format: date-time}
        status:
          type: string
          enum: [RUNNING, COMPLETED, FAILED]
        candidates:
          type: [integer, 'null']
          format: int32
        alerts:
          type: [integer, 'null']
          format: int32
        startedAt: {type: string, format: date-time}
        finishedAt:
          type: [string, 'null']
          format: date-time
        error:
          type: [string, 'null']
          description: <= 500
      required: [runId, scenarioCode, windowStart, windowEnd, status, candidates, alerts, startedAt, finishedAt, error]
      additionalProperties: true
    Alert:
      type: object
      properties:
        alertId: {type: string, format: uuid}
        alertNo: {type: string, description: '`ALT-YYYY-NNNNNNNN`'}
        domain:
          type: string
          enum: [FRAUD, AML]
        source:
          type: string
          enum: [FRAUD_RULE, AML_SCENARIO, SCREENING, CUSTOMER_REPORT, MANUAL, EXTERNAL, REGULATORY]
        sourceRef:
          type: [string, 'null']
          description: risk alertId, scenario runId, screeningId, fraud reportId
        scenarioCode:
          type: [string, 'null']
        ruleIds:
          type: array
          items: {type: string}
          description: fraud rules; [] otherwise
        riskScore:
          type: [integer, 'null']
          format: int32
          description: 0..100
        decision:
          type: [string, 'null']
          description: fraud engine decision
        subjectType:
          type: [string, 'null']
          enum: [CUSTOMER, PARTNER, null]
          description: null when unresolved
        subjectId:
          type: [string, 'null']
          format: uuid
        walletId:
          type: [string, 'null']
          format: uuid
        txnIds:
          type: array
          items: {type: string, format: uuid}
        txnRefs:
          type: array
          items: {type: string}
          description: opaque
        amountPoisha:
          type: [integer, 'null']
          format: int64
        severity:
          type: string
          enum: [LOW, MEDIUM, HIGH, CRITICAL]
        status:
          type: string
          enum: [NEW, LINKED, CLOSED]
        disposition:
          type: [string, 'null']
          enum: [TRUE_POSITIVE, FALSE_POSITIVE, INCONCLUSIVE, null]
        caseId:
          type: [string, 'null']
          format: uuid
        details: {type: object, additionalProperties: true, description: 'source-specific detail (repeats[], scenario figures, rule list)'}
        createdAt: {type: string, format: date-time}
      required: [alertId, alertNo, domain, source, sourceRef, scenarioCode, ruleIds, riskScore, decision, subjectType, subjectId, walletId, txnIds, txnRefs, amountPoisha,
        severity, status, disposition, caseId, details, createdAt]
      additionalProperties: true
    ManualAlertRequest:
      type: object
      properties:
        domain:
          type: string
          enum: [FRAUD, AML]
        walletId: {type: string, format: uuid}
        severity:
          type: string
          enum: [LOW, MEDIUM, HIGH, CRITICAL]
        summary: {type: string, minLength: 1, maxLength: 500, description: 1..500 internal; never sent outside the service}
        txnRefs:
          type: array
          items: {type: string}
          maxItems: 500
          description: 0..500 opaque references
      required: [domain, walletId, severity, summary, txnRefs]
      additionalProperties: true
    CaseSummary:
      type: object
      properties:
        caseId: {type: string, format: uuid}
        caseNo: {type: string, description: '`CASE-YYYY-NNNNNN`'}
        domain:
          type: string
          enum: [FRAUD, AML]
        caseType:
          type: string
          enum: [FRAUD, AML_MONITORING, SCREENING, EDD, REGULATORY_INSTRUCTION, PERIODIC_REVIEW, CUSTOMER_REPORT]
        subjectType:
          type: [string, 'null']
          enum: [CUSTOMER, PARTNER, null]
        subjectId:
          type: [string, 'null']
          format: uuid
        walletId:
          type: [string, 'null']
          format: uuid
          description: primary wallet
        priority:
          type: string
          enum: [LOW, MEDIUM, HIGH, CRITICAL]
        status:
          type: string
          enum: [OPEN, ASSIGNED, INVESTIGATING, ESCALATED, PENDING_DECISION, DECIDED, CLOSED]
        assigneeId:
