# compliance-service provided API (contractVersion 1.0.0, kernel 1.0). Producer-owned (CONTRACT-MODEL O1).
openapi: 3.1.0
info: {title: compliance-service API, version: 1.0.0, description: 'Bits Pay SVC-11 compliance-service: screening lists, screening, monitoring scenarios, alerts and
    cases, freezes and regulatory instructions, CTR/STR (goAML file export), MIS, approvals. Kernel 1.0 headers, errors and pagination apply to every operation.'}
servers:
- {url: 'http://localhost:8111', description: local}
- {url: 'http://localhost:8000/compliance', description: edge proxy (dev)}
tags:
- {name: Approvals}
- {name: Screening lists}
- {name: Screening}
- {name: Monitoring}
- {name: Alerts and cases}
- {name: Freezes}
- {name: CTR and STR}
- {name: MIS}
- {name: R2}
paths:
  /v1/approvals:
    get:
      operationId: listApprovals
      summary: List maker-checker requests
      tags: [Approvals]
      x-audience: staff
      x-actors:
      - type: STAFF
        roles: [COMPLIANCE_OFFICER, CAMLCO, RISK_CHECKER, AUDITOR]
      x-audit: false
      parameters:
      - {$ref: '#/components/parameters/XCorrelationId'}
      - {$ref: '#/components/parameters/XActorType'}
      - {$ref: '#/components/parameters/XActorId'}
      - {$ref: '#/components/parameters/XActorRoles'}
      - {$ref: '#/components/parameters/XChannel'}
      - {$ref: '#/components/parameters/XActorUserId'}
      - name: status
        in: query
        required: false
        schema:
          type: string
          enum: [PENDING, APPROVED, REJECTED, EXPIRED, CANCELLED]
        description: default PENDING
      - name: entityType
        in: query
        required: false
        schema:
          type: string
          enum: [ListVersion, ScreeningSettings, TransliterationChangeSet, ScreeningDecision, EddDecision, CaseDecision, CaseAction, FreezeLift, AutoFreezeReview,
            RegulatoryInstruction, StrReport, CtrReport, AmlScenario]
      - name: limit
        in: query
        required: false
        schema: {type: integer, format: int32}
        description: 1..200, default 50 (kernel K3.4)
      - name: cursor
        in: query
        required: false
        schema: {type: string}
        description: opaque, 24 h (kernel K3.4)
      responses:
        '200':
          description: Approvals, newest first
          content:
            application/json:
              schema: {$ref: '#/components/schemas/ApprovalPage'}
              example:
                items:
                - approvalId: 0193a3f0-0000-7000-8000-000000000501
                  service: compliance-service
                  entityType: CaseAction
                  entityId: 0193a3e0-0000-7000-8000-000000000601
                  action: EXECUTE
                  makerId: 0192f010-0000-7000-8000-0000000000c1
                  checkerId: null
                  level: 1
                  requiredLevels: 1
                  checkerRoles: [CAMLCO]
                  amountPoisha: 14820000
                  status: PENDING
                  summary: LIEN CASE-2026-000123
                  deepLink: /v1/approvals/0193a3f0-0000-7000-8000-000000000501
                  requestedAt: '2026-10-09T10:00:00.000Z'
                  decidedAt: null
                  expiresAt: '2026-10-12T10:00:00.000Z'
                nextCursor: null
        '400':
          description: 'VALIDATION_FAILED: schema, header, range or format error; VALIDATION_FAILED / INVALID_CURSOR: expired, tampered or foreign cursor'
          content:
            application/problem+json:
              schema:
                allOf:
                - {$ref: '#/components/schemas/Problem'}
                - type: object
                  properties:
                    code:
                      enum: [VALIDATION_FAILED]
                    reason:
                      enum: [INVALID_CURSOR, null]
              example:
                type: about:blank
                title: expired, tampered or foreign cursor
                status: 400
                code: VALIDATION_FAILED
                detail: null
                instance: /v1/approvals
                correlationId: c-77aa
                reason: INVALID_CURSOR
                errors:
                - {field: comment, message: must not be blank}
        '403':
          description: 'ACTOR_NOT_ALLOWED: actor type or role not permitted'
          content:
            application/problem+json:
              schema:
                allOf:
                - {$ref: '#/components/schemas/Problem'}
                - type: object
                  properties:
                    code:
                      enum: [ACTOR_NOT_ALLOWED]
              example: {type: 'about:blank', title: actor type or role not permitted, status: 403, code: ACTOR_NOT_ALLOWED, detail: null, instance: /v1/approvals,
                correlationId: c-77aa, reason: null}
  /v1/approvals/{id}:approve:
    post:
      operationId: approveApproval
      summary: Approve the current level
      tags: [Approvals]
      description: Role must be in the current level's `checkerRoles` (else 403). Executes the approved effect in the same DB transaction (state change + outbox).
      x-audience: staff
      x-actors:
      - type: STAFF
        roles: [COMPLIANCE_OFFICER, CAMLCO, RISK_CHECKER]
      x-audit: true
      parameters:
      - {$ref: '#/components/parameters/XCorrelationId'}
      - {$ref: '#/components/parameters/XActorType'}
      - {$ref: '#/components/parameters/XActorId'}
      - {$ref: '#/components/parameters/XActorRoles'}
      - {$ref: '#/components/parameters/XChannel'}
      - {$ref: '#/components/parameters/XActorUserId'}
      - name: Idempotency-Key
        in: header
        required: false
        schema: {type: string, maxLength: 64, pattern: '^[A-Za-z0-9_-]{1,64}$'}
        description: Kernel K3.3; optional for this operation
      - name: id
        in: path
        required: true
        schema: {type: string, format: uuid}
      requestBody:
        required: true
        content:
          application/json:
            schema: {$ref: '#/components/schemas/ApproveRequest'}
            example: {comment: Lien sized correctly}
      responses:
        '200':
          description: Approval after the decision (PENDING with the next level, or APPROVED)
          content:
            application/json:
              schema: {$ref: '#/components/schemas/Approval'}
              example:
                approvalId: 0193a3f0-0000-7000-8000-000000000501
                service: compliance-service
                entityType: CaseAction
                entityId: 0193a3e0-0000-7000-8000-000000000601
                action: EXECUTE
                makerId: 0192f010-0000-7000-8000-0000000000c1
                checkerId: null
                level: 1
                requiredLevels: 1
                checkerRoles: [CAMLCO]
                amountPoisha: 14820000
                status: PENDING
                summary: LIEN CASE-2026-000123
                deepLink: /v1/approvals/0193a3f0-0000-7000-8000-000000000501
                requestedAt: '2026-10-09T10:00:00.000Z'
                decidedAt: null
                expiresAt: '2026-10-12T10:00:00.000Z'
        '400':
          description: 'VALIDATION_FAILED: schema, header, range or format error'
          content:
            application/problem+json:
              schema:
                allOf:
                - {$ref: '#/components/schemas/Problem'}
                - type: object
                  properties:
                    code:
                      enum: [VALIDATION_FAILED]
              example:
                type: about:blank
                title: schema, header, range or format error
                status: 400
                code: VALIDATION_FAILED
                detail: null
                instance: /v1/approvals/{id}:approve
                correlationId: c-77aa
                reason: null
                errors:
                - {field: comment, message: must not be blank}
        '403':
          description: 'ACTOR_NOT_ALLOWED: actor type or role not permitted'
          content:
            application/problem+json:
              schema:
                allOf:
                - {$ref: '#/components/schemas/Problem'}
                - type: object
                  properties:
                    code:
                      enum: [ACTOR_NOT_ALLOWED]
              example: {type: 'about:blank', title: actor type or role not permitted, status: 403, code: ACTOR_NOT_ALLOWED, detail: null, instance: '/v1/approvals/{id}:approve',
                correlationId: c-77aa, reason: null}
        '404':
          description: 'NOT_FOUND: entity missing'
          content:
            application/problem+json:
              schema:
                allOf:
                - {$ref: '#/components/schemas/Problem'}
                - type: object
                  properties:
                    code:
                      enum: [NOT_FOUND]
              example: {type: 'about:blank', title: entity missing, status: 404, code: NOT_FOUND, detail: null, instance: '/v1/approvals/{id}:approve', correlationId: c-77aa,
                reason: null}
        '409':
          description: 'STATE_CONFLICT / NOT_PENDING: not PENDING; STATE_CONFLICT / APPROVAL_EXPIRED: expired; STATE_CONFLICT / REVALIDATION_FAILED: the entity changed
            since the request (e.g. freeze no longer APPLIED)'
          content:
            application/problem+json:
              schema:
                allOf:
                - {$ref: '#/components/schemas/Problem'}
                - type: object
                  properties:
                    code:
                      enum: [STATE_CONFLICT]
                    reason:
                      enum: [NOT_PENDING, APPROVAL_EXPIRED, REVALIDATION_FAILED, null]
              example: {type: 'about:blank', title: 'the entity changed since the request (e.g. freeze no longer ', status: 409, code: STATE_CONFLICT, detail: null,
                instance: '/v1/approvals/{id}:approve', correlationId: c-77aa, reason: REVALIDATION_FAILED}
        '422':
          description: 'MAKER_CHECKER_VIOLATION: checker = maker, = case assignee/proposer, or decided an earlier level'
          content:
            application/problem+json:
              schema:
                allOf:
                - {$ref: '#/components/schemas/Problem'}
                - type: object
                  properties:
                    code:
                      enum: [MAKER_CHECKER_VIOLATION]
              example: {type: 'about:blank', title: 'checker = maker, = case assignee/proposer, or decided an ear', status: 422, code: MAKER_CHECKER_VIOLATION, detail: null,
                instance: '/v1/approvals/{id}:approve', correlationId: c-77aa, reason: null}
  /v1/approvals/{id}:reject:
