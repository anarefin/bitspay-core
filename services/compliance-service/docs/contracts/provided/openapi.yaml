          items: {$ref: '#/components/schemas/ScreeningMatch'}
        decision:
          type: [string, 'null']
          enum: [CLEAR, REJECT, null]
        decidedBy:
          type: [string, 'null']
          format: uuid
        sourceEventId:
          type: [string, 'null']
          format: uuid
