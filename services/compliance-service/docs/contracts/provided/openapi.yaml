  /v1/screening/lists/{listCode}/versions:
    post:
      operationId: uploadListVersion
      summary: Upload a new list file
      tags: [Screening lists]
      x-audience: staff
      x-actors:
      - type: STAFF
        roles: [COMPLIANCE_OFFICER]
      x-audit: true
      parameters:
      - {$ref: '#/components/parameters/XCorrelationId'}
      - {$ref: '#/components/parameters/XActorType'}
      - {$ref: '#/components/parameters/XActorId'}
      - {$ref: '#/components/parameters/XActorRoles'}
      - {$ref: '#/components/parameters/XChannel'}
      - {$ref: '#/components/parameters/XActorUserId'}
      - name: Idempotency-Key
        in: header
        required: false
        schema: {type: string, maxLength: 64, pattern: '^[A-Za-z0-9_-]{1,64}$'}
        description: Kernel K3.3; optional for this operation
      - name: listCode
        in: path
        required: true
        schema:
          type: string
          enum: [UN, BFIU, OFAC, EU, UKHMT, PEP, INTERNAL]
      requestBody:
        required: true
        content:
          multipart/form-data:
            schema:
              type: object
              properties:
                file: {type: string, format: binary, description: <= 200 MB list file in the list's parser format}
                publicationDate:
                  type: [string, 'null']
                  format: date
                  description: publication date printed on the list
              required: [file]
              additionalProperties: false
            example: {file: (binary), publicationDate: '2026-10-08'}
      responses:
        '201':
          description: 'Parsed synchronously (<= 60 s): status PARSED or PARSE_FAILED'
          content:
            application/json:
              schema: {$ref: '#/components/schemas/ListVersion'}
              example:
                versionId: 0193a1c0-0000-7000-8000-000000000101
                listCode: UN
                versionNo: 15
                status: PARSED
                fileName: consolidated.xml
                fileSha256: 3b7d4c1e9a0f2b5c6d7e8f9012a3b4c5d6e7f8091a2b3c4d5e6f708192a3b4c5
                publicationDate: '2026-10-08'
                recordCount: 1012
                added: 3
                changed: 2
                removed: 1
                parseReport:
                  warnings:
                  - {externalRef: QDi.431, line: null, message: DOB 'circa 1965' parsed as year 1965}
                  errors: []
                uploadedBy: 0192f010-0000-7000-8000-0000000000c1
                approvalId: null
                approvedBy: null
                activatedAt: null
                createdAt: '2026-10-09T04:00:00.000Z'
        '202':
          description: 'Parsing continues asynchronously: status UPLOADED'
          content:
            application/json:
              schema: {$ref: '#/components/schemas/ListVersion'}
              example:
                versionId: 0193a1c0-0000-7000-8000-000000000101
                listCode: UN
                versionNo: 15
                status: PARSED
                fileName: consolidated.xml
                fileSha256: 3b7d4c1e9a0f2b5c6d7e8f9012a3b4c5d6e7f8091a2b3c4d5e6f708192a3b4c5
                publicationDate: '2026-10-08'
                recordCount: 1012
                added: 3
                changed: 2
                removed: 1
                parseReport:
                  warnings:
                  - {externalRef: QDi.431, line: null, message: DOB 'circa 1965' parsed as year 1965}
                  errors: []
                uploadedBy: 0192f010-0000-7000-8000-0000000000c1
                approvalId: null
                approvedBy: null
                activatedAt: null
                createdAt: '2026-10-09T04:00:00.000Z'
        '400':
          description: 'VALIDATION_FAILED: schema, header, range or format error; VALIDATION_FAILED / FILE_TOO_LARGE: file > 200 MB; VALIDATION_FAILED / UNSUPPORTED_FILE_FORMAT:
            not parseable by the list''s parser at all'
          content:
            application/problem+json:
              schema:
                allOf:
                - {$ref: '#/components/schemas/Problem'}
                - type: object
                  properties:
                    code:
                      enum: [VALIDATION_FAILED]
                    reason:
                      enum: [FILE_TOO_LARGE, UNSUPPORTED_FILE_FORMAT, null]
              example:
                type: about:blank
                title: not parseable by the list's parser at all
                status: 400
                code: VALIDATION_FAILED
                detail: null
                instance: /v1/screening/lists/{listCode}/versions
                correlationId: c-77aa
                reason: UNSUPPORTED_FILE_FORMAT
                errors:
                - {field: comment, message: must not be blank}
        '403':
          description: 'ACTOR_NOT_ALLOWED: actor type or role not permitted'
          content:
            application/problem+json:
              schema:
                allOf:
                - {$ref: '#/components/schemas/Problem'}
                - type: object
                  properties:
                    code:
                      enum: [ACTOR_NOT_ALLOWED]
              example: {type: 'about:blank', title: actor type or role not permitted, status: 403, code: ACTOR_NOT_ALLOWED, detail: null, instance: '/v1/screening/lists/{listCode}/versions',
                correlationId: c-77aa, reason: null}
        '404':
          description: 'NOT_FOUND: entity missing'
          content:
            application/problem+json:
              schema:
                allOf:
                - {$ref: '#/components/schemas/Problem'}
                - type: object
                  properties:
                    code:
                      enum: [NOT_FOUND]
              example: {type: 'about:blank', title: entity missing, status: 404, code: NOT_FOUND, detail: null, instance: '/v1/screening/lists/{listCode}/versions',
                correlationId: c-77aa, reason: null}
        '409':
          description: 'STATE_CONFLICT / DUPLICATE_LIST_FILE: same SHA-256 already uploaded for this list'
