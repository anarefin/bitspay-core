  parameters:
    XCorrelationId:
      name: X-Correlation-Id
      in: header
      required: false
      schema: {type: string, maxLength: 64, pattern: '^[A-Za-z0-9._-]{1,64}$'}
      description: Generated when absent; echoed in problem bodies and envelopes (kernel K3.1)
    XActorType:
      name: X-Actor-Type
      in: header
      required: true
      schema:
        type: string
        enum: [CUSTOMER, AGENT, MERCHANT, DISTRIBUTOR, INSTITUTION, STAFF, SYSTEM, SERVICE]
      description: Actor type (kernel K3.1)
    XActorId:
      name: X-Actor-Id
      in: header
      required: true
      schema: {type: string, maxLength: 64}
      description: staffUserId (STAFF), customerId (CUSTOMER)
    XActorRoles:
      name: X-Actor-Roles
      in: header
      required: false
      schema: {type: string}
      description: Comma-separated kernel K7 role codes; required for STAFF
    XChannel:
      name: X-Channel
      in: header
      required: true
      schema:
        type: string
        enum: [APP, USSD, PARTNER_APP, PORTAL, BACKOFFICE, API, SYSTEM]
      description: Channel of origin
    XActorUserId:
      name: X-Actor-User-Id
      in: header
      required: false
      schema: {type: string, maxLength: 64, pattern: '^[A-Za-z0-9_-]{1,64}$'}
      description: Maker != checker comparison and audit only
    XActorWalletId:
      name: X-Actor-Wallet-Id
      in: header
      required: false
      schema: {type: string, format: uuid}
      description: Wallet the customer operates (customer operations)
    XDeviceId:
      name: X-Device-Id
      in: header
      required: false
      schema: {type: string, maxLength: 128}
      description: Device (customer operations)
