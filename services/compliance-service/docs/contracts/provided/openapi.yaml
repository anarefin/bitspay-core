          description: '>= 1 LIEN: current attempt number'
        linkedFreezeId:
          type: [string, 'null']
          format: uuid
          description: shortfall DEBIT_BLOCK of a LIEN
        status:
          type: string
          enum: [REQUESTED, APPLIED, FAILED, LIFT_REQUESTED, LIFTED]
        attempts: {type: integer, format: int32, description: delivery attempts of the current step}
