              example: {type: 'about:blank', title: actor type or role not permitted, status: 403, code: ACTOR_NOT_ALLOWED, detail: null, instance: /v1/exports/aml,
                correlationId: c-77aa, reason: null}
  /v1/exports/aml/{jobId}/file:
    get:
      operationId: downloadAmlExport
      summary: Download an export file (audited, R2)
      tags: [R2]
      x-audience: staff
      x-actors:
      - type: STAFF
        roles: [CAMLCO]
      x-audit: true
      parameters:
      - {$ref: '#/components/parameters/XCorrelationId'}
      - {$ref: '#/components/parameters/XActorType'}
      - {$ref: '#/components/parameters/XActorId'}
      - {$ref: '#/components/parameters/XActorRoles'}
      - {$ref: '#/components/parameters/XChannel'}
      - {$ref: '#/components/parameters/XActorUserId'}
      - name: jobId
        in: path
        required: true
        schema: {type: string, format: uuid}
      responses:
        '200':
          description: file
          content:
            text/csv:
              schema: {type: string, format: binary}
              example: 'key,count

                AML-SC-05,12

                '
            application/x-ndjson:
              schema: {type: string, format: binary}
              example: '{"alertNo":"ALT-2026-00001234"}

                '
        '400':
          description: 'VALIDATION_FAILED: schema, header, range or format error'
          content:
            application/problem+json:
              schema:
                allOf:
                - {$ref: '#/components/schemas/Problem'}
                - type: object
                  properties:
                    code:
                      enum: [VALIDATION_FAILED]
              example:
                type: about:blank
                title: schema, header, range or format error
                status: 400
                code: VALIDATION_FAILED
                detail: null
                instance: /v1/exports/aml/{jobId}/file
                correlationId: c-77aa
                reason: null
                errors:
                - {field: comment, message: must not be blank}
        '403':
          description: 'ACTOR_NOT_ALLOWED: actor type or role not permitted'
          content:
            application/problem+json:
              schema:
                allOf:
                - {$ref: '#/components/schemas/Problem'}
                - type: object
                  properties:
                    code:
                      enum: [ACTOR_NOT_ALLOWED]
              example: {type: 'about:blank', title: actor type or role not permitted, status: 403, code: ACTOR_NOT_ALLOWED, detail: null, instance: '/v1/exports/aml/{jobId}/file',
                correlationId: c-77aa, reason: null}
        '404':
          description: 'NOT_FOUND: entity missing'
          content:
            application/problem+json:
              schema:
                allOf:
                - {$ref: '#/components/schemas/Problem'}
                - type: object
                  properties:
                    code:
                      enum: [NOT_FOUND]
              example: {type: 'about:blank', title: entity missing, status: 404, code: NOT_FOUND, detail: null, instance: '/v1/exports/aml/{jobId}/file', correlationId: c-77aa,
                reason: null}
        '409':
          description: 'STATE_CONFLICT / EXPORT_NOT_READY: job not COMPLETED'
          content:
            application/problem+json:
              schema:
                allOf:
                - {$ref: '#/components/schemas/Problem'}
                - type: object
                  properties:
                    code:
                      enum: [STATE_CONFLICT]
                    reason:
                      enum: [EXPORT_NOT_READY, null]
              example: {type: 'about:blank', title: job not COMPLETED, status: 409, code: STATE_CONFLICT, detail: null, instance: '/v1/exports/aml/{jobId}/file',
                correlationId: c-77aa, reason: EXPORT_NOT_READY}
  /v1/imports/external-alerts:
    post:
      operationId: importExternalAlerts
      summary: Import alerts from an external AML system (R2)
      tags: [R2]
      x-audience: staff
      x-actors:
      - type: STAFF
        roles: [CAMLCO]
      x-audit: true
      parameters:
      - {$ref: '#/components/parameters/XCorrelationId'}
      - {$ref: '#/components/parameters/XActorType'}
      - {$ref: '#/components/parameters/XActorId'}
      - {$ref: '#/components/parameters/XActorRoles'}
      - {$ref: '#/components/parameters/XChannel'}
      - {$ref: '#/components/parameters/XActorUserId'}
      - name: Idempotency-Key
        in: header
        required: false
        schema: {type: string, maxLength: 64, pattern: '^[A-Za-z0-9_-]{1,64}$'}
        description: Kernel K3.3; optional for this operation
      requestBody:
        required: true
        content:
          multipart/form-data:
            schema:
              type: object
              properties:
                file: {type: string, format: binary, description: 'CSV `walletId|msisdn,severity,summary,externalRef`, <= 10 MB'}
