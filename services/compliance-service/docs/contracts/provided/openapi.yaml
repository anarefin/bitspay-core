                - {line: 7, message: unknown walletId}
        '400':
          description: 'VALIDATION_FAILED: schema, header, range or format error'
          content:
            application/problem+json:
              schema:
                allOf:
                - {$ref: '#/components/schemas/Problem'}
                - type: object
                  properties:
                    code:
                      enum: [VALIDATION_FAILED]
              example:
                type: about:blank
                title: schema, header, range or format error
                status: 400
                code: VALIDATION_FAILED
                detail: null
                instance: /v1/imports/external-alerts
                correlationId: c-77aa
                reason: null
                errors:
                - {field: comment, message: must not be blank}
        '403':
          description: 'ACTOR_NOT_ALLOWED: actor type or role not permitted'
          content:
            application/problem+json:
              schema:
                allOf:
                - {$ref: '#/components/schemas/Problem'}
                - type: object
                  properties:
                    code:
                      enum: [ACTOR_NOT_ALLOWED]
              example: {type: 'about:blank', title: actor type or role not permitted, status: 403, code: ACTOR_NOT_ALLOWED, detail: null, instance: /v1/imports/external-alerts,
                correlationId: c-77aa, reason: null}
components:
  schemas:
    Approval:
      type: object
      description: One maker-checker request (same shape as the approval.events data).
      properties:
        approvalId: {type: string, format: uuid}
        service:
          type: string
          enum: [compliance-service]
          description: no `module` (single-module service)
        entityType:
          type: string
          enum: [ListVersion, ScreeningSettings, TransliterationChangeSet, ScreeningDecision, EddDecision, CaseDecision, CaseAction, FreezeLift, AutoFreezeReview,
            RegulatoryInstruction, StrReport, CtrReport, AmlScenario]
          description: codes.yaml entityTypes
        entityId: {type: string, maxLength: 128, description: '<= 128 e.g. caseId, actionId, `UN:15`'}
        action: {type: string, pattern: '^[A-Z][A-Z_]{1,39}$', description: '^[A-Z][A-Z_]{1,39}$ ACTIVATE, UPDATE, DECIDE, EXECUTE, LIFT, REVIEW, SUBMIT'}
        makerId: {type: string, description: 'STAFF uuid, or `compliance-service` (auto-freeze review)'}
        checkerId:
          type: [string, 'null']
          description: decider of the reported level
        level: {type: integer, format: int32, description: 1 <= level <= requiredLevels 1-based}
        requiredLevels: {type: integer, format: int32, description: 1..2}
        checkerRoles:
          type: array
          items:
            type: string
            enum: [OPS_MAKER, OPS_CHECKER, FIN_MAKER, FIN_CHECKER, SUP_AGENT, SUP_MAKER, SUP_CHECKER, RISK_ANALYST, RISK_CHECKER, COMPLIANCE_OFFICER, CAMLCO, PARTNER_OPS_MAKER,
              PARTNER_OPS_CHECKER, PRICING_MAKER, PRICING_CHECKER, ADMIN, AUDITOR, READ_ONLY]
          minItems: 1
          description: non-empty roles allowed to decide the current level
        amountPoisha:
          type: [integer, 'null']
          format: int64
          description: '>= 0 lien / confirmed-fraud amount, else null'
        status:
          type: string
          enum: [PENDING, APPROVED, REJECTED, EXPIRED, CANCELLED]
        summary: {type: string, maxLength: 200, description: '<= 200, no customer PII'}
        deepLink: {type: string, description: '`/v1/approvals/{approvalId}`'}
        requestedAt: {type: string, format: date-time}
        decidedAt:
          type: [string, 'null']
          format: date-time
        expiresAt: {type: string, format: date-time, description: requestedAt + 72 h}
      required: [approvalId, service, entityType, entityId, action, makerId, checkerId, level, requiredLevels, checkerRoles, amountPoisha, status, summary, deepLink,
        requestedAt, decidedAt, expiresAt]
      additionalProperties: true
    ApproveRequest:
      type: object
      properties:
        comment: {type: string, minLength: 1, maxLength: 500, description: 1..500}
      additionalProperties: true
    RejectRequest:
      type: object
      properties:
        comment: {type: string, minLength: 1, maxLength: 500, description: 1..500}
        reasonCode:
          type: [string, 'null']
          pattern: ^[A-Z_]{3,40}$
          description: ^[A-Z_]{3,40}$
      required: [comment]
      additionalProperties: true
    PendingApproval:
      type: object
      description: Returned by every operation that only creates a maker-checker request.
      properties:
        entityType:
          type: string
          enum: [ListVersion, ScreeningSettings, TransliterationChangeSet, ScreeningDecision, EddDecision, CaseDecision, CaseAction, FreezeLift, AutoFreezeReview,
            RegulatoryInstruction, StrReport, CtrReport, AmlScenario]
        entityId: {type: string, description: <= 128}
        status:
          type: string
          enum: [PENDING_APPROVAL]
        approvalId: {type: string, format: uuid, description: 'decide with `POST /v1/approvals/{id}:approve`'}
      required: [entityType, entityId, status, approvalId]
      additionalProperties: true
    ScreeningList:
      type: object
      properties:
        listCode:
          type: string
          enum: [UN, BFIU, OFAC, EU, UKHMT, PEP, INTERNAL]
        name: {type: string}
        listKind:
          type: string
          enum: [SANCTIONS, PEP, INTERNAL]
        parser:
          type: string
          enum: [UN_XML, OFAC_SDN_XML, OFAC_CSV, EU_XML, UKHMT_CSV, GENERIC_CSV]
        threshold:
          type: [number, 'null']
          description: 0..1 per-list override of the review threshold; null = global
        autoFreezeOnConfirmed: {type: boolean, description: BR-11-14}
        activeVersionId:
          type: [string, 'null']
          format: uuid
          description: null until a first activation
        activeVersionNo:
          type: [integer, 'null']
          format: int32
          description: '>= 1'
        activatedAt:
          type: [string, 'null']
          format: date-time
        recordCount:
          type: [integer, 'null']
          format: int32
          description: entries in the active version
      required: [listCode, name, listKind, parser, threshold, autoFreezeOnConfirmed, activeVersionId, activeVersionNo, activatedAt, recordCount]
      additionalProperties: true
    ScreeningListCollection:
      type: object
      properties:
        items:
          type: array
          items: {$ref: '#/components/schemas/ScreeningList'}
          description: not paged; one item per list code (<= 16)
      required: [items]
      additionalProperties: true
    ParseIssue:
      type: object
      properties:
        externalRef:
          type: [string, 'null']
        line:
          type: [integer, 'null']
          format: int32
          description: CSV line / XML record index
        message: {type: string, description: <= 500}
      required: [externalRef, line, message]
      additionalProperties: true
    ParseReport:
      type: object
      properties:
        warnings:
          type: array
          items: {$ref: '#/components/schemas/ParseIssue'}
        errors:
          type: array
          items: {$ref: '#/components/schemas/ParseIssue'}
          description: non-empty blocks `:submit`
      required: [warnings, errors]
      additionalProperties: true
    ListVersion:
      type: object
      properties:
        versionId: {type: string, format: uuid}
        listCode:
          type: string
          enum: [UN, BFIU, OFAC, EU, UKHMT, PEP, INTERNAL]
        versionNo: {type: integer, format: int32, description: '>= 1'}
        status:
          type: string
          enum: [UPLOADED, PARSE_FAILED, PARSED, PENDING_APPROVAL, ACTIVE, SUPERSEDED, REJECTED]
        fileName: {type: string}
        fileSha256: {type: string, pattern: '^[0-9a-f]{64}$', description: 64 lower-case hex}
        publicationDate:
          type: [string, 'null']
          format: date
        recordCount:
          type: [integer, 'null']
          format: int32
          description: null until parsed
        added:
          type: [integer, 'null']
          format: int32
          description: diff vs the active version
        changed:
          type: [integer, 'null']
          format: int32
        removed:
          type: [integer, 'null']
          format: int32
        parseReport:
          anyOf:
          - {$ref: '#/components/schemas/ParseReport'}
          - {type: 'null'}
        uploadedBy: {type: string, format: uuid, description: staffUserId}
        approvalId:
          type: [string, 'null']
          format: uuid
        approvedBy:
          type: [string, 'null']
          format: uuid
        activatedAt:
          type: [string, 'null']
          format: date-time
        createdAt: {type: string, format: date-time}
      required: [versionId, listCode, versionNo, status, fileName, fileSha256, publicationDate, recordCount, added, changed, removed, parseReport, uploadedBy, approvalId,
        approvedBy, activatedAt, createdAt]
      additionalProperties: true
    DiffEntry:
      type: object
      properties:
        externalRef: {type: string}
        entryType:
          type: string
          enum: [INDIVIDUAL, ENTITY, VESSEL, OTHER]
        primaryName: {type: string}
      required: [externalRef, entryType, primaryName]
      additionalProperties: true
    ListDiff:
      type: object
      properties:
        added:
          type: array
          items: {$ref: '#/components/schemas/DiffEntry'}
          description: <= 1000 items
        changed:
          type: array
          items: {$ref: '#/components/schemas/DiffEntry'}
          description: <= 1000 items
        removed:
          type: array
          items: {$ref: '#/components/schemas/DiffEntry'}
          description: <= 1000 items
        truncated: {type: boolean, description: true when any list was capped}
      required: [added, changed, removed, truncated]
      additionalProperties: true
    ListVersionDetail:
      type: object
      properties:
        versionId: {type: string, format: uuid}
        listCode:
          type: string
          enum: [UN, BFIU, OFAC, EU, UKHMT, PEP, INTERNAL]
        versionNo: {type: integer, format: int32, description: '>= 1'}
        status:
          type: string
          enum: [UPLOADED, PARSE_FAILED, PARSED, PENDING_APPROVAL, ACTIVE, SUPERSEDED, REJECTED]
        fileName: {type: string}
        fileSha256: {type: string, pattern: '^[0-9a-f]{64}$', description: 64 lower-case hex}
        publicationDate:
          type: [string, 'null']
          format: date
        recordCount:
          type: [integer, 'null']
          format: int32
          description: null until parsed
        added:
          type: [integer, 'null']
          format: int32
          description: diff vs the active version
        changed:
          type: [integer, 'null']
          format: int32
        removed:
          type: [integer, 'null']
          format: int32
        parseReport:
          anyOf:
          - {$ref: '#/components/schemas/ParseReport'}
          - {type: 'null'}
        uploadedBy: {type: string, format: uuid, description: staffUserId}
        approvalId:
          type: [string, 'null']
          format: uuid
        approvedBy:
          type: [string, 'null']
          format: uuid
        activatedAt:
          type: [string, 'null']
          format: date-time
        createdAt: {type: string, format: date-time}
        diff:
          anyOf:
          - {$ref: '#/components/schemas/ListDiff'}
          - {type: 'null'}
      required: [versionId, listCode, versionNo, status, fileName, fileSha256, publicationDate, recordCount, added, changed, removed, parseReport, uploadedBy, approvalId,
        approvedBy, activatedAt, createdAt, diff]
      additionalProperties: true
    ListEntry:
      type: object
      properties:
        entryId: {type: string, format: uuid}
        listCode:
          type: string
          enum: [UN, BFIU, OFAC, EU, UKHMT, PEP, INTERNAL]
        versionNo: {type: integer, format: int32}
        externalRef: {type: string}
        entryType:
          type: string
          enum: [INDIVIDUAL, ENTITY, VESSEL, OTHER]
        primaryName: {type: string}
        aliases:
          type: array
          items: {type: string}
        dobText:
          type: [string, 'null']
          description: as published
        nationality:
          type: array
          items: {type: string}
          description: ISO 3166 alpha-2
        programs:
          type: array
          items: {type: string}
        idNumbersMasked:
          type: array
          items: {type: string}
          description: first 4 + `****` clear ID numbers never returned
        remarks:
          type: [string, 'null']
      required: [entryId, listCode, versionNo, externalRef, entryType, primaryName, aliases, dobText, nationality, programs, idNumbersMasked, remarks]
      additionalProperties: true
    RescreenRequest:
      type: object
      properties:
        mode:
          type: string
          enum: [FULL]
          description: DELTA jobs are created by list activation only
        listCodes:
          type: [array, 'null']
          items:
            type: string
            enum: [UN, BFIU, OFAC, EU, UKHMT, PEP, INTERNAL]
          description: null/absent = all lists
        comment: {type: string, minLength: 1, maxLength: 500, description: 1..500}
      required: [mode, comment]
      additionalProperties: true
    RescreenJob:
      type: object
      properties:
        jobId: {type: string, format: uuid}
        mode:
          type: string
          enum: [DELTA, FULL]
        listVersionId:
          type: [string, 'null']
          format: uuid
          description: DELTA only
        status:
          type: string
          enum: [QUEUED, RUNNING, COMPLETED, FAILED, CANCELLED]
        total: {type: integer, format: int64, description: subjects to process}
        processed: {type: integer, format: int64}
        hits: {type: integer, format: int32, description: non-CLEAR screenings created}
        requestedBy: {type: string, description: staffUserId or `compliance-service`}
        startedAt:
          type: [string, 'null']
          format: date-time
        finishedAt:
          type: [string, 'null']
          format: date-time
        createdAt: {type: string, format: date-time}
      required: [jobId, mode, listVersionId, status, total, processed, hits, requestedBy, startedAt, finishedAt, createdAt]
      additionalProperties: true
    ScoreBreakdown:
      type: object
      properties:
        jaroWinkler: {type: number, description: 0..1}
        jaroWinklerJoined: {type: number, description: 0..1}
        tokenSet: {type: number, description: 0..1}
        phoneticEqual: {type: boolean}
        subsetRule: {type: boolean}
        dobAdjust: {type: number}
        typeAdjust: {type: number}
      required: [jaroWinkler, jaroWinklerJoined, tokenSet, phoneticEqual, subsetRule, dobAdjust, typeAdjust]
      additionalProperties: true
    ScreeningMatch:
      type: object
      properties:
        matchId: {type: string, format: uuid}
        listCode:
          type: string
          enum: [UN, BFIU, OFAC, EU, UKHMT, PEP, INTERNAL, BLACKLIST]
          description: '`BLACKLIST` = limits-risk blacklist hit'
        listKind:
          type: string
          enum: [SANCTIONS, PEP, INTERNAL, BLACKLIST]
        listVersion: {type: integer, format: int32, description: '>= 1; 0 for BLACKLIST'}
        entryId:
          type: [string, 'null']
          format: uuid
          description: null for BLACKLIST
        externalRef: {type: string, description: blacklist entryId for BLACKLIST}
        entryType:
          type: string
          enum: [INDIVIDUAL, ENTITY, VESSEL, OTHER]
        matchedName:
          type: [string, 'null']
          description: null for ID / INTERNAL_BLACKLIST
        subjectName:
          type: [string, 'null']
          description: normalised subject variant that matched
        score: {type: number, description: 0.0000..1.0000 not money}
        matchType:
          type: string
          enum: [NAME, NAME_DOB, ID, INTERNAL_BLACKLIST]
        matchedSubjectType:
          type: [string, 'null']
          enum: [PARTNER, PERSON, null]
          description: partner screenings only
        matchedSubjectId:
          type: [string, 'null']
          format: uuid
          description: partnerId or key-person personId
        breakdown:
          anyOf:
          - {$ref: '#/components/schemas/ScoreBreakdown'}
          - {type: 'null'}
        disposition:
          type: string
          enum: [PENDING, TRUE_MATCH, FALSE_POSITIVE]
        dispositionBy:
          type: [string, 'null']
          format: uuid
        dispositionAt:
          type: [string, 'null']
          format: date-time
      required: [matchId, listCode, listKind, listVersion, entryId, externalRef, entryType, matchedName, subjectName, score, matchType, matchedSubjectType, matchedSubjectId,
        breakdown, disposition, dispositionBy, dispositionAt]
      additionalProperties: true
    AdHocScreeningRequest:
      type: object
      description: Ad-hoc screening. A request with subjectId re-screens that subject (trigger MANUAL); a request with nameEn screens an unsaved PERSON/ORGANISATION
        and publishes no event.
      properties:
        subjectId:
          type: [string, 'null']
          format: uuid
          description: exactly one of subjectId / nameEn an existing CUSTOMER or PARTNER subject
        entityKind:
          type: [string, 'null']
          enum: [INDIVIDUAL, ORGANISATION, null]
          description: required with nameEn
        nameEn:
          type: [string, 'null']
          maxLength: 200
          description: 1..200 ad-hoc name
        nameBn:
          type: [string, 'null']
          maxLength: 200
          description: 1..200
        dob:
          type: [string, 'null']
          format: date
        nid:
          type: [string, 'null']
          description: 10/13/17 digits hashed on receipt (kernel K2), never stored or logged in clear
      additionalProperties: true
    ScreeningResult:
      type: object
      properties:
        screeningId: {type: string, format: uuid}
        subjectType:
          type: string
          enum: [CUSTOMER, PARTNER, PERSON]
          description: PERSON for ad-hoc names
        subjectId: {type: string, format: uuid}
        trigger:
          type: string
          enum: [ONBOARDING, RESCREEN, MANUAL, PROFILE_CHANGE, PERIODIC]
          description: always MANUAL here
        result:
          type: string
          enum: [CLEAR, POTENTIAL_MATCH, CONFIRMED_MATCH]
        eddRequired: {type: boolean}
        maxScore:
          type: [number, 'null']
          description: null when no match
        status:
          type: string
          enum: [COMPLETED, UNDER_REVIEW, PENDING_DECISION, DECIDED]
        matches:
          type: array
          items: {$ref: '#/components/schemas/ScreeningMatch'}
      required: [screeningId, subjectType, subjectId, trigger, result, eddRequired, maxScore, status, matches]
      additionalProperties: true
    ScreeningSummary:
      type: object
      properties:
        screeningId: {type: string, format: uuid}
        subjectType:
          type: string
          enum: [CUSTOMER, PARTNER, PERSON]
        subjectId: {type: string, format: uuid}
        subjectName:
          type: [string, 'null']
          description: display name of the subject (staff only)
        trigger:
          type: string
          enum: [ONBOARDING, RESCREEN, MANUAL, PROFILE_CHANGE, PERIODIC]
        result:
          type: string
          enum: [CLEAR, POTENTIAL_MATCH, CONFIRMED_MATCH]
        eddRequired: {type: boolean}
        status:
          type: string
          enum: [COMPLETED, UNDER_REVIEW, PENDING_DECISION, DECIDED]
        maxScore:
          type: [number, 'null']
        caseId:
          type: [string, 'null']
          format: uuid
        createdAt: {type: string, format: date-time}
        decidedAt:
          type: [string, 'null']
          format: date-time
      required: [screeningId, subjectType, subjectId, subjectName, trigger, result, eddRequired, status, maxScore, caseId, createdAt, decidedAt]
      additionalProperties: true
    ScreeningDetail:
      type: object
      properties:
        screeningId: {type: string, format: uuid}
        subjectType:
          type: string
          enum: [CUSTOMER, PARTNER, PERSON]
        subjectId: {type: string, format: uuid}
        subjectName:
          type: [string, 'null']
          description: display name of the subject (staff only)
        trigger:
          type: string
          enum: [ONBOARDING, RESCREEN, MANUAL, PROFILE_CHANGE, PERIODIC]
        result:
          type: string
          enum: [CLEAR, POTENTIAL_MATCH, CONFIRMED_MATCH]
        eddRequired: {type: boolean}
        status:
          type: string
          enum: [COMPLETED, UNDER_REVIEW, PENDING_DECISION, DECIDED]
        maxScore:
          type: [number, 'null']
        caseId:
          type: [string, 'null']
          format: uuid
        createdAt: {type: string, format: date-time}
        decidedAt:
          type: [string, 'null']
          format: date-time
        listVersions:
          type: object
          additionalProperties: {type: integer, format: int32}
