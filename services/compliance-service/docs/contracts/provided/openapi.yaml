      type: object
      properties:
        assigneeId: {type: string, format: uuid, description: staff user holding a role of the case domain}
      required: [assigneeId]
      additionalProperties: true
    EmptyRequest:
      type: object
      description: Empty JSON object.
      properties: {}
      additionalProperties: true
    EscalateRequest:
      type: object
      properties:
        reason: {type: string, minLength: 1, maxLength: 500, description: 1..500}
      required: [reason]
      additionalProperties: true
    NoteRequest:
      type: object
      properties:
        body: {type: string, minLength: 1, maxLength: 4000, description: 1..4000}
      required: [body]
      additionalProperties: true
    AlertDispositionRequest:
      type: object
      properties:
        disposition:
          type: string
          enum: [TRUE_POSITIVE, FALSE_POSITIVE, INCONCLUSIVE]
        comment:
          type: [string, 'null']
          maxLength: 500
          description: 1..500
      required: [disposition]
      additionalProperties: true
    CaseDecisionProposal:
      type: object
      properties:
        decision:
          type: string
          enum: [CONFIRMED_FRAUD, FALSE_POSITIVE, SUSPICIOUS, NOT_SUSPICIOUS, EDD_APPROVED, EDD_REJECTED, SCREENING_CLEAR, SCREENING_REJECT, INSTRUCTION_EXECUTED,
            REVIEW_COMPLETED]
          description: allowed values depend on caseType (BR-11-33)
        rationale: {type: string, minLength: 1, maxLength: 2000, description: 1..2000 internal; never leaves the service}
        recommendedActions:
          type: array
          items:
            type: string
            enum: [FREEZE, DEBIT_BLOCK, LIEN, LIFT, SET_WATCH, CLEAR_WATCH, PROPOSE_BLACKLIST, STR_DRAFT, REGRADE, RECOMMEND_REVERSAL, SUSPEND_PARTNER]
          description: may be []
        recommendedGrade:
          type: [string, 'null']
          enum: [LOW, MEDIUM, HIGH, null]
          description: customers only
        confirmedFraudPoisha: {type: integer, format: int64, description: '>= 0, default 0 FRAUD'}
        lienAmountPoisha:
          type: [integer, 'null']
          format: int64
          description: '> 0 informational for the checker'
        eddChecklist:
          anyOf:
          - {$ref: '#/components/schemas/EddChecklist'}
          - {type: 'null'}
      required: [decision, rationale, recommendedActions]
      additionalProperties: true
    CaseActionRequest:
      type: object
      properties:
        actionType:
          type: string
          enum: [FREEZE, DEBIT_BLOCK, LIEN, LIFT, SET_WATCH, CLEAR_WATCH, PROPOSE_BLACKLIST, STR_DRAFT, REGRADE, RECOMMEND_REVERSAL, SUSPEND_PARTNER]
        walletId:
          type: [string, 'null']
          format: uuid
          description: FREEZE, DEBIT_BLOCK, LIEN, SET_WATCH, CLEAR_WATCH; default = case primary wallet
        partnerId:
          type: [string, 'null']
          format: uuid
          description: SUSPEND_PARTNER
        amountPoisha:
          type: [integer, 'null']
          format: int64
          description: '> 0 LIEN (requested amount)'
        freezeId:
          type: [string, 'null']
          format: uuid
          description: LIFT
        txnRefs:
          type: [array, 'null']
          items: {type: string}
          description: 1..50 RECOMMEND_REVERSAL
        blacklistType:
          type: [string, 'null']
          enum: [NID, MSISDN, WALLET, DEVICE, null]
          description: PROPOSE_BLACKLIST
        deviceId:
          type: [string, 'null']
          description: <= 128 PROPOSE_BLACKLIST with DEVICE
        blacklistReasonCode:
          type: [string, 'null']
          enum: [FRAUD_CONFIRMED, AML_SUSPICION, SANCTIONS, null]
          description: PROPOSE_BLACKLIST
        blacklistExpiresAt:
          type: [string, 'null']
          format: date-time
          description: future PROPOSE_BLACKLIST; null = no expiry
        recommendedGrade:
          type: [string, 'null']
          enum: [LOW, MEDIUM, HIGH, null]
          description: REGRADE
        partnerReasonCode:
          type: [string, 'null']
          enum: [AML_FREEZE, FRAUD_FREEZE, RISK_PERFORMANCE, null]
          description: SUSPEND_PARTNER
        comment: {type: string, minLength: 1, maxLength: 500, description: 1..500 internal}
      required: [actionType, comment]
      additionalProperties: true
    RecoveryRequest:
      type: object
      properties:
        amountPoisha: {type: integer, format: int64, minimum: 1, description: '> 0'}
        note: {type: string, minLength: 1, maxLength: 500, description: 1..500}
      required: [amountPoisha, note]
      additionalProperties: true
    CaseRecovery:
      type: object
      properties:
        caseId: {type: string, format: uuid}
        confirmedFraudPoisha: {type: integer, format: int64}
        recoveredPoisha: {type: integer, format: int64, description: cumulative}
      required: [caseId, confirmedFraudPoisha, recoveredPoisha]
      additionalProperties: true
    CloseRequest:
      type: object
      properties:
        resolution: {type: string, minLength: 1, maxLength: 2000, description: 1..2000 internal}
        noStrJustification:
          type: [string, 'null']
          description: 1..1000 SUSPICIOUS cases without STR; CAMLCO only
      required: [resolution]
      additionalProperties: true
    ReopenRequest:
      type: object
      properties:
        reason: {type: string, minLength: 1, maxLength: 500, description: 1..500}
      required: [reason]
      additionalProperties: true
    InstructionTarget:
      type: object
      properties:
        walletId: {type: string, format: uuid}
        amountPoisha:
          type: [integer, 'null']
          format: int64
          description: '> 0 required for LIEN'
        freezeId:
          type: [string, 'null']
          format: uuid
          description: 'required for LIFT: the freeze to lift'
      required: [walletId]
      additionalProperties: true
    RegulatoryInstructionRequest:
      type: object
      description: JSON part `instruction` of the multipart request.
      properties:
        referenceNo: {type: string, minLength: 1, maxLength: 64, description: '1..64, unique authority reference; becomes the freeze `reference`'}
        authority:
          type: string
          enum: [BFIU, COURT, BB, ACC, POLICE]
        receivedDate: {type: string, format: date}
        instructionType:
          type: string
          enum: [FULL_BLOCK, DEBIT_BLOCK, LIEN, LIFT]
        targets:
          type: array
          items: {$ref: '#/components/schemas/InstructionTarget'}
          minItems: 1
          maxItems: 100
          description: 1..100
        comment: {type: string, minLength: 1, maxLength: 500, description: 1..500 internal}
      required: [referenceNo, authority, receivedDate, instructionType, targets, comment]
      additionalProperties: true
    InstructionTargetStatus:
      type: object
      properties:
        walletId: {type: string, format: uuid}
        amountPoisha:
          type: [integer, 'null']
          format: int64
        freezeId:
          type: [string, 'null']
          format: uuid
          description: freeze created (or lifted) for this target
        freezeStatus:
          type: [string, 'null']
          enum: [REQUESTED, APPLIED, FAILED, LIFT_REQUESTED, LIFTED, null]
      required: [walletId, amountPoisha, freezeId, freezeStatus]
      additionalProperties: true
    RegulatoryInstruction:
      type: object
      properties:
        instructionId: {type: string, format: uuid}
        referenceNo: {type: string, description: <= 64}
        authority:
          type: string
          enum: [BFIU, COURT, BB, ACC, POLICE]
        receivedDate: {type: string, format: date}
        instructionType:
          type: string
          enum: [FULL_BLOCK, DEBIT_BLOCK, LIEN, LIFT]
        status:
          type: string
          enum: [PENDING_APPROVAL, EXECUTING, EXECUTED, PARTIALLY_EXECUTED, REJECTED]
        caseId:
          type: [string, 'null']
          format: uuid
          description: REGULATORY_INSTRUCTION case, created on approval
        documentEvidenceId: {type: string, format: uuid, description: the uploaded instruction document}
        approvalId:
          type: [string, 'null']
          format: uuid
        targets:
          type: array
          items: {$ref: '#/components/schemas/InstructionTargetStatus'}
        createdBy: {type: string, format: uuid}
        approvedBy:
          type: [string, 'null']
          format: uuid
        createdAt: {type: string, format: date-time}
        updatedAt: {type: string, format: date-time}
      required: [instructionId, referenceNo, authority, receivedDate, instructionType, status, caseId, documentEvidenceId, approvalId, targets, createdBy, approvedBy,
        createdAt, updatedAt]
      additionalProperties: true
    FreezeLiftRequest:
      type: object
      properties:
        liftReference:
          type: [string, 'null']
          description: <= 64 authority reference of the lift order, if any (audit only)
        comment: {type: string, minLength: 1, maxLength: 500, description: 1..500 internal}
      required: [comment]
      additionalProperties: true
    FreezeRetryRequest:
      type: object
      properties:
        comment: {type: string, minLength: 1, maxLength: 500, description: 1..500}
      required: [comment]
      additionalProperties: true
    CtrRecord:
      type: object
      properties:
        businessDate: {type: string, format: date, description: per CUTOFF.EOD}
        walletId: {type: string, format: uuid}
        subjectId:
          type: [string, 'null']
          format: uuid
        cashInPoisha: {type: integer, format: int64, description: '>= 0'}
        cashOutPoisha: {type: integer, format: int64, description: '>= 0'}
        txnCount: {type: integer, format: int32}
        status:
          type: string
          enum: [EXTRACTED, INCLUDED, EXPORTED]
        reportId:
          type: [string, 'null']
          format: uuid
      required: [businessDate, walletId, subjectId, cashInPoisha, cashOutPoisha, txnCount, status, reportId]
      additionalProperties: true
    CtrReportRequest:
      type: object
      properties:
        period: {type: string, pattern: '^[0-9]{4}-(0[1-9]|1[0-2])$', description: '`YYYY-MM`, a past month'}
      required: [period]
      additionalProperties: true
    CtrReport:
      type: object
      properties:
        reportId: {type: string, format: uuid}
        period: {type: string, description: '`YYYY-MM`'}
        status:
          type: string
          enum: [DRAFT, PENDING_APPROVAL, APPROVED, EXPORTED, SUBMITTED, REJECTED]
        recordCount: {type: integer, format: int32}
        totalPoisha: {type: integer, format: int64, description: sum of cash-in + cash-out of the records}
        approvalId:
          type: [string, 'null']
          format: uuid
        fileSha256:
          type: [string, 'null']
          description: set on first export
        goamlReference:
          type: [string, 'null']
          description: <= 64
        submittedAt:
          type: [string, 'null']
          format: date-time
        createdBy: {type: string, format: uuid}
        approvedBy:
          type: [string, 'null']
          format: uuid
        createdAt: {type: string, format: date-time}
        updatedAt: {type: string, format: date-time}
      required: [reportId, period, status, recordCount, totalPoisha, approvalId, fileSha256, goamlReference, submittedAt, createdBy, approvedBy, createdAt, updatedAt]
      additionalProperties: true
    MarkSubmittedRequest:
      type: object
      properties:
        goamlReference: {type: string, minLength: 1, maxLength: 64, description: 1..64 reference returned by the goAML portal}
        submittedAt: {type: string, format: date-time, description: not in the future}
      required: [goamlReference, submittedAt]
      additionalProperties: true
    StrCreateRequest:
      type: object
      properties:
        caseId: {type: string, format: uuid, description: AML or FRAUD case}
        reportCode:
          type: string
          enum: [STR, SAR]
      required: [caseId, reportCode]
      additionalProperties: true
    StrParty:
      type: object
      properties:
        role:
          type: string
          enum: [SUBJECT, COUNTERPARTY]
        customerId:
          type: [string, 'null']
          format: uuid
        walletId:
          type: [string, 'null']
          format: uuid
        firstName:
          type: [string, 'null']
        lastName:
          type: [string, 'null']
        gender:
          type: [string, 'null']
          enum: [MALE, FEMALE, THIRD_GENDER, null]
        birthdate:
          type: [string, 'null']
          format: date
        idNumber:
          type: [string, 'null']
          description: write-only typed by the officer; stored encrypted; never returned
        idNumberMasked:
          type: [string, 'null']
          description: '`******` + last 4 read-only'
        msisdn:
          type: [string, 'null']
          description: 13 digits goAML account / phone number
        occupation:
          type: [string, 'null']
        address:
          type: [object, 'null']
          additionalProperties: true
          description: '{line1, city, district, countryCode}'
      required: [role, customerId, walletId, firstName, lastName, gender, birthdate, idNumberMasked, msisdn, occupation, address]
      additionalProperties: true
    StrFields:
      type: object
      properties:
        reason: {type: string, description: <= 4000 goAML `<reason>`}
        action: {type: string, description: <= 4000 goAML `<action>`}
        indicators:
          type: array
          items: {type: string}
          description: scenario codes / rule ids mapped via goaml_code_map
        txnRefs:
          type: array
          items: {type: string}
          description: <= 500 STR transactions
        parties:
          type: array
          items: {$ref: '#/components/schemas/StrParty'}
          description: '>= 1'
      required: [reason, action, indicators, txnRefs, parties]
      additionalProperties: true
    ValidationIssue:
      type: object
      properties:
        path: {type: string, description: JSON path in fields or XML element path}
        message: {type: string}
      required: [path, message]
      additionalProperties: true
    ValidationReport:
      type: object
      properties:
        valid: {type: boolean}
        mode:
          type: string
          enum: [XSD, STRUCTURAL]
        errors:
          type: array
          items: {$ref: '#/components/schemas/ValidationIssue'}
          description: block submit
        warnings:
          type: array
          items: {$ref: '#/components/schemas/ValidationIssue'}
        validatedAt: {type: string, format: date-time}
      required: [valid, mode, errors, warnings, validatedAt]
      additionalProperties: true
    StrReport:
      type: object
      properties:
        strId: {type: string, format: uuid}
        strNo: {type: string, description: '`STR-YYYY-NNNNNN` = goAML entity_reference'}
        caseId: {type: string, format: uuid}
        reportCode:
          type: string
          enum: [STR, SAR]
        status:
          type: string
          enum: [DRAFT, PENDING_APPROVAL, APPROVED, EXPORTED, SUBMITTED, REJECTED]
        fields: {$ref: '#/components/schemas/StrFields'}
        validationReport:
          anyOf:
          - {$ref: '#/components/schemas/ValidationReport'}
          - {type: 'null'}
        xmlSha256:
          type: [string, 'null']
        approvalId:
          type: [string, 'null']
          format: uuid
        goamlReference:
          type: [string, 'null']
        submittedAt:
          type: [string, 'null']
          format: date-time
        createdBy: {type: string, format: uuid}
        approvedBy:
          type: [string, 'null']
          format: uuid
        createdAt: {type: string, format: date-time}
        updatedAt: {type: string, format: date-time}
        version: {type: integer, format: int64, description: = ETag; send as If-Match on PUT}
      required: [strId, strNo, caseId, reportCode, status, fields, validationReport, xmlSha256, approvalId, goamlReference, submittedAt, createdBy, approvedBy, createdAt,
        updatedAt, version]
      additionalProperties: true
    StrSummary:
      type: object
      properties:
        strId: {type: string, format: uuid}
        strNo: {type: string}
        caseId: {type: string, format: uuid}
        reportCode:
          type: string
          enum: [STR, SAR]
        status:
          type: string
          enum: [DRAFT, PENDING_APPROVAL, APPROVED, EXPORTED, SUBMITTED, REJECTED]
        createdAt: {type: string, format: date-time}
        updatedAt: {type: string, format: date-time}
      required: [strId, strNo, caseId, reportCode, status, createdAt, updatedAt]
      additionalProperties: true
    StrUpdateRequest:
      type: object
      properties:
        fields: {$ref: '#/components/schemas/StrFields'}
      required: [fields]
      additionalProperties: true
    CountRow:
      type: object
      properties:
        key: {type: string}
        count: {type: integer, format: int64}
      required: [key, count]
      additionalProperties: true
    AmlSummary:
      type: object
      properties:
        from: {type: string, format: date}
        to: {type: string, format: date, description: inclusive}
        alertsByScenario:
          type: array
          items: {$ref: '#/components/schemas/CountRow'}
        alertsByStatus:
          type: array
          items: {$ref: '#/components/schemas/CountRow'}
        casesByType:
          type: array
          items: {$ref: '#/components/schemas/CountRow'}
        casesByStatus:
          type: array
          items: {$ref: '#/components/schemas/CountRow'}
        strByStatus:
          type: array
          items: {$ref: '#/components/schemas/CountRow'}
        ctrRecords: {type: integer, format: int64}
        screeningHitsByList:
          type: array
          items: {$ref: '#/components/schemas/CountRow'}
        eddCasesOpen: {type: integer, format: int64}
        slaBreaches: {type: integer, format: int64}
      required: [from, to, alertsByScenario, alertsByStatus, casesByType, casesByStatus, strByStatus, ctrRecords, screeningHitsByList, eddCasesOpen, slaBreaches]
      additionalProperties: true
    AgeingRow:
      type: object
      properties:
        priority:
          type: string
          enum: [LOW, MEDIUM, HIGH, CRITICAL]
        bucket:
          type: string
          enum: [D0_1, D1_3, D3_7, D7_30, D30_PLUS]
          description: age in days since openedAt
        count: {type: integer, format: int64}
      required: [priority, bucket, count]
      additionalProperties: true
    CaseAgeing:
      type: object
      properties:
        asOf: {type: string, format: date-time}
        rows:
          type: array
          items: {$ref: '#/components/schemas/AgeingRow'}
          description: open cases only
      required: [asOf, rows]
      additionalProperties: true
    FraudRow:
      type: object
      properties:
        key: {type: string, description: rule id / channel / GEO district code / partnerId / date}
        alerts: {type: integer, format: int64}
        decidedAlerts: {type: integer, format: int64}
        falsePositives: {type: integer, format: int64}
        falsePositiveRateBps: {type: integer, format: int32, description: floor(fp x 10000 / decided) 0 when decided = 0}
        confirmedFraudCount: {type: integer, format: int64}
        confirmedFraudPoisha: {type: integer, format: int64}
        recoveredPoisha: {type: integer, format: int64}
      required: [key, alerts, decidedAlerts, falsePositives, falsePositiveRateBps, confirmedFraudCount, confirmedFraudPoisha, recoveredPoisha]
      additionalProperties: true
    FraudTotals:
      type: object
      properties:
        txnValuePoisha: {type: integer, format: int64, description: sum of monitored COMPLETED amounts in the period}
        confirmedFraudPoisha: {type: integer, format: int64}
        lossRatioBps: {type: integer, format: int32, description: floor((confirmed - recovered) x 10000 / txnValue)}
        recoveryRateBps: {type: integer, format: int32, description: floor(recovered x 10000 / confirmed)}
      required: [txnValuePoisha, confirmedFraudPoisha, lossRatioBps, recoveryRateBps]
      additionalProperties: true
    FraudSummary:
      type: object
      properties:
        from: {type: string, format: date}
        to: {type: string, format: date}
        groupBy:
          type: string
          enum: [rule, channel, district, partner, day]
        rows:
          type: array
          items: {$ref: '#/components/schemas/FraudRow'}
        totals: {$ref: '#/components/schemas/FraudTotals'}
      required: [from, to, groupBy, rows, totals]
      additionalProperties: true
    FraudReportRequest:
      type: object
      properties:
        txnRef:
          type: [string, 'null']
          pattern: ^[A-Z0-9-]{1,32}$
          description: 1..32 `[A-Z0-9-]` opaque
        reportedMsisdn:
          type: [string, 'null']
          description: '`01…`, `880…`, `+880…` hashed + masked on receipt'
        category:
          type: string
          enum: [SCAM, UNAUTHORISED, SIM_SWAP, PHISHING, OTHER]
        description:
          type: [string, 'null']
          maxLength: 1000
          description: <= 1000
      required: [category]
      additionalProperties: true
    FraudReportCreated:
      type: object
      properties:
        reportId: {type: string, format: uuid}
        reportNo: {type: string, description: '`FR-YYYY-NNNNNN`'}
        status:
          type: string
          enum: [RECEIVED]
      required: [reportId, reportNo, status]
      additionalProperties: true
    FraudReportStatus:
      type: object
      properties:
        reportId: {type: string, format: uuid}
        reportNo: {type: string}
        status:
          type: string
          enum: [RECEIVED, UNDER_REVIEW, CLOSED]
          description: no investigation detail (tipping-off)
        createdAt: {type: string, format: date-time}
        updatedAt: {type: string, format: date-time}
      required: [reportId, reportNo, status, createdAt, updatedAt]
      additionalProperties: true
    ReviewRunResult:
      type: object
      properties:
        runAt: {type: string, format: date-time}
        dueSubjects: {type: integer, format: int32}
        casesOpened: {type: integer, format: int32, description: <= review.daily-cap}
      required: [runAt, dueSubjects, casesOpened]
      additionalProperties: true
    ReviewSchedule:
      type: object
      properties:
        subjectId: {type: string, format: uuid, description: customerId}
        riskGrade:
          type: string
          enum: [LOW, MEDIUM, HIGH]
        nextReviewAt: {type: string, format: date}
        lastReviewCaseId:
          type: [string, 'null']
          format: uuid
      required: [subjectId, riskGrade, nextReviewAt, lastReviewCaseId]
      additionalProperties: true
    ExportRequest:
      type: object
      properties:
        dataset:
          type: string
          enum: [TRANSACTIONS, CUSTOMERS, ALERTS]
        fromTs: {type: string, format: date-time}
        toTs: {type: string, format: date-time, description: '> fromTs, <= 31 days later'}
        format:
          type: string
          enum: [CSV, JSONL]
      required: [dataset, fromTs, toTs, format]
      additionalProperties: true
    ExportJob:
      type: object
      properties:
        jobId: {type: string, format: uuid}
        dataset:
          type: string
          enum: [TRANSACTIONS, CUSTOMERS, ALERTS]
        fromTs: {type: string, format: date-time}
        toTs: {type: string, format: date-time}
        format:
          type: string
          enum: [CSV, JSONL]
        status:
          type: string
          enum: [QUEUED, RUNNING, COMPLETED, FAILED]
        createdAt: {type: string, format: date-time}
      required: [jobId, dataset, fromTs, toTs, format, status, createdAt]
      additionalProperties: true
    ImportLineError:
      type: object
      properties:
        line: {type: integer, format: int32}
        message: {type: string}
      required: [line, message]
      additionalProperties: true
    ImportResult:
      type: object
      properties:
        imported: {type: integer, format: int32, description: alerts created (source EXTERNAL)}
        rejected: {type: integer, format: int32}
        errors:
          type: array
          items: {$ref: '#/components/schemas/ImportLineError'}
          description: <= 1000
      required: [imported, rejected, errors]
      additionalProperties: true
    Problem:
      type: object
      description: RFC 9457 problem (kernel K3.6). Extension members are declared per operation.
      properties:
        type: {type: string, default: 'about:blank'}
        title: {type: string, maxLength: 200}
        status: {type: integer, format: int32}
        code:
          type: string
          enum: [VALIDATION_FAILED, ACTOR_NOT_ALLOWED, NOT_FOUND, IDEMPOTENCY_CONFLICT, STATE_CONFLICT, SOD_VIOLATION, INSUFFICIENT_FUNDS, LIMIT_EXCEEDED, RISK_BLOCKED,
            RISK_STEP_UP_REQUIRED, RISK_HELD_FOR_REVIEW, WALLET_NOT_TRANSACTABLE, MAX_BALANCE_EXCEEDED, REFUND_EXCEEDS_ORIGINAL, SERVICE_DISABLED, MAKER_CHECKER_VIOLATION,
            DEPENDENCY_UNAVAILABLE]
        detail:
          type: [string, 'null']
          maxLength: 1000
        instance:
          type: [string, 'null']
        correlationId: {type: string}
        reason:
          type: [string, 'null']
          pattern: ^[A-Z][A-Z0-9_]*$
        errors:
          type: array
          items:
            type: object
            properties:
              field: {type: string}
              message: {type: string}
            required: [field, message]
        retryable: {type: boolean}
      required: [type, title, status, code, correlationId]
      additionalProperties: true
    AlertPage:
      type: object
      description: Cursor page of Alert (kernel K3.4)
      properties:
