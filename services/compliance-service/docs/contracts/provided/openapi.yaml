      required: [disposition, comment]
      additionalProperties: true
    ScreeningDecisionRequest:
      type: object
      properties:
        decision:
          type: string
          enum: [CLEAR, REJECT]
        comment: {type: string, minLength: 1, maxLength: 500, description: 1..500}
      required: [decision, comment]
      additionalProperties: true
    NameSample:
      type: object
      properties:
