      - {name: id, in: path, required: true, description: approvalId, schema: {type: string, format: uuid}, example: 0192f7a1-0000-7000-8000-000000000001}
    post:
      operationId: approveApproval
      tags: [approvals]
      summary: Approve the current level; the final level executes the refund synchronously
      description: |
        Checker != maker (and != any earlier-level checker; X-Actor-User-Id compared when both present).
        Final approval executes the refund with Idempotency-Key apr-{approvalId}, initiator = the maker's identity.
        The response carries the refund's PaymentResult when executed; a refused execution returns 200 with requestStatus
        EXECUTION_FAILED and `transaction` (FAILED) when persisted. An unknown execution outcome (dependency unavailable) returns 200
        with requestStatus APPROVED and `transaction` null or INITIATED; the approval-execution job completes it with the same key.
        503 only when the decision itself could not be recorded.
      x-audience: staff
      x-actors:
        - {type: STAFF, roles: [OPS_CHECKER, SUP_CHECKER]}
        - {type: MERCHANT, rule: "only when bitspay.txn.refund.merchantSelfApproval = true: X-Actor-Id = owning partner and X-Actor-User-Id present and != maker's"}
      x-idempotency: "natural (state machine); repeated approve on a decided level -> 409 STATE_CONFLICT"
      requestBody:
        required: false
        content:
          application/json:
            schema: {$ref: '#/components/schemas/ApproveRequest'}
            examples:
              approve:
                value: {comment: "Order cancelled, verified with merchant"}
      responses:
        '200':
          description: Decision result
          content:
            application/json:
              schema: {$ref: '#/components/schemas/ApprovalDecisionResult'}
              examples:
                executed:
                  value: {approvalId: 0192f7a1-0000-7000-8000-000000000001, status: APPROVED, requestStatus: EXECUTED, resultTxnRef: MR26101300C4D8N2QX, transaction: {txnRef: MR26101300C4D8N2QX, txnId: 0192f7b0-0000-7000-8000-000000000001, txnType: MERCHANT_REFUND, status: COMPLETED, failureCode: null, amountPoisha: 80000, feePoisha: 0, vatPoisha: 0, totalDebitPoisha: 80000, feeBearer: PAYER, currency: BDT, fromWalletId: 0192f2dd-0004-7000-8000-00000000d004, toWalletId: 0192f2aa-0001-7000-8000-00000000a001, createdAt: '2026-10-13T04:00:00.010Z', completedAt: '2026-10-13T04:00:00.090Z'}}
        '403': {$ref: '#/components/responses/Forbidden'}
        '404': {$ref: '#/components/responses/NotFound'}
        '409': {$ref: '#/components/responses/Conflict'}
        '422':
          description: "MAKER_CHECKER_VIOLATION (checker = maker, or same checker on two levels)."
