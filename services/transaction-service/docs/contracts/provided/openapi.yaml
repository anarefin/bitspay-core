  /v1/internal/reversals:
    parameters: *commonHeaders
    post:
      operationId: executeReversal
      tags: [reversals]
      summary: Execute a support-approved reversal (full or partial principal)
      description: |
        X-Actor-Type SERVICE with X-Actor-Id in reversal.allowedServices; others -> 403. No wallet-status gate, no risk,
        no pricing, no max-balance constraint. Caller key per attempt: `rev-{reversalRequestId}-{attempt}`; the same key is
        re-sent only after 503/timeout/5xx/connection failure. Partial (amountPoisha < original principal) requires
        reverseFee = reverseCommission = false, else 400. The original ends REVERSED in both cases. p99 400 ms.
      x-audience: service
      x-actors:
        - {type: SERVICE, ids: [support-service]}
      x-idempotency: "Idempotency-Key required (rev-{reversalRequestId}-{attempt}); scope (X-Actor-Id, key)"
      parameters:
        - $ref: '#/components/parameters/IdempotencyKey'
      requestBody:
        required: true
        content:
          application/json:
            schema: {$ref: '#/components/schemas/ReversalRequest'}
            examples:
              full:
                value: {originalTxnRef: PP26100900K3M9QX2A, reasonCode: WRONG_TRANSFER, reverseFee: true, reverseCommission: true, releaseHoldCommandId: 8d3c1f0e-2b4a-5c6d-9e8f-0a1b2c3d4e5f, approvalId: 0192f8bb-0000-7000-8000-000000000001, amountPoisha: null}
              partial:
                value: {originalTxnRef: PP26100900K3M9QX2A, reasonCode: DISPUTE_UPHELD, reverseFee: false, reverseCommission: false, approvalId: 0192f8bb-0000-7000-8000-000000000002, amountPoisha: 20000}
      responses:
        '200':
          description: "PaymentResult of the REVERSAL (RV...): from = original.to, to = original.from, totalDebitPoisha = amountPoisha, feeBearer = original's."
          content:
            application/json:
              schema: {$ref: '#/components/schemas/PaymentResult'}
              examples:
                completed:
                  value: {txnRef: RV26100900Q2D5M8XT, txnId: 0192f4a0-0000-7000-8000-000000000001, txnType: REVERSAL, status: COMPLETED, failureCode: null, amountPoisha: 50000, feePoisha: 500, vatPoisha: 75, totalDebitPoisha: 50000, feeBearer: PAYER, currency: BDT, fromWalletId: 0192f2bb-0002-7000-8000-00000000b002, toWalletId: 0192f2aa-0001-7000-8000-00000000a001, createdAt: '2026-10-09T09:30:00.000Z', completedAt: '2026-10-09T09:30:00.040Z'}
        '400': {$ref: '#/components/responses/BadRequest'}
        '403': {$ref: '#/components/responses/Forbidden'}
        '404': {$ref: '#/components/responses/NotFound'}
        '409':
          description: |
            IDEMPOTENCY_CONFLICT (no transaction); STATE_CONFLICT original not reversible (not persisted, no transaction);
            STATE_CONFLICT from ledger REJECTED ORIGINAL_NOT_FOUND / ALREADY_REVERSED / HOLD_NOT_FOUND / INVALID_AMOUNT / OTHER
            or ledger HTTP 400/403 (persisted FAILED, carries `transaction` with failureCode LEDGER_*).
          x-codes: [IDEMPOTENCY_CONFLICT, STATE_CONFLICT]
          content:
            application/problem+json:
              schema: {$ref: '#/components/schemas/ProblemPayment'}
        '422':
          description: "INSUFFICIENT_FUNDS or WALLET_NOT_TRANSACTABLE (ledger ACCOUNT_CLOSED/ACCOUNT_NOT_FOUND) with `transaction`; SERVICE_DISABLED (FEATURE.REVERSAL off, before any side effect, no transaction)."
          x-codes: [INSUFFICIENT_FUNDS, WALLET_NOT_TRANSACTABLE, SERVICE_DISABLED]
          content:
            application/problem+json:
              schema: {$ref: '#/components/schemas/ProblemPayment'}
        '503': {$ref: '#/components/responses/PaymentUnavailable'}

