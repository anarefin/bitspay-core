openapi: 3.1.0
info:
  title: transaction-service (SVC-02)
  version: 1.1.0
  description: |
    Payment orchestrator of Bits Pay. Every operation served by transaction-service, including staff,
    internal and local-test operations. Kernel 1.0 rules apply (headers K3.1, idempotency K3.3,
    pagination K3.4, money K3.5, problem+json K3.6, product switches K3.7).

    - Money is int64 poisha. IDs are canonical lower-case UUIDs. Timestamps are ISO-8601 UTC with milliseconds and `Z`.
    - Every response for a request whose payment intent was **persisted** carries the transaction:
      top-level on 200, as the problem member `transaction` otherwise. Refusals decided before persistence carry none.
    - `x-audience` = primary audience; `x-actors` = allowed `X-Actor-Type` values with roles / `X-Actor-Id` values and binding rules.
    - Problem extension members owned by this service: `transaction`, `limitCode`, `limitParty`, `remainingPoisha`,
      `remainingCount`, `resetsAt`, `walletId`, `walletStatus` (see `codes.yaml → problemExtensions`).
    - Problem `reason` values owned by this service are listed in `codes.yaml → problemReasons` (CR-TRANSACTION-1 adds the
      biller reasons of bill payment, recharge and bill enquiry).
    - MVP (CR-TRANSACTION-1, contractVersion 1.1.0): BILL_PAY and RECHARGE against the internal biller catalogue, fulfilled by
      the in-process simulated biller provider (no outbound biller or telco call, SRS A-41).
  x-service: transaction-service
  x-contract-version: 1.1.0
  x-kernel: "1.0"
servers:
  - url: http://localhost:8102
    description: local / Compose (management port 9102)
tags:
  - {name: payments, description: Money-moving payment APIs}
  - {name: quote, description: Read-only fee quote}
  - {name: bills, description: Bill enquiry against the internal biller catalogue (simulated provider)}
  - {name: reversals, description: Internal reversal executor}
  - {name: transactions, description: Transaction queries}
  - {name: merchant-refund-requests, description: Merchant refund maker-checker requests}
  - {name: approvals, description: Local maker-checker engine (kernel K5)}
  - {name: beneficiaries, description: Saved beneficiaries (PAY-009)}
  - {name: admin, description: Staff operations (internal)}
  - {name: dev, description: Local/test profile only}

paths:
  /v1/payments/quote:
    parameters: &commonHeaders
      - $ref: '#/components/parameters/XCorrelationId'
      - $ref: '#/components/parameters/XActorType'
      - $ref: '#/components/parameters/XActorId'
      - $ref: '#/components/parameters/XActorWalletId'
      - $ref: '#/components/parameters/XActorRoles'
      - $ref: '#/components/parameters/XActorUserId'
      - $ref: '#/components/parameters/XChannel'
      - $ref: '#/components/parameters/XDeviceId'
    post:
      operationId: quotePayment
      tags: [quote]
      summary: Wallet-based fee quote (no money moves, no persistence, no Idempotency-Key)
      description: |
        Reads both wallets' status (types and direction validated as for the payment), reads the sender's
        monthly count from limits-risk usage (300 ms, no retry) and evaluates the pricing algorithm.
        If the count cannot be read, evaluates without the free allowance and returns `feeIsUpperBound: true` (OPEN D-17).
        No risk evaluation, no reservation. p99 30 ms (+ <= 300 ms usage call).
        BILL_PAY / RECHARGE (CR-TRANSACTION-1): send `billerId` instead of `toWalletId`; the biller's settlement wallet is
        the catalogue's `walletId` (biller-catalogue-cache) and is echoed as `toWalletId`. The biller's amount rules apply
        (400 BILL_AMOUNT_OUT_OF_RANGE); no bill enquiry and no provider call is made by a quote.
      x-audience: customer
      x-actors:
        - {type: CUSTOMER, rule: "txnType P2P, CASH_OUT, MERCHANT_PAYMENT, BILL_PAY, RECHARGE; X-Actor-Wallet-Id = fromWalletId"}
        - {type: AGENT, rule: "txnType CASH_IN, FLOAT_TRANSFER; X-Actor-Wallet-Id = fromWalletId"}
        - {type: DISTRIBUTOR, rule: "txnType FLOAT_TRANSFER; X-Actor-Wallet-Id = fromWalletId"}
        - {type: STAFF, roles: [OPS_CHECKER, FIN_CHECKER], rule: "txnType FLOAT_TRANSFER"}
      x-idempotency: none (read-only)
      requestBody:
        required: true
        content:
          application/json:
            schema: {$ref: '#/components/schemas/QuoteRequest'}
            examples:
              cashOut:
                value: {txnType: CASH_OUT, fromWalletId: 0192f2bb-0002-7000-8000-00000000b002, toWalletId: 0192f2cc-0003-7000-8000-00000000c003, amountPoisha: 50000}
              billPay:
                value: {txnType: BILL_PAY, fromWalletId: 0192f2aa-0001-7000-8000-00000000a001, billerId: 0192f9b0-0000-7000-8000-0000000000e1, amountPoisha: 125000}
      responses:
        '200':
          description: Quote
          content:
            application/json:
              schema: {$ref: '#/components/schemas/QuoteResult'}
              examples:
                cashOut:
                  value: {txnType: CASH_OUT, fromWalletId: 0192f2bb-0002-7000-8000-00000000b002, toWalletId: 0192f2cc-0003-7000-8000-00000000c003, amountPoisha: 50000, feePoisha: 750, vatPoisha: 112, feeBearer: PAYER, totalDebitPoisha: 50862, creditToPayeePoisha: 50000, commissionPoisha: 300, aitPoisha: 30, pricingPlanId: PLN-CASHOUT-STD, pricingPlanVersion: 2, feeIsUpperBound: false, currency: BDT, quotedAt: '2026-10-09T08:03:20.002Z'}
                billPay:
                  value: {txnType: BILL_PAY, fromWalletId: 0192f2aa-0001-7000-8000-00000000a001, toWalletId: 0192f9b1-0000-7000-8000-0000000000e1, billerId: 0192f9b0-0000-7000-8000-0000000000e1, amountPoisha: 125000, feePoisha: 500, vatPoisha: 75, feeBearer: PAYER, totalDebitPoisha: 125575, creditToPayeePoisha: 125000, commissionPoisha: 0, aitPoisha: 0, pricingPlanId: PLN-BILL-STD, pricingPlanVersion: 1, feeIsUpperBound: false, currency: BDT, quotedAt: '2026-10-14T09:00:00.002Z'}
        '400': {$ref: '#/components/responses/BillBadRequest'}
        '403': {$ref: '#/components/responses/Forbidden'}
        '404': {$ref: '#/components/responses/BillNotFound'}
        '409':
          description: "STATE_CONFLICT reason BILLER_INACTIVE (BILL_PAY / RECHARGE quotes only). Never carries `transaction`."
          x-codes: [STATE_CONFLICT]
          x-reasons: [BILLER_INACTIVE]
          content:
            application/problem+json:
              schema: {$ref: '#/components/schemas/ProblemBase'}
        '422':
          description: "WALLET_NOT_TRANSACTABLE (ext walletId, walletStatus) or SERVICE_DISABLED. Never carries `transaction`."
          x-codes: [WALLET_NOT_TRANSACTABLE, SERVICE_DISABLED]
          content:
            application/problem+json:
              schema: {$ref: '#/components/schemas/ProblemWallet'}
        '503': {$ref: '#/components/responses/UnavailableNoTxn'}

  /v1/payments/p2p:
    parameters: *commonHeaders
    post:
      operationId: payP2p
      tags: [payments]
      summary: P2P transfer (customer to customer)
      description: |
        Synchronous final status. Delegated P2P: disbursement-service may call with the payer's CUSTOMER headers
        and `X-Channel: SYSTEM`; treated as a normal P2P (OPEN D-33). p99 300 ms.
      x-audience: customer
      x-actors:
        - {type: CUSTOMER, rule: "X-Actor-Wallet-Id = fromWalletId (also delegated calls by disbursement-service with the payer's CUSTOMER headers)"}
      x-idempotency: "Idempotency-Key required; scope (X-Actor-Id, key); retained >= 7 days (OPEN D-01)"
      parameters:
        - $ref: '#/components/parameters/IdempotencyKey'
      requestBody:
        required: true
        content:
          application/json:
            schema: {$ref: '#/components/schemas/P2pRequest'}
            examples:
              rahimToKarim:
                value: {fromWalletId: 0192f2aa-0001-7000-8000-00000000a001, toWalletId: 0192f2bb-0002-7000-8000-00000000b002, amountPoisha: 50000, purposeCode: FAMILY_SUPPORT, note: for Eid shopping}
      responses:
        '200': {$ref: '#/components/responses/PaymentOk'}
        '400': {$ref: '#/components/responses/BadRequest'}
        '403': {$ref: '#/components/responses/Forbidden'}
        '404': {$ref: '#/components/responses/NotFound'}
        '409': {$ref: '#/components/responses/PaymentConflict'}
        '422': {$ref: '#/components/responses/PaymentUnprocessable'}
        '503': {$ref: '#/components/responses/PaymentUnavailable'}

  /v1/payments/cash-in:
    parameters: *commonHeaders
    post:
      operationId: payCashIn
      tags: [payments]
      summary: Cash-in at an agent (agent to customer)
      x-audience: partner
      x-actors:
        - {type: AGENT, rule: "X-Actor-Wallet-Id = agentWalletId"}
      x-idempotency: "Idempotency-Key required; scope (X-Actor-Id, key)"
      parameters:
        - $ref: '#/components/parameters/IdempotencyKey'
      requestBody:
        required: true
        content:
          application/json:
            schema: {$ref: '#/components/schemas/CashInRequest'}
            examples:
              salmaToRahim:
                value: {agentWalletId: 0192f2cc-0003-7000-8000-00000000c003, customerWalletId: 0192f2aa-0001-7000-8000-00000000a001, amountPoisha: 100000}
      responses:
        '200':
          description: COMPLETED
          content:
            application/json:
              schema: {$ref: '#/components/schemas/PaymentResult'}
              examples:
                completed:
                  value: {txnRef: CI26100900B7N2K8QD, txnId: 0192f3c5-1a00-7c00-9a51-3f2c8e1d0a21, txnType: CASH_IN, status: COMPLETED, failureCode: null, amountPoisha: 100000, feePoisha: 0, vatPoisha: 0, totalDebitPoisha: 100000, feeBearer: PAYER, currency: BDT, fromWalletId: 0192f2cc-0003-7000-8000-00000000c003, toWalletId: 0192f2aa-0001-7000-8000-00000000a001, createdAt: '2026-10-09T10:15:00.120Z', completedAt: '2026-10-09T10:15:00.170Z'}
        '400': {$ref: '#/components/responses/BadRequest'}
        '403': {$ref: '#/components/responses/Forbidden'}
        '404': {$ref: '#/components/responses/NotFound'}
        '409': {$ref: '#/components/responses/PaymentConflict'}
        '422': {$ref: '#/components/responses/PaymentUnprocessable'}
        '503': {$ref: '#/components/responses/PaymentUnavailable'}

  /v1/payments/cash-out:
    parameters: *commonHeaders
    post:
      operationId: payCashOut
      tags: [payments]
      summary: Customer-initiated cash-out (customer to agent)
      x-audience: customer
      x-actors:
        - {type: CUSTOMER, rule: "X-Actor-Wallet-Id = customerWalletId"}
      x-idempotency: "Idempotency-Key required; scope (X-Actor-Id, key)"
      parameters:
        - $ref: '#/components/parameters/IdempotencyKey'
      requestBody:
        required: true
        content:
          application/json:
            schema: {$ref: '#/components/schemas/CashOutRequest'}
            examples:
              karimAtSalma:
                value: {customerWalletId: 0192f2bb-0002-7000-8000-00000000b002, agentWalletId: 0192f2cc-0003-7000-8000-00000000c003, amountPoisha: 50000}
      responses:
        '200':
          description: COMPLETED
          content:
            application/json:
              schema: {$ref: '#/components/schemas/PaymentResult'}
              examples:
                completed:
                  value: {txnRef: CO26100900H4W8P2ZN, txnId: 0192f3d0-0000-7000-8000-000000000001, txnType: CASH_OUT, status: COMPLETED, failureCode: null, amountPoisha: 50000, feePoisha: 750, vatPoisha: 112, totalDebitPoisha: 50862, feeBearer: PAYER, currency: BDT, fromWalletId: 0192f2bb-0002-7000-8000-00000000b002, toWalletId: 0192f2cc-0003-7000-8000-00000000c003, createdAt: '2026-10-09T11:00:00.010Z', completedAt: '2026-10-09T11:00:00.075Z'}
        '400': {$ref: '#/components/responses/BadRequest'}
        '403': {$ref: '#/components/responses/Forbidden'}
        '404': {$ref: '#/components/responses/NotFound'}
        '409': {$ref: '#/components/responses/PaymentConflict'}
        '422': {$ref: '#/components/responses/PaymentUnprocessable'}
        '503': {$ref: '#/components/responses/PaymentUnavailable'}

  /v1/payments/merchant:
    parameters: *commonHeaders
    post:
      operationId: payMerchant
      tags: [payments]
      summary: Merchant payment (customer to merchant, Bangla QR on-us)
      description: "With PAYEE-borne MDR the response has feeBearer PAYEE and totalDebitPoisha = amountPoisha."
      x-audience: customer
      x-actors:
        - {type: CUSTOMER, rule: "X-Actor-Wallet-Id = customerWalletId"}
      x-idempotency: "Idempotency-Key required; scope (X-Actor-Id, key)"
      parameters:
        - $ref: '#/components/parameters/IdempotencyKey'
      requestBody:
        required: true
        content:
          application/json:
            schema: {$ref: '#/components/schemas/MerchantPaymentRequest'}
            examples:
              rahimAtNirob:
                value: {customerWalletId: 0192f2aa-0001-7000-8000-00000000a001, merchantWalletId: 0192f2dd-0004-7000-8000-00000000d004, amountPoisha: 35000, merchantReference: INV-2026-0042, qrPayloadId: 0192f3b0-0000-7000-8000-0000000000f1}
      responses:
        '200':
          description: COMPLETED
          content:
            application/json:
              schema: {$ref: '#/components/schemas/PaymentResult'}
              examples:
                completed:
                  value: {txnRef: MP26100900H8N2KQ5X, txnId: 0192f3e0-0000-7000-8000-000000000001, txnType: MERCHANT_PAYMENT, status: COMPLETED, failureCode: null, amountPoisha: 35000, feePoisha: 525, vatPoisha: 79, totalDebitPoisha: 35000, feeBearer: PAYEE, currency: BDT, fromWalletId: 0192f2aa-0001-7000-8000-00000000a001, toWalletId: 0192f2dd-0004-7000-8000-00000000d004, createdAt: '2026-10-09T12:00:00.010Z', completedAt: '2026-10-09T12:00:00.068Z'}
        '400': {$ref: '#/components/responses/BadRequest'}
        '403': {$ref: '#/components/responses/Forbidden'}
        '404': {$ref: '#/components/responses/NotFound'}
        '409': {$ref: '#/components/responses/PaymentConflict'}
        '422': {$ref: '#/components/responses/PaymentUnprocessable'}
        '503': {$ref: '#/components/responses/PaymentUnavailable'}

  /v1/payments/merchant-refund:
    parameters: *commonHeaders
    post:
      operationId: payMerchantRefund
      tags: [payments]
      summary: Direct merchant refund (full or partial) of a MERCHANT_PAYMENT
      description: |
        MERCHANT only. A merchant whose sub-type requires maker-checker (seed ENTERPRISE) gets 422 MAKER_CHECKER_VIOLATION
        and must use /v1/merchant-refund-requests. STAFF refunds only through an approval (entityType MerchantRefund).
        Excess amount -> 422 REFUND_EXCEEDS_ORIGINAL with `remainingPoisha` (not persisted). p99 400 ms.
      x-audience: partner
      x-actors:
        - {type: MERCHANT, rule: "X-Actor-Wallet-Id = original.toWalletId"}
      x-idempotency: "Idempotency-Key required; scope (X-Actor-Id, key)"
      parameters:
        - $ref: '#/components/parameters/IdempotencyKey'
      requestBody:
        required: true
        content:
          application/json:
            schema: {$ref: '#/components/schemas/MerchantRefundRequest'}
            examples:
              partial:
                value: {originalTxnRef: MP26100900H8N2KQ5W, amountPoisha: 40000, reasonCode: CUSTOMER_RETURN}
      responses:
        '200':
          description: COMPLETED
          content:
            application/json:
              schema: {$ref: '#/components/schemas/PaymentResult'}
              examples:
                completed:
                  value: {txnRef: MR26101200A7K2M9QX, txnId: 0192f5b0-0000-7000-8000-000000000001, txnType: MERCHANT_REFUND, status: COMPLETED, failureCode: null, amountPoisha: 40000, feePoisha: 0, vatPoisha: 0, totalDebitPoisha: 40000, feeBearer: PAYER, currency: BDT, fromWalletId: 0192f2dd-0004-7000-8000-00000000d004, toWalletId: 0192f2aa-0001-7000-8000-00000000a001, createdAt: '2026-10-12T06:15:00.120Z', completedAt: '2026-10-12T06:15:00.210Z'}
        '400': {$ref: '#/components/responses/BadRequest'}
        '403': {$ref: '#/components/responses/Forbidden'}
        '404': {$ref: '#/components/responses/NotFound'}
        '409': {$ref: '#/components/responses/PaymentConflict'}
        '422': {$ref: '#/components/responses/RefundUnprocessable'}
        '503': {$ref: '#/components/responses/PaymentUnavailable'}

  /v1/payments/float-transfer:
    parameters: *commonHeaders
    post:
      operationId: payFloatTransfer
      tags: [payments]
      summary: Float transfer (top-up or return between direct parent and child)
      description: |
        DISTRIBUTOR or AGENT owning fromWalletId (hierarchy: direct parent <-> child, else 403), or STAFF OPS_CHECKER/FIN_CHECKER
        (hierarchy overridden and audited; requestId mandatory). treasury-service forwards the context of the actor owning
        fromWalletId (TOP_UP: approving parent; RETURN: requester) or the STAFF approver, with Idempotency-Key = float request id.
        SERVICE actors -> 403. Pair outside float.allowedPairs -> 400.
      x-audience: partner
      x-actors:
        - {type: DISTRIBUTOR, rule: "X-Actor-Wallet-Id = fromWalletId; direct parent/child of toWalletId"}
        - {type: AGENT, rule: "X-Actor-Wallet-Id = fromWalletId; direct parent/child of toWalletId"}
        - {type: STAFF, roles: [OPS_CHECKER, FIN_CHECKER], rule: "requestId mandatory; hierarchy override audited"}
        - {forwardedBy: treasury-service, rule: "forwards the owning actor's or STAFF approver's X-Actor-* headers unchanged"}
      x-idempotency: "Idempotency-Key required; scope (X-Actor-Id, key)"
      parameters:
        - $ref: '#/components/parameters/IdempotencyKey'
      requestBody:
        required: true
        content:
          application/json:
            schema: {$ref: '#/components/schemas/FloatTransferRequest'}
            examples:
              distributorToSalma:
                value: {fromWalletId: 0192f4a1-0d03-7c00-8a00-00000000d003, toWalletId: 0192f2cc-0003-7000-8000-00000000c003, amountPoisha: 5000000, requestId: 0192f6a0-0000-7000-8000-000000000001}
      responses:
        '200':
          description: COMPLETED
          content:
            application/json:
              schema: {$ref: '#/components/schemas/PaymentResult'}
              examples:
                completed:
                  value: {txnRef: FT26100900P3X8K2NM, txnId: 0192f6a1-0000-7000-8000-000000000001, txnType: FLOAT_TRANSFER, status: COMPLETED, failureCode: null, amountPoisha: 5000000, feePoisha: 0, vatPoisha: 0, totalDebitPoisha: 5000000, feeBearer: PAYER, currency: BDT, fromWalletId: 0192f4a1-0d03-7c00-8a00-00000000d003, toWalletId: 0192f2cc-0003-7000-8000-00000000c003, createdAt: '2026-10-09T13:00:00.010Z', completedAt: '2026-10-09T13:00:00.060Z'}
        '400': {$ref: '#/components/responses/BadRequest'}
        '403': {$ref: '#/components/responses/Forbidden'}
        '404': {$ref: '#/components/responses/NotFound'}
        '409': {$ref: '#/components/responses/PaymentConflict'}
        '422': {$ref: '#/components/responses/PaymentUnprocessable'}
        '503': {$ref: '#/components/responses/PaymentUnavailable'}

  /v1/bills:enquire:
    parameters: *commonHeaders
    post:
      operationId: enquireBill
      tags: [bills]
      summary: Bill enquiry against the internal biller catalogue (simulated provider, read-only)
      description: |
        MVP (CR-TRANSACTION-1, SRS BIL-005 partial, BIL-011). Reads the biller from the `biller-catalogue-cache` data contract
        (wallet-service) and asks the in-process simulated biller provider (`bitspay.billers.mode = SIMULATED`; no outbound call,
        SRS A-41). For amountMode ENQUIRY returns a synthetic customer name, a due amount derived deterministically from a hash of
        the reference (within the biller's min..max, stable for the Dhaka calendar month), a due date and an `enquiryRef`.
        For OPEN / FIXED returns the biller's amount rules with the enquiry fields null. No persistence, no Idempotency-Key,
        no risk, no pricing. Product switch FEATURE.BILL_PAY applies.
      x-audience: customer
      x-actors:
        - {type: CUSTOMER, rule: "X-Actor-Wallet-Id required (the customer wallet that will pay)"}
      x-idempotency: none (read-only)
      requestBody:
        required: true
        content:
          application/json:
            schema: {$ref: '#/components/schemas/BillEnquiryRequest'}
            examples:
              desco:
                value: {billerId: 0192f9b0-0000-7000-8000-0000000000e1, billReference: '1234567890'}
      responses:
        '200':
          description: Enquiry result (ENQUIRY) or the biller's amount rules (OPEN / FIXED)
          content:
            application/json:
              schema: {$ref: '#/components/schemas/BillEnquiryResult'}
              examples:
                desco:
                  value: {billerId: 0192f9b0-0000-7000-8000-0000000000e1, billerCode: DESCO, billReference: '1234567890', amountMode: ENQUIRY, customerName: SIM CUSTOMER 7890, dueAmountPoisha: 125000, dueDate: '2026-11-15', enquiryRef: SIM-ENQ-3F9A0C7B21D4E856, fixedAmountPoisha: null, minAmountPoisha: 1000, maxAmountPoisha: 5000000}
                open:
                  value: {billerId: 0192f9b0-0000-7000-8000-0000000000e5, billerCode: BTCL-INT, billReference: 'BTCL-0042117', amountMode: OPEN, customerName: null, dueAmountPoisha: null, dueDate: null, enquiryRef: null, fixedAmountPoisha: null, minAmountPoisha: 1000, maxAmountPoisha: 5000000}
        '400': {$ref: '#/components/responses/BillBadRequest'}
        '403': {$ref: '#/components/responses/Forbidden'}
        '404': {$ref: '#/components/responses/BillNotFound'}
        '409':
          description: "STATE_CONFLICT reason BILLER_INACTIVE (biller not ACTIVE)."
          x-codes: [STATE_CONFLICT]
          x-reasons: [BILLER_INACTIVE]
          content:
            application/problem+json:
              schema: {$ref: '#/components/schemas/ProblemBase'}
        '422':
          description: "SERVICE_DISABLED (FEATURE.BILL_PAY off or channel not allowed)."
          x-codes: [SERVICE_DISABLED]
          content:
            application/problem+json:
              schema: {$ref: '#/components/schemas/ProblemBase'}
        '503': {$ref: '#/components/responses/UnavailableNoTxn'}

  /v1/payments/bill-payment:
    parameters: *commonHeaders
    post:
      operationId: payBill
      tags: [payments]
      summary: Bill payment to an internal-catalogue biller (customer to biller wallet; simulated provider)
      description: |
        MVP (CR-TRANSACTION-1, SRS BIL-003, BIL-008, BIL-011). Customer-initiated only. Pipeline: validate + catalogue (biller ACTIVE,
        reference matches referencePattern, amount rules, enquiry match) -> idempotency -> wallet status (customer C, biller
        settlement wallet B) -> risk evaluate (BILL_PAY) -> pricing (BILL_PAY) -> intent -> ledger command 18 post-bill-payment
        (customer -> biller wallet) -> simulated provider confirm (synchronous, in-process, only after ledger OK/EXISTS) -> outcome
        + outbox. Provider rejection (reserved test references ending 0000) -> automatic compensating post-reversal (reason
        SYSTEM_ERROR) and final status FAILED with failureCode PROVIDER_REJECTED (409 STATE_CONFLICT reason PROVIDER_REJECTED
        with `transaction`). No PENDING state in MVP. The Idempotency-Key is the client reference (clientReference, OPEN D-13).
        p99 300 ms.
      x-audience: customer
      x-actors:
        - {type: CUSTOMER, rule: "X-Actor-Wallet-Id = customerWalletId"}
      x-idempotency: "Idempotency-Key required; scope (X-Actor-Id, key); retained >= 7 days (OPEN D-01)"
      parameters:
        - $ref: '#/components/parameters/IdempotencyKey'
      requestBody:
        required: true
        content:
          application/json:
            schema: {$ref: '#/components/schemas/BillPaymentRequest'}
            examples:
              rahimPaysDesco:
                value: {customerWalletId: 0192f2aa-0001-7000-8000-00000000a001, billerId: 0192f9b0-0000-7000-8000-0000000000e1, billReference: '1234567890', amountPoisha: 125000, enquiryRef: SIM-ENQ-3F9A0C7B21D4E856}
      responses:
        '200':
          description: COMPLETED (PaymentResult + billerId, billReference, providerReceipt, token)
          content:
            application/json:
              schema: {$ref: '#/components/schemas/PaymentResult'}
              examples:
                completed:
