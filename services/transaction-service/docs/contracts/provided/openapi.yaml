  /v1/payments/recharge:
    parameters: *commonHeaders
    post:
      operationId: payRecharge
      tags: [payments]
      summary: Mobile recharge (top-up) via the operator catalogue (customer to operator biller wallet; simulated provider)
      description: |
        MVP (CR-TRANSACTION-1, SRS BIL-012). Customer-initiated only. The operator is derived from the MSISDN prefix through
        `biller:mno-prefix:{prefix}`; when `operatorBillerId` is sent it must equal the derived operator (else 400 OPERATOR_MISMATCH).
        Pipeline as bill payment with risk/pricing txnType RECHARGE and ledger command 19 post-recharge. Provider rejection
        (reserved test MSISDNs ending 0000) -> compensating post-reversal and FAILED PROVIDER_REJECTED. p99 300 ms.
      x-audience: customer
      x-actors:
        - {type: CUSTOMER, rule: "X-Actor-Wallet-Id = customerWalletId"}
      x-idempotency: "Idempotency-Key required; scope (X-Actor-Id, key); retained >= 7 days (OPEN D-01)"
      parameters:
        - $ref: '#/components/parameters/IdempotencyKey'
      requestBody:
        required: true
        content:
          application/json:
            schema: {$ref: '#/components/schemas/RechargeRequest'}
            examples:
              rahimTopsUpGp:
                value: {customerWalletId: 0192f2aa-0001-7000-8000-00000000a001, msisdn: '01712345678', operatorBillerId: null, rechargeType: PREPAID, amountPoisha: 10000}
      responses:
        '200':
          description: COMPLETED (PaymentResult + billerId, msisdn, providerReceipt)
          content:
            application/json:
              schema: {$ref: '#/components/schemas/PaymentResult'}
              examples:
                completed:
                  value: {txnRef: RC26101400P4N8W2ZA, txnId: 0192fa20-0000-7000-8000-000000000001, txnType: RECHARGE, status: COMPLETED, failureCode: null, amountPoisha: 10000, feePoisha: 0, vatPoisha: 0, totalDebitPoisha: 10000, feeBearer: OPERATOR, currency: BDT, fromWalletId: 0192f2aa-0001-7000-8000-00000000a001, toWalletId: 0192f9b1-0000-7000-8000-0000000000e7, createdAt: '2026-10-14T09:05:00.101Z', completedAt: '2026-10-14T09:05:00.160Z', billerId: 0192f9b0-0000-7000-8000-0000000000e7, billReference: null, msisdn: '01712345678', providerReceipt: SIM-RC-RC26101400P4N8W2ZA, token: null}
        '400': {$ref: '#/components/responses/BillBadRequest'}
        '403': {$ref: '#/components/responses/Forbidden'}
        '404': {$ref: '#/components/responses/BillNotFound'}
        '409': {$ref: '#/components/responses/BillPaymentConflict'}
        '422': {$ref: '#/components/responses/PaymentUnprocessable'}
