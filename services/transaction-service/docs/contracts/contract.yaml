service: transaction-service
number: "02"
modules: []
contractVersion: 1.0.0
kernel: "1.0"
owner: Dev-2

provides:
  apis:
    - openapi: provided/openapi.yaml
      major: 1
      # every operation in the openapi is provided; staff/internal/test ones carry x-audience staff|internal|service
  events:
    - topic: txn.events
      key: "sender (from) walletId of the transaction described in data; TRANSACTION_REVERSED / TRANSACTION_REFUNDED: the ORIGINAL's from walletId"
      compacted: false
      tombstones: false
      partitions: {dev: 3, prod: 96}
      retention: 7d
      transport: outbox
      eventTypes:
        - {type: TRANSACTION_COMPLETED, version: 1, aggregateType: Transaction, schema: provided/events/txn.events/TRANSACTION_COMPLETED.v1.schema.json, example: provided/events/txn.events/TRANSACTION_COMPLETED.v1.example.json}
        - {type: TRANSACTION_FAILED, version: 1, aggregateType: Transaction, schema: provided/events/txn.events/TRANSACTION_FAILED.v1.schema.json, example: provided/events/txn.events/TRANSACTION_FAILED.v1.example.json}
        - {type: TRANSACTION_REVERSED, version: 1, aggregateType: Transaction, schema: provided/events/txn.events/TRANSACTION_REVERSED.v1.schema.json, example: provided/events/txn.events/TRANSACTION_REVERSED.v1.example.json}
        - {type: TRANSACTION_REFUNDED, version: 1, aggregateType: Transaction, schema: provided/events/txn.events/TRANSACTION_REFUNDED.v1.schema.json, example: provided/events/txn.events/TRANSACTION_REFUNDED.v1.example.json}
  inboundTopics: []
  data: []
  codes: provided/codes.yaml

consumes:
  apis:
    # ---------------- ledger-service ----------------
    - producer: ledger-service
      operation: "POST /v1/ledger/commands/post-p2p"
      major: 1
      pinnedContractVersion: 1.0.0
      purpose: "step 7 of the payment pipeline for P2P (command type 1); also re-drive and approval-free retries with the identical body"
      fieldsUsed: &ledgerPaymentFields
        - "req.commandId"
        - "req.txnRef"
        - "req.fromAccountId"
        - "req.toAccountId"
        - "req.amountPoisha"
        - "req.pricing.feePoisha"
        - "req.pricing.vatPoisha"
        - "req.pricing.feeBearer"
        - "req.pricing.commissionPoisha"
        - "req.pricing.commissionSource"
        - "req.pricing.commissionBeneficiaryAccountId"
        - "req.pricing.aitPoisha"
        - "req.constraints.destinationMaxBalancePoisha"
        - "req.metadata.channel"
        - "req.metadata.initiatorActorId"
        - "res.commandId"
        - "res.result"
        - "res.rejectionCode"
        - "res.detail"
        - "res.transferIds"
        - "res.postedAt"
      codesUsed:
        - {set: commandResult, values: "*"}
        - {set: rejectionCode, values: "*"}
        - {set: rejectionDetailToken, values: [NOT_REVERSIBLE, ACCOUNT_TYPE_MISMATCH, id_already_failed]}
      resilience: {connectTimeoutMs: 100, timeoutMs: 500, retries: 0, circuitBreaker: ledger, bulkhead: 512, onFailure: "503 DEPENDENCY_UNAVAILABLE with transaction (status INITIATED); sweeper/re-drive resolves"}
    - producer: ledger-service
      operation: "POST /v1/ledger/commands/post-cash-in"
      major: 1
      pinnedContractVersion: 1.0.0
      purpose: "step 7 for CASH_IN (command type 2)"
      fieldsUsed: *ledgerPaymentFields
      codesUsed:
        - {set: commandResult, values: "*"}
        - {set: rejectionCode, values: "*"}
        - {set: rejectionDetailToken, values: [NOT_REVERSIBLE, ACCOUNT_TYPE_MISMATCH, id_already_failed]}
      resilience: {connectTimeoutMs: 100, timeoutMs: 500, retries: 0, circuitBreaker: ledger, bulkhead: 512, onFailure: "503 with transaction INITIATED"}
    - producer: ledger-service
      operation: "POST /v1/ledger/commands/post-cash-out"
      major: 1
      pinnedContractVersion: 1.0.0
      purpose: "step 7 for CASH_OUT (command type 3)"
      fieldsUsed: *ledgerPaymentFields
      codesUsed:
        - {set: commandResult, values: "*"}
        - {set: rejectionCode, values: "*"}
        - {set: rejectionDetailToken, values: [NOT_REVERSIBLE, ACCOUNT_TYPE_MISMATCH, id_already_failed]}
      resilience: {connectTimeoutMs: 100, timeoutMs: 500, retries: 0, circuitBreaker: ledger, bulkhead: 512, onFailure: "503 with transaction INITIATED"}
    - producer: ledger-service
      operation: "POST /v1/ledger/commands/post-merchant-payment"
      major: 1
      pinnedContractVersion: 1.0.0
      purpose: "step 7 for MERCHANT_PAYMENT (command type 4)"
      fieldsUsed: *ledgerPaymentFields
      codesUsed:
        - {set: commandResult, values: "*"}
        - {set: rejectionCode, values: "*"}
        - {set: rejectionDetailToken, values: [NOT_REVERSIBLE, ACCOUNT_TYPE_MISMATCH, id_already_failed]}
      resilience: {connectTimeoutMs: 100, timeoutMs: 500, retries: 0, circuitBreaker: ledger, bulkhead: 512, onFailure: "503 with transaction INITIATED"}
    - producer: ledger-service
      operation: "POST /v1/ledger/commands/post-merchant-refund"
      major: 1
      pinnedContractVersion: 1.0.0
      purpose: "step 7 for MERCHANT_REFUND (command type 5)"
      fieldsUsed: *ledgerPaymentFields
      codesUsed:
        - {set: commandResult, values: "*"}
        - {set: rejectionCode, values: "*"}
        - {set: rejectionDetailToken, values: [NOT_REVERSIBLE, ACCOUNT_TYPE_MISMATCH, id_already_failed]}
      resilience: {connectTimeoutMs: 100, timeoutMs: 500, retries: 0, circuitBreaker: ledger, bulkhead: 512, onFailure: "503 with transaction INITIATED"}
    - producer: ledger-service
      operation: "POST /v1/ledger/commands/post-float-transfer"
      major: 1
      pinnedContractVersion: 1.0.0
      purpose: "step 7 for FLOAT_TRANSFER (command type 6)"
      fieldsUsed: *ledgerPaymentFields
      codesUsed:
        - {set: commandResult, values: "*"}
        - {set: rejectionCode, values: "*"}
        - {set: rejectionDetailToken, values: [NOT_REVERSIBLE, ACCOUNT_TYPE_MISMATCH, id_already_failed]}
      resilience: {connectTimeoutMs: 100, timeoutMs: 500, retries: 0, circuitBreaker: ledger, bulkhead: 512, onFailure: "503 with transaction INITIATED"}
    - producer: ledger-service
      operation: "POST /v1/ledger/commands/post-reversal"
      major: 1
      pinnedContractVersion: 1.0.0
      purpose: "execute a support-approved reversal (command type 7); commandId = reversal txnId"
      fieldsUsed:
        - "req.commandId"
        - "req.txnRef"
        - "req.originalCommandId"
        - "req.reverseFee"
        - "req.reverseCommission"
        - "req.releaseHoldCommandId"
        - "req.amountPoisha"
        - "res.commandId"
        - "res.result"
        - "res.rejectionCode"
        - "res.detail"
        - "res.transferIds"
        - "res.postedAt"
      codesUsed:
        - {set: commandResult, values: "*"}
        - {set: rejectionCode, values: "*"}
        - {set: rejectionDetailToken, values: [NOT_REVERSIBLE, ACCOUNT_TYPE_MISMATCH, id_already_failed]}
      resilience: {connectTimeoutMs: 100, timeoutMs: 500, retries: 0, circuitBreaker: ledger, bulkhead: 512, onFailure: "503 with transaction INITIATED"}
    - producer: ledger-service
      operation: "GET /v1/ledger/commands/{commandId}"
      major: 1
      pinnedContractVersion: 1.0.0
      purpose: "recovery sweeper and late-post verifier: resolve the outcome of an INITIATED intent or re-check a sweeper FAILED row"
      fieldsUsed:
        - "path.commandId"
        - "res.commandId"
        - "res.found"
        - "res.result"
        - "res.rejectionCode"
        - "res.transfers[].transferId"
        - "res.transfers[].legIndex"
      codesUsed:
        - {set: rejectionCode, values: "*"}
      resilience: {timeoutMs: 1000, retries: 2, circuitBreaker: ledger-lookup, onFailure: "skip the row this pass; never mark FAILED on error"}

    # ---------------- limits-risk-service ----------------
    - producer: limits-risk-service
      operation: "POST /v1/risk/evaluate"
      major: 1
      pinnedContractVersion: 1.0.0
      purpose: "step 4: limits + fraud decision and reservation (reservation id = txnId) for every payment type except REVERSAL"
      fieldsUsed:
        - "req.txnId"
        - "req.txnType"
        - "req.channel"
        - "req.deviceId"
        - "req.amountPoisha"
        - "req.from.walletId"
        - "req.from.walletType"
        - "req.from.kycTier"
        - "req.from.categoryCode"
        - "req.from.flags"
        - "req.to.walletId"
        - "req.to.walletType"
        - "req.to.kycTier"
        - "req.to.categoryCode"
        - "req.to.flags"
        - "req.at"
        - "req.context"
        - "res.decision"
        - "res.reasonCodes"
        - "res.riskScore"
        - "res.reservationId"
        - "res.receiverMaxBalancePoisha"
        - "res.usage.senderMonthlyCountForTxnType"
        - "res.violatedLimit.limitCode"
        - "res.violatedLimit.party"
        - "res.violatedLimit.dimension"
        - "res.violatedLimit.remainingValue"
        - "res.violatedLimit.resetsAt"
      codesUsed:
        - {set: riskDecision, values: "*"}
        - {set: limitDimension, values: "*"}
        - {set: limitParty, values: "*"}
      resilience: {connectTimeoutMs: 50, timeoutMs: 150, retries: 0, circuitBreaker: risk, bulkhead: 512, onFailure: "503 DEPENDENCY_UNAVAILABLE, nothing persisted, Idempotency-Key entry deleted, asynchronous reservation release (not after a 409)"}
    - producer: limits-risk-service
      operation: "POST /v1/limits/reservations/{txnId}:release"
      major: 1
      pinnedContractVersion: 1.0.0
      purpose: "release a reservation when risk may have reserved but no intent row was committed (503 at steps 4-6, idempotency takeover)"
      fieldsUsed:
        - "path.txnId"
        - "req.reasonCode"
        - "res.txnId"
        - "res.released"
        - "res.state"
      codesUsed:
        - {set: releaseState, values: "*"}
      resilience: {timeoutMs: 1000, retries: 3, backoffMs: [100, 400, 1600], circuitBreaker: risk-release, onFailure: "count bitspay_transaction_reservation_release_failures_total; limits-risk 10-minute expiry is the backstop"}
    - producer: limits-risk-service
      operation: "GET /v1/limits/wallets/{walletId}/usage"
      major: 1
      pinnedContractVersion: 1.0.0
      purpose: "quote only: sender's monthly count for the quoted txnType (SEND item) -> usage.senderMonthlyCountForTxnType (OPEN D-17)"
      fieldsUsed:
        - "path.walletId"
        - "query.txnType"
        - "res.items[].txnType"
        - "res.items[].direction"
        - "res.items[].monthlyCountUsed"
      codesUsed: []
      resilience: {timeoutMs: 300, retries: 0, circuitBreaker: risk-usage, onFailure: "quote evaluates without the free allowance and returns feeIsUpperBound = true (never an error)"}

    # ---------------- wallet-service ----------------
    - producer: wallet-service
      operation: "GET /v1/wallets/{walletId}/status"
      major: 1
      pinnedContractVersion: 1.0.0
      purpose: "fallback when the Redis wallet status cache misses (payments, quote, beneficiary create)"
      fieldsUsed:
        - "path.walletId"
        - "res.walletId"
        - "res.version"
        - "res.status"
        - "res.kycTier"
        - "res.walletType"
        - "res.categoryCode"
        - "res.flags"
      codesUsed:
        - {set: walletStatus, values: "*"}
        - {set: walletType, values: "*"}
      resilience: {timeoutMs: 100, retries: 0, singleFlight: true, circuitBreaker: wallet, bulkhead: 64, onFailure: "404 -> write wsn:{walletId} (60 s) and 404 NOT_FOUND; other errors -> 503 DEPENDENCY_UNAVAILABLE"}

    # ---------------- pricing-service ----------------
    - producer: pricing-service
      operation: "GET /v1/pricing/plans"
      major: 1
      pinnedContractVersion: 1.0.0
      purpose: "bootstrap of the in-memory pricing snapshot at start-up and on POST /v1/internal/admin/pricing:reload; pages until nextCursor is null"
      fieldsUsed:
        - "query.status"
        - "query.limit"
        - "query.cursor"
        - "res.items"
        - "res.nextCursor"
      codesUsed: []
      resilience: {timeoutMs: 2000, retries: 5, backoff: exponential, onFailure: "readiness stays DOWN until bootstrap succeeds or fee.rules has caught up; payments 503"}

  events:
    - producer: pricing-service
      topic: fee.rules
      eventType: PRICING_PLAN_UPSERTED
      version: 1
      pinnedContractVersion: 1.0.0
      groupId: "transaction-service.feerules-${HOSTNAME}"
      groupKind: per-instance
      purpose: "in-memory pricing snapshot (PlanJson); every pod reads from earliest, no reliance on committed offsets; null-value tombstone (key = planId) removes the plan"
      tombstones: true
      fieldsUsed:
        - "planId"
        - "version"
        - "status"
        - "txnType"
        - "match"
        - "priority"
        - "effectiveFrom"
        - "effectiveTo"
        - "fee"
        - "feeBearer"
        - "vatBps"
        - "freeMonthlyCount"
        - "commission"
      codesUsed: []
    - producer: wallet-service
      topic: partner.events
      eventType: PARTNER_UPSERTED
      version: 1
      pinnedContractVersion: 1.0.0
      groupId: transaction-service.partner
      purpose: "partner_link projection for float hierarchy (direct parent/child, status) and refund maker-checker sub-type"
      fieldsUsed:
        - "partnerId"
        - "partnerType"
        - "subType"
        - "categoryCode"
        - "walletId"
        - "parentPartnerId"
        - "ancestorWalletIds"
        - "status"
        - "version"
        - "effectiveFrom"
      codesUsed: []
    - producer: admin-service
      topic: refdata.events
      eventType: REFDATA_UPSERTED
      version: 1
      pinnedContractVersion: 1.0.0
      groupId: transaction-service.refdata
      purpose: "PURPOSE_CODE and REASON_CODE projections; SYSTEM_PARAM FEATURE.* product switches and WALLET.ALLOW_INBOUND_BEFORE_KYC; version-guarded, latest wins"
      fieldsUsed:
        - "type"
        - "code"
        - "nameEn"
        - "nameBn"
        - "attributes"
        - "version"
        - "active"
      codesUsed: []

  inboundTopics:
    - owner: admin-service
      topic: approval.events
      eventType: APPROVAL_REQUESTED
      version: 1
      pinnedContractVersion: 1.0.0
      fieldsUsed: ["*"]
      entityTypes: [MerchantRefund]
    - owner: admin-service
      topic: approval.events
      eventType: APPROVAL_DECIDED
      version: 1
      pinnedContractVersion: 1.0.0
      fieldsUsed: ["*"]
      entityTypes: [MerchantRefund]
    - owner: admin-service
      topic: approval.events
      eventType: APPROVAL_EXPIRED
      version: 1
      pinnedContractVersion: 1.0.0
      fieldsUsed: ["*"]
      entityTypes: [MerchantRefund]
    - owner: admin-service
      topic: audit.events
      eventType: AUDIT_RECORDED
      version: 1
      pinnedContractVersion: 1.0.0
      fieldsUsed: ["*"]
      exception: "Customer payment outcomes of P2P, CASH_IN, CASH_OUT, MERCHANT_PAYMENT and FLOAT_TRANSFER are not written to audit.events; their tamper-evident trail is txn.events chained by admin-service governance (OPEN D-05). Reversals, refund outcomes/requests/decisions, float hierarchy overrides, beneficiary changes and anomaly resolutions are audited."
      actions: [TRANSACTION_REVERSED, REVERSAL_FAILED, REFUND_COMPLETED, REFUND_FAILED, REFUND_REQUESTED, REFUND_APPROVED, REFUND_REJECTED, REFUND_EXPIRED, FLOAT_HIERARCHY_OVERRIDE, BENEFICIARY_CREATED, BENEFICIARY_UPDATED, BENEFICIARY_DELETED, ANOMALY_RESOLVED]

  data:
    - producer: wallet-service
      id: wallet-status-cache
      version: 1
      pinnedContractVersion: 1.0.0
      purpose: "read ws:{bucket} (pipelined HGET for both parties); write the negative cache wsn:{walletId} after a status-API 404"
      fieldsUsed: ["bucket", "key", "field", "value.version", "value.statusCode", "value.kycTier", "value.walletTypeCode", "value.categoryCode", "value.flags", "negativeCache"]
    - producer: pricing-service
      id: pricing-algorithm
      version: 1
      pinnedContractVersion: 1.0.0
      purpose: "transaction-service implements the evaluation algorithm identically (steps 0-8, HALF_EVEN, long/BigDecimal); every step is used"
      fieldsUsed: ["*"]
    - producer: pricing-service
      id: pricing-golden-vectors
      version: 1
      pinnedContractVersion: 1.0.0
      purpose: "test resource copied byte-for-byte; every tier CATALOGUE vector is mandatory (test pricing_goldenVectors_all); extensionVectors informative only"
      fieldsUsed: ["schemaVersion", "catalogueVersion", "rounding", "outputFields", "vectors[]"]

  codes:
    - {producer: wallet-service, set: walletStatus, values: "*"}
    - {producer: wallet-service, set: walletType, values: "*"}
    - {producer: wallet-service, set: categoryCode, values: "*"}
    - {producer: admin-service, set: refdataType, values: [PURPOSE_CODE, REASON_CODE, SYSTEM_PARAM]}

  refdata:
    - {type: PURPOSE_CODE, codes: ["*"]}
    - {type: REASON_CODE, codes: [WRONG_TRANSFER, DISPUTE_UPHELD, SYSTEM_ERROR, FRAUD_CONFIRMED, CUSTOMER_RETURN, DUPLICATE_PAYMENT, ORDER_CANCELLED, PRICE_ADJUSTMENT, OTHER]}
    - {type: SYSTEM_PARAM, codes: ["FEATURE.P2P", "FEATURE.CASH_IN", "FEATURE.CASH_OUT", "FEATURE.MERCHANT_PAYMENT", "FEATURE.MERCHANT_REFUND", "FEATURE.FLOAT_TRANSFER", "FEATURE.REVERSAL", "WALLET.ALLOW_INBOUND_BEFORE_KYC"]}
