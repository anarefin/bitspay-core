                      enum: [DUPLICATE_TXN_ID, SYSTEM_PARTY_NOT_ALLOWED, null]
              example:
                type: about:blank
                title: Validation failed
                status: 400
                code: VALIDATION_FAILED
                correlationId: c-0f3e9a
                errors:
                - {field: amountPoisha, message: must be >= 1}
        '403':
          description: ACTOR_NOT_ALLOWED
          content:
