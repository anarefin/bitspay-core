      - {$ref: '#/components/parameters/XChannel'}
      - {$ref: '#/components/parameters/XActorRoles'}
      - {$ref: '#/components/parameters/XActorUserId'}
      - {$ref: '#/components/parameters/IdempotencyKey'}
      description: 2 approval levels (2nd = CAMLCO) when the set touches REGULATORY_CAP or raises any value by > 50 %.
      requestBody:
        required: true
        content:
          application/json:
            schema: {$ref: '#/components/schemas/ChangeSetRequest'}
            example:
              summary: Raise Tier 2 P2P daily send to 60,000 Tk
              operations:
              - op: UPSERT_RULE
                rule: {layer: TIER, userCategory: CUSTOMER, kycTier: 2, riskGrade: null, channel: null, scope: P2P, direction: SEND, dimension: DAILY_AMOUNT, value: 6000000, effectiveFrom: '2026-10-10T18:00:00.000Z',
                  effectiveTo: null, reason: BB circular ref 12/2026}
              - {op: DEACTIVATE_RULE, ruleId: 0192f3aa-0000-7000-8000-000000000777}
      responses:
        '202':
          description: Accepted, pending approval (entityType LimitChangeSet, action APPLY)
          content:
            application/json:
              schema: {$ref: '#/components/schemas/ChangeSetAccepted'}
              example:
                changeSetId: 0192f3ab-0000-7000-8000-000000000101
                approvalId: 0192f5ab-0000-7000-8000-000000000001
                status: PENDING
                requiredLevels: 1
                diff:
                - {key: TIER|CUSTOMER|2|*|*|P2P|SEND|DAILY_AMOUNT, before: 5000000, after: 6000000}
        '400':
          description: Resulting OVERRIDE above an applicable REGULATORY_CAP, amount not a multiple of 100 poisha, MIN > MAX, schema
          content:
            application/problem+json:
              schema:
                allOf:
                - {$ref: '#/components/schemas/Problem'}
                - type: object
                  properties:
                    reason:
                      type: [string, 'null']
                      enum: [EXCEEDS_REGULATORY_CAP, null]
              example:
                type: about:blank
                title: Validation failed
                status: 400
                code: VALIDATION_FAILED
                correlationId: c-0f3e9a
                errors:
                - {field: amountPoisha, message: must be >= 1}
        '403':
          description: ACTOR_NOT_ALLOWED
          content:
            application/problem+json:
              schema: {$ref: '#/components/schemas/Problem'}
              example: {type: 'about:blank', title: Actor not allowed, status: 403, code: ACTOR_NOT_ALLOWED, correlationId: c-0f3e9a}
        '409':
          description: IDEMPOTENCY_CONFLICT
          content:
            application/problem+json:
              schema: {$ref: '#/components/schemas/Problem'}
              example: {type: 'about:blank', title: State conflict, status: 409, code: STATE_CONFLICT, correlationId: c-0f3e9a}
