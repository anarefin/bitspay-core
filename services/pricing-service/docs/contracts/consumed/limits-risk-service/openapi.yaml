  /v1/limits/wallets/{walletId}/usage:
    get:
      operationId: getWalletUsage
      summary: Remaining headroom per txnType (LIM-007)
      tags: [limits]
      x-audience: customer
      x-actors:
      - {type: CUSTOMER, scope: own wallet (X-Actor-Wallet-Id = walletId)}
      - {type: AGENT, scope: own wallet}
      - {type: MERCHANT, scope: own wallet}
      - {type: DISTRIBUTOR, scope: own wallet}
      - {type: INSTITUTION, scope: own wallet}
      - type: STAFF
        roles: ['*']
      - type: SERVICE
        ids: [transaction-service, support-service, wallet-service]
      x-idempotency: read-only
      parameters:
      - {$ref: '#/components/parameters/XCorrelationId'}
      - {$ref: '#/components/parameters/XActorType'}
      - {$ref: '#/components/parameters/XActorId'}
      - {$ref: '#/components/parameters/XChannel'}
      - {$ref: '#/components/parameters/XActorRoles'}
      - {$ref: '#/components/parameters/XActorUserId'}
      - {$ref: '#/components/parameters/WalletId'}
      - {$ref: '#/components/parameters/XActorWalletId'}
      - name: txnType
        in: query
        required: false
        schema:
          type: string
          enum: [P2P, CASH_IN, CASH_OUT, MERCHANT_PAYMENT, MERCHANT_REFUND, FLOAT_TRANSFER, REVERSAL, DISBURSEMENT]
      - name: walletType
        in: query
        required: false
        schema:
          type: string
          enum: [C, A, D, M, I]
        description: used only when no profile is held for the wallet
      - name: kycTier
        in: query
        required: false
        schema: {type: integer, minimum: 0, maximum: 2}
        description: used only when no profile is held
      - name: categoryCode
        in: query
        required: false
        schema: {type: integer, minimum: 0, maximum: 99999}
        description: used only when no profile is held
      description: p95 <= 30 ms. 'Used' includes outstanding reservations; limits are the effective values (precedence, emergency REDUCE, self-limits). The transaction-service quote
        reads monthlyCountUsed (OPEN D-17); wallet-service reads maxBalancePoisha for closure payouts.
      responses:
        '200':
          description: OK
          content:
            application/json:
              schema: {$ref: '#/components/schemas/UsageResponse'}
              example:
                walletId: 0192f2aa-0000-7000-8000-00000000a001
                asOf: '2026-10-09T08:05:00.000Z'
                userCategory: CUSTOMER
                kycTier: 2
                riskGrade: LOW
                maxBalancePoisha: 50000000
                items:
                - txnType: P2P
                  direction: SEND
                  allowed: true
                  perTxnMinPoisha: 1000
                  perTxnMaxPoisha: 2500000
                  monthlyCountUsed: 7
                  daily: {countLimit: 50, countUsed: 3, countRemaining: 47, amountLimitPoisha: 5000000, amountUsedPoisha: 350000, amountRemainingPoisha: 4650000, resetsAt: '2026-10-09T18:00:00.000Z'}
                  weekly: null
                  monthly: {countLimit: 300, countUsed: 7, countRemaining: 293, amountLimitPoisha: 30000000, amountUsedPoisha: 900000, amountRemainingPoisha: 29100000, resetsAt: '2026-10-31T18:00:00.000Z'}
        '400':
          description: VALIDATION_FAILED
          content:
            application/problem+json:
              schema: {$ref: '#/components/schemas/Problem'}
              example:
                type: about:blank
                title: Validation failed
                status: 400
                code: VALIDATION_FAILED
                correlationId: c-0f3e9a
                errors:
                - {field: amountPoisha, message: must be >= 1}
        '403':
          description: Another holder's wallet
          content:
            application/problem+json:
              schema: {$ref: '#/components/schemas/Problem'}
              example: {type: 'about:blank', title: Actor not allowed, status: 403, code: ACTOR_NOT_ALLOWED, correlationId: c-0f3e9a}
        '404':
          description: Wallet profile unknown and no override applies
          content:
            application/problem+json:
              schema: {$ref: '#/components/schemas/Problem'}
              example: {type: 'about:blank', title: Not found, status: 404, code: NOT_FOUND, correlationId: c-0f3e9a}
        '503':
          description: DEPENDENCY_UNAVAILABLE (retryable)
          content:
            application/problem+json:
              schema: {$ref: '#/components/schemas/Problem'}
              example: {type: 'about:blank', title: Dependency unavailable, status: 503, code: DEPENDENCY_UNAVAILABLE, correlationId: c-0f3e9a, retryable: true}
  /v1/blacklist/check:
    get:
      operationId: checkBlacklist
      summary: Is a value blacklisted?
      tags: [lists]
      x-audience: service
      x-actors:
      - type: SERVICE
        ids: [wallet-service]
      - type: STAFF
        roles: ['*']
      x-idempotency: read-only
      parameters:
      - {$ref: '#/components/parameters/XCorrelationId'}
      - {$ref: '#/components/parameters/XActorType'}
      - {$ref: '#/components/parameters/XActorId'}
      - {$ref: '#/components/parameters/XChannel'}
      - {$ref: '#/components/parameters/XActorRoles'}
      - {$ref: '#/components/parameters/XActorUserId'}
      - name: type
        in: query
        required: true
        schema:
          type: string
          enum: [NID, MSISDN, DEVICE, WALLET, BANK_ACCOUNT, IP, PARTNER]
      - name: value
        in: query
        required: false
        schema: {type: string, maxLength: 128}
        description: clear value (MSISDN, DEVICE, WALLET, PARTNER, IP only); exactly one of value / valueHash; masked in access logs
      - name: valueHash
        in: query
        required: false
        schema: {type: string, pattern: '^[0-9a-f]{64}$'}
        description: kernel K2 hash; mandatory for NID and BANK_ACCOUNT
      description: p95 <= 20 ms. ACTIVE, unexpired BLACK entries only.
      responses:
        '200':
          description: OK
          content:
            application/json:
              schema: {$ref: '#/components/schemas/BlacklistCheckResponse'}
              example:
                listed: true
                entries:
                - {entryId: 0192f5aa-0000-7000-8000-0000000000e1, type: NID, reasonCode: FRAUD_CONFIRMED, valueMasked: '******1234', expiresAt: null, createdAt: '2026-09-01T10:00:00.000Z'}
        '400':
          description: both or neither of value/valueHash, invalid normalisation, NID/BANK_ACCOUNT with value
          content:
            application/problem+json:
              schema:
                allOf:
                - {$ref: '#/components/schemas/Problem'}
                - type: object
                  properties:
                    reason:
                      type: [string, 'null']
                      enum: [CLEAR_VALUE_NOT_ALLOWED, null]
              example:
                type: about:blank
                title: Validation failed
                status: 400
                code: VALIDATION_FAILED
                correlationId: c-0f3e9a
                errors:
                - {field: amountPoisha, message: must be >= 1}
        '403':
          description: ACTOR_NOT_ALLOWED
          content:
            application/problem+json:
              schema: {$ref: '#/components/schemas/Problem'}
              example: {type: 'about:blank', title: Actor not allowed, status: 403, code: ACTOR_NOT_ALLOWED, correlationId: c-0f3e9a}
        '503':
          description: DEPENDENCY_UNAVAILABLE (retryable)
          content:
            application/problem+json:
              schema: {$ref: '#/components/schemas/Problem'}
              example: {type: 'about:blank', title: Dependency unavailable, status: 503, code: DEPENDENCY_UNAVAILABLE, correlationId: c-0f3e9a, retryable: true}
  /v1/blacklist/entries:
    post:
      operationId: proposeBlacklistEntry
      summary: Propose a blacklist entry (always maker-checked)
      tags: [lists]
      x-audience: staff
      x-actors:
      - type: SERVICE
        ids: [compliance-service]
      - type: STAFF
        roles: [RISK_ANALYST, COMPLIANCE_OFFICER, PARTNER_OPS_MAKER]
      x-idempotency: optional Idempotency-Key (kernel K3.3)
      parameters:
      - {$ref: '#/components/parameters/XCorrelationId'}
      - {$ref: '#/components/parameters/XActorType'}
      - {$ref: '#/components/parameters/XActorId'}
      - {$ref: '#/components/parameters/XChannel'}
      - {$ref: '#/components/parameters/XActorRoles'}
      - {$ref: '#/components/parameters/XActorUserId'}
      - {$ref: '#/components/parameters/IdempotencyKey'}
      description: SERVICE requests are never auto-approved (checker RISK_CHECKER / CAMLCO). compliance-service sends source COMPLIANCE_CASE, valueHash and reasonCode FRAUD_CONFIRMED
        | AML_SUSPICION | SANCTIONS.
      requestBody:
        required: true
        content:
          application/json:
            schema: {$ref: '#/components/schemas/BlacklistEntryProposal'}
            example: {type: NID, valueHash: 9f2c0e7a1b3d5f7091a2b3c4d5e6f708192a3b4c5d6e7f8091a2b3c4d5e6f708, valueMasked: null, reasonCode: FRAUD_CONFIRMED, expiresAt: null, comment: Confirmed
                identity fraud, source: COMPLIANCE_CASE, reference: CASE-2026-000123}
      responses:
        '202':
          description: Accepted, PENDING_APPROVAL
          content:
            application/json:
              schema: {$ref: '#/components/schemas/ListEntryAccepted'}
              example: {entryId: 0192f5aa-0000-7000-8000-0000000000e2, status: PENDING_APPROVAL, approvalId: 0192f5ab-0000-7000-8000-000000000001, valueMasked: null}
        '400':
          description: VALIDATION_FAILED
          content:
            application/problem+json:
              schema:
                allOf:
                - {$ref: '#/components/schemas/Problem'}
                - type: object
                  properties:
                    reason:
                      type: [string, 'null']
                      enum: [CLEAR_VALUE_NOT_ALLOWED, null]
              example:
                type: about:blank
                title: Validation failed
                status: 400
                code: VALIDATION_FAILED
                correlationId: c-0f3e9a
                errors:
                - {field: amountPoisha, message: must be >= 1}
        '403':
          description: ACTOR_NOT_ALLOWED
          content:
            application/problem+json:
              schema: {$ref: '#/components/schemas/Problem'}
              example: {type: 'about:blank', title: Actor not allowed, status: 403, code: ACTOR_NOT_ALLOWED, correlationId: c-0f3e9a}
        '409':
          description: ACTIVE or PENDING_APPROVAL entry already exists for (type, hash); or IDEMPOTENCY_CONFLICT
          content:
            application/problem+json:
              schema:
