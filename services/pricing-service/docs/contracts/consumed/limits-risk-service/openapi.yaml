      x-idempotency: per item txnId (= ledger commandId); re-evaluating a held batch reservation returns the same decision and reservationId
      parameters:
      - {$ref: '#/components/parameters/XCorrelationId'}
      - {$ref: '#/components/parameters/XActorType'}
      - {$ref: '#/components/parameters/XActorId'}
      - {$ref: '#/components/parameters/XChannel'}
      - {$ref: '#/components/parameters/XActorRoles'}
      - {$ref: '#/components/parameters/XActorUserId'}
      description: <= 1,000 items, p95 <= 300 ms for 1,000. Blacklist covers WALLET, DEVICE, MSISDN, NID and PARTNER of both parties (OPEN D-29); MSISDN/NID/PARTNER checks need the wallet
        profile held locally, skipped + counted when absent. Batch reservations never auto-expire (OPEN D-14). The pricing-service caller is its campaign module.
      requestBody:
        required: true
        content:
          application/json:
            schema: {$ref: '#/components/schemas/BatchRequest'}
            example:
              dryRun: false
              items:
              - txnId: 0192f4d0-0000-7000-8000-000000000001
                txnType: DISBURSEMENT
                channel: API
                amountPoisha: 1500000
                from: {walletId: 0192f2ff-0000-7000-8000-0000000000f1, walletType: I, kycTier: 2, categoryCode: 401, flags: 0}
                to: {walletId: 0192f2bb-0000-7000-8000-00000000b002, walletType: C, kycTier: 1, categoryCode: 0, flags: 0}
                at: '2026-10-09T09:00:00.000Z'
      responses:
        '200':
          description: OK
          content:
            application/json:
              schema: {$ref: '#/components/schemas/BatchResponse'}
              example:
                items:
                - txnId: 0192f4d0-0000-7000-8000-000000000001
                  decision: ALLOW
                  reasonCodes: []
                  riskScore: 0
                  reservationId: 0192f4d0-0000-7000-8000-000000000001
                  receiverMaxBalancePoisha: 10000000
                  usage: {senderMonthlyCountForTxnType: 0}
                  violatedLimit: null
              x-additional-examples:
                campaignRewardLimitExceeded:
                  items:
                  - txnId: 0192f4d0-0000-7000-8000-000000000002
                    decision: LIMIT_EXCEEDED
                    reasonCodes: ['LIMIT:CAMPAIGN_REWARD_RECEIVE_DAILY_AMOUNT']
                    riskScore: 0
                    reservationId: null
                    receiverMaxBalancePoisha: 10000000
                    usage: {senderMonthlyCountForTxnType: null}
                    violatedLimit: {limitCode: CAMPAIGN_REWARD_RECEIVE_DAILY_AMOUNT, party: TO, walletId: 0192f2bb-0000-7000-8000-00000000b002, scope: CAMPAIGN_REWARD, direction: RECEIVE,
                      dimension: DAILY_AMOUNT, layer: TIER, limitValue: 100000, currentValue: 90000, attemptedValue: 20000, remainingValue: 10000, resetsAt: '2026-10-09T18:00:00.000Z'}
                dryRun:
                  items:
                  - txnId: 0192f4d0-0000-7000-8000-000000000001
                    decision: ALLOW
                    reasonCodes: []
                    riskScore: 0
                    reservationId: null
                    receiverMaxBalancePoisha: 10000000
                    usage: {senderMonthlyCountForTxnType: 0}
                    violatedLimit: null
        '400':
          description: '> 1,000 items, duplicate txnId, misuse of walletType S'
          content:
            application/problem+json:
              schema:
                allOf:
                - {$ref: '#/components/schemas/Problem'}
                - type: object
                  properties:
                    reason:
