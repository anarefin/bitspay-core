      - type: STAFF
        roles: [OPS_MAKER, OPS_CHECKER, RISK_ANALYST]
      x-idempotency: intrinsic per txnId; always 200 for a well-formed call
      parameters:
      - {$ref: '#/components/parameters/XCorrelationId'}
      - {$ref: '#/components/parameters/XActorType'}
      - {$ref: '#/components/parameters/XActorId'}
      - {$ref: '#/components/parameters/XChannel'}
      - {$ref: '#/components/parameters/XActorRoles'}
      - {$ref: '#/components/parameters/XActorUserId'}
      - {$ref: '#/components/parameters/TxnId'}
      description: p95 <= 20 ms. STAFF releases are audited. Callers retry until a final state.
      requestBody:
        required: false
