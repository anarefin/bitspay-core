openapi: 3.1.0
info: {title: limits-risk-service, version: 1.0.0, description: 'Bits Pay SVC-05 limits & risk. contractVersion 1.0.0, kernel 1.0. Headers, problem body, pagination and idempotency per
    kernel K3. No operation moves money; Idempotency-Key is never required (optional where stated). x-actors lists allowed actor types; for SERVICE the allowed X-Actor-Id values; for
    STAFF the roles (''*'' = any staff role).'}
servers:
- {url: 'http://localhost:8105', description: local}
tags:
- {name: risk}
- {name: limits}
- {name: lists}
- {name: limits-config}
- {name: fraud-rules}
- {name: approvals}
- {name: internal}
paths:
  /v1/risk/evaluate:
    post:
      operationId: evaluateRisk
      summary: 'Evaluate one payment: emergency controls, blacklist, limits (check-and-reserve), fraud rules'
      tags: [risk]
      x-audience: service
      x-actors:
      - type: SERVICE
        ids: [transaction-service]
      x-idempotency: per txnId (re-evaluating a held reservation returns the same decision and reservationId, counts nothing twice)
      parameters:
      - {$ref: '#/components/parameters/XCorrelationId'}
      - {$ref: '#/components/parameters/XActorType'}
      - {$ref: '#/components/parameters/XActorId'}
      - {$ref: '#/components/parameters/XChannel'}
      - {$ref: '#/components/parameters/XActorRoles'}
      - {$ref: '#/components/parameters/XActorUserId'}
      description: 'p95 <= 50 ms (limits part <= 10 ms). HTTP 200 for every decision. Caller read timeout 150 ms, no retry. Unknown request fields are ignored. Examples of other decisions:
        LIMIT_EXCEEDED -> violatedLimit object; BLOCK -> reasonCodes [BLACKLIST:DEVICE:FROM], riskScore 100, usage {senderMonthlyCountForTxnType: null}.'
      requestBody:
        required: true
        content:
          application/json:
            schema: {$ref: '#/components/schemas/EvaluateRequest'}
            example:
              txnId: 0192f3c1-7a2b-7c00-9a51-3f2c8e1d0a11
              txnType: P2P
              channel: APP
              deviceId: d-123
              amountPoisha: 50000
              from: {walletId: 0192f2aa-0000-7000-8000-00000000a001, walletType: C, kycTier: 2, categoryCode: 0, flags: 0}
              to: {walletId: 0192f2bb-0000-7000-8000-00000000b002, walletType: C, kycTier: 1, categoryCode: 0, flags: 0}
              at: '2026-10-09T08:03:22.000Z'
              context: null
      responses:
        '200':
          description: OK
          content:
            application/json:
              schema: {$ref: '#/components/schemas/EvaluateResponse'}
              example:
                decision: ALLOW
                reasonCodes: []
                riskScore: 12
                reservationId: 0192f3c1-7a2b-7c00-9a51-3f2c8e1d0a11
                receiverMaxBalancePoisha: 10000000
                usage: {senderMonthlyCountForTxnType: 7}
                violatedLimit: null
              x-additional-examples:
                limitExceeded:
                  decision: LIMIT_EXCEEDED
                  reasonCodes: ['LIMIT:P2P_RECEIVE_DAILY_AMOUNT']
                  riskScore: 0
                  reservationId: null
                  receiverMaxBalancePoisha: 10000000
                  usage: {senderMonthlyCountForTxnType: 7}
                  violatedLimit: {limitCode: P2P_RECEIVE_DAILY_AMOUNT, party: TO, walletId: 0192f2bb-0000-7000-8000-00000000b002, scope: P2P, direction: RECEIVE, dimension: DAILY_AMOUNT,
                    layer: TIER, limitValue: 5000000, currentValue: 4980000, attemptedValue: 50000, remainingValue: 20000, resetsAt: '2026-10-09T18:00:00.000Z'}
                blacklistBlock:
                  decision: BLOCK
                  reasonCodes: ['BLACKLIST:DEVICE:FROM']
                  riskScore: 100
                  reservationId: null
                  receiverMaxBalancePoisha: null
                  usage: {senderMonthlyCountForTxnType: null}
                  violatedLimit: null
                fraudHold:
                  decision: HOLD
                  reasonCodes: [FR-NEWDEV-001, FR-BEN-001]
                  riskScore: 75
                  reservationId: null
                  receiverMaxBalancePoisha: 10000000
                  usage: {senderMonthlyCountForTxnType: 7}
                  violatedLimit: null
                emergencyFreeze:
                  decision: SERVICE_DISABLED
                  reasonCodes: ['EMERGENCY:EC-000017']
                  riskScore: 0
                  reservationId: null
                  receiverMaxBalancePoisha: null
                  usage: {senderMonthlyCountForTxnType: null}
                  violatedLimit: null
                allowAndAlert:
                  decision: ALLOW_AND_ALERT
                  reasonCodes: [FR-VEL-001]
                  riskScore: 30
                  reservationId: 0192f3c1-7a2b-7c00-9a51-3f2c8e1d0a11
                  receiverMaxBalancePoisha: 10000000
                  usage: {senderMonthlyCountForTxnType: 7}
                  violatedLimit: null
        '400':
          description: VALIDATION_FAILED
          content:
            application/problem+json:
              schema:
                allOf:
                - {$ref: '#/components/schemas/Problem'}
                - type: object
                  properties:
                    reason:
                      type: [string, 'null']
                      enum: [SYSTEM_PARTY_NOT_ALLOWED, null]
              example:
                type: about:blank
                title: Validation failed
                status: 400
                code: VALIDATION_FAILED
                correlationId: c-0f3e9a
                errors:
                - {field: amountPoisha, message: must be >= 1}
        '403':
          description: ACTOR_NOT_ALLOWED
          content:
            application/problem+json:
              schema: {$ref: '#/components/schemas/Problem'}
              example: {type: 'about:blank', title: Actor not allowed, status: 403, code: ACTOR_NOT_ALLOWED, correlationId: c-0f3e9a}
        '409':
          description: 'STATE_CONFLICT: txnId already released or expired (a txnId is never re-used)'
          content:
            application/problem+json:
              schema:
                allOf:
                - {$ref: '#/components/schemas/Problem'}
                - type: object
                  properties:
                    reason:
                      type: [string, 'null']
                      enum: [TXN_ID_RELEASED, null]
              example: {type: 'about:blank', title: Reservation already released, status: 409, code: STATE_CONFLICT, reason: TXN_ID_RELEASED, correlationId: c-0f3e9a}
        '503':
          description: Counter store unavailable / timeout, aggregate store unavailable with on-aggregate-unavailable = REFUSE, or config not loaded
          content:
            application/problem+json:
              schema: {$ref: '#/components/schemas/Problem'}
              example: {type: 'about:blank', title: Dependency unavailable, status: 503, code: DEPENDENCY_UNAVAILABLE, correlationId: c-0f3e9a, retryable: true}
  /v1/risk/evaluate:batch:
