            RISK_HELD_FOR_REVIEW, WALLET_NOT_TRANSACTABLE, MAX_BALANCE_EXCEEDED, REFUND_EXCEEDS_ORIGINAL, SERVICE_DISABLED, MAKER_CHECKER_VIOLATION, DEPENDENCY_UNAVAILABLE]
        detail:
          type: [string, 'null']
          maxLength: 1000
        instance:
          type: [string, 'null']
        correlationId: {type: string}
        reason:
          type: [string, 'null']
          pattern: ^[A-Z][A-Z0-9_]*$
        errors:
          type: array
          items:
            type: object
            additionalProperties: true
            properties:
              field: {type: string}
              message: {type: string}
            required: [field, message]
          minItems: 1
        retryable: {type: boolean, const: true}
      required: [type, title, status, code, correlationId]
      description: Kernel K3.6 problem body
  parameters:
    XCorrelationId:
      name: X-Correlation-Id
      in: header
      required: true
      schema: {type: string, maxLength: 64, pattern: '^[A-Za-z0-9._-]+$'}
      description: generated if absent (kernel K3.1)
    XActorType:
      name: X-Actor-Type
      in: header
      required: true
      schema:
        type: string
        enum: [CUSTOMER, AGENT, MERCHANT, DISTRIBUTOR, INSTITUTION, STAFF, SYSTEM, SERVICE]
    XActorId:
      name: X-Actor-Id
      in: header
      required: true
      schema: {type: string, maxLength: 64}
    XChannel:
      name: X-Channel
      in: header
      required: true
      schema:
        type: string
        enum: [APP, USSD, PARTNER_APP, PORTAL, BACKOFFICE, API, SYSTEM]
    XActorRoles:
      name: X-Actor-Roles
      in: header
      required: false
      schema: {type: string}
      description: comma-separated K7 role codes; required for STAFF
    XActorWalletId:
      name: X-Actor-Wallet-Id
      in: header
      required: false
      schema: {type: string, pattern: '^[0-9a-f]{8}-[0-9a-f]{4}-[0-9a-f]{4}-[0-9a-f]{4}-[0-9a-f]{12}$'}
      description: required for wallet-holder actors
    XActorUserId:
      name: X-Actor-User-Id
      in: header
      required: false
      schema: {type: string, maxLength: 64, pattern: '^[A-Za-z0-9_-]+$'}
    IdempotencyKey:
      name: Idempotency-Key
      in: header
      required: false
      schema: {type: string, maxLength: 64, pattern: '^[A-Za-z0-9_-]+$'}
      description: optional; retained >= 7 days (kernel K3.3, OPEN D-01)
    IfMatch:
      name: If-Match
      in: header
      required: true
      schema: {type: string, pattern: '^[0-9]+$'}
      description: current row version of the DRAFT
    Limit:
      name: limit
      in: query
      required: false
      schema: {type: integer, minimum: 1, maximum: 200, default: 50}
    Cursor:
      name: cursor
      in: query
      required: false
      schema: {type: string}
    WalletId:
      name: walletId
      in: path
      required: true
      schema: {type: string, format: uuid, pattern: '^[0-9a-f]{8}-[0-9a-f]{4}-[0-9a-f]{4}-[0-9a-f]{4}-[0-9a-f]{12}$'}
    TxnId:
      name: txnId
      in: path
      required: true
      schema: {type: string, format: uuid, pattern: '^[0-9a-f]{8}-[0-9a-f]{4}-[0-9a-f]{4}-[0-9a-f]{4}-[0-9a-f]{12}$'}
    Id:
      name: id
      in: path
      required: true
      schema: {type: string, format: uuid, pattern: '^[0-9a-f]{8}-[0-9a-f]{4}-[0-9a-f]{4}-[0-9a-f]{4}-[0-9a-f]{12}$'}
    RuleId:
      name: ruleId
