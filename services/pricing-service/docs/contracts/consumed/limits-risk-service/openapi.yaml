                  required: [reason, txnIds]
              example:
                type: about:blank
                title: Reservation already released
                status: 409
                code: STATE_CONFLICT
                reason: TXN_ID_RELEASED
                txnIds: [0192f4d0-0000-7000-8000-000000000002]
                correlationId: c-0f3e9a
        '503':
          description: Whole batch refused, nothing reserved
          content:
            application/problem+json:
              schema: {$ref: '#/components/schemas/Problem'}
              example: {type: 'about:blank', title: Dependency unavailable, status: 503, code: DEPENDENCY_UNAVAILABLE, correlationId: c-0f3e9a, retryable: true}
  /v1/limits/reservations/{txnId}:release:
