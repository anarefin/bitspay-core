    P400:
      description: Validation failed
      content:
        application/problem+json:
          schema:
            $ref: '#/components/schemas/Problem'
          example:
            type: about:blank
            title: Validation failed
            status: 400
            code: VALIDATION_FAILED
            detail: null
            instance: /v1/pricing/quote
            correlationId: c-0f3e9a
            reason: null
            errors:
            - field: amountPoisha
              message: must be between 1 and 10000000000000
    P403:
      description: Actor not allowed
      content:
        application/problem+json:
          schema:
            $ref: '#/components/schemas/Problem'
          example:
            type: about:blank
            title: Actor not allowed
            status: 403
            code: ACTOR_NOT_ALLOWED
            detail: null
            instance: /v1/pricing/quote
            correlationId: c-0f3e9a
            reason: null
    P404:
      description: Not found
      content:
        application/problem+json:
          schema:
            $ref: '#/components/schemas/Problem'
          example:
            type: about:blank
            title: Not found
            status: 404
            code: NOT_FOUND
            detail: null
            instance: /v1/pricing/quote
            correlationId: c-0f3e9a
            reason: null
    P409:
      description: Conflict (STATE_CONFLICT or IDEMPOTENCY_CONFLICT)
      content:
        application/problem+json:
          schema:
            $ref: '#/components/schemas/Problem'
          example:
            type: about:blank
            title: Conflict (STATE_CONFLICT or IDEMPOTENCY_CONFLICT)
            status: 409
            code: STATE_CONFLICT
            detail: null
            instance: /v1/pricing/quote
            correlationId: c-0f3e9a
            reason: null
    P422:
      description: Business refusal (MAKER_CHECKER_VIOLATION, SERVICE_DISABLED or INSUFFICIENT_FUNDS)
      content:
        application/problem+json:
          schema:
            $ref: '#/components/schemas/Problem'
          example:
            type: about:blank
            title: Business refusal (MAKER_CHECKER_VIOLATION, SERVICE_DISABLED or INSUFFICIENT_FUNDS)
            status: 422
            code: MAKER_CHECKER_VIOLATION
            detail: null
            instance: /v1/pricing/quote
            correlationId: c-0f3e9a
            reason: null
    P503:
      description: Dependency unavailable; retry
      content:
        application/problem+json:
          schema:
            $ref: '#/components/schemas/Problem'
          example:
            type: about:blank
            title: Dependency unavailable; retry
            status: 503
            code: DEPENDENCY_UNAVAILABLE
            detail: null
            instance: /v1/pricing/quote
            correlationId: c-0f3e9a
            reason: null
            retryable: true
