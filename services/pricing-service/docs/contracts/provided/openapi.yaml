openapi: 3.1.0
info:
  title: pricing-service
  version: 1.1.0
  description: 'Provided API of pricing-service (modules pricing and campaign). Kernel 1.0: headers K3.1, idempotency K3.3, pagination K3.4, problem K3.6. x-audience
    = service|staff|customer|partner|internal; x-actors = allowed actor types/roles (serviceActorIds ''*'' = any SERVICE caller); x-problem-reasons = provider-owned
    problem.reason values per HTTP status; x-module = owning module.'
servers:
- url: http://localhost:8106
tags:
- name: pricing-quote
- name: pricing-plans
- name: pricing-internal
- name: commission-rules
- name: commissions
- name: settlements
- name: adjustments
- name: approvals
- name: campaigns
- name: segments
- name: rewards
- name: wallet-offers
- name: referrals
- name: draws
- name: campaign-internal
paths:
  /v1/approvals:
    get:
      operationId: listApprovals
      summary: List approval requests (both modules)
      tags:
      - approvals
      x-audience: staff
      x-actors:
      - types:
        - STAFF
        roles:
        - '*'
      x-module: shared
      x-idempotency: none
      parameters:
      - name: status
        in: query
        required: false
        schema:
          type: string
          enum:
          - PENDING
          - APPROVED
          - REJECTED
          - EXPIRED
          - CANCELLED
      - name: entityType
        in: query
        required: false
        schema:
          type: string
      - name: limit
        in: query
        required: false
        schema:
          type: integer
          format: int32
          minimum: 1
          maximum: 200
          default: 50
        description: 1..200, default 50
      - name: cursor
        in: query
        required: false
        schema:
          type: string
        description: opaque, valid 24 h
      responses:
        '200':
          description: Success
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ApprovalPage'
              example:
                items:
                - approvalId: 0192f3d0-1b2c-7a00-8e11-4c5d6e7f8a9b
                  service: pricing-service
                  module: pricing
                  entityType: PricingPlanVersion
                  entityId: PLN-P2P-STD:4
                  action: ACTIVATE
                  makerId: 0192f001-0000-7000-8000-000000000001
                  checkerId: null
                  level: 1
                  requiredLevels: 1
                  checkerRoles:
                  - PRICING_CHECKER
                  amountPoisha: null
                  status: PENDING
                  summary: Activate PLN-P2P-STD v4
                  deepLink: /v1/approvals/0192f3d0-1b2c-7a00-8e11-4c5d6e7f8a9b
                  requestedAt: '2026-10-20T04:10:00.000Z'
                  decidedAt: null
                  expiresAt: '2026-10-23T04:10:00.000Z'
                nextCursor: null
        '400':
          $ref: '#/components/responses/P400'
        '403':
          $ref: '#/components/responses/P403'
      x-problem-reasons:
        '400':
        - INVALID_CURSOR
  /v1/approvals/{id}:approve:
    post:
      operationId: approve
      summary: Approve the current level
      tags:
      - approvals
      x-audience: staff
      x-actors:
      - types:
        - STAFF
        roles:
        - PRICING_CHECKER
        - FIN_CHECKER
        - OPS_CHECKER
        - RISK_CHECKER
      x-module: shared
      description: The caller's X-Actor-Roles must contain one of the current level's checkerRoles. On final approval the handler of the entityType runs in the same
        DB transaction.
      x-idempotency: none
      parameters:
      - name: id
        in: path
        required: true
        schema:
          type: string
          format: uuid
          pattern: ^[0-9a-f]{8}-[0-9a-f]{4}-[0-9a-f]{4}-[0-9a-f]{4}-[0-9a-f]{12}$
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/ApproveRequest'
            example:
              comment: Checked against fee schedule
      responses:
        '200':
          description: Success
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Approval'
              example:
                approvalId: 0192f3d0-1b2c-7a00-8e11-4c5d6e7f8a9b
                service: pricing-service
                module: pricing
                entityType: PricingPlanVersion
                entityId: PLN-P2P-STD:4
                action: ACTIVATE
                makerId: 0192f001-0000-7000-8000-000000000001
                checkerId: 0192f001-0000-7000-8000-000000000002
                level: 1
                requiredLevels: 1
                checkerRoles:
                - PRICING_CHECKER
                amountPoisha: null
                status: APPROVED
                summary: Activate PLN-P2P-STD v4
                deepLink: /v1/approvals/0192f3d0-1b2c-7a00-8e11-4c5d6e7f8a9b
                requestedAt: '2026-10-20T04:10:00.000Z'
                decidedAt: '2026-10-20T06:00:00.000Z'
                expiresAt: '2026-10-23T04:10:00.000Z'
        '400':
          $ref: '#/components/responses/P400'
        '403':
          $ref: '#/components/responses/P403'
        '404':
          $ref: '#/components/responses/P404'
        '409':
          $ref: '#/components/responses/P409'
        '422':
          $ref: '#/components/responses/P422'
      x-problem-reasons:
        '409':
        - NOT_PENDING
        - APPROVAL_EXPIRED
        - BACKDATING_NOT_ALLOWED
        - GOLDEN_SELF_CHECK_FAILED
        - REVALIDATION_FAILED
        '422':
        - CHECKER_IS_MAKER
        - CHECKER_ALREADY_DECIDED
        - CAMPAIGN_FUNDING_INSUFFICIENT
  /v1/approvals/{id}:reject:
    post:
      operationId: reject
      summary: Reject the current level
      tags:
      - approvals
      x-audience: staff
      x-actors:
      - types:
        - STAFF
        roles:
        - PRICING_CHECKER
        - FIN_CHECKER
        - OPS_CHECKER
        - RISK_CHECKER
      x-module: shared
      x-idempotency: none
      parameters:
      - name: id
        in: path
        required: true
        schema:
          type: string
          format: uuid
          pattern: ^[0-9a-f]{8}-[0-9a-f]{4}-[0-9a-f]{4}-[0-9a-f]{4}-[0-9a-f]{12}$
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/RejectRequest'
            example:
              comment: Fee exceeds the regulatory cap
              reasonCode: null
      responses:
        '200':
          description: Success
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Approval'
              example:
                approvalId: 0192f3d0-1b2c-7a00-8e11-4c5d6e7f8a9b
                service: pricing-service
                module: pricing
                entityType: PricingPlanVersion
                entityId: PLN-P2P-STD:4
                action: ACTIVATE
                makerId: 0192f001-0000-7000-8000-000000000001
                checkerId: 0192f001-0000-7000-8000-000000000002
                level: 1
                requiredLevels: 1
                checkerRoles:
                - PRICING_CHECKER
                amountPoisha: null
                status: REJECTED
                summary: Activate PLN-P2P-STD v4
                deepLink: /v1/approvals/0192f3d0-1b2c-7a00-8e11-4c5d6e7f8a9b
                requestedAt: '2026-10-20T04:10:00.000Z'
                decidedAt: '2026-10-20T06:00:00.000Z'
                expiresAt: '2026-10-23T04:10:00.000Z'
        '400':
          $ref: '#/components/responses/P400'
        '403':
          $ref: '#/components/responses/P403'
        '404':
          $ref: '#/components/responses/P404'
        '409':
          $ref: '#/components/responses/P409'
        '422':
          $ref: '#/components/responses/P422'
      x-problem-reasons:
        '409':
        - NOT_PENDING
        - APPROVAL_EXPIRED
        '422':
        - CHECKER_IS_MAKER
