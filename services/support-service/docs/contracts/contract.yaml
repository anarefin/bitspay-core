# support-service — contract manifest (CONTRACT-MODEL §3). Mirror: SPEC.md §5 (provides) and §6 (consumes).
service: support-service
number: "09"
modules: []
contractVersion: 1.0.0
kernel: "1.0"
owner: Dev-3

provides:
  apis:
    - openapi: provided/openapi.yaml
      major: 1
      # every operation in the openapi is provided; x-audience / x-actors per operation
  events:
    - topic: support.events
      key: "ticketId"
      aggregateType: Ticket
      compacted: false
      tombstones: false
      partitions: {dev: 3, prod: 6}
      retention: 7d
      transport: outbox
      ordering: "per ticket (key = ticketId)"
      eventTypes:
        - {type: TICKET_CREATED, version: 1, aggregateType: Ticket, schema: provided/events/support.events/TICKET_CREATED.v1.schema.json}
        - {type: TICKET_STATUS_CHANGED, version: 1, aggregateType: Ticket, schema: provided/events/support.events/TICKET_STATUS_CHANGED.v1.schema.json}
        - {type: DISPUTE_OPENED, version: 1, aggregateType: Ticket, schema: provided/events/support.events/DISPUTE_OPENED.v1.schema.json}
        - {type: DISPUTE_RESOLVED, version: 1, aggregateType: Ticket, schema: provided/events/support.events/DISPUTE_RESOLVED.v1.schema.json}
        - {type: REVERSAL_REQUESTED, version: 1, aggregateType: Ticket, schema: provided/events/support.events/REVERSAL_REQUESTED.v1.schema.json}
        - {type: REVERSAL_COMPLETED, version: 1, aggregateType: Ticket, schema: provided/events/support.events/REVERSAL_COMPLETED.v1.schema.json}
  inboundTopics: []
  data: []
  codes: provided/codes.yaml

consumes:
  apis:
    # ---------------- transaction-service ----------------
    - producer: transaction-service
      operation: "POST /v1/internal/reversals"
      major: 1
      pinnedContractVersion: 1.0.0
      purpose: "execute an APPROVED reversal request (reversal-executor only); one Idempotency-Key per attempt rev-{reversalRequestId}-{attempt}"
      identity: "X-Actor-Type SERVICE, X-Actor-Id support-service"
      fieldsUsed:
        - header.Idempotency-Key
        - req.originalTxnRef
        - req.reasonCode
        - req.reverseFee
        - req.reverseCommission
        - req.releaseHoldCommandId
        - req.approvalId
        - req.amountPoisha
        - res.txnRef
        - res.status
        - res.amountPoisha
        - res.feePoisha
        - res.vatPoisha
        - res.completedAt
        - problem.transaction.failureCode
      codesUsed:
        - {set: "reason:Reversal", values: [WRONG_TRANSFER, DISPUTE_UPHELD, SYSTEM_ERROR, FRAUD_CONFIRMED]}
        - {set: failureCode, values: [LEDGER_HOLD_NOT_FOUND]}
      resilience: {connectTimeoutMs: 300, timeoutMs: 3000, circuitBreaker: true, retries: "same key only after 503/timeout/5xx/connection failure; backoff 10 s → 1 h, no limit, alert after 30 min", onFailure: "request stays EXECUTING (unknown outcome); definitive 4xx/422 mapped per SPEC BR-S-34"}
    - producer: transaction-service
      operation: "GET /v1/transactions/{txnRef}"
      major: 1
      pinnedContractVersion: 1.0.0
      purpose: "dispute / reversal eligibility, pre-execution re-check, 409 reconciliation, enquiry, receipt resend"
      identity: "forwarded caller: STAFF headers, or the CUSTOMER / MERCHANT / AGENT caller's own X-Actor-Type, X-Actor-Id, X-Actor-Wallet-Id; jobs: SERVICE support-service"
      fieldsUsed:
        - path.txnRef
        - res.txnId
        - res.txnRef
        - res.txnType
        - res.status
        - res.amountPoisha
        - res.feePoisha
        - res.vatPoisha
        - res.fromWalletId
        - res.toWalletId
        - res.channel
        - res.createdAt
        - res.completedAt
        - res.originalTxnRef
        - res.reversalTxnRef
        - res.reversedAmountPoisha
      codesUsed:
        - {set: transactionStatus, values: [INITIATED, COMPLETED, FAILED, REVERSED, PARTIALLY_REFUNDED, REFUNDED]}
        - {set: txnType, values: [P2P, CASH_IN, CASH_OUT, MERCHANT_PAYMENT, MERCHANT_REFUND, FLOAT_TRANSFER, REVERSAL]}
      resilience: {connectTimeoutMs: 300, timeoutMs: 1000, circuitBreaker: true, onFailure: "503 DEPENDENCY_UNAVAILABLE to the caller (nothing created); executor pre-check stays APPROVED; 404 → history lookup fallback"}
    - producer: transaction-service
      operation: "GET /v1/transactions"
      major: 1
      pinnedContractVersion: 1.0.0
      purpose: "customer 360 transactions section and enquiry within the 30-day hot window"
      identity: "forwarded STAFF headers"
      fieldsUsed:
        - query.walletId
        - query.fromTs
        - query.toTs
        - query.txnType
        - query.status
        - query.limit
        - query.cursor
        - res.items[].txnRef
        - res.items[].txnType
        - res.items[].status
        - res.items[].direction
        - res.items[].amountPoisha
        - res.items[].feePoisha
        - res.items[].vatPoisha
        - res.items[].fromWalletId
        - res.items[].toWalletId
        - res.items[].channel
        - res.items[].createdAt
        - res.items[].completedAt
        - res.items[].originalTxnRef
        - res.items[].reversalTxnRef
        - res.nextCursor
      codesUsed: []
      resilience: {connectTimeoutMs: 300, timeoutMs: 800, circuitBreaker: true, onFailure: "360 section TIMEOUT / UNAVAILABLE; enquiry 503"}
    # ---------------- ledger-service ----------------
    - producer: ledger-service
      operation: "POST /v1/ledger/commands/create-hold"
      major: 1
      pinnedContractVersion: 1.0.0
      purpose: "command type 14 — dispute / wrong-transfer hold on the counterparty wallet"
      identity: "X-Actor-Type SERVICE, X-Actor-Id support-service; Idempotency-Key = commandId (informational)"
      fieldsUsed: [req.commandId, req.accountId, req.amountPoisha, req.reasonCode, res.commandId, res.result, res.rejectionCode, res.transferIds, res.postedAt]
      codesUsed:
        - {set: commandResult, values: [OK, EXISTS, REJECTED]}
        - {set: rejectionCode, values: "*"}
        - {set: "reason:Hold", values: [DISPUTE_HOLD, WRONG_TRANSFER_HOLD]}
      resilience: {connectTimeoutMs: 300, timeoutMs: 1000, circuitBreaker: true, retries: "same commandId and body after 503/timeout (create ≤ 10 min, release unbounded)", onFailure: "hold REQUESTED / RELEASE_REQUESTED, retried by the hold job"}
    - producer: ledger-service
      operation: "POST /v1/ledger/commands/release-hold"
      major: 1
      pinnedContractVersion: 1.0.0
      purpose: "command type 15 — release a hold created by support (holdCommandId = the create-hold commandId)"
      identity: "X-Actor-Type SERVICE, X-Actor-Id support-service; Idempotency-Key = commandId (informational)"
      fieldsUsed: [req.commandId, req.holdCommandId, res.commandId, res.result, res.rejectionCode, res.transferIds, res.postedAt]
      codesUsed:
        - {set: commandResult, values: [OK, EXISTS, REJECTED]}
        - {set: rejectionCode, values: "*"}
      resilience: {connectTimeoutMs: 300, timeoutMs: 1000, circuitBreaker: true, retries: "same commandId and body after 503/timeout (create ≤ 10 min, release unbounded)", onFailure: "hold REQUESTED / RELEASE_REQUESTED, retried by the hold job"}
    - producer: ledger-service
      operation: "GET /v1/ledger/accounts/{id}/balance"
      major: 1
      pinnedContractVersion: 1.0.0
      purpose: "hold sizing, reversal funds pre-check, customer 360 balances (never cached)"
      identity: "X-Actor-Type SERVICE, X-Actor-Id support-service"
      fieldsUsed: [path.id, res.availableBalancePoisha, res.ledgerBalancePoisha, res.heldPoisha, res.asOf, res.closed]
      codesUsed: []
      resilience: {connectTimeoutMs: 300, timeoutMs: 800, circuitBreaker: true, onFailure: "hold placement 503; executor stays APPROVED; 360 section UNAVAILABLE"}
    - producer: ledger-service
      operation: "GET /v1/ledger/holds"
      major: 1
      pinnedContractVersion: 1.0.0
      purpose: "customer 360 holds section (passed through) and reconciliation of own holds (createdBy = support-service)"
      identity: "X-Actor-Type SERVICE, X-Actor-Id support-service"
      fieldsUsed: [query.accountId, res.items, res.totalHeldPoisha]
      codesUsed: []
      resilience: {connectTimeoutMs: 300, timeoutMs: 800, circuitBreaker: true, onFailure: "360 section UNAVAILABLE"}
    # ---------------- wallet-service ----------------
    - producer: wallet-service
      operation: "GET /v1/wallets/lookup"
      major: 1
      pinnedContractVersion: 1.0.0
      purpose: "resolve an MSISDN to a wallet (ticket linking, 360, enquiry by msisdn)"
      identity: "forwarded STAFF headers (SERVICE support-service from event consumers / jobs)"
      fieldsUsed: [query.msisdn, query.walletType, res.walletId, res.displayNameMasked, res.walletType, res.status]
      codesUsed: [{set: walletStatus, values: "*"}]
      resilience: {connectTimeoutMs: 300, timeoutMs: 500, circuitBreaker: true, onFailure: "fallback to local wallet_projection; 404 → unlinked ticket / 360 404"}
    - producer: wallet-service
      operation: "GET /v1/wallets/{walletId}"
      major: 1
      pinnedContractVersion: 1.0.0
      purpose: "customer 360 wallets section, ticket linking"
      identity: "forwarded STAFF headers (downstream masking per staff roles)"
      fieldsUsed: [path.walletId, res.walletId, res.ownerType, res.ownerId, res.msisdn, res.displayName, res.language, res.status, res.statusReasonCode, res.kycTier, res.walletType, res.flags, res.version]
      codesUsed: [{set: walletStatus, values: "*"}]
      resilience: {connectTimeoutMs: 300, timeoutMs: 500, circuitBreaker: true, onFailure: "360 section UNAVAILABLE (403 → FORBIDDEN)"}
    - producer: wallet-service
      operation: "GET /v1/customers/{customerId}"
      major: 1
      pinnedContractVersion: 1.0.0
      purpose: "customer 360 profile section"
      identity: "forwarded STAFF headers (downstream masking per staff roles; NID never in clear)"
      fieldsUsed: [path.customerId, res.customerId, res.status, res.msisdn, res.nameEn, res.nidMasked, res.kycTier, res.kycStatus, res.riskGrade, res.language, res.wallets]
      codesUsed: []
      resilience: {connectTimeoutMs: 300, timeoutMs: 500, circuitBreaker: true, onFailure: "360 section UNAVAILABLE (403 → FORBIDDEN)"}
    - producer: wallet-service
      operation: "POST /v1/wallets/{walletId}/status-changes"
      major: 1
      pinnedContractVersion: 1.0.0
      purpose: "BLOCK_WALLET / UNBLOCK_WALLET service actions forwarded with the staff member's own identity (wallet-service runs the maker-checker)"
      identity: "forwarded STAFF headers (X-Actor-Type STAFF, X-Actor-Id staffUserId, X-Actor-Roles); Idempotency-Key sa-{actionId}"
      fieldsUsed: [path.walletId, header.Idempotency-Key, req.targetStatus, req.reasonCode, req.reference, req.comment, res.changeRequestId, res.outcome, res.approvalId, res.walletStatus]
      codesUsed:
        - {set: walletStatusReason, values: [CUSTOMER_REQUEST]}
        - {set: statusChangeOutcome, values: [APPLIED, PENDING_APPROVAL, NOOP]}
      resilience: {connectTimeoutMs: 300, timeoutMs: 1000, circuitBreaker: true, onFailure: "service action FAILED (staff retries with the same key)"}
    - producer: wallet-service
      operation: "POST /v1/wallets/{walletId}/flags"
      major: 1
      pinnedContractVersion: 1.0.0
      purpose: "set flag 8 (HAS_OPEN_LIEN) after a support hold becomes ACTIVE; clear it when the last support hold on the wallet leaves ACTIVE"
      identity: "X-Actor-Type SERVICE, X-Actor-Id support-service (holder = support-service)"
      fieldsUsed: [path.walletId, req.set, req.clear, req.reasonCode, res.flags]
      codesUsed: [{producer: ledger-service, set: "reason:Hold", values: [DISPUTE_HOLD, WRONG_TRANSFER_HOLD]}]
      resilience: {connectTimeoutMs: 300, timeoutMs: 1000, circuitBreaker: true, onFailure: "flag_set stays false; retried by the hold job (non-blocking)"}
    - producer: wallet-service
      operation: "PATCH /v1/customers/{customerId}"
      major: 1
      pinnedContractVersion: 1.0.0
      purpose: "UPDATE_CONTACT service action (contactUpdateMode WALLET_API, default) forwarded with the staff identity; wallet-service runs the maker-checker"
      identity: "forwarded STAFF headers; Idempotency-Key sa-{actionId}"
      fieldsUsed: [path.customerId, header.Idempotency-Key, req.msisdn, req.email, req.presentAddress, req.occupation, req.incomeBand, req.sourceOfFunds, req.purposeOfAccount, req.reason, req.reference, res.changeRequestId, res.outcome, res.approvalId]
      codesUsed: []
      resilience: {connectTimeoutMs: 300, timeoutMs: 1000, circuitBreaker: true, onFailure: "service action FAILED (staff retries with the same key)"}
    # ---------------- limits-risk-service ----------------
    - producer: limits-risk-service
      operation: "GET /v1/limits/wallets/{walletId}/usage"
      major: 1
      pinnedContractVersion: 1.0.0
      purpose: "customer 360 limits section (passed through)"
      identity: "forwarded STAFF headers"
      fieldsUsed: [path.walletId, res.walletId, res.asOf, res.userCategory, res.kycTier, res.riskGrade, res.maxBalancePoisha, res.items]
      codesUsed: []
      resilience: {connectTimeoutMs: 300, timeoutMs: 500, circuitBreaker: true, onFailure: "404 / 503 → UNAVAILABLE; timeout → TIMEOUT; 403 → FORBIDDEN"}
    # ---------------- finance-ops-service ----------------
    - producer: finance-ops-service
      operation: "GET /v1/history/wallets/{walletId}"
      major: 1
      pinnedContractVersion: 1.0.0
      purpose: "enquiry and customer 360 older history for ranges older than the 30-day hot window"
      identity: "X-Actor-Type SERVICE, X-Actor-Id support-service (the only SERVICE caller)"
      fieldsUsed:
        - path.walletId
        - query.fromTs
        - query.toTs
        - query.txnType
        - query.status
        - query.minAmountPoisha
        - query.maxAmountPoisha
        - query.limit
        - query.cursor
        - res.items[].txnRef
        - res.items[].txnType
        - res.items[].status
        - res.items[].direction
        - res.items[].amountPoisha
        - res.items[].feePoisha
        - res.items[].vatPoisha
        - res.items[].totalDebitPoisha
        - res.items[].counterparty
        - res.items[].channel
        - res.items[].createdAt
        - res.items[].completedAt
        - res.items[].failureCode
        - res.items[].originalTxnRef
        - res.items[].source
        - res.nextCursor
      codesUsed: []
      resilience: {connectTimeoutMs: 300, timeoutMs: 3500, circuitBreaker: true, onFailure: "360 section UNAVAILABLE; enquiry 503; client disabled → NOT_CONFIGURED / 422 SERVICE_DISABLED HISTORY_NOT_CONFIGURED"}
    - producer: finance-ops-service
      operation: "GET /v1/history/transactions/{txnRef}"
      major: 1
      pinnedContractVersion: 1.0.0
      purpose: "single-reference enquiry when transaction-service returns 404 or the prefix is not a transaction-service prefix"
      identity: "X-Actor-Type SERVICE, X-Actor-Id support-service"
      fieldsUsed: [path.txnRef, res.txnRef, res.txnType, res.status, res.direction, res.amountPoisha, res.feePoisha, res.vatPoisha, res.totalDebitPoisha, res.counterparty, res.channel, res.createdAt, res.completedAt, res.failureCode, res.originalTxnRef, res.source]
      codesUsed: []
      resilience: {connectTimeoutMs: 300, timeoutMs: 3500, circuitBreaker: true, onFailure: "404 to the caller; 503 → 503"}
    # ---------------- admin-service ----------------
    - producer: admin-service
      operation: "GET /v1/notifications/logs"
      major: 1
      pinnedContractVersion: 1.0.0
      purpose: "customer 360 notifications section (last 30 days)"
      identity: "SERVICE support-service with the staff user's forwarded X-Actor-Roles"
      fieldsUsed: [query.walletId, query.from, query.to, query.limit, query.cursor, res.items, res.nextCursor]
      codesUsed: []
      resilience: {connectTimeoutMs: 300, timeoutMs: 800, circuitBreaker: true, onFailure: "403 → FORBIDDEN (no retry); timeout → TIMEOUT; else UNAVAILABLE; 400 → bug alert"}
    - producer: admin-service
      operation: "GET /v1/refdata/{type}"
      major: 1
      pinnedContractVersion: 1.0.0
      purpose: "bootstrap HOLIDAY, REASON_CODE and SYSTEM_PARAM items before refdata.events catches up"
      identity: "SYSTEM support-service"
      fieldsUsed: ["path.type", "query.limit", "query.cursor", "res.items[].type", "res.items[].code", "res.items[].attributes", "res.items[].version", "res.items[].active", "res.nextCursor"]
      codesUsed: [{set: refdataType, values: [HOLIDAY, REASON_CODE, SYSTEM_PARAM]}]
      resilience: {connectTimeoutMs: 300, timeoutMs: 2000, circuitBreaker: true, onFailure: "keep local fallbacks (SUPPORT_PARAMS); retry at next start-up / hourly"}
    - producer: admin-service
      operation: "GET /v1/retention/legal-holds"
      major: 1
      pinnedContractVersion: 1.0.0
      purpose: "R2: before purging a COMPLAINT record (ticket and its disputes, consents, attachments) skip it while an ACTIVE legal hold exists"
      identity: "SYSTEM support-service"
      fieldsUsed: ["query.subjectType", "query.subjectId", "query.category", "res.items[].holdId", "res.items[].category", "res.items[].subjectType", "res.items[].subjectId", "res.items[].status"]
      codesUsed: []
      resilience: {connectTimeoutMs: 300, timeoutMs: 2000, circuitBreaker: true, onFailure: "skip the purge for this run (never delete on unknown)"}

  events:
    - producer: transaction-service
      topic: txn.events
      eventType: TRANSACTION_REVERSED
      version: 1
      pinnedContractVersion: 1.0.0
      groupId: support-service
      purpose: "lost-response reconciliation of reversal requests; match reversal_request.original_txn_ref = data.txnRef (never originalTxnRef)"
      filter: "eventType = TRANSACTION_REVERSED; other txn.events types ignored (reason FILTERED)"
      fieldsUsed: [txnRef, txnId, status, reversalTxnRef, reversedAmountPoisha, reverseFee, reverseCommission]
      codesUsed: []
    - producer: wallet-service
      topic: wallet.events
      eventType: WALLET_UPSERTED
      version: 1
      pinnedContractVersion: 1.0.0
      groupId: support-service
      purpose: "local wallet_projection (MSISDN search by hash, display); version-guarded, no inbox"
      fieldsUsed: [walletId, version, ownerType, ownerId, walletType, msisdn, displayName, language, status, statusReasonCode]
      codesUsed: [{set: walletStatus, values: "*"}]
    - producer: compliance-service
      topic: case.events
      eventType: REVERSAL_RECOMMENDED
      version: 1
      pinnedContractVersion: 1.0.0
      groupId: support-service
      purpose: "open an internal REVERSAL_RECOMMENDATION ticket (no customer notification); never auto-reverse"
      filter: "eventType = REVERSAL_RECOMMENDED; other case.events types ignored (reason FILTERED)"
      fieldsUsed: [caseId, caseNo, domain, txnRef, walletIds, amountPoisha, reasonCode, recommendedAt]
      codesUsed: []
    - producer: admin-service
      topic: refdata.events
      eventType: REFDATA_UPSERTED
      version: 1
      pinnedContractVersion: 1.0.0
      groupId: support-service
      purpose: "business calendar (HOLIDAY, CALENDAR.*), reason-code validation (REASON_CODE), complaint retention (RETENTION.COMPLAINT)"
      filter: "type ∈ {HOLIDAY, REASON_CODE, SYSTEM_PARAM}; SYSTEM_PARAM code ∈ {CALENDAR.WEEKEND_DAYS, CALENDAR.TIMEZONE, RETENTION.COMPLAINT}"
      fieldsUsed: [type, code, attributes, version, active]
      codesUsed: [{set: refdataType, values: [HOLIDAY, REASON_CODE, SYSTEM_PARAM]}]
    - producer: admin-service          # schema owner of the inbound topic (O6); records written by wallet-service
      topic: approval.events
      eventType: APPROVAL_DECIDED
      version: 1
      pinnedContractVersion: 1.0.0
      groupId: support-service.approvals
      purpose: "complete forwarded wallet service actions (APPROVED → APPLIED; REJECTED / CANCELLED → FAILED)"
      filter: "data.service = wallet-service ∧ data.entityType ∈ {WalletStatusChange, CustomerProfile}; match data.approvalId to service_action.downstream_ref"
      fieldsUsed: [approvalId, service, entityType, status, level, requiredLevels]
      codesUsed:
        - {producer: wallet-service, set: entityTypes, values: [WalletStatusChange, CustomerProfile]}
    - producer: admin-service
      topic: approval.events
      eventType: APPROVAL_EXPIRED
      version: 1
      pinnedContractVersion: 1.0.0
      groupId: support-service.approvals
      purpose: "fail forwarded wallet service actions whose wallet-side approval expired"
      filter: "data.service = wallet-service ∧ data.entityType ∈ {WalletStatusChange, CustomerProfile}"
      fieldsUsed: [approvalId, service, entityType, status]
      codesUsed:
        - {producer: wallet-service, set: entityTypes, values: [WalletStatusChange, CustomerProfile]}

  inboundTopics:
    - owner: admin-service
      topic: notification.requests
      eventType: NOTIFICATION_REQUESTED
      version: 1
      pinnedContractVersion: 1.0.0
      fieldsUsed: ["*"]
      templates: [TXN_RECEIPT, FUNDS_HELD_NOTICE, FUNDS_RELEASED_NOTICE, TICKET_UPDATE, SUPPORT_ESCALATION]
    - owner: admin-service
      topic: approval.events
      eventType: APPROVAL_REQUESTED
      version: 1
      pinnedContractVersion: 1.0.0
      fieldsUsed: ["*"]
      entityTypes: [ReversalRequest, HoldExtension, ConfigDocument]
    - owner: admin-service
      topic: approval.events
      eventType: APPROVAL_DECIDED
      version: 1
      pinnedContractVersion: 1.0.0
      fieldsUsed: ["*"]
      entityTypes: [ReversalRequest, HoldExtension, ConfigDocument]
    - owner: admin-service
      topic: approval.events
      eventType: APPROVAL_EXPIRED
      version: 1
      pinnedContractVersion: 1.0.0
      fieldsUsed: ["*"]
      entityTypes: [ReversalRequest, HoldExtension, ConfigDocument]
    - owner: admin-service
      topic: audit.events
      eventType: AUDIT_RECORDED
      version: 1
      pinnedContractVersion: 1.0.0
      fieldsUsed: ["*"]
      auditActions: [TICKET_CREATED, TICKET_UPDATED, TICKET_ASSIGNED, TICKET_STATUS_CHANGED, TICKET_ESCALATED, TICKET_REOPENED, TICKET_COMMENTED, ATTACHMENT_UPLOADED, ATTACHMENT_DOWNLOADED, DISPUTE_OPENED, DISPUTE_RESOLVED, CONSENT_RECORDED, HOLD_PLACED, HOLD_RELEASED, HOLD_EXTENSION_REQUESTED, REVERSAL_REQUESTED, REVERSAL_APPROVAL_DECIDED, REVERSAL_EXECUTED, REVERSAL_CANCELLED, REVERSAL_RETRIED, SERVICE_ACTION_BLOCK_WALLET, SERVICE_ACTION_UNBLOCK_WALLET, SERVICE_ACTION_RESEND_RECEIPT, SERVICE_ACTION_PIN_RESET, SERVICE_ACTION_UNBIND_DEVICE, SERVICE_ACTION_UPDATE_CONTACT, CUSTOMER_360_VIEWED, CONFIG_VERSION_PROPOSED, CONFIG_ACTIVATED]

  data: []

  codes:
    - {producer: admin-service, set: refdataType, values: [HOLIDAY, REASON_CODE, SYSTEM_PARAM]}
    - {producer: wallet-service, set: entityTypes, values: [WalletStatusChange, CustomerProfile]}

  refdata:
    - {type: HOLIDAY, codes: "*"}
    - {type: REASON_CODE, codes: [WRONG_TRANSFER, DISPUTE_UPHELD, SYSTEM_ERROR, FRAUD_CONFIRMED, DISPUTE_HOLD, WRONG_TRANSFER_HOLD, CUSTOMER_REQUEST]}
    - {type: SYSTEM_PARAM, codes: ["CALENDAR.WEEKEND_DAYS", "CALENDAR.TIMEZONE", "RETENTION.COMPLAINT"]}
