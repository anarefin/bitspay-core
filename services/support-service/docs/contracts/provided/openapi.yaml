        createdAt:
          type: string
          format: date-time
          description: ISO-8601 UTC, millisecond precision, Z
        updatedAt:
          type: string
          format: date-time
          description: ISO-8601 UTC, millisecond precision, Z
      required:
      - configKey
      - configVersion
      - status
      - payload
      - makerId
      - approvalId
      - createdAt
      - updatedAt
    ConfigVersionPage:
      type: object
      properties:
        items:
          type: array
