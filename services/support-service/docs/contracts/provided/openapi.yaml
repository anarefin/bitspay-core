          maxLength: 500
      required:
      - payload
      - comment
    ConfigVersionAccepted:
      type: object
      properties:
        configKey:
          type: string
          enum:
          - CATEGORIES
          - SLA_POLICY
          - ESCALATION
          - HOLD_POLICY
          - REVERSAL_POLICY
          - MASKING_POLICY
          - SUPPORT_PARAMS
        configVersion:
          type: integer
          format: int32
          minimum: 1
        status:
          type: string
          enum:
          - PENDING_APPROVAL
        approvalId:
          type: string
          format: uuid
          pattern: ^[0-9a-f]{8}-[0-9a-f]{4}-[0-9a-f]{4}-[0-9a-f]{4}-[0-9a-f]{12}$
      required:
      - configKey
      - configVersion
      - status
      - approvalId
  parameters:
    XCorrelationId:
      name: X-Correlation-Id
      in: header
      required: false
      schema:
        type: string
        maxLength: 64
        pattern: ^[A-Za-z0-9._-]+$
      description: generated if absent (kernel K3.1)
    XActorType:
      name: X-Actor-Type
      in: header
      required: true
      schema:
        type: string
        enum:
        - CUSTOMER
        - AGENT
        - MERCHANT
        - DISTRIBUTOR
        - INSTITUTION
        - STAFF
        - SYSTEM
        - SERVICE
      description: kernel K3.1
    XActorId:
      name: X-Actor-Id
      in: header
      required: true
      schema:
        type: string
        maxLength: 64
      description: kernel K3.1
    XActorWalletId:
      name: X-Actor-Wallet-Id
      in: header
      required: false
      schema:
        type: string
        format: uuid
        pattern: ^[0-9a-f]{8}-[0-9a-f]{4}-[0-9a-f]{4}-[0-9a-f]{4}-[0-9a-f]{12}$
      description: wallet holders
    XActorRoles:
      name: X-Actor-Roles
      in: header
      required: false
      schema:
        type: string
      description: 'STAFF: comma-separated K7 role codes'
    XActorUserId:
      name: X-Actor-User-Id
      in: header
      required: false
      schema:
        type: string
        maxLength: 64
        pattern: ^[A-Za-z0-9_-]+$
      description: partner sub-user; maker ≠ checker only
    XChannel:
      name: X-Channel
      in: header
      required: true
      schema:
        type: string
        enum:
        - APP
        - USSD
        - PARTNER_APP
        - PORTAL
        - BACKOFFICE
        - API
        - SYSTEM
      description: closed list
    IdempotencyKey:
      name: Idempotency-Key
      in: header
      required: true
      schema:
        type: string
        maxLength: 64
        pattern: ^[A-Za-z0-9_-]+$
      description: required; scope (X-Actor-Id, key); retention ≥ 7 d (kernel K3.3)
    limit:
      name: limit
      in: query
      required: false
      schema:
        type: integer
        format: int32
        minimum: 1
        maximum: 200
        default: 50
    cursor:
      name: cursor
      in: query
      required: false
      schema:
        type: string
      description: opaque, 24 h
