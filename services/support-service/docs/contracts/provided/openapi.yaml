components:
  schemas:
    Problem:
      type: object
      additionalProperties: true
      description: RFC 9457 problem (kernel K3.6). Extension members per operation.
      required:
      - type
      - title
      - status
      - code
      - correlationId
      properties:
        type:
          type: string
          description: URI; default about:blank
        title:
          type: string
          maxLength: 200
        status:
          type: integer
          format: int32
        code:
          type: string
          enum:
          - VALIDATION_FAILED
          - ACTOR_NOT_ALLOWED
          - NOT_FOUND
          - IDEMPOTENCY_CONFLICT
          - STATE_CONFLICT
          - SOD_VIOLATION
          - INSUFFICIENT_FUNDS
          - LIMIT_EXCEEDED
          - RISK_BLOCKED
          - RISK_STEP_UP_REQUIRED
          - RISK_HELD_FOR_REVIEW
          - WALLET_NOT_TRANSACTABLE
          - MAX_BALANCE_EXCEEDED
          - REFUND_EXCEEDS_ORIGINAL
          - SERVICE_DISABLED
          - MAKER_CHECKER_VIOLATION
          - DEPENDENCY_UNAVAILABLE
        detail:
          type:
          - string
          - 'null'
          maxLength: 1000
          description: human text, no PII, never parsed
        instance:
          type:
          - string
          - 'null'
        correlationId:
          type: string
        reason:
          type:
          - string
          - 'null'
          pattern: ^[A-Z][A-Z0-9_]*$
          description: provider-owned sub-reason (codes.yaml problemReasons)
        errors:
          type: array
          items:
            type: object
            properties:
              field:
                type: string
              message:
                type: string
            required:
            - field
            - message
        retryable:
          type: boolean
          description: always true with 503
        disputeId:
          type: string
          format: uuid
          pattern: ^[0-9a-f]{8}-[0-9a-f]{4}-[0-9a-f]{4}-[0-9a-f]{4}-[0-9a-f]{12}$
          description: 'extension: the existing active dispute (reason ACTIVE_DISPUTE_EXISTS)'
        reversalRequestId:
          type: string
          format: uuid
          pattern: ^[0-9a-f]{8}-[0-9a-f]{4}-[0-9a-f]{4}-[0-9a-f]{4}-[0-9a-f]{12}$
          description: 'extension: the existing active reversal request (reason ACTIVE_REVERSAL_EXISTS)'
    TicketCreateRequest:
      type: object
      properties:
        source:
          type: string
          enum:
          - APP
          - USSD
          - IVR
          - CHATBOT
          - CALL_CENTRE
          - AGENT
          - PORTAL
          - EMAIL
          - BACKOFFICE
          - SYSTEM
          description: origin of the complaint; IVR/CHATBOT adaptors call as SYSTEM with X-Channel SYSTEM
        category:
          type: string
          pattern: ^[A-Z][A-Z0-9_]{1,39}$
          description: CATEGORIES key (config-driven; open set)
        subCategory:
          type:
          - string
          - 'null'
          maxLength: 64
        priority:
          type:
          - string
          - 'null'
          enum:
          - P1
          - P2
          - P3
          - P4
          - null
          description: STAFF only; may only raise above the category default
        subject:
          type: string
          minLength: 1
          maxLength: 200
        description:
          type: string
          minLength: 1
          maxLength: 4000
        msisdn:
          type:
          - string
          - 'null'
          pattern: ^8801[3-9][0-9]{8}$
          description: full 13 digits 8801…
        walletId:
          type:
          - string
          - 'null'
          format: uuid
          pattern: ^[0-9a-f]{8}-[0-9a-f]{4}-[0-9a-f]{4}-[0-9a-f]{4}-[0-9a-f]{12}$
          description: link priority walletId > customerId > msisdn
        customerId:
          type:
          - string
          - 'null'
          format: uuid
          pattern: ^[0-9a-f]{8}-[0-9a-f]{4}-[0-9a-f]{4}-[0-9a-f]{4}-[0-9a-f]{12}$
        txnRef:
          type:
          - string
          - 'null'
          pattern: ^[A-Z0-9-]{1,32}$
          description: opaque reference 1..32 [A-Z0-9-]
      required:
      - source
      - category
      - subject
      - description
    TicketCreated:
      type: object
      properties:
        ticketId:
          type: string
          format: uuid
          pattern: ^[0-9a-f]{8}-[0-9a-f]{4}-[0-9a-f]{4}-[0-9a-f]{4}-[0-9a-f]{12}$
          description: UUIDv7
        ticketNumber:
          type: string
          pattern: ^T[0-9]{12,13}$
          description: T{yyMMdd}{6+ digit daily seq} (Asia/Dhaka date)
        status:
          type: string
          enum:
          - NEW
          - ASSIGNED
          - IN_PROGRESS
          - PENDING_CUSTOMER
          - PENDING_INTERNAL
          - RESOLVED
          - CLOSED
        customerVisibleStatus:
          type: string
          enum:
          - RECEIVED
          - IN_PROGRESS
          - AWAITING_YOUR_RESPONSE
          - RESOLVED
          - CLOSED
        priority:
          type: string
          enum:
          - P1
          - P2
          - P3
          - P4
        category:
          type: string
          pattern: ^[A-Z][A-Z0-9_]{1,39}$
          description: CATEGORIES key (config-driven; open set)
        walletId:
          type:
          - string
          - 'null'
          format: uuid
          pattern: ^[0-9a-f]{8}-[0-9a-f]{4}-[0-9a-f]{4}-[0-9a-f]{4}-[0-9a-f]{12}$
          description: null if unresolved
        customerId:
          type:
          - string
          - 'null'
          format: uuid
          pattern: ^[0-9a-f]{8}-[0-9a-f]{4}-[0-9a-f]{4}-[0-9a-f]{4}-[0-9a-f]{12}$
        firstResponseDueAt:
          type:
          - string
          - 'null'
          format: date-time
          description: ISO-8601 UTC, millisecond precision, Z
        resolutionDueAt:
          type: string
          format: date-time
          description: ISO-8601 UTC, millisecond precision, Z
        createdAt:
          type: string
          format: date-time
          description: ISO-8601 UTC, millisecond precision, Z
      required:
      - ticketId
      - ticketNumber
      - status
      - customerVisibleStatus
      - priority
      - category
      - walletId
      - customerId
      - firstResponseDueAt
      - resolutionDueAt
      - createdAt
    Comment:
      type: object
      properties:
        commentId:
          type: string
          format: uuid
          pattern: ^[0-9a-f]{8}-[0-9a-f]{4}-[0-9a-f]{4}-[0-9a-f]{4}-[0-9a-f]{12}$
        visibility:
          type: string
          enum:
          - CUSTOMER
          - INTERNAL
        body:
          type: string
          maxLength: 4000
        authorType:
          type: string
          description: X-Actor-Type of the author
        authorId:
          type: string
          maxLength: 64
        createdAt:
          type: string
          format: date-time
          description: ISO-8601 UTC, millisecond precision, Z
      required:
      - commentId
      - visibility
      - body
      - authorType
      - authorId
      - createdAt
    AttachmentMeta:
      type: object
      properties:
        attachmentId:
          type: string
          format: uuid
          pattern: ^[0-9a-f]{8}-[0-9a-f]{4}-[0-9a-f]{4}-[0-9a-f]{4}-[0-9a-f]{12}$
        purpose:
          type: string
          enum:
          - TICKET
          - EVIDENCE
          - CONSENT
          - REGULATORY_INSTRUCTION
        fileName:
          type: string
          maxLength: 255
        contentType:
          type: string
          enum:
          - image/jpeg
          - image/png
          - application/pdf
          - audio/mpeg
          - audio/ogg
          - text/plain
        sizeBytes:
          type: integer
          format: int32
          minimum: 1
          maximum: 10485760
        sha256Hex:
          type: string
          pattern: ^[0-9a-f]{64}$
        disputeId:
          type:
          - string
          - 'null'
          format: uuid
          pattern: ^[0-9a-f]{8}-[0-9a-f]{4}-[0-9a-f]{4}-[0-9a-f]{4}-[0-9a-f]{12}$
        createdAt:
          type: string
          format: date-time
          description: ISO-8601 UTC, millisecond precision, Z
      required:
      - attachmentId
      - purpose
      - fileName
      - contentType
      - sizeBytes
      - sha256Hex
      - disputeId
      - createdAt
    TicketView:
      type: object
      properties:
        ticketId:
