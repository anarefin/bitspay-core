      - $ref: '#/components/parameters/XActorRoles'
      - $ref: '#/components/parameters/XActorUserId'
      - $ref: '#/components/parameters/XChannel'
      description: 'Reads the ledger mirror per ACTIVE/INACTIVE trust account (one balances:batchGet); a ledger failure gives mirrorBalancePoisha:
        null, never an error.'
      responses:
        '200':
          description: OK
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/TrustPositions'
              example:
