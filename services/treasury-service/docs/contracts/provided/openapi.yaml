                      - PENDING_APPROVAL_EXISTS
                      - null
              example:
                type: about:blank
                title: an approval for the same entity and action is already pendin
                status: 409
                code: STATE_CONFLICT
                correlationId: c-7e2a01
                instance: /v1/liquidity/thresholds/{id}:retire
                reason: PENDING_APPROVAL_EXISTS
  /v1/liquidity/incidents:
    get:
      operationId: listIncidents
      tags:
