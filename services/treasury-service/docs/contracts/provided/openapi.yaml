# treasury-service provided REST contract (OpenAPI 3.1). Producer-owned (O1). Generated from one typed model; SPEC.md §5.1 mirrors it.
openapi: 3.1.0
info:
  title: treasury-service
  version: 1.0.0
  description: 'Provided REST operations of treasury-service (SVC-07): trust accounts and confirmations, e-money issuance and redemption with
    the EMY-009 hard control, trust rebalance, manual journals, maker-checker approvals, float requests and liquidity monitoring. Kernel 1.0 rules
    apply (headers K3.1, idempotency K3.3, pagination K3.4, errors K3.6). No operation here is called by another service: audiences are staff
    and partner channels.'
  x-contractVersion: 1.0.0
  x-kernel: '1.0'
servers:
- url: http://localhost:8107
  description: local
tags:
- name: Trust accounts
- name: Trust balance confirmations
- name: Attachments
- name: E-money issuance
- name: E-money redemption
- name: Trust rebalance
- name: Manual journals
- name: Reports
- name: Approvals
- name: Float requests
- name: Liquidity
paths:
  /v1/treasury/trust-accounts:
    post:
      operationId: createTrustAccount
      tags:
      - Trust accounts
      summary: Register a trust bank account (maker)
      x-audience: staff
      x-actors:
      - type: STAFF
        roles:
        - FIN_MAKER
      x-idempotency: required
      parameters:
      - $ref: '#/components/parameters/XCorrelationId'
      - $ref: '#/components/parameters/XActorType'
      - $ref: '#/components/parameters/XActorId'
      - $ref: '#/components/parameters/XActorWalletId'
      - $ref: '#/components/parameters/XActorRoles'
      - $ref: '#/components/parameters/XActorUserId'
      - $ref: '#/components/parameters/XChannel'
      - $ref: '#/components/parameters/IdempotencyKeyRequired'
      description: Creates the row PENDING_APPROVAL and an approval (TrustAccount/CREATE, 1 level FIN_CHECKER). On final approval the ledger account
        is created (BR-07-02).
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/TrustAccountCreateRequest'
            example:
              trustIndex: 1
              bankCode: BANK-020
              bankName: Partner Bank Ltd
              branchName: Motijheel
              accountName: Bits Pay Trust A/C
              accountNo: 0201234567894521
              interestBearing: true
      responses:
        '201':
          description: Created
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/TrustAccount'
              example:
                id: 0192f100-0000-7000-8000-000000000001
                trustIndex: 1
                ledgerAccountId: 00000000-0000-0000-0000-000000030001
                bankCode: BANK-020
                bankName: Partner Bank Ltd
                branchName: Motijheel
                accountName: Bits Pay Trust A/C
                accountNoMasked: '****4521'
                status: PENDING_APPROVAL
                interestBearing: true
                approvalId: 0192f100-0000-7000-8000-00000000a001
                createdAt: '2026-10-08T04:00:00.000Z'
                updatedAt: '2026-10-08T04:00:00.000Z'
        '200':
          description: Idempotent replay of the original response
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/TrustAccount'
        '400':
          description: 'VALIDATION_FAILED: schema, format, range or header violation; VALIDATION_FAILED (BANK_NOT_ELIGIBLE): bank code unknown,
            inactive or not trustEligible'
          x-problems:
          - code: VALIDATION_FAILED
            reasons: []
            when: schema, format, range or header violation
          - code: VALIDATION_FAILED
            reasons:
            - BANK_NOT_ELIGIBLE
            when: bank code unknown, inactive or not trustEligible
          content:
            application/problem+json:
              schema:
                allOf:
                - $ref: '#/components/schemas/Problem'
                - type: object
                  properties:
                    code:
                      type: string
                      enum:
                      - VALIDATION_FAILED
                    reason:
                      type:
                      - string
                      - 'null'
                      enum:
                      - BANK_NOT_ELIGIBLE
                      - null
              example:
                type: about:blank
                title: schema, format, range or header violation
                status: 400
                code: VALIDATION_FAILED
                correlationId: c-7e2a01
                instance: /v1/treasury/trust-accounts
                errors:
                - field: amountPoisha
                  message: must be between 1 and 10000000000000
        '403':
          description: 'ACTOR_NOT_ALLOWED: actor type or role not permitted'
          x-problems:
          - code: ACTOR_NOT_ALLOWED
            reasons: []
            when: actor type or role not permitted
          content:
            application/problem+json:
              schema:
                allOf:
                - $ref: '#/components/schemas/Problem'
                - type: object
                  properties:
                    code:
                      type: string
                      enum:
                      - ACTOR_NOT_ALLOWED
              example:
                type: about:blank
                title: actor type or role not permitted
                status: 403
                code: ACTOR_NOT_ALLOWED
                correlationId: c-7e2a01
                instance: /v1/treasury/trust-accounts
        '409':
          description: 'IDEMPOTENCY_CONFLICT: same Idempotency-Key, different body; STATE_CONFLICT (TRUST_INDEX_TAKEN, ACCOUNT_NO_EXISTS): trust
            index already used / account number already registered'
          x-problems:
          - code: IDEMPOTENCY_CONFLICT
            reasons: []
            when: same Idempotency-Key, different body
          - code: STATE_CONFLICT
            reasons:
            - TRUST_INDEX_TAKEN
            - ACCOUNT_NO_EXISTS
            when: trust index already used / account number already registered
          content:
            application/problem+json:
              schema:
                allOf:
                - $ref: '#/components/schemas/Problem'
                - type: object
                  properties:
                    code:
                      type: string
                      enum:
                      - IDEMPOTENCY_CONFLICT
                      - STATE_CONFLICT
                    reason:
                      type:
                      - string
                      - 'null'
                      enum:
                      - ACCOUNT_NO_EXISTS
                      - TRUST_INDEX_TAKEN
                      - null
              example:
                type: about:blank
                title: same Idempotency-Key, different body
                status: 409
                code: IDEMPOTENCY_CONFLICT
                correlationId: c-7e2a01
                instance: /v1/treasury/trust-accounts
    get:
      operationId: listTrustAccounts
      tags:
      - Trust accounts
      summary: List trust accounts
      x-audience: staff
      x-actors:
      - type: STAFF
        roles:
        - FIN_MAKER
        - FIN_CHECKER
        - OPS_MAKER
        - OPS_CHECKER
        - AUDITOR
        - ADMIN
        - READ_ONLY
      x-idempotency: none
      parameters:
      - $ref: '#/components/parameters/XCorrelationId'
      - $ref: '#/components/parameters/XActorType'
      - $ref: '#/components/parameters/XActorId'
      - $ref: '#/components/parameters/XActorWalletId'
      - $ref: '#/components/parameters/XActorRoles'
      - $ref: '#/components/parameters/XActorUserId'
      - $ref: '#/components/parameters/XChannel'
      - name: status
        in: query
        required: false
        schema:
          type: string
          enum:
          - PENDING_APPROVAL
          - PENDING_LEDGER
          - ACTIVE
          - INACTIVE
          - REJECTED
          - EXPIRED
      - name: bankCode
        in: query
        required: false
        schema:
          type: string
      - name: limit
        in: query
        required: false
        schema:
          type: integer
          format: int32
          minimum: 1
          maximum: 200
          default: 50
        description: 1..200, default 50
      - name: cursor
        in: query
        required: false
        schema:
          type: string
        description: opaque, valid 24 h
      description: Ordered by trustIndex. Account numbers masked.
      responses:
        '200':
          description: OK
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/TrustAccountPage'
              example:
                items:
                - id: 0192f100-0000-7000-8000-000000000001
                  trustIndex: 1
                  ledgerAccountId: 00000000-0000-0000-0000-000000030001
                  bankCode: BANK-020
                  bankName: Partner Bank Ltd
                  branchName: Motijheel
                  accountName: Bits Pay Trust A/C
                  accountNoMasked: '****4521'
                  status: PENDING_APPROVAL
                  interestBearing: true
                  approvalId: 0192f100-0000-7000-8000-00000000a001
                  createdAt: '2026-10-08T04:00:00.000Z'
                  updatedAt: '2026-10-08T04:00:00.000Z'
                nextCursor: null
        '400':
          description: 'VALIDATION_FAILED (INVALID_CURSOR): bad filter, limit outside 1..200, or bad cursor'
          x-problems:
          - code: VALIDATION_FAILED
            reasons:
            - INVALID_CURSOR
            when: bad filter, limit outside 1..200, or bad cursor
          content:
            application/problem+json:
              schema:
                allOf:
                - $ref: '#/components/schemas/Problem'
                - type: object
                  properties:
                    code:
                      type: string
                      enum:
                      - VALIDATION_FAILED
                    reason:
                      type:
                      - string
                      - 'null'
                      enum:
                      - INVALID_CURSOR
                      - null
              example:
                type: about:blank
                title: bad filter, limit outside 1..200, or bad cursor
                status: 400
                code: VALIDATION_FAILED
                correlationId: c-7e2a01
                instance: /v1/treasury/trust-accounts
                reason: INVALID_CURSOR
                errors:
                - field: amountPoisha
                  message: must be between 1 and 10000000000000
        '403':
          description: 'ACTOR_NOT_ALLOWED: actor type or role not permitted'
          x-problems:
          - code: ACTOR_NOT_ALLOWED
            reasons: []
            when: actor type or role not permitted
          content:
            application/problem+json:
              schema:
                allOf:
                - $ref: '#/components/schemas/Problem'
                - type: object
                  properties:
                    code:
                      type: string
                      enum:
                      - ACTOR_NOT_ALLOWED
              example:
                type: about:blank
                title: actor type or role not permitted
                status: 403
                code: ACTOR_NOT_ALLOWED
                correlationId: c-7e2a01
                instance: /v1/treasury/trust-accounts
