                items:
                - id: 0192f400-0000-7000-8000-000000000001
                  walletId: 0192f2ee-0000-7000-8000-00000000e001
                  partnerId: 0192f2e0-0000-7000-8000-00000000e000
                  incidentType: LOW
                  thresholdPoisha: 500000
                  openedBalancePoisha: 450000
                  minBalancePoisha: 420000
                  openedAt: '2026-10-09T07:55:10.120Z'
                  closedAt: null
                  alertsSent: 1
                nextCursor: null
        '400':
          description: 'VALIDATION_FAILED (INVALID_CURSOR): bad filter, limit outside 1..200, or bad cursor'
          x-problems:
          - code: VALIDATION_FAILED
            reasons:
