  /v1/treasury/trust-accounts/{id}:deactivate:
    post:
      operationId: deactivateTrustAccount
      tags:
      - Trust accounts
      summary: Request deactivation (maker)
      x-audience: staff
      x-actors:
      - type: STAFF
        roles:
        - FIN_MAKER
      x-idempotency: optional
      parameters:
      - $ref: '#/components/parameters/XCorrelationId'
      - $ref: '#/components/parameters/XActorType'
      - $ref: '#/components/parameters/XActorId'
      - $ref: '#/components/parameters/XActorWalletId'
      - $ref: '#/components/parameters/XActorRoles'
      - $ref: '#/components/parameters/XActorUserId'
      - $ref: '#/components/parameters/XChannel'
      - $ref: '#/components/parameters/IdempotencyKeyOptional'
      - name: id
        in: path
        required: true
        schema:
          type: string
          format: uuid
          pattern: ^[0-9a-f]{8}-[0-9a-f]{4}-[0-9a-f]{4}-[0-9a-f]{4}-[0-9a-f]{12}$
      description: Approval TrustAccount/DEACTIVATE. On approval → INACTIVE (no new issuance, redemption, rebalance or confirmation).
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/TrustAccountDeactivateRequest'
            example:
              reason: 'Bank relationship ended; balance moved to trust #02'
      responses:
        '202':
          description: Accepted (approval opened)
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ApprovalSubmitted'
              example:
                entityType: TrustAccount
                entityId: 0192f100-0000-7000-8000-000000000001
                action: DEACTIVATE
                approvalId: 0192f100-0000-7000-8000-00000000a002
                requiredLevels: 1
                status: PENDING
        '400':
          description: 'VALIDATION_FAILED: schema, format, range or header violation'
          x-problems:
          - code: VALIDATION_FAILED
            reasons: []
            when: schema, format, range or header violation
          content:
            application/problem+json:
              schema:
                allOf:
                - $ref: '#/components/schemas/Problem'
                - type: object
                  properties:
                    code:
                      type: string
                      enum:
                      - VALIDATION_FAILED
              example:
                type: about:blank
                title: schema, format, range or header violation
                status: 400
                code: VALIDATION_FAILED
                correlationId: c-7e2a01
                instance: /v1/treasury/trust-accounts/{id}:deactivate
                errors:
                - field: amountPoisha
                  message: must be between 1 and 10000000000000
        '403':
          description: 'ACTOR_NOT_ALLOWED: actor type or role not permitted'
          x-problems:
          - code: ACTOR_NOT_ALLOWED
            reasons: []
            when: actor type or role not permitted
          content:
            application/problem+json:
              schema:
                allOf:
                - $ref: '#/components/schemas/Problem'
                - type: object
                  properties:
                    code:
                      type: string
                      enum:
                      - ACTOR_NOT_ALLOWED
              example:
                type: about:blank
                title: actor type or role not permitted
                status: 403
                code: ACTOR_NOT_ALLOWED
                correlationId: c-7e2a01
                instance: /v1/treasury/trust-accounts/{id}:deactivate
        '404':
          description: 'NOT_FOUND: entity unknown'
          x-problems:
          - code: NOT_FOUND
            reasons: []
            when: entity unknown
          content:
            application/problem+json:
              schema:
                allOf:
                - $ref: '#/components/schemas/Problem'
                - type: object
                  properties:
                    code:
                      type: string
                      enum:
                      - NOT_FOUND
              example:
                type: about:blank
                title: entity unknown
                status: 404
                code: NOT_FOUND
                correlationId: c-7e2a01
                instance: /v1/treasury/trust-accounts/{id}:deactivate
        '409':
          description: 'STATE_CONFLICT (PENDING_APPROVAL_EXISTS): an approval for the same entity and action is already pending; STATE_CONFLICT:
            trust account not ACTIVE'
          x-problems:
          - code: STATE_CONFLICT
            reasons:
            - PENDING_APPROVAL_EXISTS
            when: an approval for the same entity and action is already pending
          - code: STATE_CONFLICT
            reasons: []
            when: trust account not ACTIVE
          content:
            application/problem+json:
              schema:
                allOf:
                - $ref: '#/components/schemas/Problem'
                - type: object
                  properties:
                    code:
                      type: string
                      enum:
                      - STATE_CONFLICT
                    reason:
                      type:
                      - string
                      - 'null'
                      enum:
                      - PENDING_APPROVAL_EXISTS
                      - null
              example:
                type: about:blank
                title: an approval for the same entity and action is already pendin
                status: 409
                code: STATE_CONFLICT
                correlationId: c-7e2a01
                instance: /v1/treasury/trust-accounts/{id}:deactivate
                reason: PENDING_APPROVAL_EXISTS
  /v1/treasury/trust-accounts/{id}/interest/{month}:
    put:
      operationId: recordTrustInterest
      tags:
      - Trust accounts
      summary: Record monthly trust interest (maker, EMY-008)
      x-audience: staff
      x-actors:
      - type: STAFF
        roles:
        - FIN_MAKER
      x-idempotency: natural
      parameters:
      - $ref: '#/components/parameters/XCorrelationId'
      - $ref: '#/components/parameters/XActorType'
      - $ref: '#/components/parameters/XActorId'
      - $ref: '#/components/parameters/XActorWalletId'
      - $ref: '#/components/parameters/XActorRoles'
      - $ref: '#/components/parameters/XActorUserId'
      - $ref: '#/components/parameters/XChannel'
      - name: id
        in: path
        required: true
        schema:
          type: string
          format: uuid
          pattern: ^[0-9a-f]{8}-[0-9a-f]{4}-[0-9a-f]{4}-[0-9a-f]{4}-[0-9a-f]{12}$
      - name: month
        in: path
        required: true
        schema:
          type: string
          pattern: ^\d{4}-\d{2}$
        description: YYYY-MM
      description: PUT is idempotent per (id, month) while the same value is pending. Creates a TrustInterest row PENDING_APPROVAL + approval
        RECORD. On approval → RECORDED (a previous RECORDED row for the month → SUPERSEDED) and TRUST_INTEREST_RECORDED (OPEN D-23).
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/TrustInterestRequest'
            example:
              interestPoisha: 412350
              comment: September interest per bank advice
      responses:
        '202':
          description: Accepted (approval opened)
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/TrustInterest'
              example:
                id: 0192f108-0000-7000-8000-000000000001
                trustAccountId: 0192f100-0000-7000-8000-000000000001
                month: '2026-09-01'
                interestPoisha: 412350
                status: PENDING_APPROVAL
                makerId: 0192f0a1-0000-7000-8000-0000000000f1
                approvalId: 0192f108-0000-7000-8000-00000000a001
                recordedAt: null
