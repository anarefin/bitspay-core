            when: bad filter, limit outside 1..200, or bad cursor
          content:
            application/problem+json:
              schema:
                allOf:
                - $ref: '#/components/schemas/Problem'
                - type: object
                  properties:
                    code:
                      type: string
                      enum:
                      - VALIDATION_FAILED
                    reason:
                      type:
                      - string
                      - 'null'
                      enum:
                      - INVALID_CURSOR
                      - null
              example:
                type: about:blank
