        in: query
        required: false
        schema:
          type: integer
          format: int32
          minimum: 1
          maximum: 200
          default: 50
        description: 1..200, default 50
      - name: cursor
        in: query
        required: false
        schema:
          type: string
        description: opaque, valid 24 h
