              schema:
                allOf:
                - $ref: '#/components/schemas/Problem'
                - type: object
                  properties:
                    code:
                      type: string
                      enum:
                      - VALIDATION_FAILED
              example:
                type: about:blank
                title: schema, format, range or header violation
                status: 400
                code: VALIDATION_FAILED
                correlationId: c-7e2a01
                instance: /v1/treasury/trust-accounts/{id}/interest/{month}
                errors:
                - field: amountPoisha
                  message: must be between 1 and 10000000000000
        '403':
          description: 'ACTOR_NOT_ALLOWED: actor type or role not permitted'
          x-problems:
          - code: ACTOR_NOT_ALLOWED
            reasons: []
            when: actor type or role not permitted
          content:
            application/problem+json:
              schema:
                allOf:
                - $ref: '#/components/schemas/Problem'
                - type: object
                  properties:
                    code:
                      type: string
                      enum:
                      - ACTOR_NOT_ALLOWED
              example:
                type: about:blank
                title: actor type or role not permitted
                status: 403
                code: ACTOR_NOT_ALLOWED
                correlationId: c-7e2a01
                instance: /v1/treasury/trust-accounts/{id}/interest/{month}
        '404':
          description: 'NOT_FOUND: entity unknown'
          x-problems:
          - code: NOT_FOUND
            reasons: []
            when: entity unknown
          content:
            application/problem+json:
              schema:
                allOf:
                - $ref: '#/components/schemas/Problem'
                - type: object
                  properties:
                    code:
                      type: string
                      enum:
                      - NOT_FOUND
              example:
                type: about:blank
                title: entity unknown
                status: 404
