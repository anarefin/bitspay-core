                - trustAccountId: 0192f100-0000-7000-8000-000000000001
                  trustIndex: 1
                  bankCode: BANK-020
                  ledgerTrustAccountId: 00000000-0000-0000-0000-000000030001
                  mirrorBalancePoisha: 50000000
                  confirmedBalancePoisha: 100000000
                  confirmedAsOf: '2026-10-08T17:59:59.000Z'
                  confirmationAgeHours: 14
                  headroomPoisha: 50000000
                  pendingIssuancePoisha: 0
                  status: ACTIVE
                totals:
                  mirrorPoisha: 50000000
                  confirmedPoisha: 100000000
                  headroomPoisha: 50000000
                asOf: '2026-10-09T08:00:00.000Z'
        '403':
          description: 'ACTOR_NOT_ALLOWED: actor type or role not permitted'
