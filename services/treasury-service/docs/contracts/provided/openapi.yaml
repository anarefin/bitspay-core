      - $ref: '#/components/parameters/XActorRoles'
      - $ref: '#/components/parameters/XActorUserId'
      - $ref: '#/components/parameters/XChannel'
      - name: from
        in: query
        required: true
        schema:
          type: string
          format: date
          pattern: ^\d{4}-\d{2}-\d{2}$
      - name: to
        in: query
        required: true
        schema:
          type: string
          format: date
          pattern: ^\d{4}-\d{2}-\d{2}$
