  schemas:
    Uuid: {type: string, pattern: '^[0-9a-f]{8}-[0-9a-f]{4}-[0-9a-f]{4}-[0-9a-f]{4}-[0-9a-f]{12}$'}
    Timestamp: {type: string, format: date-time, description: "ISO-8601 UTC with 3 ms digits and Z"}
    MoneyPoisha: {type: integer, format: int64, minimum: 1, maximum: 10000000000000}
    BatchStatus: {type: string, enum: [DRAFT, VALIDATING, VALIDATION_FAILED, VALIDATED, PENDING_APPROVAL, APPROVED, RUNNING, PAUSED, COMPLETED, PARTIALLY_FAILED, CANCELLED, REJECTED]}
    PauseReason: {type: string, enum: [INSUFFICIENT_FUNDING, OPERATOR, DEPENDENCY_UNAVAILABLE, PRODUCT_DISABLED]}
    RowStatus: {type: string, enum: [PARSED, VALID, INVALID, PROCESSING, PAID, FAILED, SKIPPED]}
    ApprovalStatus: {type: string, enum: [PENDING, APPROVED, REJECTED, EXPIRED, CANCELLED]}
    ScheduleStatus: {type: string, enum: [ACTIVE, PAUSED, SUSPENDED, COMPLETED, CANCELLED]}
    OccurrenceStatus: {type: string, enum: [PENDING, REMINDED, EXECUTING, COMPLETED, FAILED, SKIPPED]}
    PaymentRequestStatus: {type: string, enum: [PENDING, ACCEPTING, PAID, DECLINED, CANCELLED, EXPIRED]}
    Frequency: {type: string, enum: [ONCE, DAILY, WEEKLY, MONTHLY]}

    Problem:
      type: object
      additionalProperties: true
      required: [type, title, status, code, correlationId]
      properties:
        type: {type: string}
        title: {type: string, maxLength: 200}
        status: {type: integer}
        code: {type: string, enum: [VALIDATION_FAILED, ACTOR_NOT_ALLOWED, NOT_FOUND, IDEMPOTENCY_CONFLICT, STATE_CONFLICT, SOD_VIOLATION, INSUFFICIENT_FUNDS, LIMIT_EXCEEDED, RISK_BLOCKED, RISK_STEP_UP_REQUIRED, RISK_HELD_FOR_REVIEW, WALLET_NOT_TRANSACTABLE, MAX_BALANCE_EXCEEDED, REFUND_EXCEEDS_ORIGINAL, SERVICE_DISABLED, MAKER_CHECKER_VIOLATION, DEPENDENCY_UNAVAILABLE]}
        detail: {type: [string, 'null'], maxLength: 1000}
        instance: {type: [string, 'null']}
        correlationId: {type: string}
        reason: {type: [string, 'null'], enum: [INVALID_CURSOR, FILE_INVALID, NO_VALID_ROWS, INVALID_ROWS_PRESENT, ROW_NOT_RETRYABLE, SCHEDULE_CAP_EXCEEDED, REQUEST_CAP_EXCEEDED, DUPLICATE_FILE, INVALID_TRANSITION, ROWS_IN_FLIGHT, APPROVAL_EXPIRED, null]}
        errors:
          type: array
          minItems: 1
          items: {type: object, required: [field, message], properties: {field: {type: string}, message: {type: string}}}
        retryable: {type: boolean, const: true}
    ProblemWalletNotTransactable:
      allOf:
        - $ref: '#/components/schemas/Problem'
        - type: object
          properties:
            walletId: {$ref: '#/components/schemas/Uuid'}
            walletStatus: {type: string, description: "status name, e.g. DEBIT_BLOCKED"}
    ProblemWithBatch:
      allOf:
        - $ref: '#/components/schemas/Problem'
        - type: object
          properties:
            batch: {$ref: '#/components/schemas/Batch'}
    ProblemRelayedAccept:
      description: |
        Problem of POST /v1/payment-requests/{requestId}:accept. For a relayed transaction-service refusal: every member of the
        consumed problem is kept unchanged (code, reason, limit extensions, walletId/walletStatus, and `transaction`, a pass-through of
        the consumed PaymentResult), plus `paymentRequest` (this service's PaymentRequest after the outcome was applied).
        `reason` values on relayed problems are transaction-service's own and are not enumerated here.
      allOf:
        - $ref: '#/components/schemas/Problem'
        - type: object
          properties:
            reason: {type: [string, 'null'], pattern: '^[A-Z][A-Z0-9_]*$'}
            paymentRequest: {$ref: '#/components/schemas/PaymentRequest'}
            transaction: {$ref: '#/components/schemas/PaymentResult'}
            limitCode: {type: string}
            limitParty: {type: string, enum: [FROM, TO]}
            remainingPoisha: {type: [integer, 'null'], format: int64}
            remainingCount: {type: [integer, 'null'], format: int32}
            resetsAt: {type: [string, 'null'], format: date-time}
            walletId: {$ref: '#/components/schemas/Uuid'}
            walletStatus: {type: string}

    BatchRowInput:
      type: object
      additionalProperties: false
      required: [msisdn, amountPoisha]
      properties:
        msisdn: {type: string, maxLength: 20, description: "01XXXXXXXXX or 8801XXXXXXXXX; invalid -> row INVALID_MSISDN (not 400)"}
        amountPoisha: {type: integer, format: int64, description: "> 0 and <= maxRowAmountPoisha else row INVALID_AMOUNT (not 400)"}
        reference: {type: [string, 'null'], maxLength: 64}
        name: {type: [string, 'null'], maxLength: 140}
    BatchCreateRequest:
      type: object
      additionalProperties: false
      required: [payerWalletId, title, rows]
      properties:
        payerWalletId: {$ref: '#/components/schemas/Uuid'}
        title: {type: string, minLength: 1, maxLength: 120}
        clientReference: {type: [string, 'null'], maxLength: 64}
        preRegisterUnknown: {type: boolean, default: false}
        scheduledStartAt: {type: [string, 'null'], format: date-time, description: "now < x <= now + 30 d"}
        rows: {type: array, minItems: 1, maxItems: 10000, items: {$ref: '#/components/schemas/BatchRowInput'}}
    BatchCreateMultipart:
      type: object
      required: [file, payerWalletId, title]
      properties:
        file: {type: string, contentMediaType: text/csv, description: "UTF-8, comma, header required (case-insensitive): msisdn, amount (Taka, <= 2 decimals) or amount_poisha (integer), optional reference, name; <= 1,000,000 rows, <= 100 MB"}
        payerWalletId: {$ref: '#/components/schemas/Uuid'}
        title: {type: string, minLength: 1, maxLength: 120}
        clientReference: {type: string, maxLength: 64}
        preRegisterUnknown: {type: boolean, default: false}
        scheduledStartAt: {type: string, format: date-time}
    BatchCreateResponse:
      type: object
      required: [batchId, batchRef, status, totalRows]
      properties:
        batchId: {$ref: '#/components/schemas/Uuid'}
        batchRef: {type: string, pattern: '^BD\d{6}[0-9A-HJKMNP-TV-Z]{8}$'}
        status: {type: string, enum: [DRAFT, VALIDATING, VALIDATION_FAILED]}
        totalRows: {type: integer, format: int32, minimum: 0}
    Batch:
      type: object
      required: [batchId, batchRef, institutionId, payerWalletId, title, clientReference, source, status, pauseReason, failureDetail, totalRows, validRows, invalidRows, paidRows, failedRows, skippedRows, validAmountPoisha, paidAmountPoisha, approvalId, scheduledStartAt, createdAt, submittedAt, approvedAt, startedAt, completedAt]
      properties:
        batchId: {$ref: '#/components/schemas/Uuid'}
        batchRef: {type: string, pattern: '^BD\d{6}[0-9A-HJKMNP-TV-Z]{8}$'}
        institutionId: {$ref: '#/components/schemas/Uuid'}
        payerWalletId: {$ref: '#/components/schemas/Uuid'}
        title: {type: string, maxLength: 120}
        clientReference: {type: [string, 'null'], maxLength: 64}
        source: {type: string, enum: [CSV, API]}
        status: {$ref: '#/components/schemas/BatchStatus'}
        pauseReason: {anyOf: [{$ref: '#/components/schemas/PauseReason'}, {type: 'null'}], description: "non-null only when PAUSED"}
        failureDetail: {type: [string, 'null'], description: "VALIDATION_FAILED reason text"}
        totalRows: {type: integer, format: int32, minimum: 0}
        validRows: {type: integer, format: int32, minimum: 0}
        invalidRows: {type: integer, format: int32, minimum: 0}
        paidRows: {type: integer, format: int32, minimum: 0}
        failedRows: {type: integer, format: int32, minimum: 0}
        skippedRows: {type: integer, format: int32, minimum: 0}
        validAmountPoisha: {type: integer, format: int64, minimum: 0}
        paidAmountPoisha: {type: integer, format: int64, minimum: 0, description: "<= validAmountPoisha"}
        approvalId: {type: [string, 'null'], format: uuid}
        scheduledStartAt: {type: [string, 'null'], format: date-time}
        createdAt: {type: string, format: date-time}
        submittedAt: {type: [string, 'null'], format: date-time}
        approvedAt: {type: [string, 'null'], format: date-time}
        startedAt: {type: [string, 'null'], format: date-time}
        completedAt: {type: [string, 'null'], format: date-time}
    BatchPage:
      type: object
      required: [items, nextCursor]
      properties:
        items: {type: array, items: {$ref: '#/components/schemas/Batch'}}
        nextCursor: {type: [string, 'null']}
    BatchRow:
      type: object
      required: [rowNo, rowRef, msisdn, nameInFile, displayNameMasked, reference, amountPoisha, status, failureCode, failureDetail, walletId, attempt, commandId, paidAt]
      properties:
        rowNo: {type: integer, format: int32, minimum: 1}
        rowRef: {type: string, maxLength: 24, description: "{batchRef}-{rowNo}; human-readable credit ID (OPEN D-13)"}
        msisdn: {type: string, description: "clear 8801XXXXXXXXX for STAFF OPS_*, else masked 8801711****00"}
        nameInFile: {type: [string, 'null']}
        displayNameMasked: {type: [string, 'null'], description: "from wallet lookup; shown next to nameInFile (no automated name match)"}
        reference: {type: [string, 'null'], maxLength: 64}
        amountPoisha: {type: integer, format: int64, minimum: 1}
        status: {$ref: '#/components/schemas/RowStatus'}
        failureCode: {type: [string, 'null'], description: "INVALID: rowInvalidCode; FAILED: rowFailureCode (codes.yaml)"}
        failureDetail: {type: [string, 'null'], description: "e.g. violated limitCode, PRE_REGISTRATION_PENDING, preRegister reason"}
        walletId: {type: [string, 'null'], format: uuid}
        attempt: {type: integer, format: int32, minimum: 1}
        commandId: {type: [string, 'null'], format: uuid, description: "current attempt"}
        paidAt: {type: [string, 'null'], format: date-time}
    BatchRowPage:
      type: object
      required: [items, nextCursor]
      properties:
        items: {type: array, items: {$ref: '#/components/schemas/BatchRow'}}
        nextCursor: {type: [string, 'null']}
    SubmitRequest:
      type: object
      additionalProperties: false
      required: [excludeInvalidRows]
      properties:
        excludeInvalidRows: {type: boolean}
    CancelRequest:
      type: object
      additionalProperties: false
      required: [reason]
      properties:
        reason: {type: string, minLength: 1, maxLength: 140}
    EmptyBody: {type: object, additionalProperties: false}
    RetryFailedRequest:
      type: object
      additionalProperties: false
      properties:
        rowNos: {type: [array, 'null'], items: {type: integer, format: int32, minimum: 1}, maxItems: 10000, description: "null or absent = all FAILED rows with a retryable code"}

    Approval:
      type: object
      required: [approvalId, entityType, entityId, action, status, level, requiredLevels, checkerRoles, amountPoisha, makerActorType, makerId, makerUserId, summary, requestedAt, expiresAt, decidedAt]
      properties:
        approvalId: {$ref: '#/components/schemas/Uuid'}
        entityType: {type: string, enum: [DisbursementBatch]}
        entityId: {type: string, description: batchId}
        action: {type: string, enum: [EXECUTE]}
        status: {$ref: '#/components/schemas/ApprovalStatus'}
        level: {type: integer, format: int32, minimum: 1}
        requiredLevels: {type: integer, format: int32, minimum: 1, maximum: 2}
        checkerRoles: {type: array, items: {type: string}, minItems: 1}
        amountPoisha: {type: integer, format: int64, minimum: 0}
        makerActorType: {type: string, enum: [INSTITUTION, STAFF]}
        makerId: {type: string}
        makerUserId: {type: [string, 'null']}
        summary: {type: string, maxLength: 200}
        requestedAt: {type: string, format: date-time}
        expiresAt: {type: string, format: date-time}
        decidedAt: {type: [string, 'null'], format: date-time}
    ApprovalPage:
      type: object
      required: [items, nextCursor]
      properties:
        items: {type: array, items: {$ref: '#/components/schemas/Approval'}}
        nextCursor: {type: [string, 'null']}
    ApproveRequest:
      type: object
      additionalProperties: false
      properties:
        comment: {type: string, minLength: 1, maxLength: 500}
    RejectRequest:
      type: object
      additionalProperties: false
      required: [comment]
      properties:
        comment: {type: string, minLength: 1, maxLength: 500}
        reasonCode: {type: string, pattern: '^[A-Z_]{3,40}$'}
    ApprovalDecisionResponse:
      type: object
      required: [approvalId, status, level, requiredLevels, batch]
      properties:
        approvalId: {$ref: '#/components/schemas/Uuid'}
        status: {$ref: '#/components/schemas/ApprovalStatus'}
        level: {type: integer, format: int32, minimum: 1}
        requiredLevels: {type: integer, format: int32, minimum: 1}
        batch: {$ref: '#/components/schemas/Batch'}

    ScheduleCreateRequest:
      type: object
      additionalProperties: false
      required: [fromWalletId, amountPoisha, frequency, startDate]
      properties:
        fromWalletId: {$ref: '#/components/schemas/Uuid'}
        toWalletId: {type: [string, 'null'], format: uuid, description: "one of toWalletId / toMsisdn"}
        toMsisdn: {type: [string, 'null'], maxLength: 20}
        amountPoisha: {$ref: '#/components/schemas/MoneyPoisha'}
        purposeCode: {type: [string, 'null'], maxLength: 32}
        note: {type: [string, 'null'], maxLength: 140}
        frequency: {$ref: '#/components/schemas/Frequency'}
        dayOfWeek: {type: [integer, 'null'], minimum: 1, maximum: 7, description: "ISO weekday; WEEKLY only (required)"}
        dayOfMonth: {type: [integer, 'null'], minimum: 1, maximum: 31, description: "MONTHLY only (required); 31 on a shorter month = last day"}
        localTime: {type: string, pattern: '^([01]\d|2[0-3]):[0-5]\d$', default: "10:00", description: "Asia/Dhaka"}
        startDate: {type: string, format: date}
        endDate: {type: [string, 'null'], format: date}
        maxOccurrences: {type: [integer, 'null'], minimum: 1}
    ScheduleCreateResponse:
      type: object
      required: [scheduleId, status, nextOccurrenceDate, nextDueAt, toWalletId, toDisplayNameMasked]
      properties:
        scheduleId: {$ref: '#/components/schemas/Uuid'}
        status: {$ref: '#/components/schemas/ScheduleStatus'}
        nextOccurrenceDate: {type: [string, 'null'], format: date}
        nextDueAt: {type: [string, 'null'], format: date-time}
        toWalletId: {$ref: '#/components/schemas/Uuid'}
        toDisplayNameMasked: {type: [string, 'null']}
    Schedule:
      type: object
      required: [scheduleId, status, fromWalletId, toWalletId, toDisplayNameMasked, amountPoisha, purposeCode, note, frequency, dayOfWeek, dayOfMonth, localTime, startDate, endDate, maxOccurrences, occurrencesDone, consecutiveFailures, nextOccurrenceDate, nextDueAt, createdAt, updatedAt]
      properties:
        scheduleId: {$ref: '#/components/schemas/Uuid'}
        status: {$ref: '#/components/schemas/ScheduleStatus'}
        fromWalletId: {$ref: '#/components/schemas/Uuid'}
        toWalletId: {$ref: '#/components/schemas/Uuid'}
        toDisplayNameMasked: {type: [string, 'null']}
        amountPoisha: {$ref: '#/components/schemas/MoneyPoisha'}
        purposeCode: {type: [string, 'null']}
        note: {type: [string, 'null']}
        frequency: {$ref: '#/components/schemas/Frequency'}
        dayOfWeek: {type: [integer, 'null']}
        dayOfMonth: {type: [integer, 'null']}
        localTime: {type: string}
        startDate: {type: string, format: date}
        endDate: {type: [string, 'null'], format: date}
        maxOccurrences: {type: [integer, 'null']}
        occurrencesDone: {type: integer, format: int32, minimum: 0}
        consecutiveFailures: {type: integer, format: int32, minimum: 0}
        nextOccurrenceDate: {type: [string, 'null'], format: date}
        nextDueAt: {type: [string, 'null'], format: date-time}
        createdAt: {type: string, format: date-time}
        updatedAt: {type: string, format: date-time}
    SchedulePage:
      type: object
      required: [items, nextCursor]
      properties:
        items: {type: array, items: {$ref: '#/components/schemas/Schedule'}}
        nextCursor: {type: [string, 'null']}
    SchedulePatchRequest:
      type: object
      additionalProperties: false
      minProperties: 1
      properties:
        amountPoisha: {$ref: '#/components/schemas/MoneyPoisha'}
        endDate: {type: [string, 'null'], format: date}
        note: {type: [string, 'null'], maxLength: 140}
        localTime: {type: string, pattern: '^([01]\d|2[0-3]):[0-5]\d$'}
    Occurrence:
      type: object
      required: [occurrenceDate, dueAt, status, txnRef, failureCode, executedAt]
      properties:
        occurrenceDate: {type: string, format: date}
        dueAt: {type: string, format: date-time}
        status: {$ref: '#/components/schemas/OccurrenceStatus'}
        txnRef: {type: [string, 'null'], maxLength: 32}
        failureCode: {type: [string, 'null']}
        executedAt: {type: [string, 'null'], format: date-time}
    OccurrencePage:
      type: object
      required: [items, nextCursor]
      properties:
        items: {type: array, items: {$ref: '#/components/schemas/Occurrence'}}
        nextCursor: {type: [string, 'null']}

    PaymentRequestCreate:
      type: object
      additionalProperties: false
      required: [requesterWalletId, amountPoisha]
      properties:
        requesterWalletId: {$ref: '#/components/schemas/Uuid'}
        payerWalletId: {type: [string, 'null'], format: uuid, description: "one of payerWalletId / payerMsisdn"}
        payerMsisdn: {type: [string, 'null'], maxLength: 20}
        amountPoisha: {type: integer, format: int64, minimum: 1, description: "<= bitspay.requests.max-amount-poisha (2,500,000)"}
        note: {type: [string, 'null'], maxLength: 140}
        expiresInHours: {type: [integer, 'null'], minimum: 1, maximum: 168, default: 72}
    PaymentRequest:
      type: object
      required: [requestId, requestRef, status, requesterWalletId, payerWalletId, amountPoisha, note, expiresAt, txnRef, lastFailureCode, createdAt]
      properties:
        requestId: {$ref: '#/components/schemas/Uuid'}
        requestRef: {type: string, pattern: '^RQ\d{6}[0-9A-HJKMNP-TV-Z]{8}$'}
        status: {$ref: '#/components/schemas/PaymentRequestStatus'}
        requesterWalletId: {$ref: '#/components/schemas/Uuid'}
        payerWalletId: {$ref: '#/components/schemas/Uuid'}
        amountPoisha: {$ref: '#/components/schemas/MoneyPoisha'}
        note: {type: [string, 'null'], maxLength: 140}
        expiresAt: {type: string, format: date-time}
        txnRef: {type: [string, 'null'], maxLength: 32, description: "opaque P2P txnRef"}
        lastFailureCode: {type: [string, 'null'], description: "problem code of the last refused accept attempt"}
        createdAt: {type: string, format: date-time}
    PaymentRequestPage:
      type: object
      required: [items, nextCursor]
      properties:
        items: {type: array, items: {$ref: '#/components/schemas/PaymentRequest'}}
        nextCursor: {type: [string, 'null']}
    DeclineRequest:
      type: object
      additionalProperties: false
      properties:
        reason: {type: [string, 'null'], maxLength: 140}
    PaymentResult:
      description: "Pass-through of transaction-service PaymentResult as consumed from POST /v1/payments/p2p (200 body or problem member `transaction`). Relayed unchanged; this service never builds or alters it."
      type: object
      additionalProperties: true
      required: [txnRef, txnId, txnType, status, failureCode, amountPoisha, feePoisha, vatPoisha, totalDebitPoisha, feeBearer, currency, fromWalletId, toWalletId, createdAt, completedAt]
      properties:
        txnRef: {type: string, maxLength: 32}
        txnId: {$ref: '#/components/schemas/Uuid'}
        txnType: {type: string}
        status: {type: string, description: "COMPLETED | FAILED | INITIATED (INITIATED only inside a 503)"}
        failureCode: {type: [string, 'null']}
        amountPoisha: {type: integer, format: int64}
        feePoisha: {type: integer, format: int64}
        vatPoisha: {type: integer, format: int64}
        totalDebitPoisha: {type: integer, format: int64}
        feeBearer: {type: string}
        currency: {type: string}
        fromWalletId: {$ref: '#/components/schemas/Uuid'}
        toWalletId: {$ref: '#/components/schemas/Uuid'}
        createdAt: {type: string, format: date-time}
        completedAt: {type: [string, 'null'], format: date-time}
    AcceptResponse:
      type: object
      required: [request, transaction]
      properties:
        request: {$ref: '#/components/schemas/PaymentRequest'}
        transaction: {$ref: '#/components/schemas/PaymentResult'}

    WorkersResponse:
      type: object
      required: [asOf, rateLimit, rowsPerSecond, claimedChunks]
      properties:
        asOf: {type: string, format: date-time}
        rateLimit:
          type: object
          required: [name, ratePerSec, effectiveRatePerSec, backoffActive]
          properties:
            name: {type: string}
            ratePerSec: {type: integer, format: int32}
            effectiveRatePerSec: {type: integer, format: int32}
            backoffActive: {type: boolean}
        rowsPerSecond: {type: integer, format: int32}
        claimedChunks:
          type: array
          items:
            type: object
            required: [batchId, kind, chunkNo, attempt, claimedBy, leaseUntil]
            properties:
              batchId: {$ref: '#/components/schemas/Uuid'}
              kind: {type: string, enum: [VALIDATE, EXECUTE]}
              chunkNo: {type: integer, format: int32}
              attempt: {type: integer, format: int32}
              claimedBy: {type: string}
              leaseUntil: {type: string, format: date-time}
    RateLimitRequest:
      type: object
      additionalProperties: false
      required: [ratePerSec]
      properties:
        ratePerSec: {type: integer, format: int32, minimum: 1, maximum: 10000}
    RateLimitResponse:
      type: object
      required: [name, ratePerSec, updatedAt]
      properties:
        name: {type: string}
        ratePerSec: {type: integer, format: int32}
        updatedAt: {type: string, format: date-time}
