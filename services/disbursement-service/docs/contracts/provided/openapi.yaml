  /v1/payment-requests/{requestId}:accept:
    post:
      tags: [payment-requests]
      operationId: acceptPaymentRequest
      summary: Payer accepts and pays (PENDING -> ACCEPTING -> PAID) through transaction-service P2P
      description: |
        PIN is verified upstream. The payer's own headers (X-Actor-*, X-Channel, X-Device-Id, X-Correlation-Id) are forwarded to
        `POST /v1/payments/p2p` with Idempotency-Key `preq-{requestId}-{attempt}` (delegated P2P, OPEN D-33).
        A transaction-service refusal is relayed unchanged (problem `code`, `reason`, its extension members including `transaction`)
        with the extra member `paymentRequest`. 422/409 from the P2P: request back to PENDING (attempt + 1).
        503/timeout from the P2P: the 503 is relayed and the request stays ACCEPTING until resolved; a retry of this call with the same
        Idempotency-Key re-drives the same P2P key.
      x-audience: customer
      x-actors:
        - {type: CUSTOMER, rule: "X-Actor-Wallet-Id = payerWalletId"}
      x-product: REQUEST_MONEY
      parameters:
        - $ref: '#/components/parameters/RequestId'
        - $ref: '#/components/parameters/XCorrelationId'
        - $ref: '#/components/parameters/XActorType'
        - $ref: '#/components/parameters/XActorId'
        - $ref: '#/components/parameters/XActorWalletId'
        - $ref: '#/components/parameters/XChannel'
        - $ref: '#/components/parameters/XDeviceId'
        - $ref: '#/components/parameters/IdempotencyKeyRequired'
      requestBody:
        required: false
        content:
          application/json:
            schema: {$ref: '#/components/schemas/EmptyBody'}
            example: {}
      responses:
        '200':
          description: Paid
          content:
            application/json:
              schema: {$ref: '#/components/schemas/AcceptResponse'}
              example:
                request: {"requestId": "0192fc33-0000-7000-8000-000000000003", "requestRef": "RQ261009P3X8K2NM", "status": "PAID", "requesterWalletId": "0192f2bb-0002-7000-8000-00000000b002", "payerWalletId": "0192f2aa-0001-7000-8000-00000000a001", "amountPoisha": 30000, "note": "lunch", "expiresAt": "2026-10-12T09:00:00.000Z", "txnRef": "PP26100900T5Z9C1HQ", "lastFailureCode": null, "createdAt": "2026-10-09T09:00:00.000Z"}
                transaction: {txnRef: PP26100900T5Z9C1HQ, txnId: 0192fc34-0000-7000-8000-000000000004, txnType: P2P, status: COMPLETED, failureCode: null, amountPoisha: 30000, feePoisha: 500, vatPoisha: 75, totalDebitPoisha: 30575, feeBearer: PAYER, currency: BDT, fromWalletId: 0192f2aa-0001-7000-8000-00000000a001, toWalletId: 0192f2bb-0002-7000-8000-00000000b002, createdAt: "2026-10-09T10:00:00.020Z", completedAt: "2026-10-09T10:00:00.120Z"}
        '400': {$ref: '#/components/responses/ValidationFailed'}
        '403': {$ref: '#/components/responses/ActorNotAllowed'}
        '404': {$ref: '#/components/responses/NotFound'}
        '409':
          description: "Own STATE_CONFLICT (reason INVALID_TRANSITION: request not PENDING / concurrent accept, no `paymentRequest`), IDEMPOTENCY_CONFLICT, or a relayed transaction-service 409 STATE_CONFLICT with `transaction` + `paymentRequest`"
          content:
            application/problem+json:
              schema: {$ref: '#/components/schemas/ProblemRelayedAccept'}
              x-reasons: {STATE_CONFLICT: [INVALID_TRANSITION]}
        '422':
          description: "Relayed transaction-service refusal (WALLET_NOT_TRANSACTABLE, LIMIT_EXCEEDED, RISK_*, INSUFFICIENT_FUNDS, MAX_BALANCE_EXCEEDED, SERVICE_DISABLED) with `paymentRequest` (status PENDING) and, when the intent was persisted, `transaction`; or own SERVICE_DISABLED (REQUEST_MONEY switch) without `paymentRequest`"
          content:
            application/problem+json:
              schema: {$ref: '#/components/schemas/ProblemRelayedAccept'}
              example:
                type: about:blank
                title: Limit exceeded
                status: 422
                code: LIMIT_EXCEEDED
                limitCode: P2P_SEND_DAILY_AMOUNT
                limitParty: FROM
                remainingPoisha: 12000
                remainingCount: null
                resetsAt: "2026-10-09T18:00:00.000Z"
                instance: /v1/payment-requests/0192fc33-0000-7000-8000-000000000003:accept
                correlationId: c-preq-0192fc33
                transaction: {txnRef: PP26100900K3M9QX2A, txnId: 0192fc35-0000-7000-8000-000000000005, txnType: P2P, status: FAILED, failureCode: LIMIT_EXCEEDED, amountPoisha: 30000, feePoisha: 500, vatPoisha: 75, totalDebitPoisha: 30575, feeBearer: PAYER, currency: BDT, fromWalletId: 0192f2aa-0001-7000-8000-00000000a001, toWalletId: 0192f2bb-0002-7000-8000-00000000b002, createdAt: "2026-10-09T10:00:00.020Z", completedAt: "2026-10-09T10:00:00.040Z"}
                paymentRequest: {requestId: 0192fc33-0000-7000-8000-000000000003, requestRef: RQ261009P3X8K2NM, status: PENDING, requesterWalletId: 0192f2bb-0002-7000-8000-00000000b002, payerWalletId: 0192f2aa-0001-7000-8000-00000000a001, amountPoisha: 30000, note: lunch, expiresAt: "2026-10-12T09:00:00.000Z", txnRef: null, lastFailureCode: LIMIT_EXCEEDED, createdAt: "2026-10-09T09:00:00.000Z"}
        '503':
          description: "Relayed 503 (request stays ACCEPTING; `transaction` with status INITIATED when the intent was persisted; `paymentRequest` present) or own 503 before the P2P call"
          content:
            application/problem+json:
              schema: {$ref: '#/components/schemas/ProblemRelayedAccept'}

