components:
  parameters:
    XCorrelationId: {name: X-Correlation-Id, in: header, required: false, description: "generated if absent (K3.1)", schema: {type: string, maxLength: 64, pattern: '^[A-Za-z0-9._-]+$'}}
    XActorType: {name: X-Actor-Type, in: header, required: true, schema: {type: string, enum: [CUSTOMER, AGENT, MERCHANT, DISTRIBUTOR, INSTITUTION, STAFF, SYSTEM, SERVICE]}}
    XActorId: {name: X-Actor-Id, in: header, required: true, schema: {type: string, maxLength: 64}}
    XActorWalletId: {name: X-Actor-Wallet-Id, in: header, required: false, description: "required for wallet holders (CUSTOMER, INSTITUTION)", schema: {type: string, format: uuid}}
    XActorRoles: {name: X-Actor-Roles, in: header, required: false, description: "required for STAFF; comma-separated K7 codes", schema: {type: string}}
    XActorUserId: {name: X-Actor-User-Id, in: header, required: false, description: "institution sub-user; required for institution maker-checker (maker != checker)", schema: {type: string, maxLength: 64, pattern: '^[A-Za-z0-9_-]+$'}}
    XChannel: {name: X-Channel, in: header, required: true, schema: {type: string, enum: [APP, USSD, PARTNER_APP, PORTAL, BACKOFFICE, API, SYSTEM]}}
    XDeviceId: {name: X-Device-Id, in: header, required: false, schema: {type: string, maxLength: 128}}
    IdempotencyKeyRequired: {name: Idempotency-Key, in: header, required: true, schema: {type: string, maxLength: 64, pattern: '^[A-Za-z0-9_-]+$'}}
    IdempotencyKeyOptional: {name: Idempotency-Key, in: header, required: false, description: "honoured when present", schema: {type: string, maxLength: 64, pattern: '^[A-Za-z0-9_-]+$'}}
    Limit: {name: limit, in: query, required: false, schema: {type: integer, minimum: 1, maximum: 200, default: 50}}
    Cursor: {name: cursor, in: query, required: false, schema: {type: string}}
    BatchId: {name: batchId, in: path, required: true, schema: {type: string, format: uuid}, example: 0192fa10-0000-7000-8000-000000000001}
    ScheduleId: {name: scheduleId, in: path, required: true, schema: {type: string, format: uuid}, example: 0192fb01-0000-7000-8000-000000000001}
    RequestId: {name: requestId, in: path, required: true, schema: {type: string, format: uuid}, example: 0192fc33-0000-7000-8000-000000000003}
    ApprovalId: {name: id, in: path, required: true, schema: {type: string, format: uuid}, example: 0192fa22-0000-7000-8000-000000000002}

  responses:
    ValidationFailed:
      description: VALIDATION_FAILED (schema, header, limit, cursor reason INVALID_CURSOR)
      content:
        application/problem+json:
          schema: {$ref: '#/components/schemas/Problem'}
          example: {type: about:blank, title: Validation failed, status: 400, code: VALIDATION_FAILED, correlationId: c-0f3e9a, errors: [{field: limit, message: must be between 1 and 200}]}
