  /v1/approvals/{id}:approve:
    post:
      tags: [approvals]
      operationId: approveApproval
      summary: Approve the current level; the final level runs the funding check and starts the batch
      description: |
        Level 1: STAFF OPS_CHECKER or the institution checker; level 2 (validAmountPoisha >= secondLevelThresholdPoisha): STAFF FIN_CHECKER.
        Checker != maker (actorType + actorId, and X-Actor-User-Id when both carry it); a level-2 checker differs from the level-1 checker.
        Final level: funding check -> APPROVED -> RUNNING (or scheduled), or PAUSED INSUFFICIENT_FUNDING with 422 INSUFFICIENT_FUNDS (approval stays APPROVED).
      x-audience: staff
      x-actors:
        - {type: STAFF, roles: [OPS_CHECKER, FIN_CHECKER], rule: "role must be in the current level's checkerRoles"}
        - {type: INSTITUTION, rule: "level 1 only; X-Actor-Id = batch institutionId; X-Actor-User-Id present and != maker's; disabled when institutionSelfApproval = false"}
      x-product: DISBURSEMENT
      parameters:
        - $ref: '#/components/parameters/ApprovalId'
        - $ref: '#/components/parameters/XCorrelationId'
        - $ref: '#/components/parameters/XActorType'
        - $ref: '#/components/parameters/XActorId'
        - $ref: '#/components/parameters/XActorRoles'
        - $ref: '#/components/parameters/XActorUserId'
        - $ref: '#/components/parameters/XChannel'
        - $ref: '#/components/parameters/IdempotencyKeyRequired'
      requestBody:
        required: false
        content:
          application/json:
            schema: {$ref: '#/components/schemas/ApproveRequest'}
            example: {comment: Checked against payroll register}
      responses:
        '200':
          description: Decision recorded
          content:
            application/json:
              schema: {$ref: '#/components/schemas/ApprovalDecisionResponse'}
              example:
                approvalId: 0192fa22-0000-7000-8000-000000000002
                status: APPROVED
                level: 1
                requiredLevels: 1
                batch: {"batchId": "0192fa10-0000-7000-8000-000000000001", "batchRef": "BD261009K7Q2M4ZD", "institutionId": "0192f2e0-0006-7000-8000-00000000f000", "payerWalletId": "0192f2ff-0006-7000-8000-00000000f006", "title": "October 2026 salary", "clientReference": "PAYROLL-2026-10", "source": "CSV", "status": "RUNNING", "pauseReason": null, "failureDetail": null, "totalRows": 5000, "validRows": 4992, "invalidRows": 8, "paidRows": 0, "failedRows": 0, "skippedRows": 0, "validAmountPoisha": 6240000000, "paidAmountPoisha": 0, "approvalId": "0192fa22-0000-7000-8000-000000000002", "scheduledStartAt": null, "createdAt": "2026-10-09T09:00:00.000Z", "submittedAt": "2026-10-09T09:05:00.000Z", "approvedAt": "2026-10-09T09:30:00.000Z", "startedAt": "2026-10-09T09:30:01.000Z", "completedAt": null}
        '403': {$ref: '#/components/responses/ActorNotAllowed'}
        '404': {$ref: '#/components/responses/NotFound'}
        '409':
          description: "STATE_CONFLICT reason INVALID_TRANSITION (not PENDING) or APPROVAL_EXPIRED; IDEMPOTENCY_CONFLICT"
          content:
            application/problem+json:
              schema: {$ref: '#/components/schemas/Problem'}
              x-reasons: {STATE_CONFLICT: [INVALID_TRANSITION, APPROVAL_EXPIRED]}
        '422':
          description: "MAKER_CHECKER_VIOLATION; INSUFFICIENT_FUNDS at the final level (problem member `batch`); SERVICE_DISABLED"
          content:
            application/problem+json:
              schema: {$ref: '#/components/schemas/ProblemWithBatch'}
              example:
                type: about:blank
                title: Insufficient funds
                status: 422
                code: INSUFFICIENT_FUNDS
                instance: /v1/approvals/0192fa22-0000-7000-8000-000000000002:approve
                correlationId: c-7d21ab
                batch: {"batchId": "0192fa10-0000-7000-8000-000000000001", "batchRef": "BD261009K7Q2M4ZD", "institutionId": "0192f2e0-0006-7000-8000-00000000f000", "payerWalletId": "0192f2ff-0006-7000-8000-00000000f006", "title": "October 2026 salary", "clientReference": "PAYROLL-2026-10", "source": "CSV", "status": "PAUSED", "pauseReason": "INSUFFICIENT_FUNDING", "failureDetail": null, "totalRows": 5000, "validRows": 4992, "invalidRows": 8, "paidRows": 0, "failedRows": 0, "skippedRows": 0, "validAmountPoisha": 6240000000, "paidAmountPoisha": 0, "approvalId": "0192fa22-0000-7000-8000-000000000002", "scheduledStartAt": null, "createdAt": "2026-10-09T09:00:00.000Z", "submittedAt": "2026-10-09T09:05:00.000Z", "approvedAt": "2026-10-09T09:30:00.000Z", "startedAt": null, "completedAt": null}
        '503': {$ref: '#/components/responses/DependencyUnavailable'}

