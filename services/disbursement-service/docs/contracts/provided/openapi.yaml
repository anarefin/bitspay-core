      content:
        application/problem+json:
          schema: {$ref: '#/components/schemas/Problem'}
    DependencyUnavailable:
      description: DEPENDENCY_UNAVAILABLE (retryable true)
      content:
        application/problem+json:
          schema: {$ref: '#/components/schemas/Problem'}
          example: {type: about:blank, title: Try again, status: 503, code: DEPENDENCY_UNAVAILABLE, correlationId: c-0f3e9c, retryable: true}

