openapi: 3.1.0
info:
  title: disbursement-service API
  version: 1.0.0
  description: |
    Bulk disbursement batches, local maker-checker, scheduled transfers and request money (SVC-08).
    Kernel 1.0: headers K3.1, idempotency K3.3, pagination K3.4, problem+json K3.6, product switches K3.7.
    Product switch per path group: `/v1/disbursement/**` and `/v1/approvals/**` = DISBURSEMENT,
    `/v1/scheduled-transfers/**` = SCHEDULED_TRANSFER, `/v1/payment-requests/**` = REQUEST_MONEY.
    A disabled product returns 422 SERVICE_DISABLED before any side effect (state-changing operations only; reads stay available).
    Money is int64 poisha. IDs are canonical lower-case UUIDs. Timestamps ISO-8601 UTC with milliseconds.
    `Idempotency-Key` retention: 7 days (OPEN D-01); same key + same body replays the stored response; different body -> 409 IDEMPOTENCY_CONFLICT.
servers:
  - url: http://localhost:8108
tags:
  - name: batches
  - name: approvals
  - name: scheduled-transfers
  - name: payment-requests
  - name: internal-admin

paths:
  /v1/disbursement/batches:
    post:
      tags: [batches]
      operationId: createBatch
      summary: Create a disbursement batch (JSON rows or CSV upload)
      description: |
        Stores the batch (DRAFT), streams the file to the FileStore, parses rows and moves the batch to VALIDATING.
        Row-level problems (bad MSISDN, bad amount) never fail the request: they make rows INVALID.
        Payer checks: `GET /v1/wallets/{payerWalletId}` must return walletType I and ownerType INSTITUTION
        (institutionId = ownerId; for an INSTITUTION actor ownerId must equal X-Actor-Id, else 403), and the payer status must be debit-capable (A or C).
      x-audience: partner
      x-actors:
        - {type: INSTITUTION, rule: "X-Actor-Wallet-Id = payerWalletId and payer wallet ownerId = X-Actor-Id; X-Actor-User-Id recommended (required for institution maker-checker)"}
        - {type: STAFF, roles: [OPS_MAKER], rule: "on behalf of an institution; payerWalletId required"}
      x-product: DISBURSEMENT
      parameters:
        - $ref: '#/components/parameters/XCorrelationId'
        - $ref: '#/components/parameters/XActorType'
        - $ref: '#/components/parameters/XActorId'
        - $ref: '#/components/parameters/XActorWalletId'
        - $ref: '#/components/parameters/XActorRoles'
        - $ref: '#/components/parameters/XActorUserId'
        - $ref: '#/components/parameters/XChannel'
        - $ref: '#/components/parameters/IdempotencyKeyRequired'
      requestBody:
        required: true
        content:
          application/json:
            schema: {$ref: '#/components/schemas/BatchCreateRequest'}
            example:
              payerWalletId: 0192f2ff-0006-7000-8000-00000000f006
              title: October 2026 salary
              clientReference: PAYROLL-2026-10
              preRegisterUnknown: false
              scheduledStartAt: null
              rows:
                - {msisdn: "01711000002", amountPoisha: 1250000, reference: EMP-0042, name: Karim Ahmed}
                - {msisdn: "8801811000077", amountPoisha: 1310000, reference: EMP-0043, name: Shila Akter}
          multipart/form-data:
            schema: {$ref: '#/components/schemas/BatchCreateMultipart'}
            encoding:
              file: {contentType: text/csv}
      responses:
        '202':
          description: Accepted; validation runs asynchronously
          content:
            application/json:
              schema: {$ref: '#/components/schemas/BatchCreateResponse'}
              example: {batchId: 0192fa10-0000-7000-8000-000000000001, batchRef: BD261009K7Q2M4ZD, status: VALIDATING, totalRows: 2}
        '400': {$ref: '#/components/responses/ValidationFailed'}
        '403': {$ref: '#/components/responses/ActorNotAllowed'}
        '409':
          description: "STATE_CONFLICT reason DUPLICATE_FILE (same payer + SHA-256 with a live batch) or IDEMPOTENCY_CONFLICT"
          content:
            application/problem+json:
              schema: {$ref: '#/components/schemas/Problem'}
              x-reasons: {STATE_CONFLICT: [DUPLICATE_FILE]}
        '422':
          description: "WALLET_NOT_TRANSACTABLE (payer not type I / not INSTITUTION-owned / not debit-capable; extensions walletId, walletStatus) or SERVICE_DISABLED"
          content:
            application/problem+json:
              schema: {$ref: '#/components/schemas/ProblemWalletNotTransactable'}
        '503': {$ref: '#/components/responses/DependencyUnavailable'}
    get:
      tags: [batches]
      operationId: listBatches
      summary: List batches (newest first)
      x-audience: partner
      x-actors:
        - {type: INSTITUTION, rule: "only batches whose institutionId = X-Actor-Id"}
        - {type: STAFF, roles: [OPS_MAKER, OPS_CHECKER, FIN_MAKER, FIN_CHECKER, AUDITOR, READ_ONLY]}
        - {type: SERVICE, actorIds: ["*"], rule: "read-only"}
      parameters:
        - $ref: '#/components/parameters/XCorrelationId'
        - $ref: '#/components/parameters/XActorType'
        - $ref: '#/components/parameters/XActorId'
        - $ref: '#/components/parameters/XActorWalletId'
        - $ref: '#/components/parameters/XActorRoles'
        - $ref: '#/components/parameters/XChannel'
        - {name: payerWalletId, in: query, required: false, schema: {type: string, format: uuid}}
        - {name: status, in: query, required: false, schema: {$ref: '#/components/schemas/BatchStatus'}}
        - $ref: '#/components/parameters/Limit'
        - $ref: '#/components/parameters/Cursor'
      responses:
        '200':
          description: Page of batches ordered createdAt desc, batchId desc
          content:
            application/json:
              schema: {$ref: '#/components/schemas/BatchPage'}
              example:
                items: [{batchId: 0192fa10-0000-7000-8000-000000000001, batchRef: BD261009K7Q2M4ZD, institutionId: 0192f2e0-0006-7000-8000-00000000f000, payerWalletId: 0192f2ff-0006-7000-8000-00000000f006, title: October 2026 salary, clientReference: PAYROLL-2026-10, source: CSV, status: VALIDATED, pauseReason: null, failureDetail: null, totalRows: 5000, validRows: 4992, invalidRows: 8, paidRows: 0, failedRows: 0, skippedRows: 0, validAmountPoisha: 6240000000, paidAmountPoisha: 0, approvalId: null, scheduledStartAt: null, createdAt: "2026-10-09T09:00:00.000Z", submittedAt: null, approvedAt: null, startedAt: null, completedAt: null}]
                nextCursor: null
        '400': {$ref: '#/components/responses/ValidationFailed'}
        '403': {$ref: '#/components/responses/ActorNotAllowed'}

  /v1/disbursement/batches/{batchId}:
    get:
      tags: [batches]
      operationId: getBatch
      summary: Batch detail with counters
      x-audience: partner
      x-actors:
        - {type: INSTITUTION, rule: "owner (institutionId = X-Actor-Id)"}
        - {type: STAFF, roles: [OPS_MAKER, OPS_CHECKER, FIN_MAKER, FIN_CHECKER, AUDITOR, READ_ONLY]}
        - {type: SERVICE, actorIds: ["*"], rule: "read-only"}
      parameters:
        - $ref: '#/components/parameters/BatchId'
        - $ref: '#/components/parameters/XCorrelationId'
        - $ref: '#/components/parameters/XActorType'
        - $ref: '#/components/parameters/XActorId'
        - $ref: '#/components/parameters/XActorRoles'
        - $ref: '#/components/parameters/XChannel'
      responses:
        '200':
          description: Batch
          content:
            application/json:
              schema: {$ref: '#/components/schemas/Batch'}
              example: {"batchId": "0192fa10-0000-7000-8000-000000000001", "batchRef": "BD261009K7Q2M4ZD", "institutionId": "0192f2e0-0006-7000-8000-00000000f000", "payerWalletId": "0192f2ff-0006-7000-8000-00000000f006", "title": "October 2026 salary", "clientReference": "PAYROLL-2026-10", "source": "CSV", "status": "PARTIALLY_FAILED", "pauseReason": null, "failureDetail": null, "totalRows": 5000, "validRows": 4992, "invalidRows": 8, "paidRows": 4990, "failedRows": 2, "skippedRows": 0, "validAmountPoisha": 6240000000, "paidAmountPoisha": 6237500000, "approvalId": "0192fa22-0000-7000-8000-000000000002", "scheduledStartAt": null, "createdAt": "2026-10-09T09:00:00.000Z", "submittedAt": "2026-10-09T09:05:00.000Z", "approvedAt": "2026-10-09T09:30:00.000Z", "startedAt": "2026-10-09T09:30:01.000Z", "completedAt": "2026-10-09T09:41:12.000Z"}
        '403': {$ref: '#/components/responses/ActorNotAllowed'}
        '404': {$ref: '#/components/responses/NotFound'}

  /v1/disbursement/batches/{batchId}/rows:
    get:
      tags: [batches]
      operationId: listBatchRows
      summary: Rows of a batch (typed validation report / per-record status)
      description: "MSISDN is clear only for STAFF OPS_* roles; everyone else sees 8801711****00. Ordered by rowNo asc."
      x-audience: partner
      x-actors:
        - {type: INSTITUTION, rule: owner}
        - {type: STAFF, roles: [OPS_MAKER, OPS_CHECKER, FIN_MAKER, FIN_CHECKER, AUDITOR, READ_ONLY]}
        - {type: SERVICE, actorIds: ["*"], rule: "read-only, masked MSISDN"}
      parameters:
        - $ref: '#/components/parameters/BatchId'
        - $ref: '#/components/parameters/XCorrelationId'
        - $ref: '#/components/parameters/XActorType'
        - $ref: '#/components/parameters/XActorId'
        - $ref: '#/components/parameters/XActorRoles'
        - $ref: '#/components/parameters/XChannel'
        - {name: status, in: query, required: false, schema: {$ref: '#/components/schemas/RowStatus'}}
        - $ref: '#/components/parameters/Limit'
        - $ref: '#/components/parameters/Cursor'
      responses:
        '200':
          description: Page of rows
          content:
            application/json:
              schema: {$ref: '#/components/schemas/BatchRowPage'}
              example:
                items:
                  - {rowNo: 42, rowRef: BD261009K7Q2M4ZD-42, msisdn: "8801711****02", nameInFile: Karim Ahmed, displayNameMasked: "Karim A***", reference: EMP-0042, amountPoisha: 1250000, status: PAID, failureCode: null, failureDetail: null, walletId: 0192f2bb-0002-7000-8000-00000000b002, attempt: 1, commandId: b767a223-29e4-5c21-a222-74e75e9ca80e, paidAt: "2026-10-09T10:04:11.102Z"}
                  - {rowNo: 43, rowRef: BD261009K7Q2M4ZD-43, msisdn: "8801711****03", nameInFile: Shila Akter, displayNameMasked: "Shila A***", reference: EMP-0043, amountPoisha: 900000, status: FAILED, failureCode: LIMIT_EXCEEDED, failureDetail: DISBURSEMENT_RECEIVE_MONTHLY_AMOUNT, walletId: 0192f2bb-0003-7000-8000-00000000b003, attempt: 1, commandId: 13bc123c-e9c8-51ad-8d29-6df1718faa15, paidAt: null}
                nextCursor: null
        '400': {$ref: '#/components/responses/ValidationFailed'}
        '403': {$ref: '#/components/responses/ActorNotAllowed'}
        '404': {$ref: '#/components/responses/NotFound'}

  /v1/disbursement/batches/{batchId}/report.csv:
    get:
      tags: [batches]
      operationId: getBatchReport
      summary: Validation report (up to VALIDATED) or final per-record report (after submit)
      description: |
        UTF-8 CSV with header `rowNo,rowRef,msisdnMasked,nameInFile,displayNameMasked,reference,amount,status,failureCode,failureDetail,walletId,commandId,paidAt`.
        `amount` is Taka with exactly 2 decimals (presentation only). MSISDN always masked. The validation report ends with the line
        `# limits re-checked at payment time`. Streams; no pagination.
      x-audience: partner
      x-actors:
        - {type: INSTITUTION, rule: owner}
        - {type: STAFF, roles: [OPS_MAKER, OPS_CHECKER, FIN_MAKER, FIN_CHECKER, AUDITOR, READ_ONLY]}
      parameters:
        - $ref: '#/components/parameters/BatchId'
        - $ref: '#/components/parameters/XCorrelationId'
        - $ref: '#/components/parameters/XActorType'
        - $ref: '#/components/parameters/XActorId'
        - $ref: '#/components/parameters/XActorRoles'
        - $ref: '#/components/parameters/XChannel'
      responses:
        '200':
          description: CSV report
          content:
            text/csv:
              schema: {type: string}
              example: |
                rowNo,rowRef,msisdnMasked,nameInFile,displayNameMasked,reference,amount,status,failureCode,failureDetail,walletId,commandId,paidAt
                42,BD261009K7Q2M4ZD-42,8801711****02,Karim Ahmed,Karim A***,EMP-0042,12500.00,PAID,,,0192f2bb-0002-7000-8000-00000000b002,b767a223-29e4-5c21-a222-74e75e9ca80e,2026-10-09T10:04:11.102Z
        '403': {$ref: '#/components/responses/ActorNotAllowed'}
        '404': {$ref: '#/components/responses/NotFound'}

  /v1/disbursement/batches/{batchId}:submit:
    post:
      tags: [batches]
      operationId: submitBatch
      summary: Submit a VALIDATED batch for approval (VALIDATED -> PENDING_APPROVAL)
      description: "Creates approval_request (DisbursementBatch / EXECUTE, amountPoisha = validAmountPoisha), emits APPROVAL_REQUESTED + BATCH_SUBMITTED + audit. Funding is checked as a warning only."
      x-audience: partner
      x-actors:
        - {type: INSTITUTION, rule: owner (maker side)}
        - {type: STAFF, roles: [OPS_MAKER]}
      x-product: DISBURSEMENT
      parameters:
        - $ref: '#/components/parameters/BatchId'
        - $ref: '#/components/parameters/XCorrelationId'
        - $ref: '#/components/parameters/XActorType'
        - $ref: '#/components/parameters/XActorId'
        - $ref: '#/components/parameters/XActorRoles'
        - $ref: '#/components/parameters/XActorUserId'
        - $ref: '#/components/parameters/XChannel'
        - $ref: '#/components/parameters/IdempotencyKeyRequired'
      requestBody:
        required: true
        content:
          application/json:
            schema: {$ref: '#/components/schemas/SubmitRequest'}
            example: {excludeInvalidRows: true}
      responses:
        '200':
          description: Batch (status PENDING_APPROVAL)
          content:
            application/json:
              schema: {$ref: '#/components/schemas/Batch'}
              example: {"batchId": "0192fa10-0000-7000-8000-000000000001", "batchRef": "BD261009K7Q2M4ZD", "institutionId": "0192f2e0-0006-7000-8000-00000000f000", "payerWalletId": "0192f2ff-0006-7000-8000-00000000f006", "title": "October 2026 salary", "clientReference": "PAYROLL-2026-10", "source": "CSV", "status": "PENDING_APPROVAL", "pauseReason": null, "failureDetail": null, "totalRows": 5000, "validRows": 4992, "invalidRows": 8, "paidRows": 0, "failedRows": 0, "skippedRows": 0, "validAmountPoisha": 6240000000, "paidAmountPoisha": 0, "approvalId": "0192fa22-0000-7000-8000-000000000002", "scheduledStartAt": null, "createdAt": "2026-10-09T09:00:00.000Z", "submittedAt": "2026-10-09T09:05:00.000Z", "approvedAt": null, "startedAt": null, "completedAt": null}
        '400':
          description: "VALIDATION_FAILED, reason NO_VALID_ROWS or INVALID_ROWS_PRESENT"
          content:
            application/problem+json:
              schema: {$ref: '#/components/schemas/Problem'}
              x-reasons: {VALIDATION_FAILED: [NO_VALID_ROWS, INVALID_ROWS_PRESENT]}
        '403': {$ref: '#/components/responses/ActorNotAllowed'}
        '404': {$ref: '#/components/responses/NotFound'}
        '409': {$ref: '#/components/responses/StateConflict'}
        '422': {$ref: '#/components/responses/ServiceDisabled'}

  /v1/disbursement/batches/{batchId}:cancel:
    post:
      tags: [batches]
      operationId: cancelBatch
      summary: Cancel a batch (DRAFT..APPROVED or PAUSED -> CANCELLED)
      description: "VALID rows -> SKIPPED (reservations released explicitly; no row event). Pending approval -> CANCELLED (APPROVAL_DECIDED status CANCELLED). BATCH_COMPLETED (status CANCELLED) if any row was attempted. 409 ROWS_IN_FLIGHT while rows are PROCESSING."
      x-audience: partner
      x-actors:
        - {type: INSTITUTION, rule: owner (maker side)}
        - {type: STAFF, roles: [OPS_MAKER, OPS_CHECKER]}
      parameters:
        - $ref: '#/components/parameters/BatchId'
        - $ref: '#/components/parameters/XCorrelationId'
        - $ref: '#/components/parameters/XActorType'
        - $ref: '#/components/parameters/XActorId'
        - $ref: '#/components/parameters/XActorRoles'
        - $ref: '#/components/parameters/XActorUserId'
        - $ref: '#/components/parameters/XChannel'
        - $ref: '#/components/parameters/IdempotencyKeyRequired'
      requestBody:
        required: true
        content:
          application/json:
            schema: {$ref: '#/components/schemas/CancelRequest'}
            example: {reason: Wrong salary month uploaded}
      responses:
        '200':
          description: Batch (status CANCELLED)
          content:
            application/json:
              schema: {$ref: '#/components/schemas/Batch'}
              example: {"batchId": "0192fa10-0000-7000-8000-000000000001", "batchRef": "BD261009K7Q2M4ZD", "institutionId": "0192f2e0-0006-7000-8000-00000000f000", "payerWalletId": "0192f2ff-0006-7000-8000-00000000f006", "title": "October 2026 salary", "clientReference": "PAYROLL-2026-10", "source": "CSV", "status": "CANCELLED", "pauseReason": null, "failureDetail": null, "totalRows": 5000, "validRows": 4992, "invalidRows": 8, "paidRows": 0, "failedRows": 0, "skippedRows": 4992, "validAmountPoisha": 6240000000, "paidAmountPoisha": 0, "approvalId": "0192fa22-0000-7000-8000-000000000002", "scheduledStartAt": null, "createdAt": "2026-10-09T09:00:00.000Z", "submittedAt": "2026-10-09T09:05:00.000Z", "approvedAt": null, "startedAt": null, "completedAt": "2026-10-09T09:20:00.000Z"}
        '400': {$ref: '#/components/responses/ValidationFailed'}
        '403': {$ref: '#/components/responses/ActorNotAllowed'}
        '404': {$ref: '#/components/responses/NotFound'}
        '409':
          description: "STATE_CONFLICT reason INVALID_TRANSITION or ROWS_IN_FLIGHT; IDEMPOTENCY_CONFLICT"
          content:
            application/problem+json:
              schema: {$ref: '#/components/schemas/Problem'}
              x-reasons: {STATE_CONFLICT: [INVALID_TRANSITION, ROWS_IN_FLIGHT]}

  /v1/disbursement/batches/{batchId}:pause:
    post:
      tags: [batches]
      operationId: pauseBatch
      summary: Pause a RUNNING batch (pauseReason OPERATOR)
      x-audience: partner
      x-actors:
        - {type: INSTITUTION, rule: owner}
        - {type: STAFF, roles: [OPS_CHECKER]}
      parameters:
        - $ref: '#/components/parameters/BatchId'
        - $ref: '#/components/parameters/XCorrelationId'
        - $ref: '#/components/parameters/XActorType'
        - $ref: '#/components/parameters/XActorId'
        - $ref: '#/components/parameters/XActorRoles'
        - $ref: '#/components/parameters/XActorUserId'
        - $ref: '#/components/parameters/XChannel'
        - $ref: '#/components/parameters/IdempotencyKeyRequired'
      requestBody:
        required: false
        content:
          application/json:
            schema: {$ref: '#/components/schemas/EmptyBody'}
            example: {}
      responses:
        '200':
          description: Batch (status PAUSED)
          content:
            application/json:
              schema: {$ref: '#/components/schemas/Batch'}
              example: {"batchId": "0192fa10-0000-7000-8000-000000000001", "batchRef": "BD261009K7Q2M4ZD", "institutionId": "0192f2e0-0006-7000-8000-00000000f000", "payerWalletId": "0192f2ff-0006-7000-8000-00000000f006", "title": "October 2026 salary", "clientReference": "PAYROLL-2026-10", "source": "CSV", "status": "PAUSED", "pauseReason": "OPERATOR", "failureDetail": null, "totalRows": 5000, "validRows": 4992, "invalidRows": 8, "paidRows": 2000, "failedRows": 1, "skippedRows": 0, "validAmountPoisha": 6240000000, "paidAmountPoisha": 2500000000, "approvalId": "0192fa22-0000-7000-8000-000000000002", "scheduledStartAt": null, "createdAt": "2026-10-09T09:00:00.000Z", "submittedAt": "2026-10-09T09:05:00.000Z", "approvedAt": "2026-10-09T09:30:00.000Z", "startedAt": "2026-10-09T09:30:01.000Z", "completedAt": null}
        '403': {$ref: '#/components/responses/ActorNotAllowed'}
        '404': {$ref: '#/components/responses/NotFound'}
        '409': {$ref: '#/components/responses/StateConflict'}

  /v1/disbursement/batches/{batchId}:resume:
    post:
      tags: [batches]
      operationId: resumeBatch
      summary: Resume a PAUSED batch after a funding check (PAUSED -> RUNNING)
      x-audience: partner
      x-actors:
        - {type: INSTITUTION, rule: owner}
        - {type: STAFF, roles: [OPS_CHECKER]}
      x-product: DISBURSEMENT
      parameters:
        - $ref: '#/components/parameters/BatchId'
        - $ref: '#/components/parameters/XCorrelationId'
        - $ref: '#/components/parameters/XActorType'
        - $ref: '#/components/parameters/XActorId'
        - $ref: '#/components/parameters/XActorRoles'
        - $ref: '#/components/parameters/XActorUserId'
        - $ref: '#/components/parameters/XChannel'
        - $ref: '#/components/parameters/IdempotencyKeyRequired'
      requestBody:
        required: false
        content:
          application/json:
            schema: {$ref: '#/components/schemas/EmptyBody'}
            example: {}
      responses:
        '200':
          description: Batch (status RUNNING)
          content:
            application/json:
              schema: {$ref: '#/components/schemas/Batch'}
              example: {"batchId": "0192fa10-0000-7000-8000-000000000001", "batchRef": "BD261009K7Q2M4ZD", "institutionId": "0192f2e0-0006-7000-8000-00000000f000", "payerWalletId": "0192f2ff-0006-7000-8000-00000000f006", "title": "October 2026 salary", "clientReference": "PAYROLL-2026-10", "source": "CSV", "status": "RUNNING", "pauseReason": null, "failureDetail": null, "totalRows": 5000, "validRows": 4992, "invalidRows": 8, "paidRows": 0, "failedRows": 0, "skippedRows": 0, "validAmountPoisha": 6240000000, "paidAmountPoisha": 0, "approvalId": "0192fa22-0000-7000-8000-000000000002", "scheduledStartAt": null, "createdAt": "2026-10-09T09:00:00.000Z", "submittedAt": "2026-10-09T09:05:00.000Z", "approvedAt": "2026-10-09T09:30:00.000Z", "startedAt": "2026-10-09T09:30:01.000Z", "completedAt": null}
        '403': {$ref: '#/components/responses/ActorNotAllowed'}
        '404': {$ref: '#/components/responses/NotFound'}
        '409': {$ref: '#/components/responses/StateConflict'}
        '422':
          description: "INSUFFICIENT_FUNDS (problem member `batch`, batch stays PAUSED INSUFFICIENT_FUNDING), WALLET_NOT_TRANSACTABLE (payer account closed / unknown), SERVICE_DISABLED"
          content:
            application/problem+json:
              schema: {$ref: '#/components/schemas/ProblemWithBatch'}
              example:
                type: about:blank
                title: Insufficient funds
                status: 422
                code: INSUFFICIENT_FUNDS
                instance: /v1/disbursement/batches/0192fa10-0000-7000-8000-000000000001:resume
                correlationId: c-7d21aa
                batch: {"batchId": "0192fa10-0000-7000-8000-000000000001", "batchRef": "BD261009K7Q2M4ZD", "institutionId": "0192f2e0-0006-7000-8000-00000000f000", "payerWalletId": "0192f2ff-0006-7000-8000-00000000f006", "title": "October 2026 salary", "clientReference": "PAYROLL-2026-10", "source": "CSV", "status": "PAUSED", "pauseReason": "INSUFFICIENT_FUNDING", "failureDetail": null, "totalRows": 5000, "validRows": 4992, "invalidRows": 8, "paidRows": 0, "failedRows": 0, "skippedRows": 0, "validAmountPoisha": 6240000000, "paidAmountPoisha": 0, "approvalId": "0192fa22-0000-7000-8000-000000000002", "scheduledStartAt": null, "createdAt": "2026-10-09T09:00:00.000Z", "submittedAt": "2026-10-09T09:05:00.000Z", "approvedAt": "2026-10-09T09:30:00.000Z", "startedAt": null, "completedAt": null}
        '503': {$ref: '#/components/responses/DependencyUnavailable'}

  /v1/disbursement/batches/{batchId}:retry-failed:
    post:
      tags: [batches]
      operationId: retryFailedRows
      summary: Retry FAILED rows with a retryable failureCode (PARTIALLY_FAILED -> RUNNING)
