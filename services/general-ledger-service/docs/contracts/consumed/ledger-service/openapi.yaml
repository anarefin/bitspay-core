      - commands
      x-audience: service
      x-actors:
      - type: SERVICE
        ids:
        - transaction-service
        - pricing-service
        rule: 'pricing-service (campaign module only): original must be command type 12 and reverseFee = reverseCommission = false (flag true => 400 VALIDATION_FAILED; other original type => REJECTED OTHER
          NOT_REVERSIBLE); never sends amountPoisha or releaseHoldCommandId'
