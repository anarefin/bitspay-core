                status: 409
                code: STATE_CONFLICT
                detail: account balance is not zero
                instance: /v1/ledger/accounts/0192f2bb-0000-7000-8000-00000000b001:close
                correlationId: c-0f3e9a
                reason: BALANCE_NOT_ZERO
