    post:
      operationId: closeAccount
      summary: Close an account (TB closing transfer, code 9005)
      tags:
      - accounts
      description: 'No body. Idempotent (deterministic close command id). Precondition: debits_posted = credits_posted and both pendings 0. The closing transfer uses flags pending | closing_debit only (closes
        the account, never SUSPENSE). Already closed => 200 EXISTS.'
      x-audience: service
      x-actors:
      - type: SERVICE
        ids:
        - wallet-service
      x-idempotency: accountId (deterministic closeCommandId)
      x-problem-reasons:
