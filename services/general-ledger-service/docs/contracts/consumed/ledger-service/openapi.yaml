        (same commandId + same body => EXISTS with the original result; different body => 409; REJECTED is final for the commandId). Command endpoints require X-Actor-Type SERVICE (SYSTEM accepted only
        in the `local` profile). Lane online; service-side p99 <= 40 ms.'
