              schema:
                $ref: '#/components/schemas/CloseAccountResponse'
              example:
                accountId: 0192f2bb-0000-7000-8000-00000000b001
                result: OK
                closedAt: '2026-10-09T10:00:00.000Z'
        '409':
          description: 409 STATE_CONFLICT with reason BALANCE_NOT_ZERO | OPEN_HOLDS | SYSTEM_ACCOUNT
          content:
            application/problem+json:
              schema:
                allOf:
                - $ref: '#/components/schemas/Problem'
                - type: object
                  properties:
                    reason:
                      type: string
                      enum:
                      - BALANCE_NOT_ZERO
                      - OPEN_HOLDS
                      - SYSTEM_ACCOUNT
              example:
                type: about:blank
