# ledger-service (SVC-01) provided REST contract. contractVersion 1.0.0. Changes only via CHANGE-PROCESS.
openapi: 3.1.0
info:
  title: ledger-service API
  version: 1.0.0
  description: 'Provided REST contract of ledger-service (SVC-01), contractVersion 1.0.0, kernel 1.0. The only door to TigerBeetle: business commands, account lifecycle and ledger reads. Headers, errors
    and pagination follow kernel K3. Ledger idempotency is keyed on commandId (kernel K3.3 rule 6 exception); Idempotency-Key is optional and ignored. Money is int64 poisha. Every 128-bit id is canonical
    lower-case UUID text. Request bodies tolerate unknown fields, except the reserved names feeBearer SHARED / payerShareBps and command 13 vatPoisha, which are rejected with 400. x-actors: allowed actor
    types; for SERVICE/SYSTEM the allowed X-Actor-Id values; for STAFF the roles (''*'' = any K7 role).'
servers:
- url: http://ledger-service:8101
  description: Compose stack
- url: http://localhost:8101
  description: local
tags:
- name: commands
- name: accounts
- name: reads
- name: internal
paths:
  /v1/ledger/commands/post-p2p:
    post:
      operationId: command_post_p2p
      summary: 'Command 1 post-p2p: P2P payment (customer -> customer)'
      description: 'Ledger command type 1. Guard: from 100 -> to 100. Principal code 1001. Leg templates in SPEC §7.3. Idempotency: commandId (same commandId + same body => EXISTS with the original result;
        different body => 409; REJECTED is final for the commandId). Command endpoints require X-Actor-Type SERVICE (SYSTEM accepted only in the `local` profile). Lane online; service-side p99 <= 20 ms.'
      tags:
      - commands
      x-audience: service
      x-actors:
      - type: SERVICE
        ids:
        - transaction-service
      x-command-type: 1
      x-rejection-codes:
      - INSUFFICIENT_FUNDS
      - MAX_BALANCE_EXCEEDED
      - ACCOUNT_NOT_FOUND
      - ACCOUNT_CLOSED
      - INVALID_AMOUNT
      - OTHER
      x-idempotency: commandId (Idempotency-Key optional, logged only)
      parameters:
      - $ref: '#/components/parameters/XCorrelationId'
      - $ref: '#/components/parameters/XActorType'
      - $ref: '#/components/parameters/XActorId'
      - $ref: '#/components/parameters/XChannel'
      - $ref: '#/components/parameters/IdempotencyKey'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/PaymentCommandRequest'
            example:
              commandId: 0192f3c1-7a2b-7c00-9a51-3f2c8e1d0a11
              txnRef: PP26100900K3M9QX2A
              fromAccountId: 0192f2aa-0000-7000-8000-00000000a001
              toAccountId: 0192f2bb-0000-7000-8000-00000000b001
              amountPoisha: 50000
              pricing:
                feePoisha: 500
                vatPoisha: 75
                feeBearer: PAYER
                commissionPoisha: 0
                commissionSource: FEE_INCOME
                commissionBeneficiaryAccountId: null
                aitPoisha: 0
              constraints:
                destinationMaxBalancePoisha: 30000000
              metadata:
                channel: APP
                initiatorActorId: 0192f1bb-0000-7000-8000-000000000001
      responses:
        '200':
          description: Command outcome (OK, EXISTS or REJECTED)
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/CommandResponse'
              examples:
                ok:
                  summary: OK
                  value:
                    commandId: 0192f3c1-7a2b-7c00-9a51-3f2c8e1d0a11
                    result: OK
                    rejectionCode: null
                    detail: null
                    transferIds:
                    - fc214b7c-f80c-8143-4f0e-107e2518a302
                    - 3c9f8cd0-5cc5-1049-aa02-80dfc5c61a13
                    - 586bb84d-c6dc-fcd7-62fc-a264483349f4
                    postedAt: '2026-10-09T08:03:22.123Z'
                exists:
                  summary: EXISTS (replay of the same commandId and body)
                  value:
                    commandId: 0192f3c1-7a2b-7c00-9a51-3f2c8e1d0a11
                    result: EXISTS
                    rejectionCode: null
                    detail: null
                    transferIds:
                    - fc214b7c-f80c-8143-4f0e-107e2518a302
                    - 3c9f8cd0-5cc5-1049-aa02-80dfc5c61a13
                    - 586bb84d-c6dc-fcd7-62fc-a264483349f4
                    postedAt: '2026-10-09T08:03:22.123Z'
                rejected:
                  summary: REJECTED INSUFFICIENT_FUNDS
                  value:
                    commandId: 0192f3c1-7a2b-7c00-9a51-3f2c8e1d0a11
                    result: REJECTED
                    rejectionCode: INSUFFICIENT_FUNDS
                    detail: 'leg 0: exceeds_credits'
                    transferIds: []
                    postedAt: null
        '400':
          $ref: '#/components/responses/BadRequest'
        '403':
          $ref: '#/components/responses/Forbidden'
        '409':
          $ref: '#/components/responses/IdempotencyConflict'
        '503':
          $ref: '#/components/responses/Unavailable'
