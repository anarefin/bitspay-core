service: ledger-service
number: "01"
modules: []
contractVersion: 1.1.0
kernel: "1.0"
owner: Dev-1

provides:
  apis:
    - openapi: provided/openapi.yaml
      major: 1
      # 31 operations: 19 commands (one literal path per command name), 3 account operations,
      # 5 reads, system balance sheet, and 4 internal operations (x-audience: internal).
  events:
    - topic: ledger.changes
      key: "debitAccountId"
      compacted: false
      tombstones: false
      partitions: {dev: 3, prod: 48}
      retention: 14d
      transport: direct            # ledger-cdc-bridge role, idempotent Kafka producer (acks=all); not the outbox
      producerRole: ledger-cdc-bridge
      eventIdRule: "eventId = transferId (canonical UUID text); consumers dedupe on eventId"
      ordering: "ascending TB timestamp within a partition; re-publication possible (at-least-once), never reordering"
      eventTypes:
        - {type: LEDGER_TRANSFER_POSTED, version: 1, aggregateType: LedgerTransfer,
           schema: provided/events/ledger.changes/LEDGER_TRANSFER_POSTED.v1.schema.json,
           example: provided/events/ledger.changes/LEDGER_TRANSFER_POSTED.v1.example.json}
  inboundTopics: []
  data:
    - {id: transfer-id-derivation, version: 1, file: provided/data/transfer-id-derivation.v1.md, kind: algorithm}
    - {id: transfer-id-golden-vectors, version: 1, file: provided/data/transfer-id-golden-vectors.v1.json, kind: golden-vectors}
  codes: provided/codes.yaml

consumes:
  apis: []          # ledger-service calls no other Bits Pay service
  events: []        # ledger-service consumes no Kafka topic (the CDC bridge reads RabbitMQ tb.cdc, which is infrastructure)
  inboundTopics:
    - owner: admin-service
      topic: audit.events
      eventType: AUDIT_RECORDED
      version: 1
      pinnedContractVersion: 1.1.0
      fieldsUsed: ["*"]
      purpose: "audit trail of account lifecycle, holds, reversals, back-office and bulk commands, closure payouts and integrity mismatches (via outbox)"
      auditActions: [LEDGER_ACCOUNT_CREATED, LEDGER_ACCOUNT_CLOSED, LEDGER_HOLD_CREATED, LEDGER_HOLD_RELEASED,
                     LEDGER_REVERSAL_POSTED, LEDGER_ADJUSTMENT_POSTED, LEDGER_EMONEY_ISSUED, LEDGER_EMONEY_REDEEMED,
                     LEDGER_TRUST_REBALANCED, LEDGER_COMMISSION_SETTLED,
                     LEDGER_DISBURSEMENT_BATCH_POSTED, LEDGER_CLOSURE_PAYOUT_POSTED, LEDGER_INTEGRITY_MISMATCH]
      entityTypes: [LedgerAccount, LedgerHold, LedgerCommand, LedgerDisbursementBatch, LedgerJournalRow]
  data: []
  codes: []
  refdata: []       # reads no refdata: emits no businessDate and owns no FEATURE.* product
