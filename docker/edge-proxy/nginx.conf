# Dev/local edge proxy (kernel K8.1): /<svc-short>/... → <svc>:<port>/...; never authenticates.
# Variables + Docker DNS let nginx start even when some services are not running.
worker_processes 1;
events { worker_connections 512; }
http {
    resolver 127.0.0.11 valid=10s ipv6=off;
    server {
        listen 8000;
        location = / {
            default_type text/plain;
            return 200 "Bits Pay edge proxy. Try /<svc-short>/welcome or /<svc-short>/swagger-ui.html\n";
        }
        location /ledger/ {
            set $upstream ledger-service:8101;
            rewrite ^/ledger/(.*)$ /$1 break;
            proxy_pass http://$upstream;
            proxy_set_header X-Forwarded-Prefix /ledger;
            proxy_set_header X-Forwarded-Host $host;
            proxy_set_header X-Forwarded-Port $server_port;
            proxy_set_header X-Forwarded-Proto $scheme;
        }
        location /transaction/ {
            set $upstream transaction-service:8102;
            rewrite ^/transaction/(.*)$ /$1 break;
            proxy_pass http://$upstream;
            proxy_set_header X-Forwarded-Prefix /transaction;
            proxy_set_header X-Forwarded-Host $host;
            proxy_set_header X-Forwarded-Port $server_port;
            proxy_set_header X-Forwarded-Proto $scheme;
        }
        location /wallet/ {
