# Local values only (laptop stack).
listen_addresses = '*'
max_connections = 200            # 12 services x pool 8 + Debezium + tools
shared_buffers = 192MB
effective_cache_size = 384MB
work_mem = 4MB
maintenance_work_mem = 64MB
wal_level = logical
max_wal_senders = 4
max_replication_slots = 4        # one slot used: dbz_outbox
wal_compression = on
synchronous_commit = on
