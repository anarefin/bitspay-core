# Bits Pay — full local stack (Service Specs v6). Generated by create-skeleton.sh.
# Order: infrastructure → init jobs → 8 services → edge proxy → tools (profile "tools").
# Services never depend on other services (lazy calls with timeouts); only on their own infra.
# Image tags can be overridden in .env. Use `make help`.
name: bitspay

networks:
  bitspay:
    name: bitspay
    ipam:
      config:
        - subnet: 172.28.0.0/24

volumes:
  pg-data: {}
  redis-data: {}
  kafka-data: {}
  tb-data: {}
  object-store-data: {}

# Runtime configuration contract (kernel K8.3), shared by every service
x-svc-env: &svc-env
  SPRING_KAFKA_BOOTSTRAPSERVERS: kafka:9092
  SPRING_DATASOURCE_PASSWORD: ${PG_SERVICE_PASSWORD}
  SPRING_DATASOURCE_HIKARI_MAXIMUMPOOLSIZE: "8"
  BITSPAY_REDIS_CRITICAL_URL: redis://redis:6379
  BITSPAY_REDIS_CACHE_URL: redis://redis:6379
  BITSPAY_OUTBOX_RELAY: debezium
  BITSPAY_SECURITY_MODE: trusted-headers
  BITSPAY_PLATFORM_HMAC_KEY: ${BITSPAY_PLATFORM_HMAC_KEY}
  BITSPAY_S3_ENDPOINT: http://object-store:9000
  BITSPAY_S3_ACCESSKEY: ${S3_ACCESS_KEY}
  BITSPAY_S3_SECRETKEY: ${S3_SECRET_KEY}
  BITSPAY_S3_REGION: us-east-1
  BITSPAY_CLIENTS_LEDGER_BASEURL: http://ledger-service:8101
  BITSPAY_CLIENTS_TRANSACTION_BASEURL: http://transaction-service:8102
  BITSPAY_CLIENTS_WALLET_BASEURL: http://wallet-service:8103
  BITSPAY_CLIENTS_PARTNER_BASEURL: http://wallet-service:8103            # legacy alias
  BITSPAY_CLIENTS_LIMITSRISK_BASEURL: http://limits-risk-service:8105
  BITSPAY_CLIENTS_RISK_BASEURL: http://limits-risk-service:8105          # alias used by disbursement
  BITSPAY_CLIENTS_PRICING_BASEURL: http://pricing-service:8106
  BITSPAY_CLIENTS_TREASURY_BASEURL: http://treasury-service:8107
  BITSPAY_CLIENTS_ADMIN_BASEURL: http://admin-service:8115
  BITSPAY_CLIENTS_NOTIFICATION_BASEURL: http://admin-service:8115        # legacy alias
  BITSPAY_CLIENTS_GENERALLEDGER_BASEURL: http://general-ledger-service:8116
  SERVER_FORWARDHEADERSSTRATEGY: framework
  OTEL_SDK_DISABLED: "true"
  JAVA_TOOL_OPTIONS: >-
    -XX:MaxRAMPercentage=60 -XX:+UseSerialGC -XX:TieredStopAtLevel=1
    -Xss512k -XX:MaxMetaspaceSize=128m -XX:+ExitOnOutOfMemoryError

x-svc: &svc
  restart: unless-stopped
  networks: [bitspay]

services:
  # ───────────────────────────── infrastructure ─────────────────────────────
  postgres:
    image: ${POSTGRES_IMAGE:-postgres:18.6}
    restart: unless-stopped
    networks: [bitspay]
    mem_limit: 640m
    ports: ["5432:5432"]
    command: ["postgres", "-c", "config_file=/etc/postgresql/postgresql.conf"]
    environment:
      POSTGRES_DB: bitspay
      POSTGRES_USER: bitspay_admin
      POSTGRES_PASSWORD: ${PG_ADMIN_PASSWORD}
      PG_SERVICE_PASSWORD: ${PG_SERVICE_PASSWORD}
      PG_DEBEZIUM_PASSWORD: ${PG_DEBEZIUM_PASSWORD}
    volumes:
      - pg-data:/var/lib/postgresql
      - ./docker/postgres/postgresql.conf:/etc/postgresql/postgresql.conf:ro
      - ./docker/postgres/init:/docker-entrypoint-initdb.d:ro
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -h 127.0.0.1 -U bitspay_admin -d bitspay"]
      interval: 5s
      timeout: 3s
      retries: 40

  # Single Redis serving both the "critical" and "cache" roles (AOF on, noeviction).
  redis:
    image: ${REDIS_IMAGE:-redis:8.10.2}
    restart: unless-stopped
    networks: [bitspay]
    mem_limit: 256m
    ports: ["6379:6379"]
    command: ["redis-server", "--appendonly", "yes", "--maxmemory", "224mb", "--maxmemory-policy", "noeviction"]
    volumes: [redis-data:/data]
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 3s
      retries: 20

  kafka:
    image: ${KAFKA_IMAGE:-apache/kafka:4.3.1}
    restart: unless-stopped
    hostname: kafka
    networks:
      bitspay:
        aliases: [kafka-1]
    mem_limit: 768m
    ports: ["19092:19092"]
    environment:
      CLUSTER_ID: ${KAFKA_CLUSTER_ID:-MkU3OEVBNTcwNTJENDM2Qk}
      KAFKA_NODE_ID: 1
      KAFKA_PROCESS_ROLES: broker,controller
      KAFKA_LISTENERS: INTERNAL://:9092,EXTERNAL://:19092,CONTROLLER://:9093
      KAFKA_ADVERTISED_LISTENERS: INTERNAL://kafka:9092,EXTERNAL://localhost:19092
      KAFKA_LISTENER_SECURITY_PROTOCOL_MAP: INTERNAL:PLAINTEXT,EXTERNAL:PLAINTEXT,CONTROLLER:PLAINTEXT
      KAFKA_CONTROLLER_LISTENER_NAMES: CONTROLLER
      KAFKA_INTER_BROKER_LISTENER_NAME: INTERNAL
      KAFKA_CONTROLLER_QUORUM_VOTERS: 1@kafka:9093
      KAFKA_OFFSETS_TOPIC_REPLICATION_FACTOR: 1
      KAFKA_TRANSACTION_STATE_LOG_REPLICATION_FACTOR: 1
      KAFKA_TRANSACTION_STATE_LOG_MIN_ISR: 1
      KAFKA_GROUP_INITIAL_REBALANCE_DELAY_MS: 0
      KAFKA_AUTO_CREATE_TOPICS_ENABLE: "false"
      KAFKA_LOG_DIRS: /var/lib/kafka/data
      KAFKA_HEAP_OPTS: -Xms256m -Xmx384m
    volumes:
      - kafka-data:/var/lib/kafka/data
      - ./docker/kafka:/bitspay/kafka:ro
    healthcheck:
      test: ["CMD-SHELL", "/opt/kafka/bin/kafka-broker-api-versions.sh --bootstrap-server localhost:9092 >/dev/null 2>&1"]
      interval: 10s
      timeout: 10s
      retries: 30
      start_period: 20s

  connect:
    image: ${DEBEZIUM_CONNECT_IMAGE:-quay.io/debezium/connect:3.7}
    restart: unless-stopped
    networks: [bitspay]
    mem_limit: 640m
    ports: ["8083:8083"]
    environment:
      BOOTSTRAP_SERVERS: kafka:9092
      GROUP_ID: bitspay-connect
      CONFIG_STORAGE_TOPIC: _connect-configs
      OFFSET_STORAGE_TOPIC: _connect-offsets
      STATUS_STORAGE_TOPIC: _connect-status
      CONNECT_CONFIG_STORAGE_REPLICATION_FACTOR: 1
      CONNECT_OFFSET_STORAGE_REPLICATION_FACTOR: 1
      CONNECT_STATUS_STORAGE_REPLICATION_FACTOR: 1
      CONNECT_CONFIG_PROVIDERS: env
      CONNECT_CONFIG_PROVIDERS_ENV_CLASS: org.apache.kafka.common.config.provider.EnvVarConfigProvider
      PG_DEBEZIUM_PASSWORD: ${PG_DEBEZIUM_PASSWORD}
      HEAP_OPTS: -Xms256m -Xmx512m
    depends_on:
      postgres: { condition: service_healthy }
      kafka-init: { condition: service_completed_successfully }
    healthcheck:
      test: ["CMD-SHELL", "curl -fsS http://localhost:8083/connectors >/dev/null"]
      interval: 10s
      timeout: 5s
      retries: 30
      start_period: 30s

  tigerbeetle:
    image: ${TIGERBEETLE_IMAGE:-ghcr.io/tigerbeetle/tigerbeetle:0.17.9}
    restart: unless-stopped
    entrypoint: ["/bin/sh", "/bitspay/tigerbeetle/entrypoint.sh"]
    networks:
      bitspay:
        ipv4_address: 172.28.0.10           # TB clients take addresses, not names
    mem_limit: 1g
    ports: ["3001:3001"]
    cap_add: [IPC_LOCK]
    security_opt: ["seccomp=unconfined"]    # io_uring
    volumes:
      - tb-data:/data
      - ./docker/tigerbeetle:/bitspay/tigerbeetle:ro
    healthcheck:
      test: ["CMD-SHELL", "nc -z 127.0.0.1 3001 || exit 1"]
      interval: 5s
      timeout: 3s
      retries: 30

  # S3-compatible object store (RustFS; MinIO community images are no longer published).
  # Services only see BITSPAY_S3_*; swap the image in .env if needed.
  object-store:
    image: ${OBJECT_STORE_IMAGE:-rustfs/rustfs:1.0.1}
    restart: unless-stopped
    networks: [bitspay]
    mem_limit: 256m
    ports: ["19100:9000", "19101:9001"]
    command: ["/data"]
    environment:
      RUSTFS_ACCESS_KEY: ${S3_ACCESS_KEY}
      RUSTFS_SECRET_KEY: ${S3_SECRET_KEY}
      RUSTFS_CONSOLE_ENABLE: "true"
    volumes: [object-store-data:/data]
    healthcheck:
      test: ["CMD-SHELL", "curl -fsS http://127.0.0.1:9000/health >/dev/null || exit 1"]
      interval: 5s
      timeout: 3s
      retries: 30

  # ───────────────────────────── init jobs (run once, exit 0) ─────────────────────────────
  kafka-init:
    image: ${KAFKA_IMAGE:-apache/kafka:4.3.1}
    restart: "no"
    networks: [bitspay]
    entrypoint: ["/bin/bash", "/bitspay/kafka/create-topics.sh"]
    volumes: [./docker/kafka:/bitspay/kafka:ro]
    depends_on:
      kafka: { condition: service_healthy }

  connect-init:
    image: ${CURL_IMAGE:-curlimages/curl:8.16.0}
    restart: "no"
    networks: [bitspay]
    entrypoint: ["/bin/sh", "/bitspay/debezium/register.sh"]
    volumes: [./docker/debezium:/bitspay/debezium:ro]
    depends_on:
      connect: { condition: service_healthy }

  object-store-init:
    image: ${OBJECT_STORE_CLIENT_IMAGE:-amazon/aws-cli:2.38.0}
    restart: "no"
    networks: [bitspay]
    entrypoint: ["/bin/sh", "/bitspay/object-store/init.sh"]
    environment:
      AWS_ACCESS_KEY_ID: ${S3_ACCESS_KEY}
      AWS_SECRET_ACCESS_KEY: ${S3_SECRET_KEY}
      AWS_DEFAULT_REGION: us-east-1
    volumes: [./docker/object-store:/bitspay/object-store:ro]
    depends_on:
      object-store: { condition: service_healthy }

  # ───────────────────────────── services ─────────────────────────────

  ledger-service:
    <<: *svc
    image: bitspay/ledger-service:local
    build:
      context: ./services/ledger-service
      dockerfile: ../../docker/service.Dockerfile
    mem_limit: 448m
    ports: ["8101:8101", "9101:9101"]
    environment:
      <<: *svc-env
      SPRING_PROFILES_ACTIVE: dev,api
      SERVER_PORT: "8101"
      MANAGEMENT_SERVER_PORT: "9101"
      SPRING_DATASOURCE_URL: jdbc:postgresql://postgres:5432/bitspay?currentSchema=svc_ledger
      SPRING_DATASOURCE_USERNAME: svc_ledger
      BITSPAY_FIELD_CIPHER_KEY: ${FIELD_CIPHER_KEY_LEDGER}
      BITSPAY_TB_ADDRESSES: 172.28.0.10:3001
      BITSPAY_TB_CLUSTERID: "0"
      LEDGER_JOURNAL_MAC_KEY: ${LEDGER_JOURNAL_MAC_KEY}
    healthcheck:
      test: ["CMD-SHELL", "curl -fsS http://localhost:9101/actuator/health/readiness || exit 1"]
      interval: 10s
      timeout: 3s
      retries: 30
      start_period: 60s
    depends_on:
      postgres: { condition: service_healthy }
      kafka-init: { condition: service_completed_successfully }
      tigerbeetle: { condition: service_healthy }

  transaction-service:
    <<: *svc
    image: bitspay/transaction-service:local
    build:
      context: ./services/transaction-service
      dockerfile: ../../docker/service.Dockerfile
    mem_limit: 448m
    ports: ["8102:8102", "9102:9102"]
    environment:
      <<: *svc-env
      SPRING_PROFILES_ACTIVE: dev
      SERVER_PORT: "8102"
      MANAGEMENT_SERVER_PORT: "9102"
      SPRING_DATASOURCE_URL: jdbc:postgresql://postgres:5432/bitspay?currentSchema=svc_transaction
      SPRING_DATASOURCE_USERNAME: svc_transaction
      BITSPAY_FIELD_CIPHER_KEY: ${FIELD_CIPHER_KEY_TRANSACTION}
    healthcheck:
      test: ["CMD-SHELL", "curl -fsS http://localhost:9102/actuator/health/readiness || exit 1"]
      interval: 10s
      timeout: 3s
      retries: 30
      start_period: 60s
    depends_on:
      postgres: { condition: service_healthy }
      kafka-init: { condition: service_completed_successfully }
      redis: { condition: service_healthy }

  wallet-service:
    <<: *svc
    image: bitspay/wallet-service:local
    build:
      context: ./services/wallet-service
      dockerfile: ../../docker/service.Dockerfile
    mem_limit: 448m
    ports: ["8103:8103", "9103:9103"]
    environment:
      <<: *svc-env
      SPRING_PROFILES_ACTIVE: dev,api,cache-loader
      SERVER_PORT: "8103"
      MANAGEMENT_SERVER_PORT: "9103"
      SPRING_DATASOURCE_URL: jdbc:postgresql://postgres:5432/bitspay?currentSchema=svc_wallet
      SPRING_DATASOURCE_USERNAME: svc_wallet
      BITSPAY_FIELD_CIPHER_KEY: ${FIELD_CIPHER_KEY_WALLET}
    healthcheck:
      test: ["CMD-SHELL", "curl -fsS http://localhost:9103/actuator/health/readiness || exit 1"]
      interval: 10s
      timeout: 3s
      retries: 30
      start_period: 60s
    depends_on:
      postgres: { condition: service_healthy }
      kafka-init: { condition: service_completed_successfully }
      redis: { condition: service_healthy }
      object-store: { condition: service_healthy }
      object-store-init: { condition: service_completed_successfully }

  limits-risk-service:
    <<: *svc
    image: bitspay/limits-risk-service:local
    build:
      context: ./services/limits-risk-service
      dockerfile: ../../docker/service.Dockerfile
    mem_limit: 384m
    ports: ["8105:8105", "9105:9105"]
    environment:
      <<: *svc-env
      SPRING_PROFILES_ACTIVE: dev,api,worker
      SERVER_PORT: "8105"
      MANAGEMENT_SERVER_PORT: "9105"
      SPRING_DATASOURCE_URL: jdbc:postgresql://postgres:5432/bitspay?currentSchema=svc_limits_risk
      SPRING_DATASOURCE_USERNAME: svc_limits_risk
      BITSPAY_FIELD_CIPHER_KEY: ${FIELD_CIPHER_KEY_LIMITS_RISK}
    healthcheck:
      test: ["CMD-SHELL", "curl -fsS http://localhost:9105/actuator/health/readiness || exit 1"]
      interval: 10s
      timeout: 3s
      retries: 30
      start_period: 60s
    depends_on:
      postgres: { condition: service_healthy }
      kafka-init: { condition: service_completed_successfully }
      redis: { condition: service_healthy }

  pricing-service:
    <<: *svc
    image: bitspay/pricing-service:local
    build:
      context: ./services/pricing-service
      dockerfile: ../../docker/service.Dockerfile
    mem_limit: 384m
    ports: ["8106:8106", "9106:9106"]
    environment:
      <<: *svc-env
      SPRING_PROFILES_ACTIVE: dev,api,worker
      SERVER_PORT: "8106"
      MANAGEMENT_SERVER_PORT: "9106"
      SPRING_DATASOURCE_URL: jdbc:postgresql://postgres:5432/bitspay?currentSchema=svc_pricing
      SPRING_DATASOURCE_USERNAME: svc_pricing
      BITSPAY_FIELD_CIPHER_KEY: ${FIELD_CIPHER_KEY_PRICING}
    healthcheck:
      test: ["CMD-SHELL", "curl -fsS http://localhost:9106/actuator/health/readiness || exit 1"]
      interval: 10s
      timeout: 3s
      retries: 30
      start_period: 60s
    depends_on:
      postgres: { condition: service_healthy }
      kafka-init: { condition: service_completed_successfully }

  treasury-service:
    <<: *svc
    image: bitspay/treasury-service:local
    build:
      context: ./services/treasury-service
      dockerfile: ../../docker/service.Dockerfile
    mem_limit: 384m
    ports: ["8107:8107", "9107:9107"]
    environment:
      <<: *svc-env
      SPRING_PROFILES_ACTIVE: dev
      SERVER_PORT: "8107"
      MANAGEMENT_SERVER_PORT: "9107"
      SPRING_DATASOURCE_URL: jdbc:postgresql://postgres:5432/bitspay?currentSchema=svc_treasury
      SPRING_DATASOURCE_USERNAME: svc_treasury
      BITSPAY_FIELD_CIPHER_KEY: ${FIELD_CIPHER_KEY_TREASURY}
    healthcheck:
      test: ["CMD-SHELL", "curl -fsS http://localhost:9107/actuator/health/readiness || exit 1"]
      interval: 10s
      timeout: 3s
      retries: 30
      start_period: 60s
    depends_on:
      postgres: { condition: service_healthy }
      kafka-init: { condition: service_completed_successfully }

  admin-service:
    <<: *svc
    image: bitspay/admin-service:local
    build:
      context: ./services/admin-service
      dockerfile: ../../docker/service.Dockerfile
    mem_limit: 384m
    ports: ["8115:8115", "9115:9115"]
    environment:
      <<: *svc-env
      SPRING_PROFILES_ACTIVE: dev
      SERVER_PORT: "8115"
      MANAGEMENT_SERVER_PORT: "9115"
      SPRING_DATASOURCE_URL: jdbc:postgresql://postgres:5432/bitspay?currentSchema=svc_admin
      SPRING_DATASOURCE_USERNAME: svc_admin
      BITSPAY_FIELD_CIPHER_KEY: ${FIELD_CIPHER_KEY_ADMIN}
    healthcheck:
      test: ["CMD-SHELL", "curl -fsS http://localhost:9115/actuator/health/readiness || exit 1"]
      interval: 10s
      timeout: 3s
      retries: 30
      start_period: 60s
    depends_on:
      postgres: { condition: service_healthy }
      kafka-init: { condition: service_completed_successfully }
      redis: { condition: service_healthy }

  general-ledger-service:
    <<: *svc
    image: bitspay/general-ledger-service:local
    build:
      context: ./services/general-ledger-service
      dockerfile: ../../docker/service.Dockerfile
    mem_limit: 384m
    ports: ["8116:8116", "9116:9116"]
    environment:
      <<: *svc-env
      SPRING_PROFILES_ACTIVE: dev,api,ingest,jobs
      SERVER_PORT: "8116"
      MANAGEMENT_SERVER_PORT: "9116"
      SPRING_DATASOURCE_URL: jdbc:postgresql://postgres:5432/bitspay?currentSchema=svc_general_ledger
      SPRING_DATASOURCE_USERNAME: svc_general_ledger
      BITSPAY_FIELD_CIPHER_KEY: ${FIELD_CIPHER_KEY_GENERAL_LEDGER}
    healthcheck:
      test: ["CMD-SHELL", "curl -fsS http://localhost:9116/actuator/health/readiness || exit 1"]
      interval: 10s
      timeout: 3s
      retries: 30
      start_period: 60s
    depends_on:
      postgres: { condition: service_healthy }
      kafka-init: { condition: service_completed_successfully }

  # ───────────────────────────── edge proxy ─────────────────────────────
  # /<svc-short>/... → service (docker/edge-proxy/nginx.conf). Starts even if some services are down.
  edge-proxy:
    <<: *svc
    image: ${NGINX_IMAGE:-nginx:1.29-alpine}
    mem_limit: 64m
    ports: ["8000:8000"]
    volumes:
      - ./docker/edge-proxy/nginx.conf:/etc/nginx/nginx.conf:ro
    healthcheck:
      test: ["CMD-SHELL", "wget -qO- http://127.0.0.1:8000/ >/dev/null || exit 1"]
      interval: 10s
      timeout: 3s
      retries: 5

  # ───────────────────────────── tools (make tools) ─────────────────────────────
  kafka-ui:
    image: ${KAFKA_UI_IMAGE:-kafbat/kafka-ui:v1.3.0}
    profiles: [tools]
    networks: [bitspay]
    ports: ["8089:8080"]
    environment:
      KAFKA_CLUSTERS_0_NAME: bitspay
      KAFKA_CLUSTERS_0_BOOTSTRAPSERVERS: kafka:9092
      KAFKA_CLUSTERS_0_KAFKACONNECT_0_NAME: connect
      KAFKA_CLUSTERS_0_KAFKACONNECT_0_ADDRESS: http://connect:8083
    depends_on:
      kafka: { condition: service_healthy }
